<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Автосервис v2</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #1e1e2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #181825;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 2px solid #313244;
  flex-wrap: wrap;
}
header h1 { font-size: 20px; color: #89b4fa; }
header .user-info {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
select, button, input, textarea {
  background: #313244;
  color: #e0e0e0;
  border: 1px solid #45475a;
  border-radius: 6px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 13px;
}
button {
  cursor: pointer;
  transition: 0.2s;
}
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #1e1e2e; font-weight: 600; }
button.primary:hover { background: #74a8f5; }
button.success { background: #a6e3a1; color: #1e1e2e; }
button.danger { background: #f38ba8; color: #1e1e2e; }
button.warning { background: #f9e2af; color: #1e1e2e; }
button.small { padding: 3px 8px; font-size: 12px; }

.bell-btn {
  position: relative;
  background: #313244;
  font-size: 18px;
  padding: 5px 10px;
}
.bell-badge {
  position: absolute;
  top: -5px; right: -5px;
  background: #f38ba8;
  color: white;
  border-radius: 50%;
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

.board {
  flex: 1;
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
  overflow-y: hidden;
}
.column {
  min-width: 260px;
  width: 260px;
  background: #181825;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  border: 2px solid #313244;
}
.column.drag-over { border-color: #89b4fa; background: #1e1e2e; }
.column-header {
  padding: 10px;
  font-weight: 600;
  font-size: 13px;
  text-align: center;
  border-bottom: 2px solid #313244;
  border-radius: 8px 8px 0 0;
  color: #1e1e2e;
}
.col-1 .column-header { background: #f9e2af; }
.col-2 .column-header { background: #fab387; }
.col-3 .column-header { background: #f38ba8; }
.col-4 .column-header { background: #89b4fa; }
.col-5 .column-header { background: #a6e3a1; }
.col-6 .column-header { background: #cba6f7; }

.column-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.column-body::-webkit-scrollbar { width: 6px; }
.column-body::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }

.task {
  background: #313244;
  border-radius: 6px;
  padding: 8px;
  cursor: grab;
  font-size: 12px;
  border-left: 4px solid #89b4fa;
  transition: transform 0.15s;
  user-select: none;
}
.task:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
.task.dragging { opacity: 0.5; }
.task-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  font-weight: 600;
}
.task-title { font-size: 13px; color: #cdd6f4; }
.task-time { font-size: 11px; color: #a6adc8; }
.task-row { font-size: 11px; color: #bac2de; margin: 2px 0; }
.task-row b { color: #89b4fa; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal {
  background: #1e1e2e;
  border-radius: 10px;
  padding: 20px;
  max-width: 700px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 2px solid #313244;
}
.modal h2 { color: #89b4fa; margin-bottom: 15px; font-size: 18px; }
.modal h3 { color: #a6e3a1; margin: 12px 0 8px; font-size: 14px; }
.modal label { display: block; margin: 8px 0 4px; font-size: 13px; color: #bac2de; }
.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 8px;
}
.modal textarea { min-height: 70px; resize: vertical; }
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 15px;
  flex-wrap: wrap;
}
.readonly-field {
  background: #181825;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  margin: 4px 0;
  color: #a6adc8;
  border: 1px solid #313244;
}
.readonly-field b { color: #cdd6f4; }

.char-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 8px 0;
}
.char-item {
  background: #313244;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s;
}
.char-item:hover { background: #45475a; }
.char-item .label { color: #89b4fa; font-weight: 600; }
.char-item .value { color: #cdd6f4; text-align: right; flex: 1; margin-left: 10px; }
/* Блок «Поиск по артикулам»: строки должны занимать всю ширину и не сжиматься */
.char-item.parts-search-item { align-items: flex-start; flex-wrap: wrap; }
.char-item.parts-search-item .label { flex: 0 0 auto; }
.char-item.parts-search-item .value {
  text-align: left;
  min-width: 0;
  overflow: hidden;
}
.char-item.parts-search-item .article-line {
  width: 100%;
  justify-content: flex-start;
}
.char-item.parts-search-item .article-line + .article-line {
  border-top: 1px solid #45475a;
  margin-top: 2px;
  padding-top: 6px;
}

.vin-copy { cursor: pointer; }
.vin-copy:active { color: #a6e3a1; }

/* Лог задачи: каждая запись — отдельная строка, без рамок */
.log-entry {
  display: block;
  padding: 4px 0 4px 10px;
  margin: 0;
  font-size: 11px;
  border-left: 2px solid #45475a;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}
.log-entry + .log-entry { margin-top: 2px; }
.log-entry .log-time {
  display: block;
  color: #6c7086;
  font-size: 10px;
  margin-bottom: 1px;
}
.log-entry .log-text {
  display: block;
  color: #cdd6f4;
}
/* Лог в окне задачи — компактный список */
.task-log-list { display: block; }

/* Панель фильтра калькуляции по исполнителям */
.calc-assignee-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 10px;
  background: #1e1e2e;
  border: 1px solid #313244;
  border-radius: 8px;
  flex-wrap: wrap;
}
.calc-assignee-bar label { font-size: 12px; color: #a6adc8; }
.calc-assignee-bar select {
  padding: 6px 10px;
  font-size: 12px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 5px;
}
.calc-assignee-count {
  font-size: 11px;
  color: #6c7086;
  margin-left: auto;
}

/* ===== ЭКРАН ВХОДА ===== */
.auth-gate {
  position: fixed;
  inset: 0;
  background: rgba(13, 13, 20, 0.96);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.auth-box {
  width: 100%;
  max-width: 380px;
  background: #181825;
  border: 1px solid #313244;
  border-radius: 14px;
  padding: 30px 28px 24px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
}
.auth-logo {
  font-size: 40px;
  text-align: center;
  margin-bottom: 4px;
}
.auth-box h1 {
  margin: 0 0 4px;
  text-align: center;
  font-size: 20px;
}
.auth-sub {
  margin: 0 0 20px;
  text-align: center;
  color: #a6adc8;
  font-size: 13px;
}
.auth-box form { display: block; }
.auth-box label {
  display: block;
  font-size: 11px;
  color: #a6adc8;
  margin: 10px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.auth-box input {
  width: 100%;
  padding: 9px 12px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 6px;
  font-size: 14px;
  box-sizing: border-box;
}
.auth-box input:focus {
  border-color: #89b4fa;
  outline: none;
}
.auth-error {
  color: #f38ba8;
  font-size: 12px;
  margin: 8px 0 4px;
  min-height: 14px;
}
.auth-submit {
  width: 100%;
  padding: 10px;
  margin-top: 14px;
  font-size: 14px;
  font-weight: 600;
}
.auth-hint {
  margin-top: 16px;
  padding: 10px 12px;
  background: #313244;
  border-radius: 6px;
  font-size: 11px;
  color: #a6adc8;
  line-height: 1.5;
}
.tenant-label {
  font-size: 11px;
  color: #a6adc8;
  padding: 3px 8px;
  background: #313244;
  border-radius: 4px;
}
.logout-btn {
  padding: 4px 10px;
  font-size: 11px;
  background: transparent;
  border: 1px solid #f38ba8;
  color: #f38ba8;
  border-radius: 4px;
  cursor: pointer;
}
.logout-btn:hover { background: #f38ba8; color: #1e1e2e; }

.notification-panel {
  position: fixed;
  top: 60px;
  right: 20px;
  background: #1e1e2e;
  border: 2px solid #313244;
  border-radius: 8px;
  width: 320px;
  max-height: 400px;
  overflow-y: auto;
  z-index: 999;
  padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.notification-panel h3 { color: #89b4fa; font-size: 14px; margin-bottom: 8px; }
.notif-item {
  background: #313244;
  padding: 8px;
  border-radius: 4px;
  margin-bottom: 6px;
  font-size: 12px;
  border-left: 3px solid #f9e2af;
}
.notif-item.unread { border-left-color: #f38ba8; }
.notif-item .notif-time { color: #6c7086; font-size: 10px; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.badge-green { background: #a6e3a1; color: #1e1e2e; }
.badge-red { background: #f38ba8; color: #1e1e2e; }
.badge-yellow { background: #f9e2af; color: #1e1e2e; }
.badge-blue { background: #89b4fa; color: #1e1e2e; }
.badge-gray { background: #6c7086; color: #e0e0e0; }

.part-row {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.part-row input { flex: 1; min-width: 100px; }
.part-row select { width: auto; }

.empty-msg { text-align: center; color: #6c7086; font-size: 12px; padding: 20px; }

.schedule-post {
  background: #313244;
  padding: 8px;
  border-radius: 6px;
  margin: 5px 0;
  font-size: 12px;
}

/* ===== ВКЛАДКИ ===== */
.tab-btn {
  background: transparent;
  border: 1px solid #45475a;
  color: #a6adc8;
  font-weight: 600;
}
.tab-btn.active { background: #89b4fa; border-color: #89b4fa; color: #1e1e2e; }
.tab-btn.active:hover { background: #74a8f5; }

/* ===== СТРОКИ ЗАПЧАСТЕЙ / РАБОТ / ОПЛАТ ===== */
:root {
  --col-name: 1 1 130px;
  --col-article: 0 0 110px;
  --col-check: 0 0 22px;
  --col-qty: 0 0 96px;
  --col-hours: 0 0 110px;
  --col-num: 0 0 84px;
  --col-status: 0 0 116px;
  --col-total: 0 0 70px;
  --col-search: 0 0 196px;
  --col-del: 0 0 32px;
  --grid-gap: 5px;
  --name-min: 100px;
  --num-min: 84px;
}

.part-row {
  display: flex;
  gap: var(--grid-gap);
  align-items: center;
  margin-bottom: 4px;
}
.part-row input,
.part-row select { flex: var(--col-name); min-width: var(--name-min); }

.part-row input.name-input { flex: var(--col-name); min-width: var(--name-min); }

.part-row input.article {
  flex: var(--col-article);
  min-width: var(--col-article-min, 100px);
  text-transform: uppercase;
}

.part-row input.num { flex: var(--col-num); min-width: var(--num-min); }

.part-row .row-total {
  flex: var(--col-total);
  min-width: var(--col-total);
  text-align: right;
  font-size: 12px;
  font-weight: 600;
  color: #a6e3a1;
  align-self: center;
}
.part-row .row-total.neg { color: #f38ba8; }
.part-row select.work-status { flex: var(--col-status); min-width: var(--col-status); }
.part-row .danger.small { flex: var(--col-del); min-width: var(--col-del); }

.part-note-line {
  flex: 1 1 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  padding-left: 2px;
}
.part-note-label {
  flex: 0 0 auto;
  font-size: 10px;
  color: #6c7086;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.part-note-line .note-input {
  flex: 1 1 auto;
  min-width: 120px;
  font-size: 11px;
  padding: 4px 8px;
  background: #181825;
  color: #cdd6f4;
  border: 1px solid #313244;
  border-radius: 4px;
}
.part-note-line .note-input:focus { border-color: #89b4fa; outline: none; }
.part-row { flex-wrap: wrap; }

.ordered-check {
  flex: var(--col-check);
  min-width: var(--col-check);
  text-align: center;
  font-size: 14px;
  line-height: 1;
  color: #6c7086;
  cursor: default;
}
.ordered-check.done { color: #a6e3a1; font-weight: 700; }
.rows-head span.check-col { flex: var(--col-check); min-width: var(--col-check); }

.qty-control {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex: var(--col-qty);
  min-width: var(--col-qty);
}
.qty-control .qty-input {
  flex: 1;
  min-width: 26px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.qty-btn {
  flex: 0 0 24px;
  width: 24px;
  min-width: 0;
  padding: 3px 0;
  font-size: 13px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 4px;
  cursor: pointer;
}
.qty-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
.rows-head span.qty-col { flex: var(--col-qty); min-width: var(--col-qty); }

.part-note-line button {
  flex: 0 0 26px;
  width: 26px;
  min-width: 0;
  padding: 2px 0;
  font-size: 12px;
  line-height: 1;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid #585b70;
}
.part-note-line button.note-add-btn {
  background: #45475a;
  color: #a6e3a1;
}
.part-note-line button.note-add-btn:hover { background: #a6e3a1; color: #1e1e2e; }
.part-note-line button.note-del-btn {
  background: #45475a;
  color: #f38ba8;
}
.part-note-line button.note-del-btn:hover { background: #f38ba8; color: #1e1e2e; }
.part-note-line button.note-link-btn {
  background: #45475a;
  color: #cdd6f4;
  font-size: 11px;
}
.part-note-line button.note-link-btn:hover:not(:disabled) { background: #89b4fa; color: #1e1e2e; }
.part-note-line button.note-link-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.work-comment {
  flex: 1 1 140px;
  min-width: 120px;
  font-size: 11px;
  padding: 4px 8px;
}
.rows-head span.comment-col { flex: 1 1 140px; min-width: 120px; }
.issue-issue-row { margin-top: 4px; }

.rows-head {
  display: flex;
  gap: var(--grid-gap);
  font-size: 10px;
  color: #6c7086;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin: 6px 0 2px;
}
.rows-head span { flex: var(--col-name); min-width: var(--name-min); }
.rows-head span.article { flex: var(--col-article); min-width: 100px; }
.rows-head span.num { flex: var(--col-num); min-width: var(--num-min); }
.rows-head span.row-total { flex: var(--col-total); min-width: var(--col-total); text-align: right; }
.rows-head span.work-status { flex: var(--col-status); min-width: var(--col-status); }
.rows-head span.search-col { flex: var(--col-search); min-width: var(--col-search); }
.rows-head span.del-col { flex: var(--col-del); min-width: var(--col-del); }
.rows-head span.hours-col { flex: var(--col-hours); min-width: var(--col-hours); }

.hours-control {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 110px;
  min-width: 90px;
}
.hours-control .hours-input {
  flex: 1;
  min-width: 40px;
  text-align: center;
}
.hours-btn {
  flex: 0 0 26px;
  width: 26px;
  min-width: 0;
  padding: 3px 0;
  font-size: 14px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 4px;
  cursor: pointer;
}
.hours-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

.sched-datebar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
}
.sched-datebar button {
  padding: 5px 10px;
  font-size: 13px;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 5px;
  cursor: pointer;
}
.sched-datebar button:hover { background: #89b4fa; color: #1e1e2e; }
.sched-date-label {
  font-size: 14px;
  font-weight: 600;
  color: #cdd6f4;
  text-transform: capitalize;
}
.schedule-empty {
  padding: 18px;
  text-align: center;
  color: #6c7086;
  border: 1px dashed #45475a;
  border-radius: 8px;
  margin: 8px 0;
}

.modal-titlebar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.modal-titlebar h2 { margin: 0; flex: 1; }
.modal-title-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: 0 0 auto;
}
.close-x {
  width: 30px;
  height: 30px;
  padding: 0;
  font-size: 18px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 5px;
  cursor: pointer;
}
.close-x:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
.back-btn {
  padding: 5px 12px;
  font-size: 12px;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
}
.back-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

.sched-picker {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.sched-picker input[type="date"] {
  flex: 0 0 180px;
  padding: 6px 8px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 6px;
  font-size: 13px;
}
.sched-picker .slot-select {
  flex: 0 0 130px;
  padding: 6px 8px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 6px;
  font-size: 13px;
}

.part-search {
  display: inline-flex;
  gap: 3px;
  flex: var(--col-search);
  min-width: var(--col-search);
  align-items: center;
  justify-content: flex-start;
}

<script>
// ============ FIREBASE INIT ============
const firebaseConfig = {
  apiKey: "AIzaSyC6l-V5BOMO_rJ9cxJq3_HMhDCpWyak9UQ",
  authDomain: "baza54crm.firebaseapp.com",
  databaseURL: "https://baza54crm-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "baza54crm",
  storageBucket: "baza54crm.firebasestorage.app",
  messagingSenderId: "538489079474",
  appId: "1:538489079474:web:3c274bd327700e37e1ebab",
  measurementId: "G-Z8ZFLSR9J8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============ АРЕНДАТОРЫ (СТО) И ИЗОЛЯЦИЯ ДАННЫХ ============
const TENANTS = {
  user1: { name: 'СТО User1', dbPrefix: 'crm_user1' },
  user2: { name: 'СТО User2', dbPrefix: 'crm_user2' },
  user3: { name: 'СТО User3', dbPrefix: 'crm_user3' },
  user4: { name: 'СТО User4', dbPrefix: 'crm_user4' },
  user5: { name: 'СТО User5', dbPrefix: 'crm_user5' }
};

const PASSWORD_CACHE_KEY = 'crm_tenant_passwords';

function cachedTenantPassword(tenant) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  return map[tenant] || null;
}

function setCachedTenantPassword(tenant, password) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  map[tenant] = password;
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));
}

function effectiveTenantPassword(tenant) {
  const c = cachedTenantPassword(tenant);
  return c || tenant;
}

function authRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix + '/auth/password');
}

function currentTenant() {
  return localStorage.getItem('crm_current_tenant') || null;
}

function dataRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix);
}

function dataRef() {
  return dataRefFor(currentTenant());
}

// ============ АВТОРИЗАЦИЯ ============
const AUTH_SESSION_KEY = 'crm_auth_session';

function currentUser() {
  return localStorage.getItem(AUTH_SESSION_KEY) || null;
}

function verifyAuth(login, password) {
  const l = String(login || '').trim();
  const p = String(password || '');
  if (!TENANTS[l]) return false;
  const expected = cachedTenantPassword(l) || l;
  return p === expected;
}

function loadTenantPassword(tenant) {
  const ref = authRefFor(tenant);
  if (!ref || !ref.once) return;
  ref.once('value').then(snap => {
    const val = snap && snap.val ? snap.val() : null;
    if (val) setCachedTenantPassword(tenant, String(val));
  }).catch(() => {});
}

function changeTenantPassword(tenant, currentPass, newPass, confirmPass) {
  if (!TENANTS[tenant]) return { ok: false, error: 'СТО не выбрано' };
  const cur = String(currentPass || '');
  const np = String(newPass || '');
  const cp = String(confirmPass === undefined ? newPass : confirmPass);

  if (!cur) return { ok: false, error: 'Введите текущий пароль' };
  if (cur !== effectiveTenantPassword(tenant)) {
    return { ok: false, error: 'Неверный текущий пароль' };
  }
  if (!np) return { ok: false, error: 'Новый пароль не может быть пустым' };
  if (np.length < 4) return { ok: false, error: 'Новый пароль короче 4 символов' };
  if (np !== cp) return { ok: false, error: 'Новые пароли не совпадают' };

  const ref = authRefFor(tenant);
  if (ref && ref.set) {
    try { ref.set(np).catch(() => {}); } catch (e) { /* офлайн — останется кэш */ }
  }
  setCachedTenantPassword(tenant, np);
  return { ok: true, error: '' };
}

function resetTenantPassword(tenant) {
  const ref = authRefFor(tenant);
  if (ref && ref.remove) {
    try { ref.remove().catch(() => {}); } catch (e) {}
  }
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  delete map[tenant];
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));
}

function login(login, password) {
  if (!verifyAuth(login, password)) return false;
  localStorage.setItem(AUTH_SESSION_KEY, login);
  localStorage.setItem('crm_current_tenant', login);
  return true;
}

function logout() {
  localStorage.removeItem(AUTH_SESSION_KEY);
  localStorage.removeItem('crm_current_tenant');
  state.tasks = [];
  state.notifications = [];
  state.lastRead = {};
  state.taskCounter = 0;
  modalHistory = [];
  closeModal();
  renderAuthGate();
}

// ============ ДАННЫЕ ============

const USERS = {
  chief: { name: 'Главный механик', role: 'chief' },
  electric: { name: 'Электрик', role: 'worker' },
  locksmith: { name: 'Слесарь', role: 'worker' },
  motorist: { name: 'Моторист', role: 'worker' }
};

const COLUMNS = [
  { id: 'waiting', title: '1. Ожидает действия', cls: 'col-1' },
  { id: 'approval', title: '2. На согласовании', cls: 'col-2' },
  { id: 'parts', title: '3. Заказ / Ремонт запчастей', cls: 'col-3' },
  { id: 'inwork', title: '4. В работе', cls: 'col-4' },
  { id: 'done', title: '5. Работа завершена', cls: 'col-5' },
  { id: 'issue', title: '6. На выдачу', cls: 'col-6' }
];

const COLORS = ['#89b4fa','#a6e3a1','#f9e2af','#f38ba8','#cba6f7','#fab387','#94e2d5','#f5c2e7'];

let state = {
  tasks: [],
  notifications: [],
  currentUser: 'chief',
  notifOpen: false,
  lastRead: {},
  activeTab: 'board',
  taskCounter: 0,
  calcSort: { field: 'taskNumber', dir: 'asc' },
  statusFilter: '',
  calcAssignee: ''
};

let _dataRef = null;

function loadState() {
  const ref = dataRef();
  if (!ref) {
    state.tasks = [];
    state.notifications = [];
    state.lastRead = {};
    state.taskCounter = 0;
    render();
    return;
  }
  if (_dataRef) { try { _dataRef.off(); } catch(e){} }
  _dataRef = ref;
  ref.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state.tasks = data.tasks || [];
      state.notifications = data.notifications || [];
      state.lastRead = data.lastRead || {};
      state.taskCounter = data.taskCounter || 0;
    }
    normalizeTasks(state.tasks);
    render();
  }, (error) => {
    console.error('Firebase read error:', error);
    try {
      const saved = localStorage.getItem(localStorageFallbackKey());
      if (saved) {
        const parsed = JSON.parse(saved);
        state.tasks = parsed.tasks || [];
        state.notifications = parsed.notifications || [];
        state.lastRead = parsed.lastRead || {};
        state.taskCounter = parsed.taskCounter || 0;
      }
    } catch(e) { console.error(e); }
    normalizeTasks(state.tasks);
    render();
  });
}

function localStorageFallbackKey() {
  const t = currentTenant();
  return t ? 'crm_autoservice_' + t : 'crm_autoservice_anon';
}

function saveState() {
  const ref = dataRef();
  const data = {
    tasks: state.tasks,
    notifications: state.notifications,
    lastRead: state.lastRead,
    taskCounter: state.taskCounter
  };
  if (!ref) {
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
    return;
  }
  ref.set(data).catch(err => {
    console.error('Firebase write error:', err);
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
  });
}

function nextTaskNumber() {
  state.taskCounter = (state.taskCounter || 0) + 1;
  return state.taskCounter;
}

const PARTS_STATUS = {
  notordered: 'Не заказано',
  ordered: 'Заказано',
  instock: 'На складе'
};

const WORKS_STATUS = {
  notstarted: 'Не в работе',
  inwork: 'В работе',
  finished: 'Завершено'
};

function money(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
}

function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function partQty(p) {
  const q = parseInt(p ? p.quantity : 1, 10);
  return (isNaN(q) || q < 1) ? 1 : q;
}

function partsCost(task) { return (task.parts || []).reduce((s,p) => s + num(p.purchase) * partQty(p), 0); }
function partsRevenue(task) { return (task.parts || []).reduce((s,p) => s + num(p.sale) * partQty(p), 0); }
function worksCost(task) { return (task.works || []).reduce((s,w) => s + num(w.cost), 0); }
function worksRevenue(task) { return (task.works || []).reduce((s,w) => s + num(w.price), 0); }
function worksHours(task) { return (task.works || []).reduce((s,w) => s + num(w.hours), 0); }
function totalCost(task) { return partsCost(task) + worksCost(task); }
function totalRevenue(task) { return partsRevenue(task) + worksRevenue(task); }
function paidSum(task) { return (task.payments || []).reduce((s,p) => s + num(p.amount), 0); }
function netProfit(task) { return totalRevenue(task) - totalCost(task); }

function normalizeTasks(tasks) {
  (tasks || []).forEach(t => {
    if (!t.parts) t.parts = [];
    t.parts.forEach(p => {
      if (p.article === undefined) p.article = '';
      if (p.purchase === undefined) p.purchase = '';
      if (p.sale === undefined) p.sale = '';
      if (!p.status) p.status = 'notordered';
      const q = parseInt(p.quantity, 10);
      p.quantity = (isNaN(q) || q < 1) ? 1 : q;
      if (!Array.isArray(p.notes)) {
        p.notes = (p.note !== undefined && p.note !== null && String(p.note).trim() !== '')
          ? [String(p.note)]
          : [];
      }
      p.note = p.notes.length ? p.notes[0] : '';
    });
    if (!t.works) t.works = [];
    t.works.forEach(w => {
      if (w.hours === undefined) w.hours = '';
      if (w.cost === undefined) w.cost = '';
      if (w.price === undefined) w.price = '';
      if (!w.status) w.status = 'notstarted';
      if (!w.link) w.link = '';
      if (w.comment === undefined) w.comment = '';
    });
    if (!t.payments) t.payments = [];
    if (!t.log) t.log = [];
    if (!t.client) t.client = { name: '—', phone: '—', history: [] };
    if (!t.client.history) t.client.history = [];
    if (!t.car) t.car = { plate: '—', model: '—', year: '', vin: '' };
  });

  const numbered = (tasks || []).filter(t => typeof t.number === 'number' && t.number > 0);
  if (numbered.length) {
    state.taskCounter = Math.max(state.taskCounter || 0, ...numbered.map(t => t.number));
  }
  const unnumbered = (tasks || [])
    .filter(t => typeof t.number !== 'number' || !(t.number > 0))
    .sort((a, b) => String(a.createdAt || a.updatedAt || '').localeCompare(String(b.createdAt || b.updatedAt || '')));
  unnumbered.forEach(t => { t.number = nextTaskNumber(); });
}

function paymentState(task) {
  const rev = totalRevenue(task);
  if (rev <= 0) return 'none';
  const paid = paidSum(task);
  return paid >= rev - 0.005 ? 'paid' : 'unpaid';
}

function paymentLabel(state) {
  if (state === 'paid') return 'Оплачено';
  if (state === 'unpaid') return 'Неоплачено';
  return 'Нет суммы';
}

function paymentBadge(task) {
  const st = paymentState(task);
  const cls = st === 'paid' ? 'paid' : (st === 'unpaid' ? 'unpaid' : 'none');
  return `<span class="pay-badge ${cls}">${paymentLabel(st)}</span>`;
}

// ============ TELEGRAM ============
// Очередь: уведомления уходят по одному с паузой ~1.1 сек, чтобы не словить
// лимит Telegram (1 сообщение в секунду в один чат).
const tgQueue = [];
let tgSending = false;

function sendTelegram(text) {
  if (!appSettings.tgEnabled) return;
  if (!appSettings.tgToken || !appSettings.tgChatId) return;
  tgQueue.push(text);
  processTgQueue();
}

async function processTgQueue() {
  if (tgSending) return;
  tgSending = true;
  while (tgQueue.length) {
    const text = tgQueue.shift();
    try {
      const res = await fetch(
        `https://api.telegram.org/bot${appSettings.tgToken}/sendMessage`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: appSettings.tgChatId,
            text: text,
            parse_mode: 'HTML',
            disable_web_page_preview: true
          })
        }
      );
      const data = await res.json();
      if (!data.ok) console.warn('Telegram error:', data.description);
    } catch (e) {
      console.warn('Telegram send failed:', e);
    }
    await new Promise(r => setTimeout(r, 1100));
  }
  tgSending = false;
}

async function testTelegram() {
  const token = document.getElementById('tgToken').value.trim();
  const chatId = document.getElementById('tgChatId').value.trim();
  const out = document.getElementById('tgTestResult');
  if (!token || !chatId) {
    out.textContent = '❌ Заполните токен и chat_id';
    out.className = 'settings-msg error';
    return;
  }
  out.textContent = '⏳ Отправка...';
  out.className = 'settings-msg';
  try {
    const res = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, text: '✅ Тестовое сообщение из CRM' })
    });
    const data = await res.json();
    if (data.ok) {
      out.textContent = '✅ Сообщение отправлено';
      out.className = 'settings-msg ok';
    } else {
      out.textContent = '❌ ' + data.description;
      out.className = 'settings-msg error';
    }
  } catch (e) {
    out.textContent = '❌ ' + e.message;
    out.className = 'settings-msg error';
  }
}

// ============ ПОИСК АВТОЗАПЧАСТЕЙ ПО АРТИКУЛУ ============
function normArticle(raw) {
  const s = String(raw === null || raw === undefined ? '' : raw).trim().toUpperCase();
  return s ? encodeURIComponent(s) : '';
}

const SEARCH_SITES = [
  { id: 'drom',      title: 'Drom',      url: 'https://baza.drom.ru/oem/{ARTICLE}/' },
  { id: 'avito',     title: 'Avito',     url: 'https://www.avito.ru/all/zapchasti_i_aksessuary?q={ARTICLE}' },
  { id: 'farpost',   title: 'Farpost',   url: 'https://www.farpost.ru/oem/{ARTICLE}/' },
  { id: 'autotrade', title: 'Autotrade', url: 'https://autotrade.su/novosibirsk/find/{ARTICLE}' }
];

function searchUrl(tpl, article) {
  const a = normArticle(article);
  return a ? tpl.replace('{ARTICLE}', a) : '';
}

function openPartSearch(siteId, article) {
  const site = SEARCH_SITES.find(s => s.id === siteId);
  if (!site) return;
  const url = searchUrl(site.url, article);
  if (!url) return;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function partSearchButtonsHtml(article) {
  const a = normArticle(article);
  const disabled = a ? '' : ' disabled';
  return `<span class="part-search">${SEARCH_SITES.map(s =>
    `<button type="button" class="search-btn"${disabled} title="${s.title}: поиск по артикулу"` +
    ` onclick="event.stopPropagation();openPartSearch('${s.id}', this.dataset.article)"` +
    ` data-article="${esc(article || '')}">${s.title}</button>`
  ).join('')}</span>`;
}

function partsSummaryHtml(task) {
  const parts = task.parts || [];
  if (!parts.length) return `<div class="parts-summary empty">Запчастей нет</div>`;
  const rows = parts.map(p => {
    const name = p.name || (normArticle(p.article) ? 'Артикул ' + normArticle(p.article) : '(без названия)');
    const art = normArticle(p.article);
    const qty = partQty(p);
    return `<div class="parts-summary-line">
      ${orderedCheckHtml(p)}
      <span class="parts-summary-name">${esc(name)}${p.article ? ' <b class="art">['+esc(normArticle(p.article))+']</b>' : ''}${qty > 1 ? ' ×'+qty : ''}</span>
      <span class="parts-summary-search">${art ? partSearchButtonsHtml(p.article) : ''}</span>
      <span class="parts-summary-qty">${money(num(p.purchase)*qty)} → ${money(num(p.sale)*qty)}</span>
    </div>`;
  }).join('');
  return `<div class="parts-summary"><div class="parts-summary-head">🔩 Запчасти задачи (${parts.length})</div>${rows}</div>`;
}

function updatePartSearchButtons(input) {
  const row = input.closest('.part-row');
  if (!row) return;
  const artInput = row.querySelector('input.article');
  const article = artInput ? artInput.value : '';
  const a = normArticle(article);
  row.querySelectorAll('.search-btn').forEach(btn => {
    btn.dataset.article = article;
    btn.disabled = !a;
  });
}

function getTaskColor(id) {
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
}

function formatTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function parseTimeToMinutes(t) {
  if (!t) return Infinity;
  const d = new Date(t);
  if (isNaN(d)) return Infinity;
  return d.getTime();
}

function visibleTasksForUser() {

    list = state.tasks;
  } else {
    list = state.tasks.filter(t => !t.assignee || t.assignee === u);
  }

  }

  const sel = document.getElementById('statusFilter');
  if (!sel) return;
  const current = state.statusFilter || '';
  const opts = ['<option value="">Все статусы</option>'].concat(
    COLUMNS.map(c => `<option value="${c.id}" ${current === c.id ? 'selected' : ''}>${c.title}</option>`)

  const cnt = document.getElementById('filterCount');

    cnt.textContent = state.statusFilter

      : `Всего задач: ${total}`;
  }

function onStatusFilterChange(value) {
  state.statusFilter = value || '';
  render();
}

function statusCounts() {
  const map = {};
  COLUMNS.forEach(c => { map[c.id] = 0; });
  state.tasks.forEach(t => { if (map[t.column] !== undefined) map[t.column]++; });
  return map;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const visible = visibleTasksForUser();
  renderFilterBar();

  COLUMNS.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = `column ${col.cls}`;
    colEl.dataset.col = col.id;

    const header = document.createElement('div');
    header.className = 'column-header';
    const count = visible.filter(t => t.column === col.id).length;
    header.textContent = `${col.title} (${count})`;
    colEl.appendChild(header);

    const body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.col = col.id;

    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('drag-over'); });
    colEl.addEventListener('dragleave', () => colEl.classList.remove('drag-over'));
    colEl.addEventListener('drop', e => {
      e.preventDefault();
      colEl.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (id) tryMoveTask(id, col.id);
    });

    const tasks = visible.filter(t => t.column === col.id)
      .sort((a,b) => parseTimeToMinutes(b.updatedAt) - parseTimeToMinutes(a.updatedAt));

    tasks.forEach(t => body.appendChild(renderTask(t)));

    if (tasks.length === 0) {
      const em = document.createElement('div');
      em.className = 'empty-msg';
      em.textContent = 'Пусто';
      body.appendChild(em);
    }

    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

function renderTask(task) {
  const el = document.createElement('div');
  el.className = 'task';
  el.draggable = true;
  el.dataset.id = task.id;
  el.style.borderLeftColor = getTaskColor(task.id);

  el.innerHTML = `
    <div class="task-header">
      <span class="task-title">${esc(task.car.plate)} · ${esc(task.car.model)}</span>
    </div>
    <div class="task-row">⏰ ${formatTime(task.scheduledTime)}</div>
    ${appSettings.showAssignee ? `<div class="task-row">👤 ${task.assignee ? USERS[task.assignee].name : '—'}</div>` : ''}
    ${appSettings.showPost ? `<div class="task-row">🅿️ Пост №${task.post || '—'}</div>` : ''}
    ${taskStatusBadgesHtml(task)}
    <div class="task-row">💰 ${money(totalRevenue(task))} · 📥 ${money(paidSum(task))}</div>
    <div class="task-row">${paymentBadge(task)}</div>
  `;

  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', task.id);
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

function partStatusBadge(p) {
  const cls = p.status === 'instock' ? 'badge-green'
            : p.status === 'ordered' ? 'badge-yellow'
            : 'badge-red';
  const label = PARTS_STATUS[p.status] || p.status || '—';
  return `<span class="badge ${cls} item-badge" title="Запчасть: ${esc(p.name)}">🔩 ${esc(p.name)}: ${label}</span>`;
}

function workStatusBadge(w) {
  const cls = w.status === 'finished' ? 'badge-green'
            : w.status === 'inwork' ? 'badge-yellow'
            : 'badge-red';
  const label = WORKS_STATUS[w.status] || w.status || '—';
  const hours = num(w.hours) > 0 ? ` · ${num(w.hours)} ч` : '';
  return `<span class="badge ${cls} item-badge" title="Работа: ${esc(w.name)}">🛠 ${esc(w.name)}: ${label}${hours}</span>`;
}

function issuedBadgeHtml(task) {
  if (task.column !== 'issue' && !task.issued) return '';
  return task.issued
    ? `<span class="badge badge-green" title="Запчасти выданы клиенту">ВЫДАНО</span>`
    : `<span class="badge badge-red" title="Запчасти ещё не выданы">НЕ ВЫДАНО</span>`;
}

function taskStatusBadgesHtml(task) {
  const parts = (task.parts || []).map(partStatusBadge);
  const works = (task.works || []).map(workStatusBadge);
  const issued = issuedBadgeHtml(task);
  const hasAny = parts.length || works.length || issued;
  if (!hasAny) {
    return `<div class="task-row"><span class="badge badge-gray">Нет запчастей и работ</span></div>`;
  }
  return `
    <div class="task-badges">
      ${issued}
      ${parts.join('')}
      ${works.join('')}
    </div>
  `;
}

function getPartsSummary(task) {
  if (!task.parts || task.parts.length === 0) return '';
  const statuses = task.parts.map(p => p.status);
  if (statuses.every(s => s === 'instock')) return `<span class="badge badge-green">Запчасти: на складе</span>`;
  if (statuses.some(s => s === 'notordered')) return `<span class="badge badge-red">Запчасти: не заказано</span>`;
  return `<span class="badge badge-yellow">Запчасти: заказаны</span>`;
}

function getWorksSummary(task) {
  if (!task.works || task.works.length === 0) return '';
  const statuses = task.works.map(w => w.status);
  if (statuses.every(s => s === 'finished')) return `<span class="badge badge-green">Работы: завершено</span>`;
  if (statuses.some(s => s === 'notstarted')) return `<span class="badge badge-red">Работы: не в работе</span>`;
  return `<span class="badge badge-yellow">Работы: в работе</span>`;
}

function tryMoveTask(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  const u = state.currentUser;
  if (USERS[u].role === 'worker') {
    if (task.assignee && task.assignee !== u) {
      alert('Вы не можете изменять эту задачу');
      return;
    }
    if (!task.assignee) {
      if (newCol !== 'inwork') {
        alert('Сначала возьмите задачу в работу (назначьте себя исполнителем)');
        return;
      }
    }
  }

  if (task.column === newCol) return;

  openMoveModal(taskId, newCol);
}

function toLocalInput(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ===== СЛОТЫ ВРЕМЕНИ С ШАГОМ 30 МИНУТ =====
const SLOT_START_HOUR = 8;
const SLOT_END_HOUR = 20;
const SLOT_STEP_MIN = 30;

function timeSlots() {
  const out = [];
  const totalStart = SLOT_START_HOUR * 60;
  const totalEnd = SLOT_END_HOUR * 60;
  for (let m = totalStart; m <= totalEnd; m += SLOT_STEP_MIN) {
    const h = Math.floor(m / 60);
    const mm = m % 60;
    out.push(String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
  }
  return out;
}

function roundToSlot(hhmm) {
  const slots = timeSlots();
  if (!hhmm) return slots[0];
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m;
  const snapped = Math.round(total / SLOT_STEP_MIN) * SLOT_STEP_MIN;
  const hh = Math.floor(snapped / 60);
  const mm = snapped % 60;
  const res = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  return slots.includes(res) ? res : slots[0];
}

function isoToDateTimeParts(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d)) return { date: '', time: '' };
  const pad = n => String(n).padStart(2,'0');
  return {
    date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
  };
}

function schedDateStr(d) {
  const dt = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function partsToIso(date, time) {
  if (!date) return null;
  const t = roundToSlot(time || '');
  const d = new Date(`${date}T${t}:00`);
  if (isNaN(d)) return null;
  return d.toISOString();
}

function schedulePickerHtml(prefix, iso, label, defaultToday) {
  const parts = isoToDateTimeParts(iso);
  const slots = timeSlots();
  const selected = parts.time ? roundToSlot(parts.time) : '';
  let dateVal = parts.date;
  if (!dateVal && defaultToday) {
    dateVal = schedDateStr(new Date());
  }
  const opts = ['<option value="">— время —</option>'].concat(
    slots.map(s => `<option value="${s}" ${selected === s ? 'selected' : ''}>${s}</option>`)
  ).join('');
  return `
    <label>${label || 'Дата и время записи'} (шаг 30 минут)</label>
    <div class="sched-picker">
      <input type="date" id="${prefix}_date" value="${dateVal}">
      <select id="${prefix}_time" class="slot-select">${opts}</select>
    </div>
  `;
}

function getScheduleValue(prefix) {
  const dateEl = document.getElementById(prefix + '_date');
  const timeEl = document.getElementById(prefix + '_time');
  if (!dateEl) return null;
  return partsToIso(dateEl.value, timeEl ? timeEl.value : '');
}

function isValidSlot(hhmm) {
  if (!hhmm) return true;
  const [h, m] = hhmm.split(':').map(Number);
  return m === 0 || m === 30;
}

function extractUrl(text) {
  if (!text) return '';
  const m = String(text).match(/https?:\/\/[^\s<>"']+/i);
  return m ? m[0] : '';
}

function openPartNoteLink(input) {

}

function stepPartQty(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.qty-input');
  if (!input) return;
  let q = parseInt(input.value, 10);
  if (isNaN(q)) q = 1;
  q += delta;
  if (q < 1) q = 1;
  input.value = String(q);
  updatePartRowTotal(input);
}

function updatePartRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const qtyInput = row.querySelector('input.qty-input');
  const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
  const purchase = num(nums[0] ? nums[0].value : 0);
  const sale = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = (sale - purchase) * (qty < 1 ? 1 : qty);
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}

function collectPartRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const parts = [];
  rows.forEach(r => {
    const nameInput = r.querySelector('input.name-input');
    const articleInput = r.querySelector('input.article');
    const qtyInput = r.querySelector('input.qty-input');
    const numInputs = r.querySelectorAll('input.num');
    const notes = Array.from(r.querySelectorAll('input.note-input'))
      .map(n => n.value.trim())
      .filter(v => v !== '');
    const name = nameInput ? nameInput.value.trim() : '';
    const article = articleInput ? articleInput.value.trim() : '';
    const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
    const purchase = numInputs[0] ? numInputs[0].value.trim() : '';
    const sale = numInputs[1] ? numInputs[1].value.trim() : '';
    const statusSelect = r.querySelector('select.work-status');
    const status = statusSelect ? statusSelect.value : 'notordered';
    if (name || article || notes.length || purchase || sale) {
      parts.push({
        name, article,
        notes,
        note: notes.length ? notes[0] : '',
        link: '',
        quantity: qty < 1 ? 1 : qty,
        purchase, sale, status
      });
    }
  });
  return parts;
}

function confirmMove(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  const oldCol = task.column;
  const user = USERS[state.currentUser].name;
  const logEntries = [];

  if (newCol === 'waiting') {
    const v = document.getElementById('mExpectedAction').value.trim();
    task.pendingAction = v;
    logEntries.push(`Ожидаемое действие: ${v || '(не указано)'}`);
  } else if (newCol === 'approval') {
    const v = document.getElementById('mApproval').value.trim();
    task.approvalNote = v;
    logEntries.push(`Согласовать: ${v || '(не указано)'}`);
  } else if (newCol === 'parts') {
    const parts = collectPartRows('#partsList');
    task.parts = parts;
    logEntries.push(`Запчасти: ${parts.map(p=>p.name).join(', ') || '(нет)'}. Закупка: ${money(partsCost(task))}, продажа: ${money(partsRevenue(task))}`);
  } else if (newCol === 'inwork') {
    const assigneeEl = document.getElementById('mAssignee');
    const postEl = document.getElementById('mPost');
    const time = getScheduleValue('m');
    const works = collectWorkRows('#mWorksList');

    if (assigneeEl) {
      const assignee = assigneeEl.value;
      if (!assignee) { alert('Назначьте исполнителя'); return; }
      task.assignee = assignee;
    } else if (!task.assignee) {
      const freeWorker = Object.keys(USERS).find(k => USERS[k].role === 'worker' &&
        !state.tasks.some(t => t.assignee === k && t.column === 'inwork'));
      task.assignee = freeWorker || Object.keys(USERS).find(k => USERS[k].role === 'worker');
    }

    if (postEl) {
      task.post = parseInt(postEl.value);
    } else if (!task.post) {
      task.post = 1;
    }

    if (!time) { alert('Укажите время'); return; }
    task.scheduledTime = new Date(time).toISOString();
    if (works.length) {
      task.works = works;
      const hoursTotal = worksHours(task);
      logEntries.push(`Работы: ${works.map(w => w.name + (num(w.hours) > 0 ? ' (' + num(w.hours) + ' ч)' : '')).join(', ')}`);
      if (hoursTotal > 0) logEntries.push(`Всего часов: ${num(hoursTotal)}`);
    }

    const assigneeTxt = task.assignee ? USERS[task.assignee].name : '—';
    logEntries.push(`Исполнитель: ${assigneeTxt}, Пост №${task.post}, Время: ${formatTime(task.scheduledTime)}`);
  } else if (newCol === 'done') {
    const worksDone = collectDoneWorkRows();
    const cmEl = document.getElementById('mDoneComment');
    const cm = cmEl ? cmEl.value.trim() : '';
    if (worksDone && worksDone.length) {
      task.works = worksDone;
      const finished = worksDone.filter(w => w.status === 'finished').length;
      logEntries.push(`Работы: ${worksDone.map(w => w.name + ' — ' + (WORKS_STATUS[w.status] || w.status) + (w.comment ? ' (' + w.comment + ')' : '')).join(', ')}`);
      logEntries.push(`Завершено работ: ${finished} из ${worksDone.length}`);
    }
    task.doneComment = cm;
    if (cm) logEntries.push(`Общий комментарий: ${cm}`);
  } else if (newCol === 'issue') {
    const wdEl = document.getElementById('mWorkDone');
    const rcEl = document.getElementById('mRecommend');
    const issEl = document.getElementById('mIssued');
    const wd = wdEl ? wdEl.value.trim() : '';
    const rc = rcEl ? rcEl.value.trim() : '';
    task.workDone = wd;
    task.recommendations = rc;
    if (issEl) task.issued = issEl.value === '1';
    if (wd) logEntries.push(`Проделанные работы: ${wd}`);
    if (rc) logEntries.push(`Рекомендации: ${rc}`);
    logEntries.push(`Статус выдачи: ${task.issued ? 'ВЫДАНО' : 'НЕ ВЫДАНО'}`);
  }

  const fromTitle = COLUMNS.find(c=>c.id===oldCol).title;
  const toTitle = COLUMNS.find(c=>c.id===newCol).title;

  task.column = newCol;
  task.updatedAt = new Date().toISOString();

  task.log.push({
    time: new Date().toISOString(),
    user: user,
    text: `Перемещение: ${fromTitle} → ${toTitle}` + (logEntries.length ? '. ' + logEntries.join(' | ') : '')
  });

  if (!task.color) task.color = getTaskColor(task.id);

  notifyAboutTask(task, `Задача ${task.car.plate} перемещена в "${toTitle}"`);

  saveState();
  closeModal();
  render();
}

function removePartFromTask(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.parts || !task.parts[index]) return;
  const p = task.parts[index];
  const label = p.name || p.article || 'запчасть';
  if (!confirm(`Удалить запчасть «${label}» из задачи?`)) return;
  task.parts.splice(index, 1);
  task.log.push({
    time: new Date().toISOString(),
    user: USERS[state.currentUser].name,
    text: `Удалена запчасть: ${label}${p.article ? ' [' + normArticle(p.article) + ']' : ''}`
  });
  task.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
  setTimeout(() => openTaskView(taskId), 50);
}

function copyVin(vin) {
  navigator.clipboard.writeText(vin).then(() => alert('VIN скопирован: ' + vin)).catch(()=>{});
}

function toggleIssued(taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  t.issued = !t.issued;
  t.log.push({
    time: new Date().toISOString(),
    user: USERS[state.currentUser].name,
    text: `Статус выдачи: ${t.issued?'ВЫДАНО':'НЕ ВЫДАНО'}`
  });
  saveState();
  closeModal();
  render();
  setTimeout(()=>openTaskView(taskId), 100);
}

// ============ УДАЛЕНИЕ ЗАДАЧИ ============
function deleteTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const info = `Задача ${task.car.plate} · ${task.car.model}\nКлиент: ${task.client.name}\n` +
    `Расходы: ${money(totalCost(task))} · Доходы: ${money(totalRevenue(task))}\n` +
    `Оплачено: ${money(paidSum(task))} · Чистая прибыль: ${money(netProfit(task))}`;
  if (!confirm('Удалить задачу безвозвратно?\n\n' + info)) return;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal" style="max-width:460px">
      <h2>🗑 Удаление задачи</h2>
      <div class="readonly-field">${esc(info).replace(/\n/g,'<br>')}</div>
      <label>Укажите причину удаления (попадёт в уведомления)</label>
      <textarea id="delReason" placeholder="Например: создана по ошибке"></textarea>
      <div class="modal-actions">
        <button onclick="closeModal()">Отмена</button>
        <button class="danger" onclick="confirmDeleteTask('${taskId}')">Удалить</button>
      </div>
    </div>
  `;
  document.getElementById('modalContainer').appendChild(modal);
}

function confirmDeleteTask(taskId) {
  const idx = state.tasks.findIndex(t => t.id === taskId);
  if (idx === -1) { closeModal(); return; }
  const task = state.tasks[idx];
  const reason = (document.getElementById('delReason')?.value || '').trim();

  state.tasks.splice(idx, 1);
  state.notifications = (state.notifications || []).filter(n => n.taskId !== taskId);

  state.notifications.push({
    id: uid(),
    taskId: null,
    message: `🗑 Задача ${task.car.plate} удалена (${USERS[state.currentUser].name})${reason ? ': ' + reason : ''}`,
    time: new Date().toISOString(),
    read: false
  });
  if (state.notifications.length > 100) state.notifications = state.notifications.slice(-100);

  // ↓↓↓ Telegram
  sendTelegram(
    `🗑 <b>Удаление задачи</b>\n` +
    `${esc(task.car.plate)} · ${esc(task.car.model)}\n` +
    `Клиент: ${esc(task.client.name)}\n` +
    (reason ? `Причина: ${esc(reason)}` : '')
  );

  saveState();
  closeModal();
  render();
}

        <label>Текущий комментарий (только чтение)</label>

        <label>Добавить комментарий</label>
        <textarea id="ce_newComment" placeholder="Новый комментарий"></textarea>
      `;
      break;
    case 'log':
      title = '📜 Лог задачи';
      content = task.log.length
        ? `<div class="task-log-list">${task.log.slice().reverse().map(l => `
            <div class="log-entry">
              <span class="log-time">${formatTime(l.time)} — ${l.user}</span>
              <span class="log-text">${esc(l.text)}</span>
            </div>
          `).join('')}</div>`
        : '<div class="empty-msg">Записей пока нет</div>';
      break;
  }

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-titlebar">
        <h2>${title}</h2>
        <div class="modal-title-actions">
          <button class="back-btn" onclick="modalBack()">← Назад</button>

        </div>

      <div class="modal-actions">
        <button onclick="closeModal()">Отмена</button>
        ${field !== 'log' ? `<button class="primary" onclick="saveChar('${taskId}','${field}')">Сохранить</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('modalContainer').appendChild(modal);
  pushModalHistory(() => openCharEditor(taskId, field), title);

    const list = document.getElementById('ce_partsList');
    (task.parts && task.parts.length ? task.parts : [{name:'',status:'notordered'}]).forEach(p => addCePartRow(p));
  }
  if (field === 'works') {
    const list = document.getElementById('ce_worksList');
    (task.works && task.works.length ? task.works : [{name:'',status:'notstarted'}]).forEach(w => addCeWorkRow(w));
  }
}

function collectDoneWorkRows() {
  const list = document.getElementById('mWorksDone');
  if (!list) return null;
  const rows = list.querySelectorAll('.part-row');
  const works = [];
  rows.forEach(r => {
    const name = r.querySelector('input.name-input');
    const hrs = r.querySelector('input.hours-input');
    const nums = r.querySelectorAll('input.num');
    const sel = r.querySelector('select.work-status');
    const cm = r.querySelector('input.work-comment');
    const work = {
      name: name ? name.value.trim() : '',
      hours: hrs ? hrs.value.trim() : '',
      cost: nums[0] ? nums[0].value.trim() : '',
      price: nums[1] ? nums[1].value.trim() : '',
      status: sel ? sel.value : 'notstarted',
      comment: cm ? cm.value.trim() : ''
    };
    if (work.name || work.hours || work.cost || work.price || work.comment) {
      works.push(work);
    }
  });
  return works;
}

function stepWorkHours(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.hours-input');
  if (!input) return;
  const current = num(input.value);
  let next = Math.round((current + delta) * 2) / 2;
  if (next < 0) next = 0;
  input.value = next === 0 ? '0' : String(next);
  updateWorkRowTotal(input);
}

function updateWorkRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const cost = num(nums[0] ? nums[0].value : 0);
  const price = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = price - cost;
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}

function collectWorkRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const works = [];
  rows.forEach(r => {
    const nameInput = r.querySelector('input.name-input');
    const hoursInput = r.querySelector('input.hours-input');
    const numInputs = r.querySelectorAll('input.num');
    const name = nameInput ? nameInput.value.trim() : '';
    const hours = hoursInput ? hoursInput.value.trim() : '';
    const cost = numInputs[0] ? numInputs[0].value.trim() : '';
    const price = numInputs[1] ? numInputs[1].value.trim() : '';
    const statusSelect = r.querySelector('select');
    const status = statusSelect ? statusSelect.value : 'notstarted';
    if (name) works.push({ name, hours, cost, price, status, link: '' });
  });
  return works;
}

function removePayment(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.payments) return;
  const p = task.payments[index];
  if (!p) return;
  if (!confirm(`Удалить оплату ${money(p.amount)} от ${formatTime(p.date)}?`)) return;
  task.payments.splice(index, 1);
  task.log.push({
    time: new Date().toISOString(),
    user: USERS[state.currentUser].name,
    text: `Удалена оплата: ${money(p.amount)} (${formatTime(p.date)})`
  });
  task.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
  setTimeout(()=>openCharEditor(taskId, 'payments'), 100);
}

function saveChar(taskId, field) {
  const task = state.tasks.find(t => t.id === taskId);
  const user = USERS[state.currentUser].name;
  let logText = '';

  if (field === 'car') {
    task.car.plate = document.getElementById('ce_plate').value.trim();
    task.car.model = document.getElementById('ce_model').value.trim();
    task.car.year = document.getElementById('ce_year').value;
    logText = `Авто изменено: ${task.car.plate} ${task.car.model} ${task.car.year}`;
  } else if (field === 'vin') {
    task.car.vin = document.getElementById('ce_vin').value.trim().toUpperCase();
    logText = `VIN изменён: ${task.car.vin}`;
  } else if (field === 'time') {
    const v = getScheduleValue('ce');
    task.scheduledTime = v;
    logText = `Время изменено: ${formatTime(task.scheduledTime)}`;
  } else if (field === 'assignee') {
    task.assignee = document.getElementById('ce_assignee').value || null;
    logText = `Исполнитель: ${task.assignee ? USERS[task.assignee].name : 'не назначен'}`;
  } else if (field === 'post') {
    const v = document.getElementById('ce_post').value;
    task.post = v ? parseInt(v) : null;
    logText = `Пост: ${task.post ? '№'+task.post : '—'}`;
  } else if (field === 'parts') {
    const parts = collectPartRows('#ce_partsList');
    task.parts = parts;
    logText = `Запчасти обновлены: ${parts.map(p=>`${p.name || '(без названия)'}${p.article ? ' ['+normArticle(p.article)+']' : ''}${p.note ? ' — '+p.note : ''} (${PARTS_STATUS[p.status]||p.status}, закупка ${money(p.purchase)}, продажа ${money(p.sale)})`).join(', ') || '—'}`;
  } else if (field === 'works') {
    const works = collectWorkRows('#ce_worksList');
    task.works = works;
    logText = `Работы обновлены: ${works.map(w=>`${w.name} (${WORKS_STATUS[w.status]||w.status}, себест. ${money(w.cost)}, цена ${money(w.price)})`).join(', ') || '—'}`;
  } else if (field === 'payments') {
    const amountRaw = document.getElementById('ce_payAmount').value.trim();
    const amount = num(amountRaw);
    if (!amountRaw || amount <= 0) { alert('Укажите сумму оплаты больше нуля'); return; }
    const dateVal = document.getElementById('ce_payDate').value;
    const comment = document.getElementById('ce_payComment').value.trim();
    task.payments = task.payments || [];
    task.payments.push({
      date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
      amount: amount,
      comment: comment,
      user: user
    });
    logText = `Внесена оплата: ${money(amount)}${comment ? ' (' + comment + ')' : ''}. Всего оплачено: ${money(paidSum(task))}`;
  } else if (field === 'finance') {
    // только просмотр
  } else if (field === 'client') {
    task.client.name = document.getElementById('ce_clientName').value.trim();
    task.client.phone = document.getElementById('ce_clientPhone').value.trim();
    const add = document.getElementById('ce_historyAdd').value.trim();
    if (add) {
      task.client.history = task.client.history || [];
      task.client.history.push(add);
    }
    logText = `Клиент изменён: ${task.client.name} ${task.client.phone}${add ? ' + запись в историю' : ''}`;
  } else if (field === 'reason') {
    task.reason = document.getElementById('ce_reason').value.trim();
    logText = `Причина изменена: ${task.reason}`;
  } else if (field === 'comment') {
    const nc = document.getElementById('ce_newComment').value.trim();
    if (nc) {
      task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;
      logText = `Добавлен комментарий: ${nc}`;
    }
  }

  if (logText) {
    task.log.push({ time: new Date().toISOString(), user, text: logText });
    task.updatedAt = new Date().toISOString();
    notifyAboutTask(task, `${task.car.plate}: ${logText}`);
  }

  saveState();
  closeModal();
  render();
  setTimeout(()=>{
    if (field === 'payments' || field === 'finance') openCharEditor(taskId, field);
    else openTaskView(taskId);
  }, 100);
}

function saveEditTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  const user = USERS[state.currentUser].name;
  const changes = [];

  const nv = (id) => document.getElementById(id).value.trim();

  if (task.car.plate !== nv('e_plate')) { changes.push(`Госномер: ${task.car.plate}→${nv('e_plate')}`); task.car.plate = nv('e_plate'); }
  if (task.car.model !== nv('e_model')) { changes.push(`Модель: ${task.car.model}→${nv('e_model')}`); task.car.model = nv('e_model'); }
  if (String(task.car.year) !== nv('e_year')) { changes.push(`Год: ${task.car.year}→${nv('e_year')}`); task.car.year = nv('e_year'); }
  if (task.car.vin !== nv('e_vin').toUpperCase()) { changes.push(`VIN изменён`); task.car.vin = nv('e_vin').toUpperCase(); }
  if (task.client.name !== nv('e_clientName')) { changes.push(`Клиент: ${task.client.name}→${nv('e_clientName')}`); task.client.name = nv('e_clientName'); }
  if (task.client.phone !== nv('e_clientPhone')) { changes.push(`Телефон: ${task.client.phone}→${nv('e_clientPhone')}`); task.client.phone = nv('e_clientPhone'); }
  if (task.reason !== nv('e_reason')) { changes.push(`Причина изменена`); task.reason = nv('e_reason'); }

  const nc = nv('e_newComment');
  if (nc) {
    task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;
    changes.push(`Комментарий: ${nc}`);
  }

  if (changes.length) {
    task.log.push({ time: new Date().toISOString(), user, text: 'Редактирование. ' + changes.join('; ') });
    task.updatedAt = new Date().toISOString();
    notifyAboutTask(task, `Задача ${task.car.plate} отредактирована`);
  }

  saveState();
  closeModal();
  render();
  setTimeout(()=>openTaskView(taskId), 100);
}

// ============ РАСПИСАНИЕ ============
let scheduleDate = null;

function schedDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function shiftScheduleDate(delta) {
  const base = scheduleDate ? new Date(scheduleDate) : new Date();
  base.setHours(0,0,0,0);
  base.setDate(base.getDate() + delta);
  scheduleDate = dateStrToKey(base);
  showSchedule();
}

function scheduleTasksForDate() {
  const key = scheduleDate || schedDateStr(new Date());
  return state.tasks.filter(t => {
    if (!t.scheduledTime) return false;
    const d = new Date(t.scheduledTime);
    return schedDateStr(d) === key;
  }).sort((a,b)=>parseTimeToMinutes(a.scheduledTime)-parseTimeToMinutes(b.scheduledTime));
}

function dateStrToKey(d) {
  return schedDateStr(d);
}

function showSchedule() {
  const base = scheduleDate ? new Date(scheduleDate + 'T00:00:00') : new Date();
  const today = new Date();
  const isToday = schedDateStr(base) === schedDateStr(today);
  const tasks = scheduleTasksForDate();

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  const fmtDate = base.toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric', weekday:'short' });

  let html = `
    <div class="modal-titlebar">
      <h2>📅 Расписание постов</h2>
      <div class="modal-title-actions">
        <button class="back-btn" onclick="closeModal()">×</button>
      </div>
    </div>
    <div class="sched-datebar">
      <button onclick="shiftScheduleDate(-1)">‹</button>
      <span class="sched-date-label">${fmtDate}</span>
      <button onclick="shiftScheduleDate(1)">›</button>
      ${isToday ? '' : `<button onclick="goScheduleToday()">Сегодня</button>`}
    </div>
  `;

  if (tasks.length === 0) {
    html += `<div class="schedule-empty">На эту дату нет записей</div>`;
  } else {
    for (let i=1; i<=4; i++) {
      html += `<h3>Пост №${i}</h3>`;
      const postTasks = tasks.filter(t => t.post === i);
      if (postTasks.length === 0) {
        html += `<div class="schedule-post">Свободен</div>`;
      } else {
        postTasks.forEach(t => {
          const time = new Date(t.scheduledTime);
          const timeStr = String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
          html += `<div class="schedule-post">
            <b>${timeStr}</b> — ${t.car.plate} (${t.car.model})<br>
            <small>${t.assignee?USERS[t.assignee].name:'—'}${(t.works && t.works.length) ? ' · ' + t.works.map(w=>esc(w.name)).join(', ') : ''}</small>
          </div>`;
        });
      }
    }
  }

  modal.innerHTML = `<div class="modal">${html}
    <div class="modal-actions"><button onclick="closeModal()">Закрыть</button></div>
  </div>`;
  document.getElementById('modalContainer').appendChild(modal);
}

function goScheduleToday() {
  scheduleDate = null;
  showSchedule();
}

function showPostSchedule(postNum) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  let html = `<h2>📅 Расписание поста №${postNum}</h2>`;
  const tasks = state.tasks.filter(t => t.post === postNum).sort((a,b)=>parseTimeToMinutes(a.scheduledTime)-parseTimeToMinutes(b.scheduledTime));
  if (tasks.length === 0) html += '<div class="schedule-post">Нет задач</div>';
  tasks.forEach(t => {
    html += `<div class="schedule-post">
      <b>${formatTime(t.scheduledTime)}</b> — ${t.car.plate} (${t.car.model})<br>
      <small>Столбец: ${COLUMNS.find(c=>c.id===t.column).title}</small><br>
      <small>Исполнитель: ${t.assignee?USERS[t.assignee].name:'—'}</small>
    </div>`;
  });
  modal.innerHTML = `<div class="modal">${html}
    <div class="modal-actions"><button onclick="closeModal()">Закрыть</button></div>
  </div>`;
  document.getElementById('modalContainer').appendChild(modal);
}

  { field: 'inc_works', title: 'Работа (цена)',       type: 'num', cls: 'inc' },
  { field: 'exp_total', title: 'Расходы (общие)',     type: 'num', cls: 'exp' },
  { field: 'paid',      title: 'Оплачено',           type: 'num', cls: 'paid' },
  { field: 'debt',      title: 'Долг',               type: 'num', cls: 'debt' },
  { field: 'inc_total', title: 'Доходы (общие)',      type: 'num', cls: 'inc' },
  { field: 'profit',    title: 'Чистая прибыль',      type: 'num', cls: 'profit' },
  { field: 'payStatus', title: 'Оплата',             type: 'task' },
  { field: 'status',    title: 'Статус задачи',       type: 'task' }
];

function debtOf(task) {
  const d = totalRevenue(task) - paidSum(task);
  return d > 0 ? d : 0;
}

function calcTaskRow(t) {
  const paySt = paymentState(t);
  return {
    number: t.number || 0,
    createdAt: t.createdAt || t.updatedAt || '',
    plate: t.car.plate,
    reason: t.reason,
    exp_parts: partsCost(t),
    inc_parts: partsRevenue(t),
    exp_works: worksCost(t),
    inc_works: worksRevenue(t),
    exp_total: totalCost(t),
    paid: paidSum(t),
    debt: debtOf(t),
    inc_total: totalRevenue(t),
    profit: netProfit(t),
    payStatus: paymentLabel(paySt),
    payStatusCode: paySt,
    status: (COLUMNS.find(c => c.id === t.column) || {}).title || '—'
  };
}

function renderCalculator() {
  const el = document.getElementById('calcView');
  if (!el) return;

  const tasks = visibleTasksForUser();

  const assigneeFilter = state.calcAssignee || '';
  const filtered = !assigneeFilter ? tasks
                 : assigneeFilter === '__none__' ? tasks.filter(t => !t.assignee)
                 : tasks.filter(t => t.assignee === assigneeFilter);

  const rows = filtered.map(t => ({ task: t, row: calcTaskRow(t) }));

  const { field, dir } = state.calcSort;
  rows.sort((a, b) => {
    let va = a.row[field], vb = b.row[field];
    if (typeof va === 'string' || typeof vb === 'string') {
      va = String(va || '').toLowerCase();
      vb = String(vb || '').toLowerCase();
      return dir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
    }
    va = num(va); vb = num(vb);
    return dir === 'asc' ? va - vb : vb - va;
  });

  const sum = (f) => rows.reduce((s, r) => s + num(r.row[f]), 0);
  const expParts = sum('exp_parts'), expWorks = sum('exp_works'), expTotal = sum('exp_total');
  const incParts = sum('inc_parts'), incWorks = sum('inc_works'), incTotal = sum('inc_total');
  const paid = sum('paid'), profit = sum('profit'), debt = sum('debt');
  const doneCount = filtered.filter(t => t.column === 'done' || t.column === 'issue').length;

  const arrow = (f) => field === f ? (dir === 'asc' ? ' ▲' : ' ▼') : '';

  el.innerHTML = `
    <div class="calc-assignee-bar">
      <label>👤 Разделить по исполнителям:</label>
      <select onchange="state.calcAssignee=this.value; renderCalculator();">
        <option value="">Все исполнители</option>
        ${Object.keys(USERS).filter(k => USERS[k].role === 'worker').map(k =>
          `<option value="${k}" ${assigneeFilter === k ? 'selected' : ''}>${USERS[k].name}</option>`
        ).join('')}
        <option value="__none__" ${assigneeFilter === '__none__' ? 'selected' : ''}>Без исполнителя</option>
      </select>
      <span class="calc-assignee-count">Показано задач: ${filtered.length} из ${tasks.length}</span>
    </div>
    <div class="calc-summary">
      <div class="calc-card red">
        <div class="calc-card-title">Расходы (общие)</div>
        <div class="calc-card-value">${money(expTotal)}</div>
      </div>
      <div class="calc-card green">
        <div class="calc-card-title">Доходы (общие)</div>
        <div class="calc-card-value">${money(incTotal)}</div>
      </div>
      <div class="calc-card blue">
        <div class="calc-card-title">Оплачено</div>
        <div class="calc-card-value">${money(paid)}</div>
      </div>
      <div class="calc-card ${debt > 0 ? 'red' : 'green'}">
        <div class="calc-card-title">Долг</div>
        <div class="calc-card-value">${money(debt)}</div>
      </div>
      <div class="calc-card ${profit < 0 ? 'red' : 'green'}">
        <div class="calc-card-title">Чистая прибыль</div>
        <div class="calc-card-value">${money(profit)}</div>
      </div>
      <div class="calc-card">
        <div class="calc-card-title">Задач / завершено</div>
        <div class="calc-card-value">${tasks.length} / ${doneCount}</div>
      </div>
    </div>
    <div class="calc-hint">Нажмите на любую строку или ячейку — откроется окно задачи для редактирования. Заголовок столбца — сортировка (столбец «№» сортирует по временной шкале).</div>
    <table class="calc-table">
      <thead>
        <tr>
          ${CALC_FIELDS.map(f => `<th class="${f.type === 'num' ? 'num' : ''}" onclick="sortCalc('${f.field}')">${f.title}${arrow(f.field)}</th>`).join('')}
          <th class="del-cell"></th>

      <tbody>
        ${rows.length === 0 ? `<tr><td colspan="${CALC_FIELDS.length+1}" class="empty-msg">Нет задач для калькуляции</td></tr>` : ''}
        ${rows.map(r => {
          const row = r.row;

          <td class="num inc">${money(incTotal)}</td>

  `;

function sortCalc(field) {
  if (state.calcSort.field === field) {
    state.calcSort.dir = state.calcSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    state.calcSort.field = field;
    state.calcSort.dir = 'asc';
  }
  renderCalculator();
}

function notifyAboutTask(task, message) {
  // ↓↓↓ Отправка в Telegram (все события, проходящие через notifyAboutTask)
  sendTelegram(`🔧 <b>CRM Автосервис</b>\n${esc(message)}`);

    taskId: task.id,
    message,
    time: new Date().toISOString(),

  };
  state.notifications.push(notif);
  if (state.notifications.length > 100) state.notifications = state.notifications.slice(-100);
  saveState();
  renderNotifications();
  updateBadge();
}

function notificationsForUser() {
  const u = state.currentUser;
  if (USERS[u].role === 'chief') return state.notifications;
  return state.notifications.filter(n => {
    const t = state.tasks.find(x => x.id === n.taskId);
    return t && t.assignee === u;
  });
}

function updateBadge() {
  const notifs = notificationsForUser();
  const unread = notifs.filter(n => !n.read).length;

  if (unread > 0) {
    badge.style.display = 'flex';
    badge.textContent = unread > 99 ? '99+' : unread;
  } else {
    badge.style.display = 'none';
  }
}

function toggleNotifications() {
  state.notifOpen = !state.notifOpen;
  renderNotifications();

    notificationsForUser().forEach(n => n.read = true);
    saveState();
    updateBadge();

}

function renderNotifications() {

  if (!state.notifOpen) { panel.innerHTML = ''; return; }
