function renderCalculator() {
  const el = document.getElementById('calcView');
  if (!el) return;
  const tasks = visibleTasksForCalc();
  const assigneeFilter = state.calcAssignee || '';
  const filtered = !assigneeFilter ? tasks
    : assigneeFilter === '__none__' ? tasks.filter(t => !t.assignee)
    : tasks.filter(t => t.assignee === assigneeFilter);
  const rows = filtered.map(t => ({ task: t, row: calcTaskRow(t) }));
  const { field, dir } = state.calcSort;
  rows.sort((a, b) => {
    let va = a.row[field], vb = b.row[field];
    if (typeof va === 'string' || typeof vb === 'string') {
      va = String(va || '').toLowerCase(); vb = String(vb || '').toLowerCase();
      return dir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
    }
    return dir === 'asc' ? num(va) - num(vb) : num(vb) - num(va);
  });
  const sum = (f) => rows.reduce((s, r) => s + num(r.row[f]), 0);
  const expTotal = sum('exp_total'), incTotal = sum('inc_total'), paid = sum('paid'), profit = sum('profit'), debt = sum('debt');
  const doneCount = filtered.filter(t => t.column === 'done' || t.column === 'issue').length;
  const arrow = (f) => field === f ? (dir === 'asc' ? ' ▲' : ' ▼') : '';
  const cols = activeCalcFields();
  const hidden = state.calcHiddenCols || {};
  const cell = (f, task, row) => {
    if (f === 'number') return `<td class="num calc-num-col">${task.number || '—'}</td>`;
    if (f === 'plate') return `<td><span class="calc-car-model">${esc(task.car.model || '')}</span><span class="calc-car-plate">${esc(row.plate)} · ${esc(task.client.name)}</span></td>`;
    if (f === 'reason') return `<td>${esc(row.reason)}</td>`;
    if (f === 'exp_parts') return `<td class="num exp">${money(row.exp_parts)}</td>`;
    if (f === 'inc_parts') return `<td class="num inc">${money(row.inc_parts)}</td>`;
    if (f === 'exp_works') return `<td class="num exp">${money(row.exp_works)}</td>`;
    if (f === 'inc_works') return `<td class="num inc">${money(row.inc_works)}</td>`;
    if (f === 'exp_total') return `<td class="num exp">${money(row.exp_total)}</td>`;
    if (f === 'paid') return `<td class="num paid">${money(row.paid)}</td>`;
    if (f === 'debt') return `<td class="num debt ${row.debt > 0 ? 'owed' : ''}">${money(row.debt)}</td>`;
    if (f === 'inc_total') return `<td class="num inc">${money(row.inc_total)}</td>`;
    if (f === 'profit') return `<td class="num profit ${row.profit < 0 ? 'neg' : 'pos'}">${money(row.profit)}</td>`;
    if (f === 'payStatus') { const c = row.payStatusCode === 'paid' ? 'paid' : row.payStatusCode === 'unpaid' ? 'unpaid' : 'none'; return `<td><span class="pay-badge ${c}">${esc(row.payStatus)}</span></td>`; }
    if (f === 'status') return `<td><span class="badge ${row.statusHidden ? 'badge-gray' : 'badge-blue'}">${esc(row.status)}</span></td>`;
    return '';
  };
  const plateIdx = cols.findIndex(c => c.field === 'plate');
  el.innerHTML = `
    <div class="calc-assignee-bar">
      <label>👤 Разделить по исполнителям:</label>
      <select onchange="state.calcAssignee=this.value; renderCalculator();">
        <option value="">Все</option>
        ${Object.keys(USERS).filter(k => USERS[k].role === 'worker').map(k => `<option value="${k}" ${assigneeFilter === k ? 'selected' : ''}>${USERS[k].name}</option>`).join('')}
        <option value="__none__" ${assigneeFilter === '__none__' ? 'selected' : ''}>Без исполнителя</option>
      </select>
      <span class="calc-assignee-count">Показано: ${filtered.length} из ${tasks.length}</span>
    </div>
    <div class="calc-cols"><span class="calc-cols-title">👁 Столбцы:</span>
      ${CALC_FIELDS.map(f => {
        const isFixed = CALC_FIXED_COLS.indexOf(f.field) >= 0;
        if (isFixed) return `<label><input type="checkbox" checked disabled> ${f.title}</label>`;
        return `<label><input type="checkbox" ${hidden[f.field] ? '' : 'checked'} onchange="toggleCalcColumn('${f.field}', this.checked)"> ${f.title}</label>`;
      }).join('')}
      <button type="button" class="tab-btn" onclick="resetCalcColumns()">Все столбцы</button>
    </div>
    <div class="calc-summary">
      <div class="calc-card red"><div class="calc-card-title">Расходы</div><div class="calc-card-value">${money(expTotal)}</div></div>
      <div class="calc-card green"><div class="calc-card-title">Доходы</div><div class="calc-card-value">${money(incTotal)}</div></div>
      <div class="calc-card blue"><div class="calc-card-title">Оплачено</div><div class="calc-card-value">${money(paid)}</div></div>
      <div class="calc-card ${debt > 0 ? 'red' : 'green'}"><div class="calc-card-title">Долг</div><div class="calc-card-value">${money(debt)}</div></div>

      <div class="calc-card"><div class="calc-card-title">Задач / завершено</div><div class="calc-card-value">${tasks.length} / ${doneCount}</div></div>
    </div>
    <table class="calc-table">

        <th class="del-cell"></th>
      </tr></thead>
      <tbody>
        ${rows.length === 0 ? `<tr><td colspan="${cols.length+1}" class="empty-msg">Нет задач</td></tr>` : ''}
        ${rows.map(r => `<tr class="clickable" onclick="openTaskView('${r.task.id}')">${cols.map(f => cell(f.field, r.task, r.row)).join('')}<td class="del-cell"><button type="button" class="danger small" onclick="event.stopPropagation();deleteTask('${r.task.id}')">🗑</button></td></tr>`).join('')}
      </tbody>
    </table>`;
}
function toggleCalcColumn(field, visible) {
  if (!state.calcHiddenCols) state.calcHiddenCols = {};
  if (visible) delete state.calcHiddenCols[field];
  else state.calcHiddenCols[field] = true;
  renderCalculator();
}
function resetCalcColumns() { state.calcHiddenCols = {}; renderCalculator(); }
function sortCalc(field) {
  if (state.calcSort.field === field) state.calcSort.dir = state.calcSort.dir === 'asc' ? 'desc' : 'asc';
  else { state.calcSort.field = field; state.calcSort.dir = 'asc'; }

}

// ============ CSV ============
function exportCsv() {
  const tasks = visibleTasksForUser();
  if (!tasks.length) { alert('Нет задач'); return; }
  const sep = ';';
  const cols = [
    ['№', 'number'], ['Госномер', 'plate'], ['Модель', 'model'], ['Клиент', 'client'],
    ['Причина', 'reason'], ['Статус', 'status'], ['Исполнитель', 'assignee'],
    ['Пост', 'post'], ['Время', 'scheduled'], ['Расходы', 'exp'], ['Доходы', 'inc'],
    ['Оплачено', 'paid'], ['Долг', 'debt'], ['Прибыль', 'profit'], ['Комментарий', 'comment']
  ];
  const lines = [cols.map(c => c[0]).join(sep)];
  tasks.forEach(t => {
    const row = [
      t.number || '', t.car.plate, t.car.model, t.client.name, t.reason,
      (COLUMNS.find(c => c.id === t.column) || {}).title || '',
      t.assignee ? USERS[t.assignee].name : '',
      t.post || '', formatTime(t.scheduledTime),
      String(Math.round(totalCost(t)*100)/100).replace('.', ','),
      String(Math.round(totalRevenue(t)*100)/100).replace('.', ','),
      String(Math.round(paidSum(t)*100)/100).replace('.', ','),
      String(Math.round(debtOf(t)*100)/100).replace('.', ','),
      String(Math.round(netProfit(t)*100)/100).replace('.', ','),
      t.comment || ''
    ].map(v => {
      const s = String(v);
      if (s.includes(sep) || s.includes('"') || /[\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    });
    lines.push(row.join(sep));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'crm_zadachi_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function openImportModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px">
      <h2>📥 Импорт CSV</h2>
      <div class="readonly-field">Файл — выгрузка из CRM (CSV с «;»). Обязательный столбец — Госномер.</div>
      <label>Файл CSV</label><input type="file" id="importFile" accept=".csv,text/csv">
      <div class="modal-actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="runImport()">Импортировать</button></div>
    </div>`;
  document.getElementById('modalContainer').appendChild(modal);
}
function runImport() {
  const input = document.getElementById('importFile');
  if (!input || !input.files || !input.files.length) { alert('Выберите файл'); return; }
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const text = String(e.target.result).replace(/^\uFEFF/, '');
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQ = false; }
          else cell += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === ';' || ch === '\t') { row.push(cell); cell = ''; }
          else if (ch === '\r') {}
          else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
          else cell += ch;
        }
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      if (rows.length < 2) { alert('Файл пуст'); return; }
      const header = rows[0].map(h => String(h).toLowerCase().trim());
      const idx = (name) => header.indexOf(name);
      const iPlate = idx('госномер'), iModel = idx('модель'), iClient = idx('клиент'), iReason = idx('причина');
      if (iPlate < 0) { alert('Нет столбца «Госномер»'); return; }
      let added = 0;
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const plate = (row[iPlate] || '').trim();
        if (!plate) continue;
        const task = {
          id: uid(), number: nextTaskNumber(), column: 'waiting',
          car: { plate, model: (row[iModel] || '—').trim(), year: '', vin: '', mileage: '' },
          client: { name: (row[iClient] || '—').trim(), phone: '—', history: [] },
          reason: (row[iReason] || '—').trim(),
          comment: '', scheduledTime: null, assignee: null, post: null,
          parts: [], works: [], payments: [],
          log: [{ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: 'Импорт CSV' }],
          updatedAt: new Date().toISOString(), createdAt: new Date().toISOString(),
          issued: false, color: null
        };
        state.tasks.push(task);
        added++;
      }
      saveState();
      closeModal();
      render();
      alert('Импортировано: ' + added);
    } catch (err) { alert('Ошибка импорта: ' + err.message); }
  };
  reader.readAsText(file, 'utf-8');
}

// ============ МОДАЛЬНЫЙ СТЕК ============
function pushModalHistory(reopenFn, title) {
  modalDepth++;
  modalHistory.push({ open: reopenFn, title: title || 'Назад' });
}
function modalBack() {
  const container = document.getElementById('modalContainer');
  if (modalHistory.length < 2) { closeModal(); return; }
  const prev = modalHistory[modalHistory.length - 2];
  const reopen = prev.open;
  modalHistory.length = Math.max(0, modalHistory.length - 2);
  modalDepth = Math.max(0, modalDepth - 1);
  if (container && container.lastElementChild) container.removeChild(container.lastElementChild);
  reopen();
}
function closeModal() {
  const container = document.getElementById('modalContainer');
  if (!container) return;
  const last = container.lastElementChild;
  if (last) container.removeChild(last);
  trimModalHistory();
}
function closeModalAll() {
  const container = document.getElementById('modalContainer');
  if (container) container.innerHTML = '';
  modalHistory = [];
  modalDepth = 0;
}
function trimModalHistory() {
  const container = document.getElementById('modalContainer');
  const count = container ? container.children.length : 0;
  if (modalHistory.length > count) modalHistory.length = count;
  modalDepth = Math.max(0, count);
}
