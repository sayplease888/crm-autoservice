<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Автосервис v7</title>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@font-face {
  font-family: 'RusPlate';
  src: url('GOST-R-50577-93.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #1e1e2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #181825;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 2px solid #313244;
  flex-wrap: wrap;
}
header h1 { font-size: 20px; color: #89b4fa; }
header .user-info { margin-left: auto; display: flex; align-items: center; gap: 10px; }
select, button, input, textarea {
  background: #313244;
  color: #e0e0e0;
  border: 1px solid #45475a;
  border-radius: 6px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 13px;
}
button { cursor: pointer; transition: 0.2s; }
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #1e1e2e; font-weight: 600; }
button.primary:hover { background: #74a8f5; }
button.success { background: #a6e3a1; color: #1e1e2e; }
button.danger { background: #f38ba8; color: #1e1e2e; }
button.warning { background: #f9e2af; color: #1e1e2e; }
button.small { padding: 3px 8px; font-size: 12px; }

.bell-btn { position: relative; background: #313244; font-size: 18px; padding: 5px 10px; }
.bell-badge {
  position: absolute; top: -5px; right: -5px;
  background: #f38ba8; color: white; border-radius: 50%;
  font-size: 10px; min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

.board { flex: 1; display: flex; gap: 10px; padding: 10px; overflow-x: auto; overflow-y: hidden; }
.column {
  min-width: 260px; width: 260px;
  background: #181825; border-radius: 8px;
  display: flex; flex-direction: column;
  max-height: 100%; border: 2px solid #313244;
  transition: border-color 0.15s, background 0.15s;
}
.column.drag-over { border-color: #89b4fa; background: #1e1e2e; }
.column-header {
  padding: 10px; font-weight: 600; font-size: 13px; text-align: center;
  border-bottom: 2px solid #313244; border-radius: 8px 8px 0 0; color: #1e1e2e;
}
.col-1 .column-header { background: #3b3a2e; color: #e6d9a8; }  /* ожидание — тёплый песочный */
.col-2 .column-header { background: #3d3229; color: #e8c9a8; }  /* согласование — приглушённый оранж */
.col-3 .column-header { background: #3d2b30; color: #e8b3bf; }  /* запчасти — сдержанный бордо */
.col-4 .column-header { background: #2b3446; color: #a8c4e8; }  /* в работе — деловой синий */
.col-5 .column-header { background: #2b3d2f; color: #a8d8b3; }  /* завершено — тёмный зелёный */
.col-6 .column-header { background: #342b45; color: #c4b3e8; }  /* выдача — приглушённый фиолет */

.column-body {
  flex: 1; overflow-y: auto; padding: 8px;
  display: block; flex-direction: column; gap: 8px; min-height: 60px;
}
.column-body::-webkit-scrollbar { width: 6px; }
.column-body::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }

/* ==== КАРТОЧКА ==== */
.task {
  position: relative;
  background: #313244;
  border-radius: 6px;
  padding: 8px;
  cursor: grab;
  font-size: 12px;
  border-left: 4px solid #89b4fa;
  border-top: 1px solid #45475a;
  border-right: 1px solid #45475a;
  border-bottom: 1px solid #45475a;
  outline: 1px solid #585b70;
  outline-offset: -1px;
  transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s, border-color 0.15s;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
  display: block;
  overflow: hidden;
  isolation: isolate;
  margin-bottom: 12px
}
.task:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  border-color: #89b4fa;
  outline-color: #89b4fa;
}
.task.dragging {
  opacity: 0.4;
  cursor: grabbing;
  box-shadow: 0 8px 24px rgba(137,180,250,0.35);
  touch-action: none;
}

.task-brand-bg {
  position: absolute;
  right: -10px;
  top: -10px;
  width: 130px;
  height: 130px;
  opacity: 1;
  pointer-events: none;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.task-brand-bg img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  filter: grayscale(0.2);
}
.task-brand-bg .brand-emoji { font-size: 100px; line-height: 1; opacity: 1; }

.task-topline, .task-header, .task-row, .task-comment-note { position: relative; z-index: 1; }

.task-topline {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 2px;
}
.task-plate {
  display: flex; align-items: stretch;
  background: #ffffff; border: 2px solid #c8c8cc;
  border-radius: 5px; overflow: hidden;
  box-shadow: inset 0 0 0 1px #ffffff, inset 0 0 0 3px rgba(10,10,10,0.15);
  height: 30px; width: max-content; max-width: 100%; flex-shrink: 0;
}
.task-plate__rus {
  background: #0039a6; color: #ffffff;
  font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border-right: 1px solid #0a0a0a33; flex-shrink: 0;
}
.task-plate__number {
  font-family: 'RusPlate', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
  font-weight: 800; font-size: 14px; color: #0a0a0a;
  letter-spacing: 1px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 7px; white-space: nowrap; text-transform: uppercase;
}
.task-plate--compact .task-plate__number { font-size: 12px; padding: 0 5px; }

.task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; font-weight: 600; }
.task-title { font-size: 13px; color: #cdd6f4; }
.task-time { font-size: 11px; color: #a6adc8; }
.task-row { font-size: 11px; color: #bac2de; margin: 1px 0; }
.task-row b { color: #89b4fa; }
.task-money-row {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.1;
  margin: 2px 0;
  white-space: nowrap;
  text-align: right;
}

.task-comment-note {
  margin-top: 6px; padding: 6px 8px;
  background: rgba(249, 226, 175, 0.12);
  border: 1px solid rgba(249, 226, 175, 0.35);
  border-left: 3px solid #f9e2af;
  border-radius: 5px;
  font-size: 11px; color: #f9e2af; cursor: pointer;
  display: flex; align-items: flex-start; gap: 6px; line-height: 1.3;
  transition: background 0.15s, border-color 0.15s;
}
.task-comment-note:hover { background: rgba(249, 226, 175, 0.22); border-color: rgba(249, 226, 175, 0.6); }
.task-comment-note__icon { flex: 0 0 auto; font-size: 12px; line-height: 1.2; }
.task-comment-note__text {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  white-space: normal; word-break: break-word;
}
.task-comment-note__hint {
  flex: 0 0 auto; font-size: 9px; color: #f9e2af; opacity: 0.7;
  text-transform: uppercase; letter-spacing: 0.3px; align-self: center;
}

.comment-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.comment-modal {
  background: #1e1e2e; border: 2px solid #313244; border-radius: 10px;
  width: 100%; max-width: 560px; max-height: 85vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.comment-modal__header {
  padding: 14px 18px; background: #181825; border-bottom: 2px solid #313244;
  display: flex; align-items: center; gap: 10px;
}
.comment-modal__title { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: #f9e2af; }
.comment-modal__title small { display: block; font-size: 11px; color: #a6adc8; font-weight: 400; margin-top: 2px; }
.comment-modal__close {
  width: 30px; height: 30px; border-radius: 6px;
  background: #313244; border: 1px solid #45475a; color: #cdd6f4;
  font-size: 18px; line-height: 1; cursor: pointer; flex-shrink: 0;
}
.comment-modal__close:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
.comment-modal__body {
  padding: 16px 18px; overflow-y: auto; font-size: 13px; line-height: 1.55;
  color: #cdd6f4; white-space: pre-wrap; word-break: break-word;
}
.comment-modal__footer {
  padding: 10px 18px; background: #181825; border-top: 2px solid #313244;
  display: flex; justify-content: flex-end; gap: 8px;
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal {
  background: #1e1e2e; border-radius: 10px; padding: 20px;
  max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto;
  border: 2px solid #313244;
}
.modal h2 { color: #89b4fa; margin-bottom: 15px; font-size: 18px; }
.modal h3 { color: #a6e3a1; margin: 12px 0 8px; font-size: 14px; }
.modal label { display: block; margin: 8px 0 4px; font-size: 13px; color: #bac2de; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 8px; }
.modal textarea { min-height: 70px; resize: vertical; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; flex-wrap: wrap; }
.readonly-field {
  background: #181825; padding: 6px 10px; border-radius: 4px;
  font-size: 12px; margin: 4px 0; color: #a6adc8; border: 1px solid #313244;
}
.readonly-field b { color: #cdd6f4; }

.log-entry {
  display: block; padding: 4px 0 4px 10px; margin: 0;
  font-size: 11px; border-left: 2px solid #45475a; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word;
}
.log-entry + .log-entry { margin-top: 2px; }
.log-entry .log-time { display: block; color: #6c7086; font-size: 10px; margin-bottom: 1px; }
.log-entry .log-text { display: block; color: #cdd6f4; }

.calc-assignee-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; margin-bottom: 10px;
  background: #1e1e2e; border: 1px solid #313244;
  border-radius: 8px; flex-wrap: wrap;
}
.calc-assignee-bar label { font-size: 12px; color: #a6adc8; }
.calc-assignee-bar select {
  padding: 6px 10px; font-size: 12px;
  background: #313244; color: #cdd6f4;
  border: 1px solid #45475a; border-radius: 5px;
}
.calc-assignee-count { font-size: 11px; color: #6c7086; margin-left: auto; }

.auth-gate {
  position: fixed; inset: 0; background: rgba(13, 13, 20, 0.96);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; padding: 16px;
}
.auth-box {
  width: 100%; max-width: 380px; background: #181825;
  border: 1px solid #313244; border-radius: 14px;
  padding: 30px 28px 24px; box-shadow: 0 12px 48px rgba(0,0,0,0.5);
}
.auth-logo { font-size: 40px; text-align: center; margin-bottom: 4px; }
.auth-box h1 { margin: 0 0 4px; text-align: center; font-size: 20px; }
.auth-sub { margin: 0 0 20px; text-align: center; color: #a6adc8; font-size: 13px; }
.auth-box form { display: block; }
.auth-box label {
  display: block; font-size: 11px; color: #a6adc8;
  margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.4px;
}
.auth-box input {
  width: 100%; padding: 9px 12px;
  background: #313244; color: #cdd6f4;
  border: 1px solid #45475a; border-radius: 6px;
  font-size: 14px; box-sizing: border-box;
}
.auth-box input:focus { border-color: #89b4fa; outline: none; }
.auth-error { color: #f38ba8; font-size: 12px; margin: 8px 0 4px; min-height: 14px; }
.auth-submit { width: 100%; padding: 10px; margin-top: 14px; font-size: 14px; font-weight: 600; }
.auth-hint {
  margin-top: 16px; padding: 10px 12px;
  background: #313244; border-radius: 6px;
  font-size: 11px; color: #a6adc8; line-height: 1.5;
}
.tenant-label { font-size: 11px; color: #a6adc8; padding: 3px 8px; background: #313244; border-radius: 4px; }
.logout-btn {
  padding: 4px 10px; font-size: 11px;
  background: transparent; border: 1px solid #f38ba8; color: #f38ba8;
  border-radius: 4px; cursor: pointer;
}
.logout-btn:hover { background: #f38ba8; color: #1e1e2e; }

.notification-panel {
  position: fixed; top: 60px; right: 20px;
  background: #1e1e2e; border: 2px solid #313244;
  border-radius: 8px; width: 320px; max-height: 400px;
  overflow-y: auto; z-index: 999; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.notification-panel h3 { color: #89b4fa; font-size: 14px; margin-bottom: 8px; }
.notif-item {
  background: #313244; padding: 8px; border-radius: 4px;
  margin-bottom: 6px; font-size: 12px; border-left: 3px solid #f9e2af;
}
.notif-item.unread { border-left-color: #f38ba8; }
.notif-item .notif-time { color: #6c7086; font-size: 10px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-green { background: #589e51; color: #1e1e2e; }
.badge-red { background: #db3030; color: #1e1e2e; }
.badge-yellow { background: #daa638; color: #1e1e2e; }
.badge-blue { background: #89b4fa; color: #1e1e2e; }
.badge-gray { background: #6c7086; color: #e0e0e0; }

.part-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
.part-row input { flex: 1; min-width: 100px; }
.part-row select { width: auto; }

.empty-msg { text-align: center; color: #6c7086; font-size: 12px; padding: 20px; }
.schedule-post { background: #313244; padding: 8px; border-radius: 6px; margin: 5px 0; font-size: 12px; }

.tab-btn { background: transparent; border: 1px solid #45475a; color: #a6adc8; font-weight: 600; }
.tab-btn.active { background: #89b4fa; border-color: #89b4fa; color: #1e1e2e; }
.tab-btn.active:hover { background: #74a8f5; }

:root {
  --col-name: 1 1 130px;
  --col-article: 0 0 110px;
  --col-check: 0 0 22px;
  --col-ty: 0 0 96px;
  --col-hours: 0 0 110px;
  --col-num: 0 0 84px;
  --col-status: 0 0 116px;
  --col-total: 0 0 70px;
  --col-search: 0 0 196px;
  --col-del: 0 0 32px;
  --grid-gap: 5px;
  --name-min: 100px;
  --num-min: 84px;
}
.part-row { display: flex; gap: var(--grid-gap); align-items: center; margin-bottom: 4px; }
.part-row input, .part-row select { flex: var(--col-name); min-width: var(--name-min); }
.part-row input.name-input { flex: var(--col-name); min-width: var(--name-min); }
.part-row input.article { flex: var(--col-article); min-width: var(--col-article-min, 100px); text-transform: uppercase; }
.part-row input.num { flex: var(--col-num); min-width: var(--num-min); }
.part-row .row-total {
  flex: var(--col-total); min-width: var(--col-total);
  text-align: right; font-size: 12px; font-weight: 600;
  color: #a6e3a1; align-self: center;
}
.part-row .row-total.neg { color: #f38ba8; }
.part-row select.work-status { flex: var(--col-status); min-width: var(--col-status); }
.part-row .danger.small { flex: var(--col-del); min-width: var(--col-del); }

.part-note-line {
  flex: 1 1 100%; display: flex; align-items: center;
  gap: 8px; margin-top: 2px; padding-left: 2px;
}
.part-note-label { flex: 0 0 auto; font-size: 10px; color: #6c7086; text-transform: uppercase; letter-spacing: 0.3px; }
.part-note-line .note-input {
  flex: 1 1 auto; min-width: 120px; font-size: 11px; padding: 4px 8px;
  background: #181825; color: #cdd6f4; border: 1px solid #313244; border-radius: 4px;
}
.part-note-line .note-input:focus { border-color: #89b4fa; outline: none; }
.part-row { flex-wrap: wrap; }

.ordered-check {
  flex: var(--col-check); min-width: var(--col-check);
  text-align: center; font-size: 14px; line-height: 1;
  color: #6c7086; cursor: default;
}
.ordered-check.done { color: #a6e3a1; font-weight: 700; }
.rows-head span.check-col { flex: var(--col-check); min-width: var(--col-check); }

.qty-control { display: inline-flex; align-items: center; gap: 2px; flex: var(--col-qty); min-width: var(--col-qty); }
.qty-control .qty-input { flex: 1; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
.qty-btn {
  flex: 0 0 24px; width: 24px; min-width: 0; padding: 3px 0;
  font-size: 13px; line-height: 1;
  background: #45475a; border: 1px solid #585b70; color: #cdd6f4;
  border-radius: 4px; cursor: pointer;
}
.qty-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
.rows-head span.qty-col { flex: var(--col-qty); min-width: var(--col-qty); }

.part-note-line button {
  flex: 0 0 26px; width: 26px; min-width: 0; padding: 2px 0;
  font-size: 12px; line-height: 1; border-radius: 4px;
  cursor: pointer; border: 1px solid #585b70;
}
.part-note-line button.note-add-btn { background: #45475a; color: #a6e3a1; }
.part-note-line button.note-add-btn:hover { background: #a6e3a1; color: #1e1e2e; }
.part-note-line button.note-del-btn { background: #45475a; color: #f38ba8; }
.part-note-line button.note-del-btn:hover { background: #f38ba8; color: #1e1e2e; }
.part-note-line button.note-link-btn { background: #45475a; color: #cdd6f4; font-size: 11px; }
.part-note-line button.note-link-btn:hover:not(:disabled) { background: #89b4fa; color: #1e1e2e; }
.part-note-line button.note-link-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.work-comment { flex: 1 1 140px; min-width: 120px; font-size: 11px; padding: 4px 8px; }
.rows-head span.comment-col { flex: 1 1 140px; min-width: 120px; }
.issue-issue-row { margin-top: 4px; }

.rows-head {
  display: flex; gap: var(--grid-gap);
  font-size: 10px; color: #6c7086;
  text-transform: uppercase; letter-spacing: 0.4px;
  margin: 6px 0 2px;
}
.rows-head span { flex: var(--col-name); min-width: var(--name-min); }
.rows-head span.article { flex: var(--col-article); min-width: 100px; }
.rows-head span.num { flex: var(--col-num); min-width: var(--num-min); }
.rows-head span.row-total { flex: var(--col-total); min-width: var(--col-total); text-align: right; }
.rows-head span.work-status { flex: var(--col-status); min-width: var(--col-status); }
.rows-head span.search-col { flex: var(--col-search); min-width: var(--col-search); }
.rows-head span.del-col { flex: var(--col-del); min-width: var(--col-del); }
.rows-head span.hours-col { flex: var(--col-hours); min-width: var(--col-hours); }

:root { --col-wassignee: 0 0 132px; }
.part-row select.work-assignee { flex: var(--col-wassignee); min-width: var(--col-wassignee); }
.rows-head span.assignee-col { flex: var(--col-wassignee); min-width: var(--col-wassignee); }
select.work-assignee.auto { border-color: rgba(61,214,140,0.5); color: var(--green); }

.hours-control { display: inline-flex; align-items: center; gap: 2px; flex: 0 0 110px; min-width: 90px; }
.hours-control .hours-input { flex: 1; min-width: 40px; text-align: center; }
.hours-btn {
  flex: 0 0 26px; width: 26px; min-width: 0; padding: 3px 0;
  font-size: 14px; line-height: 1;
  background: #45475a; border: 1px solid #585b70; color: #cdd6f4;
  border-radius: 4px; cursor: pointer;
}
.hours-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

.sched-datebar { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.sched-datebar button {
  padding: 5px 10px; font-size: 13px; background: #45475a;
  border: 1px solid #585b70; color: #cdd6f4; border-radius: 5px; cursor: pointer;
}
.sched-datebar button:hover { background: #89b4fa; color: #1e1e2e; }
.sched-date-label { font-size: 14px; font-weight: 600; color: #cdd6f4; text-transform: capitalize; }
.schedule-empty { padding: 18px; text-align: center; color: #6c7086; border: 1px dashed #45475a; border-radius: 8px; margin: 8px 0; }

.modal-titlebar { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.modal-titlebar h2 { margin: 0; flex: 1; }
.modal-title-actions { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.close-x {
  width: 30px; height: 30px; padding: 0; font-size: 18px; line-height: 1;
  background: #45475a; border: 1px solid #585b70; color: #cdd6f4;
  border-radius: 5px; cursor: pointer;
}
.close-x:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
.back-btn {
  padding: 5px 12px; font-size: 12px; background: #45475a;
  border: 1px solid #585b70; color: #cdd6f4; border-radius: 5px;
  cursor: pointer; white-space: nowrap;
}
.back-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

.sched-picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sched-picker input[type="date"] {
  flex: 0 0 180px; padding: 6px 8px; background: #313244;
  color: #cdd6f4; border: 1px solid #45475a; border-radius: 6px; font-size: 13px;
}
.sched-picker .slot-select {
  flex: 0 0 130px; padding: 6px 8px; background: #313244;
  color: #cdd6f4; border: 1px solid #45475a; border-radius: 6px; font-size: 13px;
}

.part-search {
  display: inline-flex; gap: 3px; flex: var(--col-search); min-width: var(--col-search);
  align-items: center; justify-content: flex-start;
}
.search-btn {
  padding: 4px 7px; font-size: 10px; font-weight: 600;
  background: #45475a; border: 1px solid #585b70; color: #cdd6f4;
  border-radius: 4px; cursor: pointer; line-height: 1.1; transition: 0.15s;
}
.search-btn:hover:not(:disabled) { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
.search-btn:disabled { opacity: 0.35; cursor: not-allowed; background: #313244; color: #6c7086; border-color: #45475a; }

.parts-search-item { cursor: default; }
.article-line { display: flex; align-items: center; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
.article-code { font-family: 'Consolas', 'Courier New', monospace; font-weight: 700; color: #89b4fa; font-size: 12px; letter-spacing: 0.3px; min-width: 90px; }
.article-name { color: #a6adc8; font-size: 11px; flex: 1; }
.article-line .ordered-check { flex: 0 0 16px; min-width: 16px; font-size: 13px; }
.article-del-btn {
  flex: 0 0 24px; width: 24px; min-width: 0; padding: 2px 0;
  font-size: 12px; line-height: 1; background: #45475a;
  border: 1px solid #585b70; color: #f38ba8; border-radius: 4px; cursor: pointer;
}
.article-del-btn:hover { background: #f38ba8; color: #1e1e2e; }

.parts-summary { margin-top: 18px; padding: 10px 12px; background: #181825; border: 1px solid #313244; border-radius: 6px; }
.parts-summary.empty { color: #6c7086; font-size: 12px; text-align: center; padding: 14px; }
.parts-summary-head { font-size: 12px; font-weight: 600; color: #cdd6f4; margin-bottom: 8px; }
.parts-summary-line {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; border-top: 1px solid #313244;
  font-size: 12px; flex-wrap: wrap;
}
.parts-summary-line:first-of-type { border-top: none; }
.parts-summary-line .ordered-check { flex: 0 0 16px; min-width: 16px; }
.parts-summary-name { flex: 1 1 160px; color: #cdd6f4; }
.parts-summary-name .art { color: #89b4fa; font-family: 'Consolas','Courier New',monospace; font-weight: 700; }
.parts-summary-search { flex: 0 0 auto; }
.parts-summary-qty { flex: 0 0 auto; color: #a6adc8; font-variant-numeric: tabular-nums; font-size: 11px; }

.task-badges { display: flex; flex-wrap: wrap; gap: 3px; margin: 3px 0 2px; }
.task-badges .item-badge { font-size: 9px; padding: 2px 5px; line-height: 1.2; max-width: 100%; }
.badge.badge-gray { background: #313244; color: #a6adc8; }

.filter-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; background: rgba(17, 17, 27, 0.95);
  border-bottom: 1px solid #313244;
}
.filter-label { font-size: 12px; color: #a6adc8; }
.filter-bar select {
  padding: 5px 8px; font-size: 12px;
  background: #313244; color: #cdd6f4;
  border: 1px solid #45475a; border-radius: 5px;
}
.filter-count { font-size: 11px; color: #6c7086; margin-left: auto; }

.calc-wrap {
  overflow-x: hidden;
}
.calc-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.calc-card {
  background: #181825; border: 2px solid #313244;
  border-radius: 8px; padding: 10px 14px; min-width: 150px;
}
.calc-card .calc-card-title { font-size: 11px; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.4px; }
.calc-card .calc-card-value { font-size: 18px; font-weight: 700; margin-top: 4px; color: #cdd6f4; }
.calc-card.green .calc-card-value { color: #a6e3a1; }
.calc-card.red .calc-card-value { color: #f38ba8; }
.calc-card.blue .calc-card-value { color: #89b4fa; }
.calc-hint { font-size: 11px; color: #6c7086; margin-bottom: 10px; }

.calc-table {
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 11px;
}
.calc-table th,
.calc-table td {
  width: auto;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
  vertical-align: middle;
  padding: 6px 6px;
}
.calc-table td:nth-child(2),
.calc-table th:nth-child(2) {
  width: auto;
  white-space: normal;
  min-width: 140px;
}
.calc-table td:last-child,
.calc-table th:last-child {
  width: 40px;
  white-space: nowrap;
}
.calc-table th:hover { background: #45475a; }
.calc-table td { padding: 7px 10px; border-top: 1px solid #313244; }
.calc-table tbody tr.clickable { cursor: pointer; }
.calc-table tbody tr.clickable:hover { background: #313244; }
.calc-table td.calc-num-col {
  width: 34px;
  white-space: nowrap;
}
.calc-table td:nth-child(3),
.calc-table th:nth-child(3) {
  width: auto;
  min-width: 90px;
}
.calc-table td .pay-badge {
  white-space: nowrap;
}
.calc-table th.num,
.calc-table td.num {
  width: 70px;
  text-align: right;
  white-space: nowrap;
}
.calc-table td.exp { color: #f38ba8; font-weight: 600; }
.calc-table td.inc { color: #a6e3a1; font-weight: 600; }
.calc-table td.paid { color: #6c7086; }
.calc-table td.debt { color: #6c7086; font-weight: 600; }
.calc-table td.debt.owed { color: #f9e2af; }
.calc-table tfoot td.debt { color: #f9e2af; }
.calc-table td.profit { font-weight: 700; }
.calc-table td.profit.pos { color: #a6e3a1; }
.calc-table td.profit.neg { color: #f38ba8; }
.calc-table tfoot td {
  background: #313244; font-weight: 700; font-size: 13px;
  padding: 10px; border-top: 2px solid #45475a;
}
.calc-table tfoot td.num { text-align: right; font-variant-numeric: tabular-nums; }
.calc-table tfoot td.exp { color: #f38ba8; }
.calc-table tfoot td.inc { color: #a6e3a1; }
.calc-table th.del-cell,
.calc-table td.del-cell {
  width: 34px;
  padding: 4px;
}
.calc-status { font-size: 10px; color: #6c7086; display: block; margin-top: 2px; }
.calc-num-col { font-variant-numeric: tabular-nums; color: #89b4fa; font-weight: 700; }
.pay-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.pay-badge.unpaid { background: #f38ba8; color: #1e1e2e; }
.pay-badge.paid { background: #a6e3a1; color: #1e1e2e; }
.pay-badge.none { background: #6c7086; color: #e0e0e0; }
.settings-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 15px; padding: 10px 12px; background: #313244;
  border-radius: 6px; margin: 6px 0; font-size: 13px;
}
.settings-row .desc { font-size: 11px; color: #6c7086; margin-top: 3px; }
.settings-divider { height: 1px; background: #45475a; margin: 18px 0 12px; }
.settings-section-title { margin: 0 0 10px; font-size: 14px; color: #cdd6f4; font-weight: 600; }
.pass-new-row { display: flex; gap: 10px; margin-top: 4px; }
.pass-new-col { flex: 1; min-width: 0; }
.pass-new-col label { margin-top: 0; }
.settings-msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
.settings-msg.error { color: #f38ba8; }
.settings-msg.ok { color: #a6e3a1; }
.settings-row .tag { flex: 0 0 auto; background: #45475a; color: #89b4fa; padding: 3px 9px; border-radius: 10px; font-size: 11px; }
.settings-row code { background: #181825; padding: 1px 5px; border-radius: 3px; font-size: 10px; color: #89b4fa; }
.switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; inset: 0; cursor: pointer; background: #45475a; border-radius: 22px; transition: 0.2s; }
.switch .slider:before {
  content: ""; position: absolute; height: 16px; width: 16px;
  left: 3px; top: 3px; background: #cdd6f4; border-radius: 50%; transition: 0.2s;
}
.switch input:checked + .slider { background: #a6e3a1; }
.switch input:checked + .slider:before { transform: translateX(20px); background: #1e1e2e; }

.sum-line { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; color: #bac2de; gap: 15px; }
.sum-line b { color: #cdd6f4; }
.sum-line.total { border-top: 1px solid #45475a; margin-top: 8px; padding-top: 6px; font-size: 14px; }
.sum-line.total b { color: #a6e3a1; }
.sum-line.total.neg b { color: #f38ba8; }
.pay-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.pay-item {
  background: #313244; padding: 6px 10px; border-radius: 4px;
  font-size: 12px; display: flex; align-items: center; gap: 10px;
}
.pay-item .pay-date { color: #89b4fa; font-weight: 600; }
.pay-item .pay-comment { flex: 1; color: #a6adc8; font-size: 11px; }
.pay-item .pay-sum { color: #a6e3a1; font-weight: 600; }

:root {
  --bg-modal: linear-gradient(145deg, #0E1A2B 0%, #101E33 100%);
  --bg-card: #13253F; --border-card: #1E4E8C; --border-card-soft: #1A3A66;
  --accent: #2E7CF6; --cyan: #3DD5C4; --green: #3DD68C;
  --text: #E8EEF7; --text-dim: #7A8FAE; --input-bg: #0B1729;
  --shadow-glow: 0 0 40px rgba(30, 136, 229, 0.25);
}
.task-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 10, 18, 0.9); backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px; z-index: 1000; overflow-y: auto;
}
.task-modal-overlay.hidden { display: none; }
.task-modal {
  position: relative; width: 100%; max-width: 860px;
  margin: auto; flex-shrink: 0;
  background: var(--bg-modal);
  border: 1px solid var(--border-card); border-radius: 16px;
  box-shadow: var(--shadow-glow), 0 30px 80px rgba(0,0,0,0.6);
  padding: 18px 22px 16px;
  animation: modalIn 0.35s ease-out;
  color: var(--text);
}
@media (max-width: 900px) {
  .calc-wrap {
    padding: 8px;
    overflow-x: hidden;
  }
  .calc-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .calc-card {
    min-width: 0;
    padding: 8px 10px;
    border-width: 1px;
  }
  .calc-card .calc-card-title { font-size: 10px; }
  .calc-card .calc-card-value { font-size: 14px; margin-top: 2px; }
  .calc-assignee-bar {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .calc-assignee-bar::-webkit-scrollbar { height: 4px; }
  .calc-assignee-bar::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }
  .calc-assignee-bar label {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 11px;
  }
 .calc-assignee-bar select {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 5px 8px;
    font-size: 11px;
  }
 .calc-assignee-count {
    flex: 0 0 auto;
    margin-left: 0;
    white-space: nowrap;
    font-size: 10px;
  }
  .calc-cols {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    overflow-y: hidden;
    white-space: nowrap;
  }
  .calc-cols > * {
    flex: 0 0 auto !important;
    white-space: nowrap;
  }
  .calc-cols label {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 10px;
  }
  .calc-cols .calc-cols-title { font-size: 10px; }
  .calc-cols button.tab-btn {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 4px 8px;
    font-size: 10px;
  }
  .calc-table-scroll {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .calc-cols::-webkit-scrollbar { height: 4px; }
  .calc-cols::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }
  .calc-table {
    width: auto;
    min-width: 100%;
    table-layout: auto;
    font-size: 11px;
  }
  .calc-table th,
  .calc-table td {
    padding: 6px 8px;
    white-space: nowrap;
    word-break: normal;
  }
  .calc-table th.num,
  .calc-table td.num {
    width: 80px;
    text-align: right;
  }
  .calc-table td.calc-num-col { width: 36px; }
  .calc-table td:nth-child(2),
  .calc-table th:nth-child(2) {
    width: 160px;
    white-space: normal;
    word-break: break-word;
  }
  .calc-car-model { font-size: 12px; }
  .calc-car-plate { font-size: 10px; }
  .calc-table td:nth-child(3),
  .calc-table th:nth-child(3) {
    width: 120px;
    white-space: normal;
    word-break: break-word;
  }
  .calc-table th.del-cell,
  .calc-table td.del-cell {
    width: 34px;
    padding: 4px;
  }
  .calc-table th {
    font-size: 10px;
    padding: 6px 6px;
  }
  .calc-scroll-hint {
    display: block;
    font-size: 10px;
    color: #6c7086;
    text-align: right;
    margin-top: 4px;
  }
}
.task-drag-ghost {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 99999;
  opacity: 0.92;
  transform: rotate(2deg) scale(1.02);
  box-shadow: 0 12px 32px rgba(0,0,0,0.55);
  border-radius: 6px;
  transition: none;
  will-change: left, top;
}
@media (max-width: 900px) {
  .task-drag-ghost {
    opacity: 1;   /* было 0.92 — на мобильном ghost непрозрачный */
  }
  .task.dragging {
    opacity: 1;   /* было 0.4 — на мобильном оригинал почти невидим */
  }
}
.task-drag-ghost .task-comment-note { display: none; }
@media (max-width: 480px) {
  .calc-table { font-size: 10px; }
  .calc-table th { font-size: 9px; }
  .calc-table th.num,
  .calc-table td.num { width: 68px; }
  .calc-table td:nth-child(2),
  .calc-table th:nth-child(2) { width: 140px; }
  .calc-table td:nth-child(3),
  .calc-table th:nth-child(3) { width: 100px; }
  .calc-card { padding: 6px 8px; }
  .calc-card .calc-card-value { font-size: 13px; }
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.task-modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; position: relative; }
.task-modal-header__icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, #2E7CF6, #1B4FB0);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; box-shadow: 0 6px 20px rgba(46,124,246,0.45); flex-shrink: 0;
}
.task-modal-header__title h1 { font-size: 18px; font-weight: 700; color: #E8EEF7; }
.task-modal-header__title p { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
.task-modal-close {
  position: absolute;
  top: 1px;
  right: 8px;
  width: 55px;
  height: 55px;
  border-radius: 8px;              /* квадрат со скруглёнными углами */
  border: 2px solid #e11d2e;       /* настоящий красный контур */
  background: #e11d2e;             /* настоящая красная заливка */
  color: #ffffff;                  /* белый крест */
  font-size: 28px;
  line-height: 1;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  z-index: 10;
  box-shadow: 0 4px 12px rgba(225, 29, 46, 0.45); /* лёгкая красная тень */
}
.task-modal-close:hover {
  background: #c8102e;             /* темнее при наведении */
  border-color: #c8102e;
  transform: scale(1.05);
}
.task-modal-close:active {
  transform: scale(0.97);
}
.task-modal-list { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
.task-block {
  position: relative; background: var(--bg-card);
  border: 1px solid var(--border-card-soft); border-radius: 12px;
  overflow: hidden; transition: border-color 0.25s;
  display: flex; flex-direction: column; min-height: 60px; flex-shrink: 0;
}
.task-block:hover { border-color: var(--border-card); }
.task-block__header {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 14px 10px; padding-bottom: 8px;
  border-bottom: 1px solid rgba(30, 78, 140, 0.3);
  flex-shrink: 0; transition: border-color 0.25s, margin 0.25s, padding 0.25s;
}
.task-block__num {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, #2E7CF6, #1B4FB0);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.task-block__icon {
  width: 26px; height: 26px; border-radius: 8px;
  background: rgba(46,124,246,0.15); border: 1px solid rgba(46,124,246,0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.task-block__title {
  font-size: 13px;
  font-weight: 600;
  flex: 1;
  min-width: 0;
}
.task-block__title-sep { color: var(--text-dim); margin: 0 6px; font-weight: 400; font-size: 16px; }
.task-block__title-accent { color: var(--cyan); font-weight: 600; }
.task-block__title-plate {
  display: inline-flex; align-items: center; gap: 8px;
  background: #FFFFFF; color: #0A0A0A;
  padding: 4px 14px; border-radius: 6px;
  font-weight: 800; font-size: 22px; letter-spacing: 2px;
  font-family: 'RusPlate', "JetBrains Mono", "Courier New", monospace;
  border: 2px solid #C8C8CC; margin-left: 4px; line-height: 1.1;
  box-shadow: inset 0 0 0 2px #FFFFFF, inset 0 0 0 4px #0A0A0A33;
  vertical-align: middle;
}
.task-block__title-plate::before {
  content: 'RUS'; font-size: 12px; color: #0039A6; font-weight: 800;
  margin-right: 2px; letter-spacing: 0.5px;
}
.task-block__header--clickable { cursor: pointer; user-select: none; transition: opacity 0.2s; }
.task-block__header--clickable:hover { opacity: 0.85; }
.task-header-btn {
  flex: 0 0 auto;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 8px;
  margin-left: auto;
  white-space: nowrap;
}
.task-block__toggle {
  margin-left: auto; width: 22px; height: 22px; border-radius: 6px;
  background: rgba(46, 124, 246, 0.12); border: 1px solid rgba(46, 124, 246, 0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--accent); transition: transform 0.25s ease; flex-shrink: 0;
}
.task-block--collapsed .task-block__toggle { transform: rotate(-90deg); }
.task-block__content {
  overflow: hidden; transition: max-height 0.35s ease, opacity 0.25s ease;
  max-height: 2000px; opacity: 1;

const PASSWORD_CACHE_KEY = 'crm_tenant_passwords';

function cachedTenantPassword(tenant) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  return map[tenant] || null;
}
function setCachedTenantPassword(tenant, password) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  map[tenant] = password;
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));

function effectiveTenantPassword(tenant) {
  const c = cachedTenantPassword(tenant);
  return c || tenant;
}
function authRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix + '/auth/password');

  const t = TENANTS[tenant];

const AUTH_SESSION_KEY = 'crm_auth_session';

  const l = String(login || '').trim();

  const expected = cachedTenantPassword(l) || l;

function partQty(p) { const q = parseInt(p ? p.quantity : 1, 10); return (isNaN(q) || q < 1) ? 1 : q; }
function partPurchase(p) {
  if (!p) return 0;
  const v =
    (p.purchase !== undefined && p.purchase !== '' && p.purchase !== null) ? p.purchase :
    (p.buy !== undefined && p.buy !== '' && p.buy !== null) ? p.buy :
    (p.cost !== undefined && p.cost !== '' && p.cost !== null) ? p.cost :
    (p.purchasePrice !== undefined && p.purchasePrice !== '' && p.purchasePrice !== null) ? p.purchasePrice : '';
  return num(v);
}
function partSale(p) {
  if (!p) return 0;
  const v =
    (p.sale !== undefined && p.sale !== '' && p.sale !== null) ? p.sale :
    (p.sellPrice !== undefined && p.sellPrice !== '' && p.sellPrice !== null) ? p.sellPrice :
    (p.sell !== undefined && p.sell !== '' && p.sell !== null) ? p.sell :
    (p.price !== undefined && p.price !== '' && p.price !== null) ? p.price :
    (p.salePrice !== undefined && p.salePrice !== '' && p.salePrice !== null) ? p.salePrice : '';
  return num(v);
}
function partHasContent(p) {
  if (!p) return false;
  if (String(p.name || '').trim()) return true;
  if (String(p.article || '').trim()) return true;
  if (partPurchase(p) > 0) return true;
  if (partSale(p) > 0) return true;
  if (Array.isArray(p.notes) && p.notes.some(n => String(n || '').trim())) return true;
  return false;
}
function partsCost(t) { return (t.parts || []).reduce((s,p) => s + partPurchase(p) * partQty(p), 0); }
function partsRevenue(t) { return (t.parts || []).reduce((s,p) => s + partSale(p) * partQty(p), 0); }
function worksCost(t) { return (t.works || []).reduce((s,w) => s + num(w.cost), 0); }
function worksRevenue(t) { return (t.works || []).reduce((s,w) => s + num(w.price), 0); }
function worksHours(t) { return (t.works || []).reduce((s,w) => s + num(w.hours), 0); }
function totalCost(t) { return partsCost(t) + worksCost(t); }
function totalRevenue(t) { return partsRevenue(t) + worksRevenue(t); }
function paidSum(t) { return (t.payments || []).reduce((s,p) => s + num(p.amount), 0); }
function netProfit(t) { return totalRevenue(t) - totalCost(t); }
function paymentState(t) {
  const rev = totalRevenue(t);
  if (rev <= 0) return 'none';
  return paidSum(t) >= rev - 0.005 ? 'paid' : 'unpaid';
}
function paymentLabel(s) { return s === 'paid' ? 'Оплачено' : s === 'unpaid' ? 'Неоплачено' : 'Нет суммы'; }
function paymentBadge(t) {
  const st = paymentState(t);
  const cls = st === 'paid' ? 'paid' : (st === 'unpaid' ? 'unpaid' : 'none');
  return `<span class="pay-badge ${cls}">${paymentLabel(st)}</span>`;
}

function migratePart(p) {
  if (!p || typeof p !== 'object') return p;
  if (p.article === undefined || p.article === null) p.article = '';
  const q = parseInt(p.quantity, 10);
  p.quantity = (isNaN(q) || q < 1) ? 1 : q;
  if (!Array.isArray(p.notes)) {
    p.notes = (p.note !== undefined && p.note !== null && String(p.note).trim() !== '') ? [String(p.note)] : [];
  }
  p.note = p.notes.length ? p.notes[0] : '';
  if (!p.status) p.status = 'notordered';
  if (p.purchase === undefined || p.purchase === null) p.purchase = '';
  if (p.sale === undefined || p.sale === null) p.sale = '';
  return p;
}
function normalizeTasks(tasks) {
  (tasks || []).forEach(t => {
    if (!t.parts) t.parts = [];
    t.parts = t.parts.map(migratePart).filter(partHasContent);
    if (!t.works) t.works = [];
    t.works.forEach(w => {
      if (w.hours === undefined) w.hours = '';
      if (w.cost === undefined) w.cost = '';
      if (w.price === undefined) w.price = '';
      if (!w.status) w.status = 'notstarted';
      if (!w.link) w.link = '';
      if (w.comment === undefined) w.comment = '';
      if (w.assignee === undefined || w.assignee === null) w.assignee = '';
    });
    if (t.hidden === undefined) t.hidden = false;
    if (!t.payments) t.payments = [];
    if (!t.log) t.log = [];
    if (!t.client) t.client = { name: '—', phone: '—', history: [] };
    if (!t.client.history) t.client.history = [];
    if (!t.car) t.car = { plate: '—', model: '—', year: '', vin: '' };
    if (t.column === undefined) t.column = 'waiting';
    if (t.order === undefined) t.order = 0;
  });
  const numbered = (tasks || []).filter(t => typeof t.number === 'number' && t.number > 0);
  if (numbered.length) state.taskCounter = Math.max(state.taskCounter || 0, ...numbered.map(t => t.number));
  const unnumbered = (tasks || []).filter(t => typeof t.number !== 'number' || !(t.number > 0))
    .sort((a, b) => String(a.createdAt || a.updatedAt || '').localeCompare(String(b.createdAt || b.updatedAt || '')));
  unnumbered.forEach(t => { t.number = nextTaskNumber(); });
}
function nextTaskNumber() {
  state.taskCounter = (state.taskCounter || 0) + 1;
  return state.taskCounter;
}
async function nextTaskNumberAsync() {
  const ref = dataRef();
  if (!ref) return nextTaskNumber();
  try {
    const counterRef = ref.child('taskCounter');
    const result = await counterRef.transaction((current) => (current || 0) + 1);
    if (result.committed) {
      state.taskCounter = result.snapshot.val();
      return state.taskCounter;
    }
    return nextTaskNumber();
  } catch (err) { return nextTaskNumber(); }
}

function localStorageFallbackKey() {
  const t = currentTenant();
  return t ? 'crm_autoservice_' + t : 'crm_autoservice_anon';
}
let _saveTimer = null;
function saveState() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => saveStateImmediate(), 500);
}
function saveStateImmediate() {
  const ref = dataRef();
  const data = { tasks: state.tasks, notifications: state.notifications, lastRead: state.lastRead, taskCounter: state.taskCounter };
  if (!ref) { localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data)); return; }
  ref.update(data).catch(err => {
    console.error('Firebase write error:', err);
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
  });
}
function loadState() {
  const ref = dataRef();
  if (!ref) {
    state.tasks = []; state.notifications = []; state.lastRead = {}; state.taskCounter = 0;
    render(); return;
  }
  if (_dataRef) { try { _dataRef.off(); } catch(e){} }
  _dataRef = ref;
  ref.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state.tasks = data.tasks || [];
      state.notifications = data.notifications || [];
      state.lastRead = data.lastRead || {};
      state.taskCounter = data.taskCounter || 0;
    }
    normalizeTasks(state.tasks);
    render();
  }, (error) => {
    console.error('Firebase read error:', error);
    try {
      const saved = localStorage.getItem(localStorageFallbackKey());
      if (saved) {
        const parsed = JSON.parse(saved);
        state.tasks = parsed.tasks || [];
        state.notifications = parsed.notifications || [];
        state.lastRead = parsed.lastRead || {};
        state.taskCounter = parsed.taskCounter || 0;
      }
    } catch(e) { console.error(e); }
    normalizeTasks(state.tasks);
    render();
  });
}

function brandOf(model) {

// ============ УДАЛЕНИЕ ФОНА У ЛОГОТИПОВ ============
const LOGO_PROCESS_CACHE = {};

function processLogoRemoveBackground(url, callback) {
  if (LOGO_PROCESS_CACHE[url] !== undefined) {
    callback(LOGO_PROCESS_CACHE[url]);
    return;
  }
  LOGO_PROCESS_CACHE[url] = null;

  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth;
      c.height = im.naturalHeight;
      const cx = c.getContext('2d');
      cx.drawImage(im, 0, 0);
      const imgData = cx.getImageData(0, 0, c.width, c.height);
      const d = imgData.data;

      const bgR = d[0], bgG = d[1], bgB = d[2];
      const THRESHOLD = 40;

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const diff = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
        if (diff < THRESHOLD) d[i + 3] = 0;
      }
      cx.putImageData(imgData, 0, 0);
      const dataUrl = c.toDataURL('image/png');
      LOGO_PROCESS_CACHE[url] = dataUrl;
      callback(dataUrl);
    } catch (e) {
      console.warn('Не удалось убрать фон у логотипа:', url, e);
      LOGO_PROCESS_CACHE[url] = null;
      callback(null);
    }
  };
  im.onerror = () => {
    LOGO_PROCESS_CACHE[url] = null;
    callback(null);
  };
  im.src = url;
}

  const m = raw.match(/^([А-ЯA-Z0-9\s]+?)\s*(\d{2,3})?$/i);
  let main = raw, region = '';
  if (m) { main = (m[1] || raw).trim(); region = (m[2] || '').trim(); }
  const numberText = region ? `${main} ${region}` : main;

}

function currentKanbanFilters() { return Array.isArray(state.kanbanFilter) ? state.kanbanFilter : []; }
function taskMatchesKanbanFilter(t, key) {
  const parts = t.parts || []; const works = t.works || [];
  switch (key) {
    case 'unpaid': return paymentState(t) === 'unpaid';
    case 'notordered': return parts.some(p => p.status === 'notordered');
    case 'ordered': return parts.some(p => p.status === 'ordered');
    case 'nowork': return works.some(w => w.status === 'notstarted');
    case 'inwork': return works.some(w => w.status === 'inwork');
  }
  return true;
}
const KANBAN_FILTERS = [
  { key: 'unpaid',     title: 'Неоплаченные' },
  { key: 'notordered', title: 'Незаказанные' },
  { key: 'ordered',    title: 'Заказанные' },
  { key: 'nowork',     title: 'Не в работе' },
  { key: 'inwork',     title: 'В работе' }
];
function tasksBaseForUser() {
  const u = state.currentUser;
  if (USERS[u].role === 'chief') return state.tasks;
  return state.tasks.filter(t => !t.assignee || t.assignee === u);
}
function visibleTasksForUser() {
  let list = tasksBaseForUser();
  const fl = currentKanbanFilters();
  if (fl.length) list = list.filter(t => fl.some(k => taskMatchesKanbanFilter(t, k)));
  return list.filter(t => !t.hidden);
}
function visibleTasksForCalc() {
  let list = tasksBaseForUser();
  const f = state.calcStatusFilter || '';

function renderTask(task) {
  const el = document.createElement('div');
  el.className = 'task';
  el.dataset.id = task.id;
  el.style.borderLeftColor = getTaskColor(task.id);
  el.innerHTML = taskCardHtml(task);

  let holdTimer = null;
  let dragReady = false;
  let didDrag = false;

  function cancelHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  }
  function resetDrag() {
    dragReady = false;
    el.draggable = false;
  }

el.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('.task-comment-note')) return;
  if (e.target.closest('button')) return;
  cancelHold();
  didDrag = false;
  el.draggable = true;
  dragReady = true;
});


 el.addEventListener('mouseup', () => {
  cancelHold();
  setTimeout(() => {
    if (!dragTaskId) {
      el.draggable = false;
      dragReady = false;
    }
  }, 0);
});
  el.addEventListener('mouseleave', () => { cancelHold(); resetDrag(); });

el.addEventListener('dragstart', e => {
  didDrag = true;
  dragTaskId = task.id;
  dragEl = el;

  e.dataTransfer.setData('text/plain', task.id);
  e.dataTransfer.effectAllowed = 'move';

  cleanupDragGhost();
  const rect = el.getBoundingClientRect();
  dragGhostOffsetX = e.clientX - rect.left;
  dragGhostOffsetY = e.clientY - rect.top;

  const ghost = el.cloneNode(true);
  ghost.classList.add('task-drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left = (e.clientX - dragGhostOffsetX) + 'px';
  ghost.style.top  = (e.clientY - dragGhostOffsetY) + 'px';
  ghost.style.transform = 'rotate(2deg) scale(1.02)';
  ghost.querySelectorAll('button').forEach(b => b.disabled = true);
  document.body.appendChild(ghost);
  dragGhostEl = ghost;

  try {
    const img = new Image();
    img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    e.dataTransfer.setDragImage(img, 0, 0);
  } catch (_) {}

  el.classList.add('dragging');
});

el.addEventListener('dragend', () => {
  if (dragEl) dragEl.classList.remove('dragging');
  document.querySelectorAll('.column.drag-over').forEach(c => c.classList.remove('drag-over'));
  cleanupDragGhost();
  cleanupGhost();
  dragTaskId = null;
  dragEl = null;
  resetDrag();
  setTimeout(() => { didDrag = false; }, 0);
});
// ==== TOUCH DRAG (мобильные) ====
let touchHoldTimer = null;
let touchDragActive = false;
let touchStartX = 0, touchStartY = 0;
let touchMoved = false;

el.addEventListener('touchstart', e => {
  if (e.target.closest('.task-comment-note')) return;
  if (e.target.closest('button')) return;
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchMoved = false;
  touchDragActive = false;

touchHoldTimer = setTimeout(() => {
  touchDragActive = true;
  dragTaskId = task.id;
  dragEl = el;
  el.classList.add('dragging');

  // --- ghost для тача ---
  cleanupDragGhost();
  const rect = el.getBoundingClientRect();
  // «Палец» в точке старта — берём центр пальца из touchstart (touchStartX/Y)
  dragGhostOffsetX = touchStartX - rect.left;
  dragGhostOffsetY = touchStartY - rect.top;

  const ghost = el.cloneNode(true);
  ghost.classList.add('task-drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left = (touchStartX - dragGhostOffsetX) + 'px';
  ghost.style.top  = (touchStartY - dragGhostOffsetY) + 'px';
  ghost.style.transform = 'rotate(2deg) scale(1.02)';
  ghost.querySelectorAll('button').forEach(b => b.disabled = true);
  document.body.appendChild(ghost);
  dragGhostEl = ghost;

  if (navigator.vibrate) navigator.vibrate(30);
}, 250);
}, { passive: true });

el.addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if (!touchDragActive) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      if (touchHoldTimer) { clearTimeout(touchHoldTimer); touchHoldTimer = null; }
      e.preventDefault();
      const board = document.getElementById('board');
      board.scrollLeft -= dx;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchMoved = true;
      return;
    }
    if (Math.abs(dy) > 10) {
      if (touchHoldTimer) { clearTimeout(touchHoldTimer); touchHoldTimer = null; }
    }
    return;
  }

  e.preventDefault();
  touchMoved = true;

  const board = document.getElementById('board');
  const br = board.getBoundingClientRect();
  const EDGE = 70;
  const STEP = 14;
  if (t.clientX < br.left + EDGE) {
    const intensity = (br.left + EDGE - t.clientX) / EDGE;
    board.scrollLeft -= Math.max(4, STEP * intensity);
  } else if (t.clientX > br.right - EDGE) {
    const intensity = (t.clientX - (br.right - EDGE)) / EDGE;
    board.scrollLeft += Math.max(4, STEP * intensity);
  }
  // --- двигаем ghost за пальцем ---
  if (dragGhostEl) {
    dragGhostEl.style.left = (t.clientX - dragGhostOffsetX) + 'px';
    dragGhostEl.style.top  = (t.clientY - dragGhostOffsetY) + 'px';
  }
  moveDragToCursor(t.clientX, t.clientY);
}, { passive: false });

el.addEventListener('touchend', e => {
  if (touchHoldTimer) { clearTimeout(touchHoldTimer); touchHoldTimer = null; }
  if (!touchDragActive) return;
  touchDragActive = false;
  el.classList.remove('dragging');
    cleanupDragGhost();
  document.querySelectorAll('.column.drag-over').forEach(c => c.classList.remove('drag-over'));

  if (dragEl) {
    const colBody = dragEl.closest('.column-body');
    const newCol = colBody ? colBody.dataset.col : task.column;
    tryMoveTask(task.id, newCol);
  }
  dragTaskId = null;
  dragEl = null;
}, { passive: true });

el.addEventListener('touchcancel', () => {
  if (touchHoldTimer) { clearTimeout(touchHoldTimer); touchHoldTimer = null; }
  touchDragActive = false;
  if (dragEl) dragEl.classList.remove('dragging');
  cleanupDragGhost();   // ← добавить
  document.querySelectorAll('.column.drag-over').forEach(c => c.classList.remove('drag-over'));
  dragTaskId = null;
  dragEl = null;
});

el.addEventListener('click', e => {

}

document.getElementById('board').addEventListener('dragover', e => {
  if (!dragTaskId || !dragEl) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  moveDragToCursor(e.clientX, e.clientY);
});
document.getElementById('board').addEventListener('dragenter', e => {
  if (dragTaskId) e.preventDefault();
});
document.getElementById('board').addEventListener('drop', e => {
  e.preventDefault();
  if (!dragTaskId) return;
  const task = state.tasks.find(t => t.id === dragTaskId);
  if (task && dragEl) {
    const colBody = dragEl.closest('.column-body');
    const newCol = colBody ? colBody.dataset.col : task.column;
    tryMoveTask(task.id, newCol);
  }
  document.querySelectorAll('.column.drag-over').forEach(c => c.classList.remove('drag-over'));
});

function moveDragToCursor(x, y) {
  const board = document.getElementById('board');
  const colEls = board.querySelectorAll('.column');
  let targetColEl = null;
  for (const colEl of colEls) {
    const r = colEl.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) { targetColEl = colEl; break; }
  }
  if (!targetColEl) return;
  const colBody = targetColEl.querySelector('.column-body');
  if (!colBody) return;
  const newCol = colBody.dataset.col;
  const colTasks = Array.from(colBody.querySelectorAll('.task')).filter(el => el !== dragEl);
  let insertIdx = colTasks.length;
  for (let i = 0; i < colTasks.length; i++) {
    const r = colTasks[i].getBoundingClientRect();
    const midY = r.top + r.height / 2;
    if (y < midY) { insertIdx = i; break; }
  }
  let currentIdx = -1;
  if (dragEl.parentElement === colBody) currentIdx = Array.from(colBody.children).indexOf(dragEl);
  if (currentIdx !== -1) {
    const effectiveIdx = currentIdx < insertIdx ? insertIdx - 1 : insertIdx;
    if (effectiveIdx === currentIdx) { highlightColumn(targetColEl); return; }
  }
  if (dragEl.parentElement) dragEl.parentElement.removeChild(dragEl);
  if (colTasks.length === 0) {
    const empty = colBody.querySelector('.empty-msg');
    if (empty) empty.remove();
    colBody.appendChild(dragEl);
  } else if (insertIdx >= colTasks.length) {
    colTasks[colTasks.length - 1].after(dragEl);
  } else {
    colTasks[insertIdx].before(dragEl);
  }
    const task = state.tasks.find(t => t.id === dragTaskId);
  if (task) {
    Array.from(colBody.querySelectorAll('.task')).forEach((el, i) => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (t) t.order = i;
    });
  }
  updateColumnCounts();
  highlightColumn(targetColEl);
}
function normalizeOrder(colId) {
  const arr = state.tasks.filter(t => t.column === colId).sort((a, b) => (a.order || 0) - (b.order || 0));
  arr.forEach((t, i) => { t.order = i; });
}
function highlightColumn(colEl) {
  document.querySelectorAll('.column.drag-over').forEach(c => { if (c !== colEl) c.classList.remove('drag-over'); });
  colEl.classList.add('drag-over');
}
function restoreEmptyPlaceholder(colId) {
  const board = document.getElementById('board');
  const colEl = board.querySelector(`.column[data-col="${colId}"]`);
  if (!colEl) return;
  const colBody = colEl.querySelector('.column-body');
  if (!colBody) return;
  if (!colBody.querySelector('.task') && !colBody.querySelector('.empty-msg')) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Пусто';
    colBody.appendChild(empty);
  }
}
function updateColumnCounts() {
  const board = document.getElementById('board');
  COLUMNS.forEach(col => {
    const colEl = board.querySelector(`.column[data-col="${col.id}"]`);
    if (!colEl) return;
    const header = colEl.querySelector('.column-header');
    if (!header) return;
    const count = visibleTasksForUser().filter(t => t.column === col.id).length;
    header.textContent = `${col.title} (${count})`;
  });
}

function tryMoveTask(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const u = state.currentUser;
  if (USERS[u].role === 'worker') {
    if (task.assignee && task.assignee !== u) { alert('Вы не можете изменять эту задачу'); return; }
    if (!task.assignee && newCol !== 'inwork') { alert('Сначала возьмите задачу в работу'); return; }
  }
  if (task.column === newCol) { saveState(); return; }

  const noModalCols = ['parts', 'inwork', 'done'];
  if (noModalCols.indexOf(newCol) >= 0) {
    const oldCol = task.column;
    task.column = newCol;
    task.updatedAt = new Date().toISOString();
    const fromTitle = (COLUMNS.find(c => c.id === oldCol) || {}).title || oldCol;
    const toTitle = (COLUMNS.find(c => c.id === newCol) || {}).title || newCol;
    task.log.push({
      time: new Date().toISOString(),
      user: USERS[u].name,
      text: `Перемещение: ${fromTitle} → ${toTitle}`
    });
    saveState();
    render();
    return;
  }

  openMoveModal(taskId, newCol);
}

// ============ ВРЕМЯ / РАСПИСАНИЕ ============
function toLocalInput(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const SLOT_START_HOUR = 8, SLOT_END_HOUR = 20, SLOT_STEP_MIN = 30;
function timeSlots() {
  const out = [];
  for (let m = SLOT_START_HOUR * 60; m <= SLOT_END_HOUR * 60; m += SLOT_STEP_MIN) {
    const h = Math.floor(m / 60), mm = m % 60;
    out.push(String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
  }
  return out;
}
function roundToSlot(hhmm) {
  const slots = timeSlots();
  if (!hhmm) return slots[0];
  const [h, m] = hhmm.split(':').map(Number);
  const snapped = Math.round((h*60+m) / SLOT_STEP_MIN) * SLOT_STEP_MIN;
  const res = String(Math.floor(snapped/60)).padStart(2,'0') + ':' + String(snapped%60).padStart(2,'0');
  return slots.includes(res) ? res : slots[0];
}
function isoToDateTimeParts(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d)) return { date: '', time: '' };
  const p = n => String(n).padStart(2,'0');
  return { date: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, time: `${p(d.getHours())}:${p(d.getMinutes())}` };
}
function schedDateStr(d) {
  const dt = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
}
function partsToIso(date, time) {
  if (!date) return null;
  const t = roundToSlot(time || '');
  const d = new Date(`${date}T${t}:00`);
  if (isNaN(d)) return null;
  return d.toISOString();
}
function schedulePickerHtml(prefix, iso, label, defaultToday) {
  const parts = isoToDateTimeParts(iso);
  const slots = timeSlots();
  const selected = parts.time ? roundToSlot(parts.time) : '';
  let dateVal = parts.date;
  if (!dateVal && defaultToday) dateVal = schedDateStr(new Date());
  const opts = ['<option value="">— время —</option>'].concat(slots.map(s => `<option value="${s}" ${selected === s ? 'selected' : ''}>${s}</option>`)).join('');
  return `<label>${label || 'Дата и время записи'} (шаг 30 минут)</label>
    <div class="sched-picker"><input type="date" id="${prefix}_date" value="${dateVal}"><select id="${prefix}_time" class="slot-select">${opts}</select></div>`;
}
function getScheduleValue(prefix) {
  const dateEl = document.getElementById(prefix + '_date');
  const timeEl = document.getElementById(prefix + '_time');
  if (!dateEl) return null;
  return partsToIso(dateEl.value, timeEl ? timeEl.value : '');
}

function stepPartQty(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.qty-input');
  if (!input) return;
  let q = parseInt(input.value, 10); if (isNaN(q)) q = 1;
  q += delta; if (q < 1) q = 1;
  input.value = String(q);
  updatePartRowTotal(input);
}
function updatePartRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const qtyInput = row.querySelector('input.qty-input');
  const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
  const purchase = num(nums[0] ? nums[0].value : 0);
  const sale = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = (sale - purchase) * (qty < 1 ? 1 : qty);
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}
function collectPartRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const parts = [];
  rows.forEach(r => {
    const name = (r.querySelector('input.name-input')?.value || '').trim();
    const article = (r.querySelector('input.article')?.value || '').trim();
    const qtyInput = r.querySelector('input.qty-input');
    const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
    const nums = r.querySelectorAll('input.num');
    const purchase = nums[0] ? nums[0].value.trim() : '';
    const sale = nums[1] ? nums[1].value.trim() : '';
    const status = r.querySelector('select.work-status')?.value || 'notordered';
    const notes = Array.from(r.querySelectorAll('input.note-input')).map(n => n.value.trim()).filter(v => v !== '');
    if (name || article || notes.length || purchase || sale) {
      parts.push({ name, article, notes, note: notes.length ? notes[0] : '', link: '', quantity: qty < 1 ? 1 : qty, purchase, sale, status });
    }
  });
  return parts;
}
function stepWorkHours(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.hours-input');
  if (!input) return;
  let next = Math.round((num(input.value) + delta) * 2) / 2;
  if (next < 0) next = 0;
  input.value = next === 0 ? '0' : String(next);
  updateWorkRowTotal(input);
}
function updateWorkRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const cost = num(nums[0] ? nums[0].value : 0);
  const price = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = price - cost;
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}
function collectWorkRows(selector) {

// ============ CONFIRM MOVE ============
function confirmMove(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  const oldCol = task.column;
  const user = USERS[state.currentUser].name;
  const logEntries = [];
  if (newCol === 'waiting') {
    const v = document.getElementById('mExpectedAction')?.value.trim() || '';
    task.pendingAction = v;
    logEntries.push(`Ожидаемое действие: ${v || '(не указано)'}`);
  } else if (newCol === 'approval') {
    const v = document.getElementById('mApproval')?.value.trim() || '';
    task.approvalNote = v;
    logEntries.push(`Согласовать: ${v || '(не указано)'}`);
  } else if (newCol === 'parts') {
    const parts = collectPartRows('#partsList');
    task.parts = parts;
    logEntries.push(`Запчасти: ${parts.map(p=>p.name).join(', ') || '(нет)'}`);
  } else if (newCol === 'inwork') {
    const assigneeEl = document.getElementById('mAssignee');
    const postEl = document.getElementById('mPost');
    const time = getScheduleValue('m');
    const works = collectWorkRows('#mWorksList');
    if (assigneeEl) { const a = assigneeEl.value; if (!a) { alert('Назначьте исполнителя'); return; } task.assignee = a; }
    else if (!task.assignee) task.assignee = 'locksmith';
    if (postEl) task.post = parseInt(postEl.value);
    else if (!task.post) task.post = 1;
    if (!time) { alert('Укажите время'); return; }
    task.scheduledTime = new Date(time).toISOString();
    if (works.length) task.works = works;
    logEntries.push(`Исполнитель: ${task.assignee ? USERS[task.assignee].name : '—'}, Пост №${task.post}`);
  } else if (newCol === 'done') {
    const worksDone = collectDoneWorkRows();
    const cm = document.getElementById('mDoneComment')?.value.trim() || '';
    if (worksDone && worksDone.length) task.works = worksDone;
    task.doneComment = cm;
    if (cm) logEntries.push(`Комментарий: ${cm}`);
  } else if (newCol === 'issue') {
    task.workDone = document.getElementById('mWorkDone')?.value.trim() || '';
    task.recommendations = document.getElementById('mRecommend')?.value.trim() || '';
    task.issued = (document.getElementById('mIssued')?.value || '0') === '1';
    logEntries.push(`Статус выдачи: ${task.issued ? 'ВЫДАНО' : 'НЕ ВЫДАНО'}`);
  }
  const fromTitle = COLUMNS.find(c=>c.id===oldCol).title;
  const toTitle = COLUMNS.find(c=>c.id===newCol).title;
  const noteParts = [];
  if (newCol === 'waiting' && task.pendingAction) {
    noteParts.push({ label: 'Ожидаемое действие', value: task.pendingAction });
  }
  if (newCol === 'approval' && task.approvalNote) {
    noteParts.push({ label: 'Что необходимо согласовать', value: task.approvalNote });
  }
  if (newCol === 'issue') {
    if (task.workDone) noteParts.push({ label: 'Проделанные работы', value: task.workDone });
    if (task.recommendations) noteParts.push({ label: 'Рекомендации для обслуживания', value: task.recommendations });
  }
  if (newCol === 'done' && task.doneComment) {
    noteParts.push({ label: 'Комментарий по завершении', value: task.doneComment });
  }
  if (noteParts.length) {
    const stamp = `[${nowStr()}] ${toTitleFromId(newCol)}`;
    const lines = noteParts.map(n => `  ${n.label}: ${n.value}`);
    const block = `${stamp}\n${lines.join('\n')}`;
    task.comment = (task.comment ? task.comment + '\n' : '') + block;
  }
  task.column = newCol;
  task.updatedAt = new Date().toISOString();
  task.log.push({ time: new Date().toISOString(), user, text: `Перемещение: ${fromTitle} → ${toTitle}` + (logEntries.length ? '. ' + logEntries.join(' | ') : '') });
  saveState();
  closeModal();
  render();
}

function saveWorkModal(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.works || !task.works[index]) return;
  const list = document.getElementById('ce_worksList');
  const rows = list ? list.querySelectorAll('.part-row') : [];
  const collect = (r) => {
    const name = (r.querySelector('input.name-input')?.value || '').trim();
    const hours = (r.querySelector('input.hours-input')?.value || '').trim();
    const nums = r.querySelectorAll('input.num');
    const cost = nums[0] ? nums[0].value.trim() : '';
    const price = nums[1] ? nums[1].value.trim() : '';
    const status = r.querySelector('select.work-status')?.value || 'notstarted';
    const assignee = r.querySelector('select.work-assignee')?.value || '';
    return { name, hours, cost, price, status, assignee };
  };
  const first = rows[0] ? collect(rows[0]) : { name: '' };
  if (!first.name) {
    if (!confirm('Название пустое — удалить?')) return;
    task.works.splice(index, 1);
  } else {
    task.works[index] = Object.assign({}, task.works[index], first);
  }
  const newWorks = [];
  for (let i = 1; i < rows.length; i++) {
    const r = collect(rows[i]);
    if (r.name) newWorks.push(Object.assign({ link: '', comment: '' }, r));
  }
  if (newWorks.length) task.works = (task.works || []).concat(newWorks);
  task.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
  setTimeout(() => openTaskView(taskId), 80);
}

function saveChar(taskId, field) {
  const task = state.tasks.find(t => t.id === taskId);
  const user = USERS[state.currentUser].name;
  let logText = '';
  if (field === 'car') {
    task.car.plate = document.getElementById('ce_plate').value.trim();
    task.car.model = document.getElementById('ce_model').value.trim();
    task.car.year = document.getElementById('ce_year').value;
    logText = 'Авто изменено';
  } else if (field === 'vin') {
    task.car.vin = document.getElementById('ce_vin').value.trim().toUpperCase();
    logText = 'VIN изменён';
  } else if (field === 'time') {
    const v = getScheduleValue('ce');
    task.scheduledTime = v;
    logText = `Время: ${formatTime(v)}`;
  } else if (field === 'assignee') {
    task.assignee = document.getElementById('ce_assignee').value || null;
    logText = `Исполнитель: ${task.assignee ? USERS[task.assignee].name : '—'}`;
  } else if (field === 'post') {
    const v = document.getElementById('ce_post').value;
    task.post = v ? parseInt(v) : null;
    logText = `Пост: ${task.post ? '№'+task.post : '—'}`;
  } else if (field === 'parts') {
    const parts = collectPartRows('#ce_partsList');
    task.parts = parts;
    logText = 'Запчасти обновлены';
  } else if (field === 'works') {
    const works = collectWorkRows('#ce_worksList');
    task.works = works;
    logText = 'Работы обновлены';
  } else if (field === 'payments') {
    const amountRaw = document.getElementById('ce_payAmount').value.trim();
    const amount = num(amountRaw);
    if (!amountRaw || amount <= 0) { alert('Укажите сумму'); return; }
    const dateVal = document.getElementById('ce_payDate').value;
    const comment = document.getElementById('ce_payComment').value.trim();
    const method = document.getElementById('ce_payMethod').value;
    task.payments = task.payments || [];
    task.payments.push({ date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(), amount, comment, method, user });
    logText = `Оплата ${money(amount)}`;
  } else if (field === 'client') {
    task.client.name = document.getElementById('ce_clientName').value.trim();
    task.client.phone = document.getElementById('ce_clientPhone').value.trim();
    logText = 'Клиент изменён';
  } else if (field === 'reason') {
    task.reason = document.getElementById('ce_reason').value.trim();
    logText = 'Причина изменена';
  } else if (field === 'comment') {
    const nc = document.getElementById('ce_newComment').value.trim();
    if (nc) {
      task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;
      logText = 'Комментарий добавлен';
    }
  }
  if (logText) {
    task.log.push({ time: new Date().toISOString(), user, text: logText });
    task.updatedAt = new Date().toISOString();
  }
  saveState();
  closeModal();
  render();
  setTimeout(()=>{
    if (field === 'payments') openCharEditor(taskId, field);
    else openTaskView(taskId);
  }, 100);
}

let scheduleDate = null;
function shiftScheduleDate(delta) {
  const base = scheduleDate ? new Date(scheduleDate) : new Date();
  base.setHours(0,0,0,0);
  base.setDate(base.getDate() + delta);
  scheduleDate = schedDateStr(base);
  showSchedule();
}
function showSchedule() {
  const base = scheduleDate ? new Date(scheduleDate + 'T00:00:00') : new Date();
  const key = schedDateStr(base);
  const tasks = state.tasks.filter(t => {
    if (!t.scheduledTime) return false;
    return schedDateStr(new Date(t.scheduledTime)) === key;
  }).sort((a,b)=>parseTimeToMinutes(a.scheduledTime)-parseTimeToMinutes(b.scheduledTime));
  const fmtDate = base.toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric', weekday:'short' });

  let html = `<div class="modal-titlebar"><h2>📅 Расписание постов</h2><div class="modal-title-actions"><button class="back-btn" onclick="closeModal()">×</button></div></div>
    <div class="sched-datebar"><button onclick="shiftScheduleDate(-1)">‹</button><span class="sched-date-label">${fmtDate}</span><button onclick="shiftScheduleDate(1)">›</button>${scheduleDate ? `<button onclick="scheduleDate=null;showSchedule()">Сегодня</button>` : ''}</div>`;

  if (!tasks.length) html += `<div class="schedule-empty">На эту дату нет записей</div>`;
  else {
    for (let i=1; i<=4; i++) {
      html += `<h3>Пост №${i}</h3>`;
      const postTasks = tasks.filter(t => t.post === i);
      if (!postTasks.length) html += `<div class="schedule-post">Свободен</div>`;
      else postTasks.forEach(t => {
        const time = new Date(t.scheduledTime);
        html += `<div class="schedule-post"><b>${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}</b> — ${esc(t.car.plate)} (${esc(t.car.model)})<br><small>${t.assignee?USERS[t.assignee].name:'—'}</small></div>`;
      });
    }
  }

  const fullHtml = `<div class="modal">${html}<div class="modal-actions"><button onclick="closeModal()">Закрыть</button></div></div>`;

  let existing = document.getElementById('scheduleModal');
  if (existing) {
    existing.innerHTML = fullHtml;
    return;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'scheduleModal';
  modal.innerHTML = fullHtml;
  document.getElementById('modalContainer').appendChild(modal);
}

function debtOf(task) { const d = totalRevenue(task) - paidSum(task); return d > 0 ? d : 0; }
