<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Автосервис v7</title>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@font-face {
  font-family: 'RusPlate';
  src: url('GOST-R-50577-93.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #1e1e2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #181825;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 2px solid #313244;
  flex-wrap: wrap;
}
header h1 { font-size: 20px; color: #89b4fa; }
header .user-info { margin-left: auto; display: flex; align-items: center; gap: 10px; }
select, button, input, textarea {
  background: #313244;
  color: #e0e0e0;
  border: 1px solid #45475a;
  border-radius: 6px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 13px;
}
button { cursor: pointer; transition: 0.2s; }
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #1e1e2e; font-weight: 600; }
button.primary:hover { background: #74a8f5; }
button.success { background: #a6e3a1; color: #1e1e2e; }
button.danger { background: #f38ba8; color: #1e1e2e; }
button.warning { background: #f9e2af; color: #1e1e2e; }
button.small { padding: 3px 8px; font-size: 12px; }

.bell-btn { position: relative; background: #313244; font-size: 18px; padding: 5px 10px; }
.bell-badge {
  position: absolute; top: -5px; right: -5px;
  background: #f38ba8; color: white; border-radius: 50%;
  font-size: 10px; min-width: 16px; height: 16px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

.board { flex: 1; display: flex; gap: 10px; padding: 10px; overflow-x: auto; overflow-y: hidden; }
.column {
  min-width: 260px; width: 260px;
  background: #181825; border-radius: 8px;
  display: flex; flex-direction: column;
  max-height: 100%; border: 2px solid #313244;
  transition: border-color 0.15s, background 0.15s;
}
.column.drag-over { border-color: #89b4fa; background: #1e1e2e; }
.column-header {
  padding: 10px; font-weight: 600; font-size: 13px; text-align: center;
  border-bottom: 2px solid #313244; border-radius: 8px 8px 0 0; color: #1e1e2e;
}
.col-recent .column-header { background: #2a2d3a; color: #cdd6f4; }  /* изменения */
.col-1 .column-header { background: #3b3a2e; color: #e6d9a8; }  /* ожидание — тёплый песочный */
.col-2 .column-header { background: #3d3229; color: #e8c9a8; }  /* согласование — приглушённый оранж */
.col-3 .column-header { background: #3d2b30; color: #e8b3bf; }  /* запчасти — сдержанный бордо */
.col-4 .column-header { background: #2b3446; color: #a8c4e8; }  /* в работе — деловой синий */
.col-5 .column-header { background: #2b3d2f; color: #a8d8b3; }  /* завершено — тёмный зелёный */
.col-6 .column-header { background: #342b45; color: #c4b3e8; }  /* выдача — приглушённый фиолет */
.col-recent { min-width: 260px; max-width: 300px; }
.rc-card {
  background: #313244; border-radius: 6px; padding: 7px 9px; margin-bottom: 8px;
  border-left: 3px solid #89b4fa; cursor: pointer; font-size: 11px;
  border: 1px solid #45475a; transition: border-color 0.15s, transform 0.15s;
}
.rc-card:hover { border-color: #89b4fa; transform: translateY(-1px); }
.rc-card__head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.rc-card__plate { font-family: 'Consolas','Courier New',monospace; font-weight: 700; color: #89b4fa; font-size: 11px; }
.rc-card__model { flex: 1; color: #cdd6f4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.rc-card__cnt { background: rgba(137,180,250,0.2); color: #89b4fa; padding: 0 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
.rc-card__line { color: #a6adc8; font-size: 10px; line-height: 1.35; padding-left: 2px; border-left: 2px solid #45475a; margin-top: 3px; padding-left: 6px; }
.rc-card__line.rc-ai { border-left-color: #3DD5C4; }
.rc-card__line.rc-status { border-left-color: #f9e2af; }
.rc-card__line.rc-move { border-left-color: #89b4fa; }
.rc-card__time { color: #6c7086; font-size: 9px; }

.column-body {
  flex: 1; overflow-y: auto; padding: 8px;
  display: block; flex-direction: column; gap: 8px; min-height: 60px;
}
.column-body::-webkit-scrollbar { width: 6px; }
.column-body::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }

/* ==== КАРТОЧКА ==== */
.task {
  position: relative;
  background: #313244;
  border-radius: 6px;
  padding: 8px;
  cursor: grab;
  font-size: 12px;
  border-left: 4px solid #89b4fa;
  border-top: 1px solid #45475a;
  border-right: 1px solid #45475a;
  border-bottom: 1px solid #45475a;
  outline: 1px solid #585b70;
  outline-offset: -1px;
  transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s, border-color 0.15s, max-height 0.25s ease;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-y;
  display: block;
  overflow: hidden;
  isolation: isolate;
  margin-bottom: 12px;
}
/* Компактный режим — 2 строки */
.task.task--compact .task-groups,
.task.task--compact .task-money-row,
.task.task--compact .task-comment-note,
.task.task--compact .task-row:not(.task-compact-line) { display: none; }
.task.task--compact { padding: 5px 8px 5px 6px; }
.task.task--compact .task-topline { margin-bottom: 0; }
.task.task--compact .task-header { display: none; }
.task .task-expand-hint { display: none !important; }
.task-compact-line {
  display: flex; align-items: center; gap: 6px; flex-wrap: nowrap;
  font-size: 11px; color: #a6adc8; margin-top: 2px; position: relative; z-index: 1;
}
.task-compact-line .tc-model { color: #cdd6f4; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
.task-compact-line .tc-meta { flex: 0 0 auto; white-space: nowrap; font-size: 10px; color: #6c7086; }
.task-card-actions {
  position: absolute; top: 4px; right: 4px; z-index: 5;
  display: flex; gap: 4px;
}
.task-card-btn {
  width: 26px; height: 26px; padding: 0; border-radius: 6px;
  border: 1px solid #45475a; background: #313244; color: #cdd6f4;
  font-size: 13px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.task-card-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
.task-card-btn.expand-btn {
  width: 40px; height: 34px; font-size: 18px; font-weight: 800;
  background: #2E7CF6; border: 2px solid #89b4fa; color: #fff;
  box-shadow: 0 2px 8px rgba(46,124,246,0.45);
}
.task-card-btn.expand-btn:hover {
  background: #89b4fa; color: #1e1e2e; border-color: #cdd6f4;
  transform: scale(1.08);
}
.task:not(.task--compact) .task-card-btn.expand-btn {
  background: #40a02b; border-color: #a6e3a1; color: #fff;
  box-shadow: 0 2px 8px rgba(64,160,43,0.45);
}
.task:not(.task--compact) .task-card-btn.expand-btn:hover {
  background: #a6e3a1; color: #1e1e2e;
}
.task-card-btn.open-btn {
  background: rgba(166, 227, 161, 0.2); border-color: #a6e3a1; color: #a6e3a1;
}
.task-card-btn.open-btn:hover { background: #a6e3a1; color: #1e1e2e; }
.task:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  border-color: #89b4fa;
  outline-color: #89b4fa;
}
.task.dragging {
  opacity: 0.4;
  cursor: grabbing;
  box-shadow: 0 8px 24px rgba(137,180,250,0.35);
  touch-action: none;
}

.task-brand-bg {
  position: absolute;
  right: -10px;
  top: -10px;
  width: 130px;
  height: 130px;
  opacity: 1;
  pointer-events: none;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.task-brand-bg img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  filter: grayscale(0.2);
}
.task-brand-bg .brand-emoji { font-size: 100px; line-height: 1; opacity: 1; }

.task-topline, .task-header, .task-row, .task-comment-note { position: relative; z-index: 1; }

.task-topline {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 2px;
}
.task-plate {
  display: flex; align-items: stretch;
  background: #ffffff; border: 2px solid #c8c8cc;
  border-radius: 5px; overflow: hidden;
  box-shadow: inset 0 0 0 1px #ffffff, inset 0 0 0 3px rgba(10,10,10,0.15);
  height: 30px; width: max-content; max-width: 100%; flex-shrink: 0;
}
.task-plate__rus {
  background: #0039a6; color: #ffffff;
  font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px; border-right: 1px solid #0a0a0a33; flex-shrink: 0;
}
.task-plate__number {
  font-family: 'RusPlate', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
  font-weight: 800; font-size: 14px; color: #0a0a0a;
  letter-spacing: 1px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 7px; white-space: nowrap; text-transform: uppercase;
}
.task-plate--compact .task-plate__number { font-size: 12px; padding: 0 5px; }

.task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; font-weight: 600; }
.task-title { font-size: 13px; color: #cdd6f4; }
.task-time { font-size: 11px; color: #a6adc8; }
.task-row { font-size: 11px; color: #bac2de; margin: 1px 0; }
.task-row b { color: #89b4fa; }
.task-money-row {
  font-size: 15px;
  font-weight: 700;
  color: #ffffff;
  line-height: 1.1;
  margin: 2px 0;
  white-space: nowrap;
  text-align: right;
}

.task-comment-note {
  margin-top: 6px; padding: 6px 8px;
  background: rgba(249, 226, 175, 0.12);
  border: 1px solid rgba(249, 226, 175, 0.35);
  border-left: 3px solid #f9e2af;
  border-radius: 5px;
  font-size: 11px; color: #f9e2af; cursor: pointer;
  display: flex; align-items: flex-start; gap: 6px; line-height: 1.3;
  transition: background 0.15s, border-color 0.15s;
}
.task-comment-note:hover { background: rgba(249, 226, 175, 0.22); border-color: rgba(249, 226, 175, 0.6); }
.task-comment-note__icon { flex: 0 0 auto; font-size: 12px; line-height: 1.2; }
.task-comment-note__text {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  white-space: normal; word-break: break-word;
}
.task-comment-note__hint {
  flex: 0 0 auto; font-size: 9px; color: #f9e2af; opacity: 0.7;
  text-transform: uppercase; letter-spacing: 0.3px; align-self: center;
}

.comment-modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.comment-modal {
  background: #1e1e2e; border: 2px solid #313244; border-radius: 10px;
  width: 100%; max-width: 560px; max-height: 85vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.comment-modal__header {
  padding: 14px 18px; background: #181825; border-bottom: 2px solid #313244;
  display: flex; align-items: center; gap: 10px;
}
.comment-modal__title { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: #f9e2af; }
.comment-modal__title small { display: block; font-size: 11px; color: #a6adc8; font-weight: 400; margin-top: 2px; }
.comment-modal__close {
  width: 30px; height: 30px; border-radius: 6px;
  background: #313244; border: 1px solid #45475a; color: #cdd6f4;
  font-size: 18px; line-height: 1; cursor: pointer; flex-shrink: 0;
}
.comment-modal__close:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
.comment-modal__body {
  padding: 16px 18px; overflow-y: auto; font-size: 13px; line-height: 1.55;
  color: #cdd6f4; white-space: pre-wrap; word-break: break-word;
}
.comment-modal__footer {
  padding: 10px 18px; background: #181825; border-top: 2px solid #313244;
  display: flex; justify-content: flex-end; gap: 8px;
}

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal {
  background: #1e1e2e; border-radius: 10px; padding: 20px;
  max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto;
  border: 2px solid #313244;
}
.modal h2 { color: #89b4fa; margin-bottom: 15px; font-size: 18px; }
.modal h3 { color: #a6e3a1; margin: 12px 0 8px; font-size: 14px; }
.modal label { display: block; margin: 8px 0 4px; font-size: 13px; color: #bac2de; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 8px; }
.modal textarea { min-height: 70px; resize: vertical; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; flex-wrap: wrap; }
.readonly-field {
  background: #181825; padding: 6px 10px; border-radius: 4px;
  font-size: 12px; margin: 4px 0; color: #a6adc8; border: 1px solid #313244;
}
.readonly-field b { color: #cdd6f4; }

.log-entry {
  display: block; padding: 4px 0 4px 10px; margin: 0;
  font-size: 11px; border-left: 2px solid #45475a; line-height: 1.45;
  white-space: pre-wrap; word-break: break-word;
}
.log-entry + .log-entry { margin-top: 2px; }
.log-entry .log-time { display: block; color: #6c7086; font-size: 10px; margin-bottom: 1px; }
.log-entry .log-text { display: block; color: #cdd6f4; }

/* Панель последних изменений (группировка по задаче) */
.rc-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9000;
  display: flex; justify-content: flex-end; align-items: stretch;
}
.rc-panel {
  width: 100%; max-width: 420px; background: #1e1e2e;
  border-left: 1px solid #313244; display: flex; flex-direction: column;
  box-shadow: -8px 0 32px rgba(0,0,0,0.4); animation: rcSlide 0.25s ease-out;
}
@keyframes rcSlide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.rc-header {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid #313244; background: #181825;
}
.rc-header h2 { margin: 0; flex: 1; font-size: 16px; color: #89b4fa; }
.rc-header .rc-close {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid #45475a;
  background: #313244; color: #cdd6f4; font-size: 18px; cursor: pointer;
}
.rc-header .rc-close:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
.rc-body { flex: 1; overflow-y: auto; padding: 10px 12px 20px; }
.rc-empty { text-align: center; color: #6c7086; padding: 40px 16px; font-size: 13px; }
.rc-group {
  margin-bottom: 12px; border: 1px solid #313244; border-radius: 10px;
  background: #181825; overflow: hidden;
}
.rc-group__head {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: rgba(137,180,250,0.08); border-bottom: 1px solid #313244;
  cursor: pointer; user-select: none;
}
.rc-group__head:hover { background: rgba(137,180,250,0.15); }
.rc-group__plate {
  font-family: 'Consolas','Courier New',monospace; font-weight: 700;
  color: #89b4fa; font-size: 12px;
}
.rc-group__model { flex: 1; font-size: 12px; color: #cdd6f4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc-group__count {
  font-size: 10px; background: rgba(137,180,250,0.2); color: #89b4fa;
  padding: 1px 7px; border-radius: 10px; font-weight: 600;
}
.rc-group__entries { padding: 6px 10px 8px; }
.rc-entry {
  padding: 5px 0 5px 10px; border-left: 2px solid #45475a;
  font-size: 11px; line-height: 1.4; margin-bottom: 4px;
}
.rc-entry .rc-time { display: block; color: #6c7086; font-size: 10px; margin-bottom: 1px; }
.rc-entry .rc-text { color: #cdd6f4; }
.rc-entry.rc-ai { border-left-color: #3DD5C4; }
.rc-entry.rc-status { border-left-color: #f9e2af; }
.rc-entry.rc-move { border-left-color: #89b4fa; }
.rc-footer {
  padding: 8px 14px; border-top: 1px solid #313244; font-size: 11px; color: #6c7086;
  display: flex; justify-content: space-between; align-items: center;
}
@media (max-width: 480px) {
  .rc-panel { max-width: 100%; }
}

.calc-assignee-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; margin-bottom: 10px;
  background: #1e1e2e; border: 1px solid #313244;
  border-radius: 8px; flex-wrap: wrap;
}
.calc-assignee-bar label { font-size: 12px; color: #a6adc8; }
.calc-assignee-bar select {
  padding: 6px 10px; font-size: 12px;
  background: #313244; color: #cdd6f4;
  border: 1px solid #45475a; border-radius: 5px;
}
.calc-assignee-count { font-size: 11px; color: #6c7086; margin-left: auto; }

.auth-gate {
  position: fixed; inset: 0; background: rgba(13, 13, 20, 0.96);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; padding: 16px;
}
.auth-box {
  width: 100%; max-width: 380px; background: #181825;
  border: 1px solid #313244; border-radius: 14px;
  padding: 30px 28px 24px; box-shadow: 0 12px 48px rgba(0,0,0,0.5);
}
.auth-logo { font-size: 40px; text-align: center; margin-bottom: 4px; }
.auth-box h1 { margin: 0 0 4px; text-align: center; font-size: 20px; }
.auth-sub { margin: 0 0 20px; text-align: center; color: #a6adc8; font-size: 13px; }
.auth-box form { display: block; }
.auth-box label {
  display: block; font-size: 11px; color: #a6adc8;
  margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.4px;
}
.auth-box input {
  width: 100%; padding: 9px 12px;
  background: #313244; color: #cdd6f4;
  border: 1px solid #45475a; border-radius: 6px;
  font-size: 14px; box-sizing: border-box;
}
.auth-box input:focus { border-color: #89b4fa; outline: none; }
.auth-error { color: #f38ba8; font-size: 12px; margin: 8px 0 4px; min-height: 14px; }
.auth-submit { width: 100%; padding: 10px; margin-top: 14px; font-size: 14px; font-weight: 600; }
.auth-hint {
  margin-top: 16px; padding: 10px 12px;
  background: #313244; border-radius: 6px;
  font-size: 11px; color: #a6adc8; line-height: 1.5;
}
.tenant-label { font-size: 11px; color: #a6adc8; padding: 3px 8px; background: #313244; border-radius: 4px; }
.logout-btn {
  padding: 4px 10px; font-size: 11px;
  background: transparent; border: 1px solid #f38ba8; color: #f38ba8;
  border-radius: 4px; cursor: pointer;
}
.logout-btn:hover { background: #f38ba8; color: #1e1e2e; }

.notification-panel {
  position: fixed; top: 60px; right: 20px;
  background: #1e1e2e; border: 2px solid #313244;
  border-radius: 8px; width: 320px; max-height: 400px;
  overflow-y: auto; z-index: 999; padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.notification-panel h3 { color: #89b4fa; font-size: 14px; margin-bottom: 8px; }
.notif-item {
  background: #313244; padding: 8px; border-radius: 4px;
  margin-bottom: 6px; font-size: 12px; border-left: 3px solid #f9e2af;
}
.notif-item.unread { border-left-color: #f38ba8; }
.notif-item .notif-time { color: #6c7086; font-size: 10px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-green { background: #589e51; color: #1e1e2e; }
.badge-red { background: #db3030; color: #1e1e2e; }

:root {
  --bg-modal: linear-gradient(145deg, #0E1A2B 0%, #101E33 100%);
  --bg-card: #13253F; --border-card: #1E4E8C; --border-card-soft: #1A3A66;
  --accent: #2E7CF6; --cyan: #3DD5C4; --green: #3DD68C;
  --text: #E8EEF7; --text-dim: #7A8FAE; --input-bg: #0B1729;
  --shadow-glow: 0 0 40px rgba(30, 136, 229, 0.25);
}
.task-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 10, 18, 0.9); backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px; z-index: 1000; overflow-y: auto;
}
.task-modal-overlay.hidden { display: none; }
.task-modal {
  position: relative; width: 100%; max-width: 860px;
  margin: auto; flex-shrink: 0;
  background: var(--bg-modal);
  border: 1px solid var(--border-card); border-radius: 16px;
  box-shadow: var(--shadow-glow), 0 30px 80px rgba(0,0,0,0.6);
  padding: 18px 22px 16px;
  animation: modalIn 0.35s ease-out;
  color: var(--text);
}
@media (max-width: 900px) {
  .calc-wrap {
    padding: 8px;
    overflow-x: hidden;
  }
  .calc-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .calc-card {
    min-width: 0;
    padding: 8px 10px;
    border-width: 1px;
  }
  .calc-card .calc-card-title { font-size: 10px; }
  .calc-card .calc-card-value { font-size: 14px; margin-top: 2px; }
  .calc-assignee-bar {
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    gap: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .calc-assignee-bar::-webkit-scrollbar { height: 4px; }
  .calc-assignee-bar::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }
  .calc-assignee-bar label {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 11px;
  }
 .calc-assignee-bar select {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 5px 8px;
    font-size: 11px;
  }
 .calc-assignee-count {
    flex: 0 0 auto;
    margin-left: 0;
    white-space: nowrap;
    font-size: 10px;
  }
  .calc-cols {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;
    overflow-y: hidden;
    white-space: nowrap;
  }
  .calc-cols > * {
    flex: 0 0 auto !important;
    white-space: nowrap;
  }
  .calc-cols label {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 10px;
  }
  .calc-cols .calc-cols-title { font-size: 10px; }
  .calc-cols button.tab-btn {
    flex: 0 0 auto;
    white-space: nowrap;
    padding: 4px 8px;
    font-size: 10px;
  }
  .calc-table-scroll {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .calc-cols::-webkit-scrollbar { height: 4px; }
  .calc-cols::-webkit-scrollbar-thumb { background: #45475a; border-radius: 2px; }
  .calc-table {
    width: auto;
    min-width: 100%;
    table-layout: auto;
    font-size: 11px;
  }
  .calc-table th,
  .calc-table td {
    padding: 6px 8px;
    white-space: nowrap;
    word-break: normal;
  }
  .calc-table th.num,
  .calc-table td.num {
    width: 80px;
    text-align: right;
  }
  .calc-table td.calc-num-col { width: 36px; }

const db = firebase.database();

const TENANTS = {
  user1: { name: 'СТО User1', dbPrefix: 'crm_user1' },
  user2: { name: 'СТО User2', dbPrefix: 'crm_user2' },

  user5: { name: 'СТО User5', dbPrefix: 'crm_user5' }

const PASSWORD_CACHE_KEY = 'crm_tenant_passwords';

function cachedTenantPassword(tenant) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  return map[tenant] || null;
}
function setCachedTenantPassword(tenant, password) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  map[tenant] = password;
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));
}
function effectiveTenantPassword(tenant) {
  const c = cachedTenantPassword(tenant);
  return c || tenant;
}
function authRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix + '/auth/password');
}
function currentTenant() { return localStorage.getItem('crm_current_tenant') || null; }
function dataRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix);
}
function dataRef() { return dataRefFor(currentTenant()); }

const AUTH_SESSION_KEY = 'crm_auth_session';
function currentUser() { return localStorage.getItem(AUTH_SESSION_KEY) || null; }
function verifyAuth(login, password) {
  const l = String(login || '').trim();
  const p = String(password || '');
  if (!TENANTS[l]) return false;
  const expected = cachedTenantPassword(l) || l;
  return p === expected;
}
function loadTenantPassword(tenant) {
  const ref = authRefFor(tenant);
  if (!ref || !ref.once) return;
  ref.once('value').then(snap => {
    const val = snap && snap.val ? snap.val() : null;
    if (val) setCachedTenantPassword(tenant, String(val));
  }).catch(() => {});
}
function changeTenantPassword(tenant, currentPass, newPass, confirmPass) {
  if (!TENANTS[tenant]) return { ok: false, error: 'СТО не выбрано' };
  const cur = String(currentPass || '');
  const np = String(newPass || '');
  const cp = String(confirmPass === undefined ? newPass : confirmPass);
  if (!cur) return { ok: false, error: 'Введите текущий пароль' };
  if (cur !== effectiveTenantPassword(tenant)) return { ok: false, error: 'Неверный текущий пароль' };
  if (!np) return { ok: false, error: 'Новый пароль не может быть пустым' };
  if (np.length < 4) return { ok: false, error: 'Новый пароль короче 4 символов' };
  if (np !== cp) return { ok: false, error: 'Новые пароли не совпадают' };
  const ref = authRefFor(tenant);
  if (ref && ref.set) { try { ref.set(np).catch(() => {}); } catch (e) {} }
  setCachedTenantPassword(tenant, np);
  return { ok: true, error: '' };
}
function resetTenantPassword(tenant) {
  const ref = authRefFor(tenant);
  if (ref && ref.remove) { try { ref.remove().catch(() => {}); } catch (e) {} }
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  delete map[tenant];
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));
}
function login(login, password) {
  if (!verifyAuth(login, password)) return false;
  localStorage.setItem(AUTH_SESSION_KEY, login);
  localStorage.setItem('crm_current_tenant', login);
  return true;
}

}

function partQty(p) { const q = parseInt(p ? p.quantity : 1, 10); return (isNaN(q) || q < 1) ? 1 : q; }

}
function partSale(p) {

    (p.sale !== undefined && p.sale !== '' && p.sale !== null) ? p.sale :
    (p.sellPrice !== undefined && p.sellPrice !== '' && p.sellPrice !== null) ? p.sellPrice :

function migratePart(p) {
  if (!p || typeof p !== 'object') return p;
  if (p.article === undefined || p.article === null) p.article = '';
  const q = parseInt(p.quantity, 10);
  p.quantity = (isNaN(q) || q < 1) ? 1 : q;
  if (!Array.isArray(p.notes)) {
    p.notes = (p.note !== undefined && p.note !== null && String(p.note).trim() !== '') ? [String(p.note)] : [];
  }
  p.note = p.notes.length ? p.notes[0] : '';
  if (!p.status) p.status = 'notordered';
  if (p.purchase === undefined || p.purchase === null) p.purchase = '';
  if (p.sale === undefined || p.sale === null) p.sale = '';
  return p;
}
function tasksToArray(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(v => v && typeof v === 'object');
  if (typeof raw === 'object') {
    return Object.keys(raw)
      .map(k => raw[k])
      .filter(v => v && typeof v === 'object');
  }
  return [];
}

function normalizeTasks(rawTasks) {
  const tasks = tasksToArray(rawTasks);
  tasks.forEach(t => {
    if (!t.parts) t.parts = [];
    t.parts = t.parts.map(migratePart).filter(partHasContent);
    if (!t.works) t.works = [];
    t.works.forEach(w => {
      if (w.hours === undefined) w.hours = '';
      if (w.cost === undefined) w.cost = '';
      if (w.price === undefined) w.price = '';
      if (!w.status) w.status = 'notstarted';
      if (!w.link) w.link = '';
      if (w.comment === undefined) w.comment = '';
      if (w.assignee === undefined || w.assignee === null) w.assignee = '';
    });
    if (t.hidden === undefined) t.hidden = false;
    if (!t.payments) t.payments = [];
    if (!t.log) t.log = [];
    if (!t.client) t.client = { name: '—', phone: '—', history: [] };
    if (!t.client.history) t.client.history = [];
    if (!t.car) t.car = { plate: '—', model: '—', year: '', vin: '' };
    if (t.column === undefined) t.column = 'waiting';
    if (t.order === undefined) t.order = 0;
  });
  const numbered = tasks.filter(t => typeof t.number === 'number' && t.number > 0);
  if (numbered.length) state.taskCounter = Math.max(state.taskCounter || 0, ...numbered.map(t => t.number));
  const unnumbered = tasks.filter(t => typeof t.number !== 'number' || !(t.number > 0))
    .sort((a, b) => String(a.createdAt || a.updatedAt || '').localeCompare(String(b.createdAt || b.updatedAt || '')));
  unnumbered.forEach(t => { t.number = nextTaskNumber(); });
  return tasks;
}
function nextTaskNumber() {
  state.taskCounter = (state.taskCounter || 0) + 1;
  return state.taskCounter;
}
async function nextTaskNumberAsync() {
  const ref = dataRef();
  if (!ref) return nextTaskNumber();
  try {
    const counterRef = ref.child('taskCounter');
    const result = await counterRef.transaction((current) => (current || 0) + 1);
    if (result.committed) {
      state.taskCounter = result.snapshot.val();
      return state.taskCounter;
    }
    return nextTaskNumber();
  } catch (err) { return nextTaskNumber(); }
}

function localStorageFallbackKey() {
  const t = currentTenant();
  return t ? 'crm_autoservice_' + t : 'crm_autoservice_anon';
}

// Мгновенное точечное сохранение задачи + служебных данных.
// saveState() без аргумента — только метаданные (без tasks),
// чтобы не перезаписывать чужие задачи при работе с 2+ устройств.
function saveState(taskId = null) {
  if (taskId) {
    saveTaskNow(taskId);
    return;
  }
  saveMetaNow();
}

function saveMetaNow() {
  const ref = dataRef();
  const meta = {
    notifications: state.notifications,
    lastRead: state.lastRead,
    taskCounter: state.taskCounter
  };
  if (!ref) {
    // fallback: сохраняем всё локально
    const data = { tasks: state.tasks, ...meta };
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
    return;
  }
  ref.update(meta).catch(err => {
    console.error('Firebase meta write error:', err);
  });
}

function saveTaskNow(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const ref = dataRef();
  if (!ref) {
    // fallback: сохраняем всё локально
    const data = {
      tasks: state.tasks,
      notifications: state.notifications,
      lastRead: state.lastRead,
      taskCounter: state.taskCounter
    };
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
    return;
  }
  // Записываем ТОЛЬКО одну задачу — чужие не трогаем
  ref.child('tasks/' + taskId).set(task).catch(err => {
    console.error('Firebase task write error:', err);
    alert('Не удалось сохранить задачу. Проверьте соединение.');
  });
}

function deleteTaskNow(taskId) {
  const ref = dataRef();
  if (!ref) {
    const data = {
      tasks: state.tasks,
      notifications: state.notifications,
      lastRead: state.lastRead,
      taskCounter: state.taskCounter
    };
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
    return;
  }
  ref.child('tasks/' + taskId).remove().catch(err => {
    console.error('Firebase task delete error:', err);
  });
}
function loadState() {
  const ref = dataRef();
  if (!ref) {
    state.tasks = []; state.notifications = []; state.lastRead = {}; state.taskCounter = 0;
    render(); return;
  }
  if (_dataRef) { try { _dataRef.off(); } catch(e){} }
  _dataRef = ref;
  ref.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state.tasks = data.tasks;   // может быть массивом ИЛИ объектом — normalizeTasks приведёт
      state.notifications = data.notifications || [];
      state.lastRead = data.lastRead || {};
      state.taskCounter = data.taskCounter || 0;
    } else {
      state.tasks = [];
    }
    state.tasks = normalizeTasks(state.tasks);
    render();
  }, (error) => {
    console.error('Firebase read error:', error);
    try {
      const saved = localStorage.getItem(localStorageFallbackKey());
      if (saved) {
        const parsed = JSON.parse(saved);
        state.tasks = parsed.tasks;
        state.notifications = parsed.notifications || [];
        state.lastRead = parsed.lastRead || {};
        state.taskCounter = parsed.taskCounter || 0;
      }
    } catch(e) { console.error(e); }
    state.tasks = normalizeTasks(state.tasks);
    render();
  });
}

function brandOf(model) {
  if (!model) return DEFAULT_BRAND;
  const s = String(model).trim().toUpperCase();
  const keys = Object.keys(BRANDS).sort((a, b) => b.length - a.length);
  for (const key of keys) if (s === key || s.startsWith(key + ' ') || s.startsWith(key)) return BRANDS[key];
  const first = s.split(/\s+/)[0];
  if (BRANDS[first]) return BRANDS[first];
  return DEFAULT_BRAND;
}
// ============ УДАЛЕНИЕ ФОНА У ЛОГОТИПОВ ============
const LOGO_PROCESS_CACHE = {};

function processLogoRemoveBackground(url, callback) {
  if (LOGO_PROCESS_CACHE[url] !== undefined) {
    callback(LOGO_PROCESS_CACHE[url]);
    return;
  }
  LOGO_PROCESS_CACHE[url] = null;

  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = im.naturalWidth;
      c.height = im.naturalHeight;
      const cx = c.getContext('2d');
      cx.drawImage(im, 0, 0);
      const imgData = cx.getImageData(0, 0, c.width, c.height);
      const d = imgData.data;

      const bgR = d[0], bgG = d[1], bgB = d[2];
      const THRESHOLD = 40;

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const diff = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);
        if (diff < THRESHOLD) d[i + 3] = 0;
      }
      cx.putImageData(imgData, 0, 0);
      const dataUrl = c.toDataURL('image/png');
      LOGO_PROCESS_CACHE[url] = dataUrl;
      callback(dataUrl);
    } catch (e) {
      console.warn('Не удалось убрать фон у логотипа:', url, e);
      LOGO_PROCESS_CACHE[url] = null;
      callback(null);
    }
  };
  im.onerror = () => {
    LOGO_PROCESS_CACHE[url] = null;
    callback(null);
  };
  im.src = url;
}
function plateBadgeHtml(plate) {
  const raw = String(plate == null ? '' : plate).trim();
  if (!raw) return `<div class="task-plate task-plate--compact"><span class="task-plate__rus">RUS</span><span class="task-plate__number">—</span></div>`;
  const m = raw.match(/^([А-ЯA-Z0-9\s]+?)\s*(\d{2,3})?$/i);
  let main = raw, region = '';
  if (m) { main = (m[1] || raw).trim(); region = (m[2] || '').trim(); }
  const numberText = region ? `${main} ${region}` : main;
  const compact = numberText.length > 9 ? ' task-plate--compact' : '';
  return `<div class="task-plate${compact}"><span class="task-plate__rus">RUS</span><span class="task-plate__number">${esc(numberText)}</span></div>`;
}
function brandBackgroundHtml(model) {
  const b = brandOf(model);

  return `<div class="task-brand-bg" aria-hidden="true">
    <img class="brand-logo-img" data-logo-url="${esc(b.logo)}" src="${b.logo}" alt=""
         onerror="this.parentElement.style.display='none';" loading="lazy">

}
function hasComment(task) { return !!(task && task.comment && String(task.comment).trim()); }
function commentNoteHtml(task) {

function openCommentModal(taskId) {

function commentEscHandler(e) { if (e.key === 'Escape') closeCommentModal(); }
function closeCommentModal() {
  const el = document.getElementById('commentModalOverlay');
  if (el && el.parentElement) el.parentElement.removeChild(el);

function setDragGhost(e, sourceEl, task) {
  cleanupGhost();
  const rect = sourceEl.getBoundingClientRect();
  const offsetX = Math.max(0, Math.min(rect.width,  e.clientX - rect.left));
  const offsetY = Math.max(0, Math.min(rect.height, e.clientY - rect.top));
  const ghost = document.createElement('div');
  ghost.className = 'task';
  ghost.style.width = rect.width + 'px';
  ghost.style.borderLeftColor = getTaskColor(task.id);
  ghost.style.background = '#313244';
  ghost.style.padding = '8px';
  ghost.style.borderRadius = '6px';
  ghost.style.fontSize = '12px';
  ghost.style.borderLeft = '4px solid ' + getTaskColor(task.id);
  ghost.style.boxShadow = '0 8px 24px rgba(137,180,250,0.45)';
  ghost.style.opacity = '0.9';
  ghost.style.transform = 'rotate(1.5deg)';
  ghost.style.pointerEvents = 'none';
  ghost.style.display = 'flex';
  ghost.style.flexDirection = 'column';
  ghost.style.gap = '4px';
  ghost.style.overflow = 'hidden';
  ghost.innerHTML = taskCardHtml(task);
  document.getElementById('dragGhostContainer').appendChild(ghost);
  try { e.dataTransfer.setDragImage(ghost, offsetX, offsetY); } catch (err) {}
  setTimeout(cleanupGhost, 0);
}
function cleanupGhost() {
  const c = document.getElementById('dragGhostContainer');
  while (c && c.firstChild) c.removeChild(c.firstChild);
}
function cleanupDragGhost() {
  if (dragGhostEl && dragGhostEl.parentElement) {
    dragGhostEl.parentElement.removeChild(dragGhostEl);
  }
  dragGhostEl = null;
}

function currentKanbanFilters() { return Array.isArray(state.kanbanFilter) ? state.kanbanFilter : []; }
function taskMatchesKanbanFilter(t, key) {
  const parts = t.parts || []; const works = t.works || [];
  switch (key) {
    case 'unpaid': return paymentState(t) === 'unpaid';
    case 'notordered': return parts.some(p => p.status === 'notordered');
    case 'ordered': return parts.some(p => p.status === 'ordered');
    case 'nowork': return works.some(w => w.status === 'notstarted');
    case 'inwork': return works.some(w => w.status === 'inwork');
  }
  return true;
}
const KANBAN_FILTERS = [
  { key: 'unpaid',     title: 'Неоплаченные' },
  { key: 'notordered', title: 'Незаказанные' },
  { key: 'ordered',    title: 'Заказанные' },
  { key: 'nowork',     title: 'Не в работе' },
  { key: 'inwork',     title: 'В работе' }
];
function tasksBaseForUser() {
  const u = state.currentUser;
  if (USERS[u].role === 'chief') return state.tasks;
  return state.tasks.filter(t => !t.assignee || t.assignee === u);
}
function visibleTasksForUser() {
  let list = tasksBaseForUser();
  const fl = currentKanbanFilters();
  if (fl.length) list = list.filter(t => fl.some(k => taskMatchesKanbanFilter(t, k)));
  return list.filter(t => !t.hidden);
}
function visibleTasksForCalc() {
  let list = tasksBaseForUser();
  const f = state.calcStatusFilter || '';
  if (f === 'hidden') list = list.filter(t => !!t.hidden);
  else if (f) list = list.filter(t => t.column === f);
  return list;
}
function processAllBrandLogos() {
  document.querySelectorAll('img.brand-logo-img[data-logo-url]').forEach(img => {
    const url = img.dataset.logoUrl;
    if (!url) return;
    processLogoRemoveBackground(url, dataUrl => {
      if (dataUrl && img.isConnected) {

}

function renderFilterBar() {

  let inner = '';
  if (isCalc) {
    inner += `<label class="filter-label">Фильтр по статусу:</label>

function toggleKanbanFilter(key, on) {
  const fl = currentKanbanFilters().slice();
  const i = fl.indexOf(key);
  if (on && i < 0) fl.push(key);
  if (!on && i >= 0) fl.splice(i, 1);
  state.kanbanFilter = fl;
  render();
}
function onStatusFilterChange(v) { state.kanbanFilter = []; render(); }
function onCalcStatusFilterChange(v) { state.calcStatusFilter = v || ''; render(); }

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const visible = visibleTasksForUser();
  COLUMNS.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = `column ${col.cls}`;
    colEl.dataset.col = col.id;
    const header = document.createElement('div');
    header.className = 'column-header';
    const body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.col = col.id;

    if (col.special && col.id === 'recent') {
      const groups = groupChangesByTask(collectRecentChanges(60));
      header.textContent = `${col.title} (${groups.length})`;
      colEl.appendChild(header);
      if (!groups.length) {
        const em = document.createElement('div');
        em.className = 'empty-msg';
        em.textContent = 'Нет изменений';
        body.appendChild(em);
      } else {
        groups.forEach(g => {
          const card = document.createElement('div');
          card.className = 'rc-card';
          card.onclick = () => openTaskView(g.taskId);
          const lines = g.entries.slice(0, 3).map(e => {
            const cls = rcEntryClass(e.text);
            return `<div class="rc-card__line ${cls}"><span class="rc-card__time">${formatTime(e.time)}</span> ${esc(e.text.slice(0, 80))}${e.text.length > 80 ? '…' : ''}</div>`;
          }).join('');
          const more = g.entries.length > 3 ? `<div class="rc-card__line"><span class="rc-card__time">… ещё ${g.entries.length - 3}</span></div>` : '';
          card.innerHTML = `
            <div class="rc-card__head">
              <span class="rc-card__plate">${esc(g.plate)}</span>
              <span class="rc-card__model">${g.number ? '№' + g.number + ' · ' : ''}${esc(g.model)}</span>
              <span class="rc-card__cnt">${g.entries.length}</span>
            </div>
            ${lines}${more}`;
          body.appendChild(card);
        });
      }
    } else {
      const count = visible.filter(t => t.column === col.id).length;
      header.textContent = `${col.title} (${count})`;
      colEl.appendChild(header);
      const tasks = visible.filter(t => t.column === col.id).sort((a,b) => (a.order || 0) - (b.order || 0));
      tasks.forEach(t => body.appendChild(renderTask(t)));
      if (tasks.length === 0) {
        const em = document.createElement('div');
        em.className = 'empty-msg';
        em.textContent = 'Пусто';
        body.appendChild(em);
      }
    }
    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

function renderTask(task) {
  const el = document.createElement('div');
  el.className = 'task task--compact';
  el.dataset.id = task.id;
  el.style.borderLeftColor = getTaskColor(task.id);
  el.innerHTML = taskCardHtml(task);

  let holdTimer = null;
  let dragReady = false;
  let didDrag = false;

  function cancelHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  }
  function resetDrag() {
    dragReady = false;
    el.draggable = false;
  }

el.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('.task-comment-note')) return;
  if (e.target.closest('button')) return;
  cancelHold();
  didDrag = false;
  el.draggable = true;
  dragReady = true;
});


 el.addEventListener('mouseup', () => {
  cancelHold();
  setTimeout(() => {
    if (!dragTaskId) {
      el.draggable = false;
      dragReady = false;
    }
  }, 0);
});
  el.addEventListener('mouseleave', () => { cancelHold(); resetDrag(); });

el.addEventListener('dragstart', e => {
  didDrag = true;
  dragTaskId = task.id;
  dragEl = el;

  e.dataTransfer.setData('text/plain', task.id);
  e.dataTransfer.effectAllowed = 'move';

  cleanupDragGhost();
  const rect = el.getBoundingClientRect();
  dragGhostOffsetX = e.clientX - rect.left;
  dragGhostOffsetY = e.clientY - rect.top;

  const ghost = el.cloneNode(true);
  ghost.classList.add('task-drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left = (e.clientX - dragGhostOffsetX) + 'px';
  ghost.style.top  = (e.clientY - dragGhostOffsetY) + 'px';
  ghost.style.transform = 'rotate(2deg) scale(1.02)';
  ghost.querySelectorAll('button').forEach(b => b.disabled = true);
  document.body.appendChild(ghost);
  dragGhostEl = ghost;

  try {
    const img = new Image();
    img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    e.dataTransfer.setDragImage(img, 0, 0);
  } catch (_) {}

  el.classList.add('dragging');
});

el.addEventListener('dragend', () => {
  if (dragEl) dragEl.classList.remove('dragging');
  document.querySelectorAll('.column.drag-over').forEach(c => c.classList.remove('drag-over'));
  cleanupDragGhost();
  cleanupGhost();
  dragTaskId = null;
  dragEl = null;
  resetDrag();
  setTimeout(() => { didDrag = false; }, 0);
});
// ==== TOUCH DRAG (мобильные) ====
let touchHoldTimer = null;
let touchDragActive = false;
let touchStartX = 0, touchStartY = 0;
let touchMoved = false;

el.addEventListener('touchstart', e => {
  if (e.target.closest('.task-comment-note')) return;
  if (e.target.closest('button')) return;
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchMoved = false;
  touchDragActive = false;

touchHoldTimer = setTimeout(() => {
  touchDragActive = true;
  dragTaskId = task.id;
  dragEl = el;
  el.classList.add('dragging');

  // --- ghost для тача ---
  cleanupDragGhost();
  const rect = el.getBoundingClientRect();
  // «Палец» в точке старта — берём центр пальца из touchstart (touchStartX/Y)
  dragGhostOffsetX = touchStartX - rect.left;
  dragGhostOffsetY = touchStartY - rect.top;

  const ghost = el.cloneNode(true);
  ghost.classList.add('task-drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.left = (touchStartX - dragGhostOffsetX) + 'px';
  ghost.style.top  = (touchStartY - dragGhostOffsetY) + 'px';
  ghost.style.transform = 'rotate(2deg) scale(1.02)';
  ghost.querySelectorAll('button').forEach(b => b.disabled = true);
  document.body.appendChild(ghost);
  dragGhostEl = ghost;

  if (navigator.vibrate) navigator.vibrate(30);
}, 250);
}, { passive: true });

el.addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;

  if (!touchDragActive) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      if (touchHoldTimer) { clearTimeout(touchHoldTimer); touchHoldTimer = null; }
      e.preventDefault();
      const board = document.getElementById('board');
      board.scrollLeft -= dx;
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      touchMoved = true;
      return;
    }
    if (Math.abs(dy) > 10) {
      if (touchHoldTimer) { clearTimeout(touchHoldTimer); touchHoldTimer = null; }
    }
    return;
  }

  e.preventDefault();
  touchMoved = true;

  const board = document.getElementById('board');
  const br = board.getBoundingClientRect();
  const EDGE = 70;
  const STEP = 14;
  if (t.clientX < br.left + EDGE) {
    const intensity = (br.left + EDGE - t.clientX) / EDGE;
    board.scrollLeft -= Math.max(4, STEP * intensity);
  } else if (t.clientX > br.right - EDGE) {
    const intensity = (t.clientX - (br.right - EDGE)) / EDGE;
    board.scrollLeft += Math.max(4, STEP * intensity);
  }
  // --- двигаем ghost за пальцем ---
  if (dragGhostEl) {
    dragGhostEl.style.left = (t.clientX - dragGhostOffsetX) + 'px';
    dragGhostEl.style.top  = (t.clientY - dragGhostOffsetY) + 'px';
  }
  moveDragToCursor(t.clientX, t.clientY);
}, { passive: false });

el.addEventListener('touchend', e => {

}, { passive: true });

el.addEventListener('touchcancel', () => {

});
document.getElementById('board').addEventListener('dragenter', e => {

document.getElementById('board').addEventListener('drop', e => {

function moveDragToCursor(x, y) {
  const board = document.getElementById('board');
  const colEls = board.querySelectorAll('.column');
  let targetColEl = null;
  for (const colEl of colEls) {
    const r = colEl.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) { targetColEl = colEl; break; }
  }
  if (!targetColEl) return;
  const colBody = targetColEl.querySelector('.column-body');
  if (!colBody) return;
  const newCol = colBody.dataset.col;
  const colTasks = Array.from(colBody.querySelectorAll('.task')).filter(el => el !== dragEl);
  let insertIdx = colTasks.length;
  for (let i = 0; i < colTasks.length; i++) {
    const r = colTasks[i].getBoundingClientRect();
    const midY = r.top + r.height / 2;
    if (y < midY) { insertIdx = i; break; }
  }
  let currentIdx = -1;
  if (dragEl.parentElement === colBody) currentIdx = Array.from(colBody.children).indexOf(dragEl);
  if (currentIdx !== -1) {
    const effectiveIdx = currentIdx < insertIdx ? insertIdx - 1 : insertIdx;
    if (effectiveIdx === currentIdx) { highlightColumn(targetColEl); return; }
  }
  if (dragEl.parentElement) dragEl.parentElement.removeChild(dragEl);
  if (colTasks.length === 0) {
    const empty = colBody.querySelector('.empty-msg');
    if (empty) empty.remove();
    colBody.appendChild(dragEl);
  } else if (insertIdx >= colTasks.length) {
    colTasks[colTasks.length - 1].after(dragEl);
  } else {
    colTasks[insertIdx].before(dragEl);
  }
    const task = state.tasks.find(t => t.id === dragTaskId);
  if (task) {
    Array.from(colBody.querySelectorAll('.task')).forEach((el, i) => {
      const t = state.tasks.find(x => x.id === el.dataset.id);
      if (t) t.order = i;
    });
  }
  updateColumnCounts();
  highlightColumn(targetColEl);
}
function normalizeOrder(colId) {
  const arr = state.tasks.filter(t => t.column === colId).sort((a, b) => (a.order || 0) - (b.order || 0));
  arr.forEach((t, i) => { t.order = i; });
}
function highlightColumn(colEl) {
  document.querySelectorAll('.column.drag-over').forEach(c => { if (c !== colEl) c.classList.remove('drag-over'); });
  colEl.classList.add('drag-over');
}
function restoreEmptyPlaceholder(colId) {
  const board = document.getElementById('board');
  const colEl = board.querySelector(`.column[data-col="${colId}"]`);
  if (!colEl) return;
  const colBody = colEl.querySelector('.column-body');
  if (!colBody) return;
  if (!colBody.querySelector('.task') && !colBody.querySelector('.empty-msg')) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Пусто';
    colBody.appendChild(empty);
  }
}
function updateColumnCounts() {
  const board = document.getElementById('board');
  COLUMNS.forEach(col => {
    if (col.special) return;
    const colEl = board.querySelector(`.column[data-col="${col.id}"]`);
    if (!colEl) return;
    const header = colEl.querySelector('.column-header');
    if (!header) return;
    const count = visibleTasksForUser().filter(t => t.column === col.id).length;
    header.textContent = `${col.title} (${count})`;

}

// ============ BADGES ============
function statusColorGroup(kind, status) {
  if (kind === 'part') {
    if (status === 'instock') return 'green';
    if (status === 'ordered') return 'yellow';
    return 'red';
  }
  if (status === 'finished') return 'green';
  if (status === 'inwork') return 'yellow';
  return 'red';
}
const PART_STATUS_CYCLE = ['notordered', 'ordered', 'instock'];
const WORK_STATUS_CYCLE = ['notstarted', 'inwork', 'finished'];
function cycleItemStatus(taskId, kind, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (kind === 'part') {
    if (!task.parts || !task.parts[index]) return;
    const cur = task.parts[index].status || 'notordered';
    const next = PART_STATUS_CYCLE[(PART_STATUS_CYCLE.indexOf(cur) + 1) % PART_STATUS_CYCLE.length];
    const oldLabel = PARTS_STATUS[cur] || cur;
    task.parts[index].status = next;
    task.updatedAt = new Date().toISOString();
    task.log = task.log || [];
    task.log.push({ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: `Статус запчасти «${task.parts[index].name || '—'}»: ${oldLabel} → ${PARTS_STATUS[next]}` });
    saveState(taskId);
  } else if (kind === 'work') {
    if (!task.works || !task.works[index]) return;
    const cur = task.works[index].status || 'notstarted';
    const next = WORK_STATUS_CYCLE[(WORK_STATUS_CYCLE.indexOf(cur) + 1) % WORK_STATUS_CYCLE.length];
    const oldLabel = WORKS_STATUS[cur] || cur;
    task.works[index].status = next;
    task.updatedAt = new Date().toISOString();
    task.log = task.log || [];
    task.log.push({ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: `Статус работы «${task.works[index].name || '—'}»: ${oldLabel} → ${WORKS_STATUS[next]}` });
    saveState(taskId);
  }
  // Обновляем только открытую модалку задачи, не закрывая
  const overlay = document.getElementById('taskViewModal');
  if (overlay) {
    openTaskView(taskId);
  } else {
    renderBoard();
  }
}

function tryMoveTask(taskId, newCol) {
  if (newCol === 'recent') return; // нельзя перетаскивать в столбец изменений
  const colMeta = COLUMNS.find(c => c.id === newCol);
  if (colMeta && colMeta.special) return;
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const u = state.currentUser;
  if (USERS[u].role === 'worker') {
    if (task.assignee && task.assignee !== u) { alert('Вы не можете изменять эту задачу'); return; }
    if (!task.assignee && newCol !== 'inwork') { alert('Сначала возьмите задачу в работу'); return; }
  }
  if (task.column === newCol) { saveState(); return; }

  const noModalCols = ['parts', 'inwork', 'done'];
  if (noModalCols.indexOf(newCol) >= 0) {
    const oldCol = task.column;
    task.column = newCol;
    task.updatedAt = new Date().toISOString();
    const fromTitle = (COLUMNS.find(c => c.id === oldCol) || {}).title || oldCol;
    const toTitle = (COLUMNS.find(c => c.id === newCol) || {}).title || newCol;
    task.log.push({
      time: new Date().toISOString(),
      user: USERS[u].name,
      text: `Перемещение: ${fromTitle} → ${toTitle}`
    });
    saveState(taskId);
    render();
    return;
  }

  openMoveModal(taskId, newCol);
}

// ============ ВРЕМЯ / РАСПИСАНИЕ ============
function toLocalInput(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
const SLOT_START_HOUR = 8, SLOT_END_HOUR = 20, SLOT_STEP_MIN = 30;
function timeSlots() {
  const out = [];
  for (let m = SLOT_START_HOUR * 60; m <= SLOT_END_HOUR * 60; m += SLOT_STEP_MIN) {
    const h = Math.floor(m / 60), mm = m % 60;
    out.push(String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
  }
  return out;
}
function roundToSlot(hhmm) {
  const slots = timeSlots();
  if (!hhmm) return slots[0];
  const [h, m] = hhmm.split(':').map(Number);
  const snapped = Math.round((h*60+m) / SLOT_STEP_MIN) * SLOT_STEP_MIN;
  const res = String(Math.floor(snapped/60)).padStart(2,'0') + ':' + String(snapped%60).padStart(2,'0');
  return slots.includes(res) ? res : slots[0];
}
function isoToDateTimeParts(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d)) return { date: '', time: '' };
  const p = n => String(n).padStart(2,'0');
  return { date: `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, time: `${p(d.getHours())}:${p(d.getMinutes())}` };
}
function schedDateStr(d) {
  const dt = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
}
function partsToIso(date, time) {
  if (!date) return null;
  const t = roundToSlot(time || '');
  const d = new Date(`${date}T${t}:00`);
  if (isNaN(d)) return null;
  return d.toISOString();
}
function schedulePickerHtml(prefix, iso, label, defaultToday) {
  const parts = isoToDateTimeParts(iso);
  const slots = timeSlots();
  const selected = parts.time ? roundToSlot(parts.time) : '';
  let dateVal = parts.date;
  if (!dateVal && defaultToday) dateVal = schedDateStr(new Date());
  const opts = ['<option value="">— время —</option>'].concat(slots.map(s => `<option value="${s}" ${selected === s ? 'selected' : ''}>${s}</option>`)).join('');
  return `<label>${label || 'Дата и время записи'} (шаг 30 минут)</label>
    <div class="sched-picker"><input type="date" id="${prefix}_date" value="${dateVal}"><select id="${prefix}_time" class="slot-select">${opts}</select></div>`;
}
function getScheduleValue(prefix) {
  const dateEl = document.getElementById(prefix + '_date');
  const timeEl = document.getElementById(prefix + '_time');
  if (!dateEl) return null;
  return partsToIso(dateEl.value, timeEl ? timeEl.value : '');
}

function extractUrl(text) {

  return m ? m[0] : '';
}
function openPartNoteLink(input) {

function updatePartOrderedCheck(select) {

  if (!row) return;

  if (!check) return;
  const done = select.value === 'ordered' || select.value === 'instock';

function stepPartQty(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.qty-input');
  if (!input) return;
  let q = parseInt(input.value, 10); if (isNaN(q)) q = 1;
  q += delta; if (q < 1) q = 1;
  input.value = String(q);
  updatePartRowTotal(input);
}
function updatePartRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const qtyInput = row.querySelector('input.qty-input');
  const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
  const purchase = num(nums[0] ? nums[0].value : 0);
  const sale = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = (sale - purchase) * (qty < 1 ? 1 : qty);
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}
function collectPartRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const parts = [];
  rows.forEach(r => {
    const name = (r.querySelector('input.name-input')?.value || '').trim();
    const article = (r.querySelector('input.article')?.value || '').trim();
    const qtyInput = r.querySelector('input.qty-input');
    const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
    const nums = r.querySelectorAll('input.num');
    const purchase = nums[0] ? nums[0].value.trim() : '';
    const sale = nums[1] ? nums[1].value.trim() : '';
    const status = r.querySelector('select.work-status')?.value || 'notordered';
    const notes = Array.from(r.querySelectorAll('input.note-input')).map(n => n.value.trim()).filter(v => v !== '');
    if (name || article || notes.length || purchase || sale) {
      parts.push({ name, article, notes, note: notes.length ? notes[0] : '', link: '', quantity: qty < 1 ? 1 : qty, purchase, sale, status });
    }
  });
  return parts;
}
function stepWorkHours(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.hours-input');
  if (!input) return;
  let next = Math.round((num(input.value) + delta) * 2) / 2;
  if (next < 0) next = 0;
  input.value = next === 0 ? '0' : String(next);
  updateWorkRowTotal(input);
}
function updateWorkRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const cost = num(nums[0] ? nums[0].value : 0);
  const price = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = price - cost;
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}
function collectWorkRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const works = [];
  rows.forEach(r => {
    const name = (r.querySelector('input.name-input')?.value || '').trim();
    const hours = (r.querySelector('input.hours-input')?.value || '').trim();
    const nums = r.querySelectorAll('input.num');
    const cost = nums[0] ? nums[0].value.trim() : '';
    const price = nums[1] ? nums[1].value.trim() : '';
    const status = r.querySelector('select.work-status')?.value || 'notstarted';
    const assignee = r.querySelector('select.work-assignee')?.value || '';
    const comment = (r.querySelector('input.work-comment')?.value || '').trim();
    if (name) works.push({ name, hours, cost, price, status, assignee, comment, link: '' });
  });
  return works;
}

// ============ CONFIRM MOVE ============
function confirmMove(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  const oldCol = task.column;
  const user = USERS[state.currentUser].name;
  const logEntries = [];
  if (newCol === 'waiting') {
    const v = document.getElementById('mExpectedAction')?.value.trim() || '';
    task.pendingAction = v;
    logEntries.push(`Ожидаемое действие: ${v || '(не указано)'}`);
  } else if (newCol === 'approval') {
    const v = document.getElementById('mApproval')?.value.trim() || '';
    task.approvalNote = v;
    logEntries.push(`Согласовать: ${v || '(не указано)'}`);
  } else if (newCol === 'parts') {
    const parts = collectPartRows('#partsList');
    task.parts = parts;
    logEntries.push(`Запчасти: ${parts.map(p=>p.name).join(', ') || '(нет)'}`);
  } else if (newCol === 'inwork') {
    const assigneeEl = document.getElementById('mAssignee');
    const postEl = document.getElementById('mPost');
    const time = getScheduleValue('m');
    const works = collectWorkRows('#mWorksList');
    if (assigneeEl) { const a = assigneeEl.value; if (!a) { alert('Назначьте исполнителя'); return; } task.assignee = a; }
    else if (!task.assignee) task.assignee = 'locksmith';
    if (postEl) task.post = parseInt(postEl.value);
    else if (!task.post) task.post = 1;
    if (!time) { alert('Укажите время'); return; }
    task.scheduledTime = new Date(time).toISOString();
    if (works.length) task.works = works;
    logEntries.push(`Исполнитель: ${task.assignee ? USERS[task.assignee].name : '—'}, Пост №${task.post}`);
  } else if (newCol === 'done') {
    const worksDone = collectDoneWorkRows();
    const cm = document.getElementById('mDoneComment')?.value.trim() || '';
    if (worksDone && worksDone.length) task.works = worksDone;
    task.doneComment = cm;
    if (cm) logEntries.push(`Комментарий: ${cm}`);
  } else if (newCol === 'issue') {
    task.workDone = document.getElementById('mWorkDone')?.value.trim() || '';
    task.recommendations = document.getElementById('mRecommend')?.value.trim() || '';
    task.issued = (document.getElementById('mIssued')?.value || '0') === '1';
    logEntries.push(`Статус выдачи: ${task.issued ? 'ВЫДАНО' : 'НЕ ВЫДАНО'}`);
  }
  const fromTitle = COLUMNS.find(c=>c.id===oldCol).title;
  const toTitle = COLUMNS.find(c=>c.id===newCol).title;
  const noteParts = [];
  if (newCol === 'waiting' && task.pendingAction) {
    noteParts.push({ label: 'Ожидаемое действие', value: task.pendingAction });
  }
  if (newCol === 'approval' && task.approvalNote) {
    noteParts.push({ label: 'Что необходимо согласовать', value: task.approvalNote });
  }
  if (newCol === 'issue') {
    if (task.workDone) noteParts.push({ label: 'Проделанные работы', value: task.workDone });
    if (task.recommendations) noteParts.push({ label: 'Рекомендации для обслуживания', value: task.recommendations });
  }
  if (newCol === 'done' && task.doneComment) {
    noteParts.push({ label: 'Комментарий по завершении', value: task.doneComment });
  }
  if (noteParts.length) {
    const stamp = `[${nowStr()}] ${toTitleFromId(newCol)}`;
    const lines = noteParts.map(n => `  ${n.label}: ${n.value}`);
    const block = `${stamp}\n${lines.join('\n')}`;
    task.comment = (task.comment ? task.comment + '\n' : '') + block;
  }
  task.column = newCol;
  task.updatedAt = new Date().toISOString();
  task.log.push({ time: new Date().toISOString(), user, text: `Перемещение: ${fromTitle} → ${toTitle}` + (logEntries.length ? '. ' + logEntries.join(' | ') : '') });
  saveState(task.id);
  closeModal();
  render();
}

function saveWorkModal(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.works || !task.works[index]) return;
  const list = document.getElementById('ce_worksList');
  const rows = list ? list.querySelectorAll('.part-row') : [];
  const collect = (r) => {
    const name = (r.querySelector('input.name-input')?.value || '').trim();
    const hours = (r.querySelector('input.hours-input')?.value || '').trim();
    const nums = r.querySelectorAll('input.num');
    const cost = nums[0] ? nums[0].value.trim() : '';
    const price = nums[1] ? nums[1].value.trim() : '';
    const status = r.querySelector('select.work-status')?.value || 'notstarted';
    const assignee = r.querySelector('select.work-assignee')?.value || '';
    return { name, hours, cost, price, status, assignee };
  };
  const first = rows[0] ? collect(rows[0]) : { name: '' };
  if (!first.name) {
    if (!confirm('Название пустое — удалить?')) return;
    task.works.splice(index, 1);
  } else {
    task.works[index] = Object.assign({}, task.works[index], first);

  const newWorks = [];
  for (let i = 1; i < rows.length; i++) {
    const r = collect(rows[i]);
    if (r.name) newWorks.push(Object.assign({ link: '', comment: '' }, r));
  }
  if (newWorks.length) task.works = (task.works || []).concat(newWorks);

  closeModal();
  render();
  setTimeout(() => openTaskView(taskId), 80);

function saveChar(taskId, field) {
  const task = state.tasks.find(t => t.id === taskId);
  const user = USERS[state.currentUser].name;
  let logText = '';
  if (field === 'car') {
    task.car.plate = document.getElementById('ce_plate').value.trim();
    task.car.model = document.getElementById('ce_model').value.trim();
    task.car.year = document.getElementById('ce_year').value;
    logText = 'Авто изменено';
  } else if (field === 'vin') {
    task.car.vin = document.getElementById('ce_vin').value.trim().toUpperCase();
    logText = 'VIN изменён';
  } else if (field === 'time') {
    const v = getScheduleValue('ce');
    task.scheduledTime = v;
    logText = `Время: ${formatTime(v)}`;
  } else if (field === 'assignee') {
    task.assignee = document.getElementById('ce_assignee').value || null;
    logText = `Исполнитель: ${task.assignee ? USERS[task.assignee].name : '—'}`;
  } else if (field === 'post') {
    const v = document.getElementById('ce_post').value;
    task.post = v ? parseInt(v) : null;
    logText = `Пост: ${task.post ? '№'+task.post : '—'}`;
  } else if (field === 'parts') {
    const parts = collectPartRows('#ce_partsList');
    task.parts = parts;
    logText = 'Запчасти обновлены';
  } else if (field === 'works') {
    const works = collectWorkRows('#ce_worksList');
    task.works = works;
    logText = 'Работы обновлены';
  } else if (field === 'payments') {
    const amountRaw = document.getElementById('ce_payAmount').value.trim();
    const amount = num(amountRaw);
    if (!amountRaw || amount <= 0) { alert('Укажите сумму'); return; }
    const dateVal = document.getElementById('ce_payDate').value;
    const comment = document.getElementById('ce_payComment').value.trim();
    const method = document.getElementById('ce_payMethod').value;
    task.payments = task.payments || [];
    task.payments.push({ date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(), amount, comment, method, user });
    logText = `Оплата ${money(amount)}`;
  } else if (field === 'client') {
    task.client.name = document.getElementById('ce_clientName').value.trim();
    task.client.phone = document.getElementById('ce_clientPhone').value.trim();
    logText = 'Клиент изменён';
  } else if (field === 'reason') {
    task.reason = document.getElementById('ce_reason').value.trim();
    logText = 'Причина изменена';
  } else if (field === 'comment') {
    const nc = document.getElementById('ce_newComment').value.trim();
    if (nc) {
      task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;
      logText = 'Комментарий добавлен';
    }
  }
  if (logText) {
    task.log.push({ time: new Date().toISOString(), user, text: logText });
    task.updatedAt = new Date().toISOString();
  }
  saveState(taskId);
  closeModal();
  render();
  setTimeout(()=>{
    if (field === 'payments') openCharEditor(taskId, field);
    else openTaskView(taskId);
  }, 100);
}

/* ===== [PATCH] saveEditTask — все поля + оплата ===== */
function saveEditTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const val = id => (document.getElementById(id)?.value || '').trim();

  task.car.plate = val('e_plate');
  task.car.model = val('e_model');
  task.car.year = val('e_year');
  task.car.vin = val('e_vin').toUpperCase();
  task.car.mileage = val('e_mileage');
  task.client.name = val('e_clientName') || '—';
  task.client.phone = val('e_clientPhone') || '—';
  task.reason = val('e_reason') || '—';
  task.comment = val('e_comment');
  task.damageDescription = val('e_damage');

  const assignee = val('e_assignee');
  task.assignee = assignee || null;

  const post = val('e_post');
  task.post = post ? parseInt(post, 10) : null;

  const d = document.getElementById('e_sched_date')?.value;
  const t = document.getElementById('e_sched_time')?.value;
  if (d && t) {
    task.scheduledTime = partsToIso(d, t) || null;
  } else if (!d && !t) {
    task.scheduledTime = null;
  }

  const nc = val('e_newComment');
  if (nc) task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;

  task.updatedAt = new Date().toISOString();
  saveState(taskId);
  closeModal();
  render();
  setTimeout(() => openTaskView(taskId), 100);
}
function deleteTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  if (!confirm('Удалить задачу безвозвратно?\n' + task.car.plate + ' · ' + task.car.model)) return;
  const idx = state.tasks.findIndex(t => t.id === taskId);
  if (idx === -1) return;
  state.tasks.splice(idx, 1);
  deleteTaskNow(taskId);
  saveMetaNow();
  closeModal();
  render();
}

let scheduleDate = null;
function shiftScheduleDate(delta) {
  const base = scheduleDate ? new Date(scheduleDate) : new Date();
  base.setHours(0,0,0,0);
  base.setDate(base.getDate() + delta);
  scheduleDate = schedDateStr(base);
  showSchedule();
}
function showSchedule() {
  const base = scheduleDate ? new Date(scheduleDate + 'T00:00:00') : new Date();
  const key = schedDateStr(base);
  const tasks = state.tasks.filter(t => {
    if (!t.scheduledTime) return false;
    return schedDateStr(new Date(t.scheduledTime)) === key;
  }).sort((a,b)=>parseTimeToMinutes(a.scheduledTime)-parseTimeToMinutes(b.scheduledTime));
  const fmtDate = base.toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric', weekday:'short' });

  let html = `<div class="modal-titlebar"><h2>📅 Расписание постов</h2><div class="modal-title-actions"><button class="back-btn" onclick="closeModal()">×</button></div></div>
    <div class="sched-datebar"><button onclick="shiftScheduleDate(-1)">‹</button><span class="sched-date-label">${fmtDate}</span><button onclick="shiftScheduleDate(1)">›</button>${scheduleDate ? `<button onclick="scheduleDate=null;showSchedule()">Сегодня</button>` : ''}</div>`;

  if (!tasks.length) html += `<div class="schedule-empty">На эту дату нет записей</div>`;
  else {
    for (let i=1; i<=4; i++) {
      html += `<h3>Пост №${i}</h3>`;
      const postTasks = tasks.filter(t => t.post === i);
      if (!postTasks.length) html += `<div class="schedule-post">Свободен</div>`;
      else postTasks.forEach(t => {
        const time = new Date(t.scheduledTime);
        html += `<div class="schedule-post"><b>${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}</b> — ${esc(t.car.plate)} (${esc(t.car.model)})<br><small>${t.assignee?USERS[t.assignee].name:'—'}</small></div>`;
      });
    }
  }

  const fullHtml = `<div class="modal">${html}<div class="modal-actions"><button onclick="closeModal()">Закрыть</button></div></div>`;

  let existing = document.getElementById('scheduleModal');
  if (existing) {
    existing.innerHTML = fullHtml;
    return;
  }

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'scheduleModal';
  modal.innerHTML = fullHtml;
  document.getElementById('modalContainer').appendChild(modal);
}

    status: t.hidden ? 'скрытая' : ((COLUMNS.find(c => c.id === t.column) || {}).title || '—'),

function renderCalculator() {

    let va = a.row[field], vb = b.row[field];
    if (typeof va === 'string' || typeof vb === 'string') {
      va = String(va || '').toLowerCase(); vb = String(vb || '').toLowerCase();
      return dir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');

  const cols = activeCalcFields();

    if (f === 'reason') return `<td>${esc(row.reason)}</td>`;
    if (f === 'exp_parts') return `<td class="num exp">${money(row.exp_parts)}</td>`;
    if (f === 'inc_parts') return `<td class="num inc">${money(row.inc_parts)}</td>`;
    if (f === 'exp_works') return `<td class="num exp">${money(row.exp_works)}</td>`;
    if (f === 'inc_works') return `<td class="num inc">${money(row.inc_works)}</td>`;
    if (f === 'exp_total') return `<td class="num exp">${money(row.exp_total)}</td>`;
    if (f === 'paid') return `<td class="num paid">${money(row.paid)}</td>`;
    if (f === 'debt') return `<td class="num debt ${row.debt > 0 ? 'owed' : ''}">${money(row.debt)}</td>`;
    if (f === 'inc_total') return `<td class="num inc">${money(row.inc_total)}</td>`;

    if (f === 'status') return `<td><span class="badge ${row.statusHidden ? 'badge-gray' : 'badge-blue'}">${esc(row.status)}</span></td>`;
    return '';
  };
  const plateIdx = cols.findIndex(c => c.field === 'plate');
  el.innerHTML = `
    <div class="calc-assignee-bar">
      <label>👤 Разделить по исполнителям:</label>
      <select onchange="state.calcAssignee=this.value; renderCalculator();">
        <option value="">Все</option>
        ${Object.keys(USERS).filter(k => USERS[k].role === 'worker').map(k => `<option value="${k}" ${assigneeFilter === k ? 'selected' : ''}>${USERS[k].name}</option>`).join('')}
        <option value="__none__" ${assigneeFilter === '__none__' ? 'selected' : ''}>Без исполнителя</option>
      </select>
      <span class="calc-assignee-count">Показано: ${filtered.length} из ${tasks.length}</span>
    </div>
    <div class="calc-cols"><span class="calc-cols-title">👁 Столбцы:</span>
      ${CALC_FIELDS.map(f => {
        const isFixed = CALC_FIXED_COLS.indexOf(f.field) >= 0;
        if (isFixed) return `<label><input type="checkbox" checked disabled> ${f.title}</label>`;
        return `<label><input type="checkbox" ${hidden[f.field] ? '' : 'checked'} onchange="toggleCalcColumn('${f.field}', this.checked)"> ${f.title}</label>`;
      }).join('')}
      <button type="button" class="tab-btn" onclick="resetCalcColumns()">Все столбцы</button>
    </div>
    <div class="calc-summary">
      <div class="calc-card red"><div class="calc-card-title">Расходы</div><div class="calc-card-value">${money(expTotal)}</div></div>
      <div class="calc-card green"><div class="calc-card-title">Доходы</div><div class="calc-card-value">${money(incTotal)}</div></div>
      <div class="calc-card blue"><div class="calc-card-title">Оплачено</div><div class="calc-card-value">${money(paid)}</div></div>
      <div class="calc-card ${debt > 0 ? 'red' : 'green'}"><div class="calc-card-title">Долг</div><div class="calc-card-value">${money(debt)}</div></div>

        ${rows.length === 0 ? `<tr><td colspan="${cols.length+1}" class="empty-msg">Нет задач</td></tr>` : ''}
        ${rows.map(r => `<tr class="clickable" onclick="openTaskView('${r.task.id}')">${cols.map(f => cell(f.field, r.task, r.row)).join('')}<td class="del-cell"><button type="button" class="danger small" onclick="event.stopPropagation();deleteTask('${r.task.id}')">🗑</button></td></tr>`).join('')}

function toggleCalcColumn(field, visible) {
  if (!state.calcHiddenCols) state.calcHiddenCols = {};

// ============ ПОСЛЕДНИЕ ИЗМЕНЕНИЯ (группировка по задаче) ============
function collectRecentChanges(limit = 80) {
  const items = [];
  (state.tasks || []).forEach(t => {
    if (!Array.isArray(t.log) || !t.log.length) return;
    t.log.forEach(entry => {
      if (!entry || !entry.time) return;
      items.push({
        taskId: t.id,
        plate: t.car?.plate || '—',
        model: t.car?.model || '',
        number: t.number || '',
        time: entry.time,
        user: entry.user || '—',
        text: entry.text || '',
        ts: Date.parse(entry.time) || 0
      });
    });
  });
  items.sort((a, b) => b.ts - a.ts);
  return items.slice(0, limit);
}

function groupChangesByTask(flatList) {
  const map = new Map();
  flatList.forEach(item => {
    if (!map.has(item.taskId)) {
      map.set(item.taskId, {
        taskId: item.taskId,
        plate: item.plate,
        model: item.model,
        number: item.number,
        entries: [],
        latestTs: item.ts
      });
    }
    const g = map.get(item.taskId);
    g.entries.push(item);
    if (item.ts > g.latestTs) g.latestTs = item.ts;
  });
  return Array.from(map.values()).sort((a, b) => b.latestTs - a.latestTs);
}

function rcEntryClass(text) {
  const t = String(text || '').toLowerCase();
  if (t.includes('ai:') || t.includes('ai из') || t.includes('артикул')) return 'rc-ai';
  if (t.includes('статус')) return 'rc-status';
  if (t.includes('перемещение') || t.includes('→')) return 'rc-move';
  return '';
}

function openRecentChanges() {
  // закрыть уведомления если открыты
  if (state.notifOpen) { state.notifOpen = false; renderNotifications(); }

  const existing = document.getElementById('rcOverlay');
  if (existing) { existing.remove(); return; }

  const flat = collectRecentChanges(100);
  const groups = groupChangesByTask(flat);

  const overlay = document.createElement('div');
  overlay.className = 'rc-overlay';
  overlay.id = 'rcOverlay';
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  let bodyHtml = '';
  if (!groups.length) {
    bodyHtml = `<div class="rc-empty">Пока нет записей в логах задач.<br>Изменения появятся после действий с задачами.</div>`;
  } else {
    bodyHtml = groups.map(g => {
      const title = g.number ? `№${g.number}` : '';
      const entriesHtml = g.entries.slice(0, 12).map(e => `
        <div class="rc-entry ${rcEntryClass(e.text)}">
