<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Автосервис v7</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<!-- PDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #1e1e2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background: #181825;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 15px;
  border-bottom: 2px solid #313244;
  flex-wrap: wrap;
}
header h1 { font-size: 20px; color: #89b4fa; }
header .user-info {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
select, button, input, textarea {
  background: #313244;
  color: #e0e0e0;
  border: 1px solid #45475a;
  border-radius: 6px;
  padding: 6px 10px;
  font-family: inherit;
  font-size: 13px;
}
button {
  cursor: pointer;
  transition: 0.2s;
}
button:hover { background: #45475a; }
button.primary { background: #89b4fa; color: #1e1e2e; font-weight: 600; }
button.primary:hover { background: #74a8f5; }
button.success { background: #a6e3a1; color: #1e1e2e; }
button.danger { background: #f38ba8; color: #1e1e2e; }
button.warning { background: #f9e2af; color: #1e1e2e; }
button.small { padding: 3px 8px; font-size: 12px; }

.bell-btn {
  position: relative;
  background: #313244;
  font-size: 18px;
  padding: 5px 10px;
}
.bell-badge {
  position: absolute;
  top: -5px; right: -5px;
  background: #f38ba8;
  color: white;
  border-radius: 50%;
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

.board {
  flex: 1;
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
  overflow-y: hidden;
}
.column {
  min-width: 260px;
  width: 260px;
  background: #181825;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  max-height: 100%;
  border: 2px solid #313244;
}
.column.drag-over { border-color: #89b4fa; background: #1e1e2e; }
.column-header {
  padding: 10px;
  font-weight: 600;
  font-size: 13px;
  text-align: center;
  border-bottom: 2px solid #313244;
  border-radius: 8px 8px 0 0;
  color: #1e1e2e;
}
.col-1 .column-header { background: #f9e2af; }
.col-2 .column-header { background: #fab387; }
.col-3 .column-header { background: #f38ba8; }
.col-4 .column-header { background: #89b4fa; }
.col-5 .column-header { background: #a6e3a1; }
.col-6 .column-header { background: #cba6f7; }

.column-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.column-body::-webkit-scrollbar { width: 6px; }
.column-body::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }

.task {
  background: #313244;
  border-radius: 6px;
  padding: 8px;
  cursor: grab;
  font-size: 12px;
  border-left: 4px solid #89b4fa;
  transition: transform 0.15s;
  user-select: none;
}
.task:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
.task.dragging { opacity: 0.5; }
.task-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  font-weight: 600;
}
.task-title { font-size: 13px; color: #cdd6f4; }
.task-time { font-size: 11px; color: #a6adc8; }
.task-row { font-size: 11px; color: #bac2de; margin: 2px 0; }
.task-row b { color: #89b4fa; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal {
  background: #1e1e2e;
  border-radius: 10px;
  padding: 20px;
  max-width: 700px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 2px solid #313244;
}
.modal h2 { color: #89b4fa; margin-bottom: 15px; font-size: 18px; }
.modal h3 { color: #a6e3a1; margin: 12px 0 8px; font-size: 14px; }
.modal label { display: block; margin: 8px 0 4px; font-size: 13px; color: #bac2de; }
.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 8px;
}
.modal textarea { min-height: 70px; resize: vertical; }
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 15px;
  flex-wrap: wrap;
}
.readonly-field {
  background: #181825;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  margin: 4px 0;
  color: #a6adc8;
  border: 1px solid #313244;
}
.readonly-field b { color: #cdd6f4; }

.char-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 8px 0;
}
.char-item {
  background: #313244;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s;
}
.char-item:hover { background: #45475a; }
.char-item .label { color: #89b4fa; font-weight: 600; }
.char-item .value { color: #cdd6f4; text-align: right; flex: 1; margin-left: 10px; }
.char-item.parts-search-item { align-items: flex-start; flex-wrap: wrap; }
.char-item.parts-search-item .label { flex: 0 0 auto; }
.char-item.parts-search-item .value {
  text-align: left;
  min-width: 0;
  overflow: hidden;
}
.char-item.parts-search-item .article-line {
  width: 100%;
  justify-content: flex-start;
}
.char-item.parts-search-item .article-line + .article-line {
  border-top: 1px solid #45475a;
  margin-top: 2px;
  padding-top: 6px;
}

.vin-copy { cursor: pointer; }
.vin-copy:active { color: #a6e3a1; }

.log-entry {
  display: block;
  padding: 4px 0 4px 10px;
  margin: 0;
  font-size: 11px;
  border-left: 2px solid #45475a;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
}
.log-entry + .log-entry { margin-top: 2px; }
.log-entry .log-time {
  display: block;
  color: #6c7086;
  font-size: 10px;
  margin-bottom: 1px;
}
.log-entry .log-text {
  display: block;
  color: #cdd6f4;
}
.task-log-list { display: block; }

.calc-assignee-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 10px;
  background: #1e1e2e;
  border: 1px solid #313244;
  border-radius: 8px;
  flex-wrap: wrap;
}
.calc-assignee-bar label { font-size: 12px; color: #a6adc8; }
.calc-assignee-bar select {
  padding: 6px 10px;
  font-size: 12px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 5px;
}
.calc-assignee-count {
  font-size: 11px;
  color: #6c7086;
  margin-left: auto;
}

.auth-gate {
  position: fixed;
  inset: 0;
  background: rgba(13, 13, 20, 0.96);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}
.auth-box {
  width: 100%;
  max-width: 380px;
  background: #181825;
  border: 1px solid #313244;
  border-radius: 14px;
  padding: 30px 28px 24px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.5);
}
.auth-logo {
  font-size: 40px;
  text-align: center;
  margin-bottom: 4px;
}
.auth-box h1 {
  margin: 0 0 4px;
  text-align: center;
  font-size: 20px;
}
.auth-sub {
  margin: 0 0 20px;
  text-align: center;
  color: #a6adc8;
  font-size: 13px;
}
.auth-box form { display: block; }
.auth-box label {
  display: block;
  font-size: 11px;
  color: #a6adc8;
  margin: 10px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.auth-box input {
  width: 100%;
  padding: 9px 12px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 6px;
  font-size: 14px;
  box-sizing: border-box;
}
.auth-box input:focus {
  border-color: #89b4fa;
  outline: none;
}
.auth-error {
  color: #f38ba8;
  font-size: 12px;
  margin: 8px 0 4px;
  min-height: 14px;
}
.auth-submit {
  width: 100%;
  padding: 10px;
  margin-top: 14px;
  font-size: 14px;
  font-weight: 600;
}
.auth-hint {
  margin-top: 16px;
  padding: 10px 12px;
  background: #313244;
  border-radius: 6px;
  font-size: 11px;
  color: #a6adc8;
  line-height: 1.5;
}
.tenant-label {
  font-size: 11px;
  color: #a6adc8;
  padding: 3px 8px;
  background: #313244;
  border-radius: 4px;
}
.logout-btn {
  padding: 4px 10px;
  font-size: 11px;
  background: transparent;
  border: 1px solid #f38ba8;
  color: #f38ba8;
  border-radius: 4px;
  cursor: pointer;
}
.logout-btn:hover { background: #f38ba8; color: #1e1e2e; }

.notification-panel {
  position: fixed;
  top: 60px;
  right: 20px;
  background: #1e1e2e;
  border: 2px solid #313244;
  border-radius: 8px;
  width: 320px;
  max-height: 400px;
  overflow-y: auto;
  z-index: 999;
  padding: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.notification-panel h3 { color: #89b4fa; font-size: 14px; margin-bottom: 8px; }
.notif-item {
  background: #313244;
  padding: 8px;
  border-radius: 4px;
  margin-bottom: 6px;
  font-size: 12px;
  border-left: 3px solid #f9e2af;
}
.notif-item.unread { border-left-color: #f38ba8; }
.notif-item .notif-time { color: #6c7086; font-size: 10px; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.badge-green { background: #a6e3a1; color: #1e1e2e; }
.badge-red { background: #f38ba8; color: #1e1e2e; }
.badge-yellow { background: #f9e2af; color: #1e1e2e; }
.badge-blue { background: #89b4fa; color: #1e1e2e; }
.badge-gray { background: #6c7086; color: #e0e0e0; }

.part-row {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.part-row input { flex: 1; min-width: 100px; }
.part-row select { width: auto; }

.empty-msg { text-align: center; color: #6c7086; font-size: 12px; padding: 20px; }

.schedule-post {
  background: #313244;
  padding: 8px;
  border-radius: 6px;
  margin: 5px 0;
  font-size: 12px;
}

.tab-btn {
  background: transparent;
  border: 1px solid #45475a;
  color: #a6adc8;
  font-weight: 600;
}
.tab-btn.active { background: #89b4fa; border-color: #89b4fa; color: #1e1e2e; }
.tab-btn.active:hover { background: #74a8f5; }

:root {
  --col-name: 1 1 130px;
  --col-article: 0 0 110px;
  --col-check: 0 0 22px;
  --col-qty: 0 0 96px;
  --col-hours: 0 0 110px;
  --col-num: 0 0 84px;
  --col-status: 0 0 116px;
  --col-total: 0 0 70px;
  --col-search: 0 0 196px;
  --col-del: 0 0 32px;
  --grid-gap: 5px;
  --name-min: 100px;
  --num-min: 84px;
}

.part-row {
  display: flex;
  gap: var(--grid-gap);
  align-items: center;
  margin-bottom: 4px;
}
.part-row input,
.part-row select { flex: var(--col-name); min-width: var(--name-min); }

.part-row input.name-input { flex: var(--col-name); min-width: var(--name-min); }

.part-row input.article {
  flex: var(--col-article);
  min-width: var(--col-article-min, 100px);
  text-transform: uppercase;
}

.part-row input.num { flex: var(--col-num); min-width: var(--num-min); }

.part-row .row-total {
  flex: var(--col-total);
  min-width: var(--col-total);
  text-align: right;
  font-size: 12px;
  font-weight: 600;
  color: #a6e3a1;
  align-self: center;
}
.part-row .row-total.neg { color: #f38ba8; }
.part-row select.work-status { flex: var(--col-status); min-width: var(--col-status); }
.part-row .danger.small { flex: var(--col-del); min-width: var(--col-del); }

.part-note-line {
  flex: 1 1 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
  padding-left: 2px;
}
.part-note-label {
  flex: 0 0 auto;
  font-size: 10px;
  color: #6c7086;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.part-note-line .note-input {
  flex: 1 1 auto;
  min-width: 120px;
  font-size: 11px;
  padding: 4px 8px;
  background: #181825;
  color: #cdd6f4;
  border: 1px solid #313244;
  border-radius: 4px;
}
.part-note-line .note-input:focus { border-color: #89b4fa; outline: none; }
.part-row { flex-wrap: wrap; }

.ordered-check {
  flex: var(--col-check);
  min-width: var(--col-check);
  text-align: center;
  font-size: 14px;
  line-height: 1;
  color: #6c7086;
  cursor: default;
}
.ordered-check.done { color: #a6e3a1; font-weight: 700; }
.rows-head span.check-col { flex: var(--col-check); min-width: var(--col-check); }

.qty-control {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex: var(--col-qty);
  min-width: var(--col-qty);
}
.qty-control .qty-input {
  flex: 1;
  min-width: 26px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.qty-btn {
  flex: 0 0 24px;
  width: 24px;
  min-width: 0;
  padding: 3px 0;
  font-size: 13px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 4px;
  cursor: pointer;
}
.qty-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
.rows-head span.qty-col { flex: var(--col-qty); min-width: var(--col-qty); }

.part-note-line button {
  flex: 0 0 26px;
  width: 26px;
  min-width: 0;
  padding: 2px 0;
  font-size: 12px;
  line-height: 1;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid #585b70;
}
.part-note-line button.note-add-btn {
  background: #45475a;
  color: #a6e3a1;
}
.part-note-line button.note-add-btn:hover { background: #a6e3a1; color: #1e1e2e; }
.part-note-line button.note-del-btn {
  background: #45475a;
  color: #f38ba8;
}
.part-note-line button.note-del-btn:hover { background: #f38ba8; color: #1e1e2e; }
.part-note-line button.note-link-btn {
  background: #45475a;
  color: #cdd6f4;
  font-size: 11px;
}
.part-note-line button.note-link-btn:hover:not(:disabled) { background: #89b4fa; color: #1e1e2e; }
.part-note-line button.note-link-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.work-comment {
  flex: 1 1 140px;
  min-width: 120px;
  font-size: 11px;
  padding: 4px 8px;
}
.rows-head span.comment-col { flex: 1 1 140px; min-width: 120px; }
.issue-issue-row { margin-top: 4px; }

.rows-head {
  display: flex;
  gap: var(--grid-gap);
  font-size: 10px;
  color: #6c7086;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin: 6px 0 2px;
}
.rows-head span { flex: var(--col-name); min-width: var(--name-min); }
.rows-head span.article { flex: var(--col-article); min-width: 100px; }
.rows-head span.num { flex: var(--col-num); min-width: var(--num-min); }
.rows-head span.row-total { flex: var(--col-total); min-width: var(--col-total); text-align: right; }
.rows-head span.work-status { flex: var(--col-status); min-width: var(--col-status); }
.rows-head span.search-col { flex: var(--col-search); min-width: var(--col-search); }
.rows-head span.del-col { flex: var(--col-del); min-width: var(--col-del); }
.rows-head span.hours-col { flex: var(--col-hours); min-width: var(--col-hours); }

/* Исполнитель работы */
:root { --col-wassignee: 0 0 132px; }
.part-row select.work-assignee { flex: var(--col-wassignee); min-width: var(--col-wassignee); }
.rows-head span.assignee-col { flex: var(--col-wassignee); min-width: var(--col-wassignee); }
select.work-assignee.auto { border-color: rgba(61,214,140,0.5); color: var(--green); }

.hours-control {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex: 0 0 110px;
  min-width: 90px;
}
.hours-control .hours-input {
  flex: 1;
  min-width: 40px;
  text-align: center;
}
.hours-btn {
  flex: 0 0 26px;
  width: 26px;
  min-width: 0;
  padding: 3px 0;
  font-size: 14px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 4px;
  cursor: pointer;
}
.hours-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

.sched-datebar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
}
.sched-datebar button {
  padding: 5px 10px;
  font-size: 13px;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 5px;
  cursor: pointer;
}
.sched-datebar button:hover { background: #89b4fa; color: #1e1e2e; }
.sched-date-label {
  font-size: 14px;
  font-weight: 600;
  color: #cdd6f4;
  text-transform: capitalize;
}
.schedule-empty {
  padding: 18px;
  text-align: center;
  color: #6c7086;
  border: 1px dashed #45475a;
  border-radius: 8px;
  margin: 8px 0;
}

.modal-titlebar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.modal-titlebar h2 { margin: 0; flex: 1; }
.modal-title-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: 0 0 auto;
}
.close-x {
  width: 30px;
  height: 30px;
  padding: 0;
  font-size: 18px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 5px;
  cursor: pointer;
}
.close-x:hover { background: #f38ba8; color: #1e1e2e; border-color: #f38ba8; }
.back-btn {
  padding: 5px 12px;
  font-size: 12px;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
}
.back-btn:hover { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

.sched-picker {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.sched-picker input[type="date"] {
  flex: 0 0 180px;
  padding: 6px 8px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 6px;
  font-size: 13px;
}
.sched-picker .slot-select {
  flex: 0 0 130px;
  padding: 6px 8px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 6px;
  font-size: 13px;
}

.part-search {
  display: inline-flex;
  gap: 3px;
  flex: var(--col-search);
  min-width: var(--col-search);
  align-items: center;
  justify-content: flex-start;
}
.search-btn {
  padding: 4px 7px;
  font-size: 10px;
  font-weight: 600;
  background: #45475a;
  border: 1px solid #585b70;
  color: #cdd6f4;
  border-radius: 4px;
  cursor: pointer;
  line-height: 1.1;
  transition: 0.15s;
}
.search-btn:hover:not(:disabled) { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }
.search-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: #313244;
  color: #6c7086;
  border-color: #45475a;
}

.parts-search-item { cursor: default; }
.article-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  flex-wrap: wrap;
}
.article-code {
  font-family: 'Consolas', 'Courier New', monospace;
  font-weight: 700;
  color: #89b4fa;
  font-size: 12px;
  letter-spacing: 0.3px;
  min-width: 90px;
}
.article-name { color: #a6adc8; font-size: 11px; flex: 1; }
.article-line .ordered-check { flex: 0 0 16px; min-width: 16px; font-size: 13px; }
.article-del-btn {
  flex: 0 0 24px;
  width: 24px;
  min-width: 0;
  padding: 2px 0;
  font-size: 12px;
  line-height: 1;
  background: #45475a;
  border: 1px solid #585b70;
  color: #f38ba8;
  border-radius: 4px;
  cursor: pointer;
}
.article-del-btn:hover { background: #f38ba8; color: #1e1e2e; }

.parts-summary {
  margin-top: 18px;
  padding: 10px 12px;
  background: #181825;
  border: 1px solid #313244;
  border-radius: 6px;
}
.parts-summary.empty {
  color: #6c7086;
  font-size: 12px;
  text-align: center;
  padding: 14px;
}
.parts-summary-head {
  font-size: 12px;
  font-weight: 600;
  color: #cdd6f4;
  margin-bottom: 8px;
}
.parts-summary-line {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-top: 1px solid #313244;
  font-size: 12px;
  flex-wrap: wrap;
}
.parts-summary-line:first-of-type { border-top: none; }
.parts-summary-line .ordered-check { flex: 0 0 16px; min-width: 16px; }
.parts-summary-name { flex: 1 1 160px; color: #cdd6f4; }
.parts-summary-name .art { color: #89b4fa; font-family: 'Consolas','Courier New',monospace; font-weight: 700; }
.parts-summary-search { flex: 0 0 auto; }
.parts-summary-qty {
  flex: 0 0 auto;
  color: #a6adc8;
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}

.task-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin: 3px 0 2px;
}
.task-badges .item-badge {
  font-size: 9px;
  padding: 2px 5px;
  line-height: 1.2;
  max-width: 100%;
}
.badge.badge-gray {
  background: #313244;
  color: #a6adc8;
}

.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: rgba(17, 17, 27, 0.95);
  border-bottom: 1px solid #313244;
}
.filter-label { font-size: 12px; color: #a6adc8; }
.filter-bar select {
  padding: 5px 8px;
  font-size: 12px;
  background: #313244;
  color: #cdd6f4;
  border: 1px solid #45475a;
  border-radius: 5px;
}
.filter-count {
  font-size: 11px;
  color: #6c7086;
  margin-left: auto;
}

.calc-wrap { flex: 1; overflow: auto; padding: 15px; }
.calc-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.calc-card {
  background: #181825;
  border: 2px solid #313244;
  border-radius: 8px;
  padding: 10px 14px;
  min-width: 150px;
}
.calc-card .calc-card-title { font-size: 11px; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.4px; }
.calc-card .calc-card-value { font-size: 18px; font-weight: 700; margin-top: 4px; color: #cdd6f4; }
.calc-card.green .calc-card-value { color: #a6e3a1; }
.calc-card.red .calc-card-value { color: #f38ba8; }
.calc-card.blue .calc-card-value { color: #89b4fa; }
.calc-hint { font-size: 11px; color: #6c7086; margin-bottom: 10px; }

.calc-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  background: #181825;
  border-radius: 8px;
  overflow: hidden;
}
.calc-table th {
  background: #313244;
  color: #89b4fa;
  padding: 8px 10px;
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.calc-table th:hover { background: #45475a; }
.calc-table td { padding: 7px 10px; border-top: 1px solid #313244; }
.calc-table tbody tr.clickable { cursor: pointer; }
.calc-table tbody tr.clickable:hover { background: #313244; }
.calc-table td.num, .calc-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.calc-table td.exp { color: #f38ba8; font-weight: 600; }
.calc-table td.inc { color: #a6e3a1; font-weight: 600; }
.calc-table td.paid { color: #6c7086; }
.calc-table td.debt { color: #6c7086; font-weight: 600; }
.calc-table td.debt.owed { color: #f9e2af; }
.calc-table tfoot td.debt { color: #f9e2af; }
.calc-table td.profit { font-weight: 700; }
.calc-table td.profit.pos { color: #a6e3a1; }
.calc-table td.profit.neg { color: #f38ba8; }
.calc-table tfoot td {
  background: #313244;
  font-weight: 700;
  font-size: 13px;
  padding: 10px;
  border-top: 2px solid #45475a;
}
.calc-table tfoot td.num { text-align: right; font-variant-numeric: tabular-nums; }
.calc-table tfoot td.exp { color: #f38ba8; }
.calc-table tfoot td.inc { color: #a6e3a1; }
.calc-table td.del-cell, .calc-table th.del-cell { text-align: center; width: 40px; }
.calc-status { font-size: 10px; color: #6c7086; display: block; margin-top: 2px; }
.calc-num-col { font-variant-numeric: tabular-nums; color: #89b4fa; font-weight: 700; }
.pay-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.pay-badge.unpaid { background: #f38ba8; color: #1e1e2e; }
.pay-badge.paid { background: #a6e3a1; color: #1e1e2e; }
.pay-badge.none { background: #6c7086; color: #e0e0e0; }
.settings-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 10px 12px;
  background: #313244;
  border-radius: 6px;
  margin: 6px 0;
  font-size: 13px;
}
.settings-row .desc { font-size: 11px; color: #6c7086; margin-top: 3px; }
.settings-divider {
  height: 1px;
  background: #45475a;
  margin: 18px 0 12px;
}
.settings-section-title {
  margin: 0 0 10px;
  font-size: 14px;
  color: #cdd6f4;
  font-weight: 600;
}
.pass-new-row {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}
.pass-new-col { flex: 1; min-width: 0; }
.pass-new-col label { margin-top: 0; }
.settings-msg {
  margin-top: 10px;
  font-size: 12px;
  min-height: 16px;
}
.settings-msg.error { color: #f38ba8; }
.settings-msg.ok { color: #a6e3a1; }
.settings-row .tag {
  flex: 0 0 auto;
  background: #45475a;
  color: #89b4fa;
  padding: 3px 9px;
  border-radius: 10px;
  font-size: 11px;
}
.settings-row code {
  background: #181825;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 10px;
  color: #89b4fa;
}
.switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; inset: 0; cursor: pointer;
  background: #45475a; border-radius: 22px; transition: 0.2s;
}
.switch .slider:before {
  content: ""; position: absolute; height: 16px; width: 16px;
  left: 3px; top: 3px; background: #cdd6f4; border-radius: 50%; transition: 0.2s;
}
.switch input:checked + .slider { background: #a6e3a1; }
.switch input:checked + .slider:before { transform: translateX(20px); background: #1e1e2e; }

.sum-line {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin: 4px 0;
  color: #bac2de;
  gap: 15px;
}
.sum-line b { color: #cdd6f4; }
.sum-line.total { border-top: 1px solid #45475a; margin-top: 8px; padding-top: 6px; font-size: 14px; }
.sum-line.total b { color: #a6e3a1; }
.sum-line.total.neg b { color: #f38ba8; }
.pay-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.pay-item {
  background: #313244;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.pay-item .pay-date { color: #89b4fa; font-weight: 600; }
.pay-item .pay-comment { flex: 1; color: #a6adc8; font-size: 11px; }
.pay-item .pay-sum { color: #a6e3a1; font-weight: 600; }

/* ========== НОВАЯ МОДАЛКА ЗАДАЧИ (из target_modal) ========== */
:root {
  --bg-modal: linear-gradient(145deg, #0E1A2B 0%, #101E33 100%);
  --bg-card: #13253F;
  --border-card: #1E4E8C;
  --border-card-soft: #1A3A66;
  --accent: #2E7CF6;
  --cyan: #3DD5C4;
  --green: #3DD68C;
  --text: #E8EEF7;
  --text-dim: #7A8FAE;
  --input-bg: #0B1729;
  --shadow-glow: 0 0 40px rgba(30, 136, 229, 0.25);
}

.task-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 10, 18, 0.9);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px;
  z-index: 1000;
  overflow-y: auto;
}
.task-modal-overlay.hidden { display: none; }

.task-modal {
  position: relative;
  width: 100%;
  max-width: 860px;
  margin: auto;
  flex-shrink: 0;
  background: var(--bg-modal);
  border: 1px solid var(--border-card);
  border-radius: 16px;
  box-shadow: var(--shadow-glow), 0 30px 80px rgba(0,0,0,0.6);
  padding: 18px 22px 16px;
  animation: modalIn 0.35s ease-out;
  color: var(--text);
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.task-modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  position: relative;
}
.task-modal-header__icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2E7CF6, #1B4FB0);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 6px 20px rgba(46,124,246,0.45);
  flex-shrink: 0;
}
.task-modal-header__title h1 { font-size: 18px; font-weight: 700; color: #E8EEF7; }
.task-modal-header__title p { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

.task-modal-close {
  position: absolute; top: -4px; right: -4px;
  width: 30px; height: 30px;
  border-radius: 50%; border: none;
  background: transparent; color: var(--text-dim);
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.task-modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }

.task-modal-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.task-block {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border-card-soft);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.25s;
  display: flex;
  flex-direction: column;
  min-height: 60px;
  flex-shrink: 0;
}
.task-block:hover { border-color: var(--border-card); }

.task-block__header {
  display: flex; align-items: center; gap: 8px;
  margin: 10px 14px 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(30, 78, 140, 0.3);
  flex-shrink: 0;
  transition: border-color 0.25s, margin 0.25s, padding 0.25s;
}
.task-block__num {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, #2E7CF6, #1B4FB0);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.task-block__icon {
  width: 26px; height: 26px; border-radius: 8px;
  background: rgba(46,124,246,0.15);
  border: 1px solid rgba(46,124,246,0.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
}
.task-block__title { font-size: 13px; font-weight: 600; }
.task-block__title-sep {
  color: var(--text-dim);
  margin: 0 6px;
  font-weight: 400;
  font-size: 16px;
}
.task-block__title-accent {
  color: var(--cyan);
  font-weight: 600;
}
.task-block__title-plate {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #FFFFFF;
  color: #0A0A0A;
  padding: 4px 14px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: 2px;
  font-family: "JetBrains Mono", "Courier New", monospace;
  border: 2px solid #C8C8CC;
  margin-left: 4px;
  line-height: 1.1;
  box-shadow:
    inset 0 0 0 2px #FFFFFF,
    inset 0 0 0 4px #0A0A0A33;
  vertical-align: middle;
}
.task-block__title-plate::before {
  content: 'RUS';
  font-size: 12px;
  color: #0039A6;
  font-weight: 800;
  margin-right: 2px;
  letter-spacing: 0.5px;
}

.task-block__header--clickable {
  cursor: pointer;
  user-select: none;
  transition: opacity 0.2s;
}
.task-block__header--clickable:hover { opacity: 0.85; }

.task-block__toggle {
  margin-left: auto;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: rgba(46, 124, 246, 0.12);
  border: 1px solid rgba(46, 124, 246, 0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  color: var(--accent);
  transition: transform 0.25s ease;
  flex-shrink: 0;
}

.task-block--collapsed .task-block__toggle {
  transform: rotate(-90deg);
}

.task-block__content {
  overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease;
  max-height: 2000px;
  opacity: 1;
  display: flex;
  flex: 1;
  align-items: stretch;
  min-height: 0;
  flex-direction: row;
}
.task-block--collapsed .task-block__content {
  max-height: 0;
  opacity: 0;
}

.task-block--collapsed .task-block__header {
  margin-bottom: 10px;
  padding-bottom: 0;
  border-bottom-color: transparent;
}

.task-block__image {
  flex: 0 0 auto;
  width: 22%;
  max-width: 260px;
  align-self: flex-start;
  overflow: hidden;
  position: relative;
  background: var(--input-bg);
}
.task-block__image img {
  display: block;
  max-width: 100%;
  height: auto;
  object-fit: contain;
  align-self: flex-start;
}
.task-block__image::after {
  content: '';
  position: absolute;
  inset: auto 0 0 0;
  height: 0;
  pointer-events: none;
}

.task-block__fields {
  flex: 1;
  min-width: 0;
  padding: 0 14px 12px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.task-field { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.task-field__icon {
  width: 26px; height: 26px; border-radius: 8px;
  background: rgba(46,124,246,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; color: var(--accent);
}
.task-field__label {
  font-size: 11px;
  color: var(--text-dim);
  min-width: 108px;
  flex-shrink: 0;
}
.task-field__value {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid rgba(30, 78, 140, 0.5);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 30px;
  min-width: 0;
  color: var(--text);
}
.task-field__value span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-field__value--readonly { background: rgba(11, 23, 41, 0.5); }
.task-field__value--multiline {
  align-items: flex-start;
  min-height: 46px;
  padding: 6px 9px;
}
.task-field__value--multiline span {
  white-space: normal;
  line-height: 1.35;
  color: var(--text);
  font-size: 11px;
}
.task-chevron { color: #4A5C7A; font-size: 10px; flex-shrink: 0; margin-left: 6px; }
.task-copy-btn {
  background: transparent; border: none;
  color: var(--accent); cursor: pointer;
  font-size: 12px; padding: 1px; flex-shrink: 0;
}
.task-copy-btn:hover { color: var(--cyan); }

.task-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 600;
  white-space: nowrap;
}
.task-badge--green {
  background: rgba(61, 214, 140, 0.15); color: var(--green);
  border: 1px solid rgba(61, 214, 140, 0.35);
}
.task-badge--cyan {
  background: rgba(61, 213, 196, 0.15); color: var(--cyan);
  border: 1px solid rgba(61, 213, 196, 0.35);
}
.task-badge--red {
  background: rgba(243, 139, 168, 0.15); color: #f38ba8;
  border: 1px solid rgba(243, 139, 168, 0.35);
}
.task-badge--yellow {
  background: rgba(249, 226, 175, 0.15); color: #f9e2af;
  border: 1px solid rgba(249, 226, 175, 0.35);
}

.task-finance-value { font-size: 13px; font-weight: 700; color: var(--cyan); }

/* ===== СПИСКИ ЗАПЧАСТЕЙ И РАБОТ В БЛОКЕ 2 ===== */
.item-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 4px 0 2px;
}
.item-list__group {
  border: 1px solid rgba(30, 78, 140, 0.4);
  border-radius: 8px;
  padding: 4px 6px 5px;
  background: rgba(11, 23, 41, 0.5);
}
.item-list__group-title {
  font-size: 10px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin: 2px 0 4px;
}
.item-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid rgba(30, 78, 140, 0.35);
  background: var(--input-bg);
  flex-wrap: wrap;
  cursor: pointer;
}
.item-row:hover { border-color: var(--accent); }
/* Подсветка всего DIV по статусу: красный / жёлтый / зелёный */
.item-row--red    { border-left: 3px solid #f38ba8; background: rgba(243, 139, 168, 0.16); }
.item-row--yellow { border-left: 3px solid #f9e2af; background: rgba(249, 226, 175, 0.14); }
.item-row--green  { border-left: 3px solid #a6e3a1; background: rgba(166, 227, 161, 0.14); }
.item-row--red:hover    { background: rgba(243, 139, 168, 0.28); }
.item-row--yellow:hover { background: rgba(249, 226, 175, 0.26); }
.item-row--green:hover  { background: rgba(166, 227, 161, 0.26); }

/* Группы запчастей/работ на канбан-доске */
.task-groups { display: flex; flex-direction: column; gap: 4px; margin: 3px 0; }
.task-group { border-radius: 6px; padding: 3px 5px; border: 1px solid #313244; }
.task-group--parts { background: rgba(137, 180, 250, 0.10); border-left: 3px solid #89b4fa; }
.task-group--works { background: rgba(166, 227, 161, 0.10); border-left: 3px solid #a6e3a1; }
.task-group__title { font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-dim); margin-bottom: 2px; }
.task-group .task-badges { margin: 0; }
.task-group__empty { font-size: 10px; color: var(--text-dim); }

/* Модель авто крупным шрифтом в калькуляции */
.calc-car-model { display: block; font-size: 15px; font-weight: 700; color: #cdd6f4; line-height: 1.25; }
.calc-car-plate { display: block; font-size: 11px; color: var(--text-dim); }

<script>
// ============ FIREBASE INIT ============
const firebaseConfig = {
  apiKey: "AIzaSyC6l-V5BOMO_rJ9cxJq3_HMhDCpWyak9UQ",
  authDomain: "baza54crm.firebaseapp.com",
  databaseURL: "https://baza54crm-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "baza54crm",
  storageBucket: "baza54crm.firebasestorage.app",
  messagingSenderId: "538489079474",
  appId: "1:538489079474:web:3c274bd327700e37e1ebab",
  measurementId: "G-Z8ZFLSR9J8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============ АРЕНДАТОРЫ (СТО) И ИЗОЛЯЦИЯ ДАННЫХ ============
const TENANTS = {
  user1: { name: 'СТО User1', dbPrefix: 'crm_user1' },
  user2: { name: 'СТО User2', dbPrefix: 'crm_user2' },
  user3: { name: 'СТО User3', dbPrefix: 'crm_user3' },
  user4: { name: 'СТО User4', dbPrefix: 'crm_user4' },
  user5: { name: 'СТО User5', dbPrefix: 'crm_user5' }
};

const PASSWORD_CACHE_KEY = 'crm_tenant_passwords';

function cachedTenantPassword(tenant) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  return map[tenant] || null;
}

function setCachedTenantPassword(tenant, password) {
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  map[tenant] = password;
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));
}

function effectiveTenantPassword(tenant) {
  const c = cachedTenantPassword(tenant);
  return c || tenant;
}

function authRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix + '/auth/password');
}

function currentTenant() {
  return localStorage.getItem('crm_current_tenant') || null;
}

function dataRefFor(tenant) {
  const t = TENANTS[tenant];
  if (!t) return null;
  return db.ref(t.dbPrefix);
}

function dataRef() {
  return dataRefFor(currentTenant());
}

// ============ АВТОРИЗАЦИЯ ============
const AUTH_SESSION_KEY = 'crm_auth_session';

function currentUser() {
  return localStorage.getItem(AUTH_SESSION_KEY) || null;
}

function verifyAuth(login, password) {
  const l = String(login || '').trim();
  const p = String(password || '');
  if (!TENANTS[l]) return false;
  const expected = cachedTenantPassword(l) || l;
  return p === expected;
}

function loadTenantPassword(tenant) {
  const ref = authRefFor(tenant);
  if (!ref || !ref.once) return;
  ref.once('value').then(snap => {
    const val = snap && snap.val ? snap.val() : null;
    if (val) setCachedTenantPassword(tenant, String(val));
  }).catch(() => {});
}

function changeTenantPassword(tenant, currentPass, newPass, confirmPass) {
  if (!TENANTS[tenant]) return { ok: false, error: 'СТО не выбрано' };
  const cur = String(currentPass || '');
  const np = String(newPass || '');
  const cp = String(confirmPass === undefined ? newPass : confirmPass);

  if (!cur) return { ok: false, error: 'Введите текущий пароль' };
  if (cur !== effectiveTenantPassword(tenant)) {
    return { ok: false, error: 'Неверный текущий пароль' };
  }
  if (!np) return { ok: false, error: 'Новый пароль не может быть пустым' };
  if (np.length < 4) return { ok: false, error: 'Новый пароль короче 4 символов' };
  if (np !== cp) return { ok: false, error: 'Новые пароли не совпадают' };

  const ref = authRefFor(tenant);
  if (ref && ref.set) {
    try { ref.set(np).catch(() => {}); } catch (e) { }
  }
  setCachedTenantPassword(tenant, np);
  return { ok: true, error: '' };
}

function resetTenantPassword(tenant) {
  const ref = authRefFor(tenant);
  if (ref && ref.remove) {
    try { ref.remove().catch(() => {}); } catch (e) {}
  }
  let map = {};
  try { map = JSON.parse(localStorage.getItem(PASSWORD_CACHE_KEY) || '{}') || {}; }
  catch (e) { map = {}; }
  delete map[tenant];
  localStorage.setItem(PASSWORD_CACHE_KEY, JSON.stringify(map));
}

function login(login, password) {
  if (!verifyAuth(login, password)) return false;
  localStorage.setItem(AUTH_SESSION_KEY, login);
  localStorage.setItem('crm_current_tenant', login);
  return true;
}

function logout() {
  localStorage.removeItem(AUTH_SESSION_KEY);
  localStorage.removeItem('crm_current_tenant');
  state.tasks = [];
  state.notifications = [];
  state.lastRead = {};
  state.taskCounter = 0;
  modalHistory = [];
  closeModalAll();
  renderAuthGate();
}

// ============ ДАННЫЕ ============

const USERS = {
  chief: { name: 'Главный механик', role: 'chief' },
  electric: { name: 'Электрик', role: 'worker' },
  locksmith: { name: 'Слесарь', role: 'worker' },
  motorist: { name: 'Моторист', role: 'worker' }
};

const COLUMNS = [
  { id: 'waiting', title: '1. Ожидает действия', cls: 'col-1' },
  { id: 'approval', title: '2. На согласовании', cls: 'col-2' },
  { id: 'parts', title: '3. Заказ / Ремонт запчастей', cls: 'col-3' },
  { id: 'inwork', title: '4. В работе', cls: 'col-4' },
  { id: 'done', title: '5. Работа завершена', cls: 'col-5' },
  { id: 'issue', title: '6. На выдачу', cls: 'col-6' }
];

const COLORS = ['#89b4fa','#a6e3a1','#f9e2af','#f38ba8','#cba6f7','#fab387','#94e2d5','#f5c2e7'];

let state = {
  tasks: [],
  notifications: [],
  currentUser: 'chief',
  notifOpen: false,
  lastRead: {},
  activeTab: 'board',
  taskCounter: 0,
  calcSort: { field: 'taskNumber', dir: 'asc' },
  kanbanFilter: [],
  calcStatusFilter: '',
  calcAssignee: '',
  calcHiddenCols: {}
};

let _dataRef = null;

function loadState() {
  const ref = dataRef();
  if (!ref) {
    state.tasks = [];
    state.notifications = [];
    state.lastRead = {};
    state.taskCounter = 0;
    render();
    return;
  }
  if (_dataRef) { try { _dataRef.off(); } catch(e){} }
  _dataRef = ref;
  ref.on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state.tasks = data.tasks || [];
      state.notifications = data.notifications || [];
      state.lastRead = data.lastRead || {};
      state.taskCounter = data.taskCounter || 0;
    }
    normalizeTasks(state.tasks);
    render();
  }, (error) => {
    console.error('Firebase read error:', error);
    try {
      const saved = localStorage.getItem(localStorageFallbackKey());
      if (saved) {
        const parsed = JSON.parse(saved);
        state.tasks = parsed.tasks || [];
        state.notifications = parsed.notifications || [];
        state.lastRead = parsed.lastRead || {};
        state.taskCounter = parsed.taskCounter || 0;
      }
    } catch(e) { console.error(e); }
    normalizeTasks(state.tasks);
    render();
  });
}

function localStorageFallbackKey() {
  const t = currentTenant();
  return t ? 'crm_autoservice_' + t : 'crm_autoservice_anon';
}

let _saveTimer = null;

function saveState() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    saveStateImmediate();
  }, 500);
}

function saveStateImmediate() {
  const ref = dataRef();
  const data = {
    tasks: state.tasks,
    notifications: state.notifications,
    lastRead: state.lastRead,
    taskCounter: state.taskCounter
  };
  if (!ref) {
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
    return;
  }
  ref.update(data).catch(err => {
    console.error('Firebase write error:', err);
    localStorage.setItem(localStorageFallbackKey(), JSON.stringify(data));
  });
}

function nextTaskNumber() {
  state.taskCounter = (state.taskCounter || 0) + 1;
  return state.taskCounter;
}

async function nextTaskNumberAsync() {
  const ref = dataRef();
  if (!ref) {
    return nextTaskNumber();
  }
  
  try {
    const counterRef = ref.child('taskCounter');
    const result = await counterRef.transaction((current) => {
      return (current || 0) + 1;
    });
    
    if (result.committed) {
      state.taskCounter = result.snapshot.val();
      return state.taskCounter;
    } else {
      return nextTaskNumber();
    }
  } catch (err) {
    console.error('Transaction failed:', err);
    return nextTaskNumber();
  }
}

const PARTS_STATUS = {
  notordered: 'Не заказано',
  ordered: 'Заказано',
  instock: 'На складе'
};

const WORKS_STATUS = {
  notstarted: 'Не в работе',
  inwork: 'В работе',
  finished: 'Завершено'
};

function money(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
}

function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== ХЕЛПЕРЫ ДЛЯ ЗАПЧАСТЕЙ =====
function partQty(p) {
  const q = parseInt(p ? p.quantity : 1, 10);
  return (isNaN(q) || q < 1) ? 1 : q;
}

function partPurchase(p) {
  if (!p) return 0;
  const v =
    (p.purchase !== undefined && p.purchase !== '' && p.purchase !== null) ? p.purchase :
    (p.buy !== undefined && p.buy !== '' && p.buy !== null) ? p.buy :
    (p.cost !== undefined && p.cost !== '' && p.cost !== null) ? p.cost :
    (p.purchasePrice !== undefined && p.purchasePrice !== '' && p.purchasePrice !== null) ? p.purchasePrice :
    '';
  return num(v);
}

function partSale(p) {
  if (!p) return 0;
  const v =
    (p.sale !== undefined && p.sale !== '' && p.sale !== null) ? p.sale :
    (p.sellPrice !== undefined && p.sellPrice !== '' && p.sellPrice !== null) ? p.sellPrice :
    (p.sell !== undefined && p.sell !== '' && p.sell !== null) ? p.sell :
    (p.price !== undefined && p.price !== '' && p.price !== null) ? p.price :
    (p.salePrice !== undefined && p.salePrice !== '' && p.salePrice !== null) ? p.salePrice :
    '';
  return num(v);
}

function partHasContent(p) {
  if (!p) return false;
  if (String(p.name || '').trim()) return true;
  if (String(p.article || '').trim()) return true;
  if (partPurchase(p) > 0) return true;
  if (partSale(p) > 0) return true;
  if (Array.isArray(p.notes) && p.notes.some(n => String(n || '').trim())) return true;
  return false;
}

function partsCost(task) {
  return (task.parts || []).reduce((s,p) => s + partPurchase(p) * partQty(p), 0);
}
function partsRevenue(task) {
  return (task.parts || []).reduce((s,p) => s + partSale(p) * partQty(p), 0);
}
function worksCost(task) { return (task.works || []).reduce((s,w) => s + num(w.cost), 0); }
function worksRevenue(task) { return (task.works || []).reduce((s,w) => s + num(w.price), 0); }
function worksHours(task) { return (task.works || []).reduce((s,w) => s + num(w.hours), 0); }
function totalCost(task) { return partsCost(task) + worksCost(task); }
function totalRevenue(task) { return partsRevenue(task) + worksRevenue(task); }
function paidSum(task) { return (task.payments || []).reduce((s,p) => s + num(p.amount), 0); }
function netProfit(task) { return totalRevenue(task) - totalCost(task); }

function migratePart(p) {
  if (!p || typeof p !== 'object') return p;

  if (p.article === undefined || p.article === null) p.article = '';

  const q = parseInt(p.quantity, 10);
  p.quantity = (isNaN(q) || q < 1) ? 1 : q;

  if (!Array.isArray(p.notes)) {
    p.notes = (p.note !== undefined && p.note !== null && String(p.note).trim() !== '')
      ? [String(p.note)]
      : [];
  }
  p.note = p.notes.length ? p.notes[0] : '';

  if (!p.status) p.status = 'notordered';

  const purchaseEmpty = (p.purchase === undefined || p.purchase === '' || p.purchase === null);
  if (purchaseEmpty) {
    if (p.buy !== undefined && p.buy !== '' && p.buy !== null) p.purchase = p.buy;
    else if (p.cost !== undefined && p.cost !== '' && p.cost !== null) p.purchase = p.cost;
    else if (p.purchasePrice !== undefined && p.purchasePrice !== '' && p.purchasePrice !== null) p.purchase = p.purchasePrice;
  }
  if (p.purchase === undefined || p.purchase === null) p.purchase = '';

  const saleEmpty = (p.sale === undefined || p.sale === '' || p.sale === null);
  if (saleEmpty) {
    if (p.sellPrice !== undefined && p.sellPrice !== '' && p.sellPrice !== null) p.sale = p.sellPrice;
    else if (p.sell !== undefined && p.sell !== '' && p.sell !== null) p.sale = p.sell;
    else if (p.price !== undefined && p.price !== '' && p.price !== null) p.sale = p.price;
    else if (p.salePrice !== undefined && p.salePrice !== '' && p.salePrice !== null) p.sale = p.salePrice;
  }
  if (p.sale === undefined || p.sale === null) p.sale = '';

  return p;
}

function normalizeTasks(tasks) {
  (tasks || []).forEach(t => {
    if (!t.parts) t.parts = [];
    t.parts = t.parts.map(migratePart).filter(partHasContent);

    if (!t.works) t.works = [];
    t.works.forEach(w => {
      if (w.hours === undefined) w.hours = '';
      if (w.cost === undefined) w.cost = '';
      if (w.price === undefined) w.price = '';
      if (!w.status) w.status = 'notstarted';
      if (!w.link) w.link = '';
      if (w.comment === undefined) w.comment = '';
      if (w.assignee === undefined || w.assignee === null) w.assignee = '';
    });
    if (t.hidden === undefined) t.hidden = false;
    if (!t.payments) t.payments = [];
    if (t.payments) t.payments.forEach(p => { if (p.method === undefined || p.method === null) p.method = ''; });
    if (!t.log) t.log = [];
    if (!t.client) t.client = { name: '—', phone: '—', history: [] };
    if (!t.client.history) t.client.history = [];
    if (!t.car) t.car = { plate: '—', model: '—', year: '', vin: '' };
  });

  const numbered = (tasks || []).filter(t => typeof t.number === 'number' && t.number > 0);
  if (numbered.length) {
    state.taskCounter = Math.max(state.taskCounter || 0, ...numbered.map(t => t.number));
  }
  const unnumbered = (tasks || [])
    .filter(t => typeof t.number !== 'number' || !(t.number > 0))
    .sort((a, b) => String(a.createdAt || a.updatedAt || '').localeCompare(String(b.createdAt || b.updatedAt || '')));
  unnumbered.forEach(t => { t.number = nextTaskNumber(); });
}

// ============ СТАТУС ОПЛАТЫ ============
function paymentState(task) {
  const rev = totalRevenue(task);
  if (rev <= 0) return 'none';
  const paid = paidSum(task);
  return paid >= rev - 0.005 ? 'paid' : 'unpaid';
}

function paymentLabel(state) {
  if (state === 'paid') return 'Оплачено';
  if (state === 'unpaid') return 'Неоплачено';
  return 'Нет суммы';
}

function paymentBadge(task) {
  const st = paymentState(task);
  const cls = st === 'paid' ? 'paid' : (st === 'unpaid' ? 'unpaid' : 'none');
  return `<span class="pay-badge ${cls}">${paymentLabel(st)}</span>`;
}

function normArticle(raw) {
  const s = String(raw === null || raw === undefined ? '' : raw).trim().toUpperCase();
  return s ? encodeURIComponent(s) : '';
}

const SEARCH_SITES = [
  { id: 'drom',      title: 'Drom',      url: 'https://baza.drom.ru/oem/{ARTICLE}/' },
  { id: 'avito',     title: 'Avito',     url: 'https://www.avito.ru/all/zapchasti_i_aksessuary?q={ARTICLE}' },
  { id: 'farpost',   title: 'Farpost',   url: 'https://www.farpost.ru/oem/{ARTICLE}/' },
  { id: 'autotrade', title: 'Autotrade', url: 'https://autotrade.su/novosibirsk/find/{ARTICLE}' }
];

function searchUrl(tpl, article) {
  const a = normArticle(article);
  return a ? tpl.replace('{ARTICLE}', a) : '';
}

function openPartSearch(siteId, article) {
  const site = SEARCH_SITES.find(s => s.id === siteId);
  if (!site) return;
  const url = searchUrl(site.url, article);
  if (!url) return;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function partSearchButtonsHtml(article) {
  const a = normArticle(article);

  return `<span class="part-search">${SEARCH_SITES.map(s =>
    `<button type="button" class="search-btn"${disabled} title="${s.title}: поиск по артикулу"` +
    ` onclick="event.stopPropagation();openPartSearch('${s.id}', this.dataset.article)"` +
    ` data-article="${esc(article || '')}">${s.title}</button>`
  ).join('')}</span>`;
}

function partsSummaryHtml(task) {
  const parts = task.parts || [];

  const rows = parts.map(p => {
    const name = p.name || (normArticle(p.article) ? 'Артикул ' + normArticle(p.article) : '(без названия)');
    const art = normArticle(p.article);
    const qty = partQty(p);

    return `<div class="parts-summary-line">

// ===== ФИЛЬТРЫ СТАТУСОВ КАНБАН-ДОСКИ =====
const KANBAN_FILTERS = [
  { key: 'unpaid',     title: 'Неоплаченные' },
  { key: 'notordered', title: 'Незаказанные' },
  { key: 'ordered',    title: 'Заказанные' },
  { key: 'nowork',     title: 'Не в работе' },
  { key: 'inwork',     title: 'В работе' }
];

function taskMatchesKanbanFilter(t, key) {
  const parts = t.parts || [];
  const works = t.works || [];
  switch (key) {
    case 'unpaid':     return paymentState(t) === 'unpaid';
    case 'notordered': return parts.some(p => p.status === 'notordered');
    case 'ordered':    return parts.some(p => p.status === 'ordered');
    case 'nowork':     return works.some(w => w.status === 'notstarted');
    case 'inwork':     return works.some(w => w.status === 'inwork');
  }
  return true;
}

function currentKanbanFilters() {
  return Array.isArray(state.kanbanFilter) ? state.kanbanFilter : [];
}

function tasksBaseForUser() {
  const u = state.currentUser;
  if (USERS[u].role === 'chief') return state.tasks;
  return state.tasks.filter(t => !t.assignee || t.assignee === u);
}

function visibleTasksForUser() {
  let list = tasksBaseForUser();
  const fl = currentKanbanFilters();
  if (fl.length) list = list.filter(t => fl.some(k => taskMatchesKanbanFilter(t, k)));
  // скрытые задачи не отображаются на канбан-доске, но участвуют в калькуляции
  list = list.filter(t => !t.hidden);
  return list;
}

// Задачи для калькуляции: включая скрытые (но с учётом прав и фильтра по статусу)
function visibleTasksForCalc() {
  let list = tasksBaseForUser();
  const f = state.calcStatusFilter || '';
  if (f === 'hidden') list = list.filter(t => !!t.hidden);
  else if (f) list = list.filter(t => t.column === f);
  return list;
}

function renderFilterBar() {
  const bar = document.getElementById('filterBar');
  if (!bar) return;
  const isCalc = state.activeTab === 'calc';
  let inner = '';
  if (isCalc) {
    inner += `<label class="filter-label">Фильтр по статусу:</label>
      <select onchange="onCalcStatusFilterChange(this.value)">
        <option value="">Все статусы</option>
        ${COLUMNS.map(c => `<option value="${c.id}" ${state.calcStatusFilter === c.id ? 'selected' : ''}>${c.title}</option>`).join('')}
        <option value="hidden" ${state.calcStatusFilter === 'hidden' ? 'selected' : ''}>🙈 скрытая</option>
      </select>`;
  } else {
    const fl = currentKanbanFilters();
    inner += `<label class="filter-label">Фильтр по статусу:</label>
      <span class="filter-checks">
        ${KANBAN_FILTERS.map(f => `<label><input type="checkbox" ${fl.indexOf(f.key) >= 0 ? 'checked' : ''} onchange="toggleKanbanFilter('${f.key}', this.checked)"> ${f.title}</label>`).join('')}
      </span>
      <button type="button" class="tab-btn" onclick="onStatusFilterChange('')">Сбросить</button>`;
  }
  const total = state.tasks.length;
  const shown = isCalc ? visibleTasksForCalc().length : visibleTasksForUser().length;
  inner += `<span class="filter-count">Показано: ${shown} из ${total}</span>`;
  bar.innerHTML = inner;
}

function toggleKanbanFilter(key, on) {
  const fl = currentKanbanFilters().slice();
  const i = fl.indexOf(key);
  if (on && i < 0) fl.push(key);
  if (!on && i >= 0) fl.splice(i, 1);
  state.kanbanFilter = fl;
  render();
}

function onStatusFilterChange(value) {
  state.kanbanFilter = [];
  render();
}

function onCalcStatusFilterChange(value) {
  state.calcStatusFilter = value || '';
  render();
}

function statusCounts() {
  const map = {};
  COLUMNS.forEach(c => { map[c.id] = 0; });
  state.tasks.forEach(t => { if (map[t.column] !== undefined) map[t.column]++; });
  return map;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const visible = visibleTasksForUser();

  COLUMNS.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = `column ${col.cls}`;
    colEl.dataset.col = col.id;

    const header = document.createElement('div');
    header.className = 'column-header';
    const count = visible.filter(t => t.column === col.id).length;
    header.textContent = `${col.title} (${count})`;
    colEl.appendChild(header);

    const body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.col = col.id;

    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('drag-over'); });
    colEl.addEventListener('dragleave', () => colEl.classList.remove('drag-over'));
    colEl.addEventListener('drop', e => {
      e.preventDefault();
      colEl.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (id) tryMoveTask(id, col.id);
    });

    const tasks = visible.filter(t => t.column === col.id)
      .sort((a,b) => parseTimeToMinutes(b.updatedAt) - parseTimeToMinutes(a.updatedAt));

    tasks.forEach(t => body.appendChild(renderTask(t)));

    if (tasks.length === 0) {
      const em = document.createElement('div');
      em.className = 'empty-msg';
      em.textContent = 'Пусто';
      body.appendChild(em);
    }

    colEl.appendChild(body);
    board.appendChild(colEl);
  });
}

function renderTask(task) {

  el.className = 'task';
  el.draggable = true;
  el.dataset.id = task.id;
  el.style.borderLeftColor = getTaskColor(task.id);

  el.innerHTML = `
    <div class="task-header">
      <span class="task-title">${esc(task.car.plate)} · ${esc(task.car.model)}</span>
    </div>

    ${appSettings.showAssignee ? `<div class="task-row">👤 ${task.assignee ? USERS[task.assignee].name : '—'}</div>` : ''}
    ${appSettings.showPost ? `<div class="task-row">🅿️ Пост №${task.post || '—'}</div>` : ''}

function partStatusBadge(p) {
  const cls = p.status === 'instock' ? 'badge-green'
            : p.status === 'ordered' ? 'badge-yellow'
            : 'badge-red';
  const label = PARTS_STATUS[p.status] || p.status || '—';
  return `<span class="badge ${cls} item-badge" title="Запчасть: ${esc(p.name)}">🔩 ${esc(p.name)}: ${label}</span>`;
}

// Цветовая группа статуса: красный / жёлтый / зелёный
function statusColorGroup(kind, status) {
  if (kind === 'part') {
    if (status === 'instock') return 'green';
    if (status === 'ordered') return 'yellow';
    return 'red';
  }
  if (status === 'finished') return 'green';
  if (status === 'inwork') return 'yellow';
  return 'red';
}

function workStatusBadge(w) {
  const cls = w.status === 'finished' ? 'badge-green'
            : w.status === 'inwork' ? 'badge-yellow'
            : 'badge-red';
  const label = WORKS_STATUS[w.status] || w.status || '—';
  const hours = num(w.hours) > 0 ? ` · ${num(w.hours)} ч` : '';
  return `<span class="badge ${cls} item-badge" title="Работа: ${esc(w.name)}">🛠 ${esc(w.name)}: ${label}${hours}</span>`;
}

// ===== СПИСКИ В БЛОКЕ 2 (запчасти и работы в соседних колонках) =====

function issuedBadgeHtml(task) {

function getPartsSummary(task) {
  if (!task.parts || task.parts.length === 0) return '';
  const statuses = task.parts.map(p => p.status);
  if (statuses.every(s => s === 'instock')) return `<span class="badge badge-green">Запчасти: на складе</span>`;
  if (statuses.some(s => s === 'notordered')) return `<span class="badge badge-red">Запчасти: не заказано</span>`;
  return `<span class="badge badge-yellow">Запчасти: заказаны</span>`;
}

function getWorksSummary(task) {
  if (!task.works || task.works.length === 0) return '';
  const statuses = task.works.map(w => w.status);
  if (statuses.every(s => s === 'finished')) return `<span class="badge badge-green">Работы: завершено</span>`;
  if (statuses.some(s => s === 'notstarted')) return `<span class="badge badge-red">Работы: не в работе</span>`;
  return `<span class="badge badge-yellow">Работы: в работе</span>`;
}

function tryMoveTask(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  const u = state.currentUser;
  if (USERS[u].role === 'worker') {
    if (task.assignee && task.assignee !== u) {
      alert('Вы не можете изменять эту задачу');
      return;
    }
    if (!task.assignee) {
      if (newCol !== 'inwork') {
        alert('Сначала возьмите задачу в работу (назначьте себя исполнителем)');
        return;
      }
    }
  }

  if (task.column === newCol) return;

  openMoveModal(taskId, newCol);
}

function toLocalInput(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const SLOT_START_HOUR = 8;
const SLOT_END_HOUR = 20;
const SLOT_STEP_MIN = 30;

function timeSlots() {
  const out = [];
  const totalStart = SLOT_START_HOUR * 60;
  const totalEnd = SLOT_END_HOUR * 60;
  for (let m = totalStart; m <= totalEnd; m += SLOT_STEP_MIN) {
    const h = Math.floor(m / 60);
    const mm = m % 60;
    out.push(String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
  }
  return out;
}

function roundToSlot(hhmm) {
  const slots = timeSlots();
  if (!hhmm) return slots[0];
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m;
  const snapped = Math.round(total / SLOT_STEP_MIN) * SLOT_STEP_MIN;
  const hh = Math.floor(snapped / 60);
  const mm = snapped % 60;
  const res = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  return slots.includes(res) ? res : slots[0];
}

function isoToDateTimeParts(iso) {
  if (!iso) return { date: '', time: '' };
  const d = new Date(iso);
  if (isNaN(d)) return { date: '', time: '' };
  const pad = n => String(n).padStart(2,'0');
  return {
    date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}`
  };
}

function schedDateStr(d) {
  const dt = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
}

function partsToIso(date, time) {
  if (!date) return null;
  const t = roundToSlot(time || '');
  const d = new Date(`${date}T${t}:00`);
  if (isNaN(d)) return null;
  return d.toISOString();
}

function schedulePickerHtml(prefix, iso, label, defaultToday) {
  const parts = isoToDateTimeParts(iso);
  const slots = timeSlots();
  const selected = parts.time ? roundToSlot(parts.time) : '';
  let dateVal = parts.date;
  if (!dateVal && defaultToday) {
    dateVal = schedDateStr(new Date());
  }
  const opts = ['<option value="">— время —</option>'].concat(
    slots.map(s => `<option value="${s}" ${selected === s ? 'selected' : ''}>${s}</option>`)
  ).join('');
  return `
    <label>${label || 'Дата и время записи'} (шаг 30 минут)</label>
    <div class="sched-picker">
      <input type="date" id="${prefix}_date" value="${dateVal}">
      <select id="${prefix}_time" class="slot-select">${opts}</select>
    </div>
  `;
}

function getScheduleValue(prefix) {
  const dateEl = document.getElementById(prefix + '_date');
  const timeEl = document.getElementById(prefix + '_time');
  if (!dateEl) return null;
  return partsToIso(dateEl.value, timeEl ? timeEl.value : '');
}

function isValidSlot(hhmm) {
  if (!hhmm) return true;
  const [h, m] = hhmm.split(':').map(Number);
  return m === 0 || m === 30;
}

}

function extractUrl(text) {
  if (!text) return '';
  const m = String(text).match(/https?:\/\/[^\s<>"']+/i);
  return m ? m[0] : '';
}

function openPartNoteLink(input) {
  const url = extractUrl(input ? input.value : '');
  if (!url) return;
  window.open(url, '_blank', 'noopener,noreferrer');
}

function noteLinkButtonHtml(value) {
  const has = !!extractUrl(value);
  return `<button type="button" class="note-link-btn"${has ? '' : ' disabled'}` +
         ` title="${has ? 'Перейти по ссылке' : 'Ссылка не найдена'}"` +
         ` onclick="openPartNoteLink(this.parentElement.querySelector('input.note-input'))">🔗</button>`;

function updateNoteLinkBtn(input) {

  const btn = line.querySelector('button.note-link-btn');

  const check = row.querySelector('.ordered-check');

  const done = select.value === 'ordered' || select.value === 'instock';
  check.classList.toggle('done', done);
  check.textContent = done ? '✓' : '○';
  check.title = done ? 'Запчасть заказана' : 'Запчасть не заказана';
}

function stepPartQty(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.qty-input');
  if (!input) return;
  let q = parseInt(input.value, 10);
  if (isNaN(q)) q = 1;
  q += delta;
  if (q < 1) q = 1;
  input.value = String(q);
  updatePartRowTotal(input);
}

let partRowCounter = 0;
function addPartRow(part) {
  const list = document.getElementById('partsList');
  if (!list) return;
  const id = 'part_' + (partRowCounter++);
  const qty = partQty(part);
  const notes = Array.isArray(part?.notes) && part.notes.length
    ? part.notes
    : (part?.note ? [part.note] : ['']);
  const purchaseVal = part ? (part.purchase !== undefined ? part.purchase : '') : '';

function updatePartRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const qtyInput = row.querySelector('input.qty-input');
  const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
  const purchase = num(nums[0] ? nums[0].value : 0);
  const sale = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = (sale - purchase) * (qty < 1 ? 1 : qty);
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}

function collectPartRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const parts = [];
  rows.forEach(r => {
    const nameInput = r.querySelector('input.name-input');
    const articleInput = r.querySelector('input.article');
    const qtyInput = r.querySelector('input.qty-input');
    const numInputs = r.querySelectorAll('input.num');
    const notes = Array.from(r.querySelectorAll('input.note-input'))
      .map(n => n.value.trim())
      .filter(v => v !== '');
    const name = nameInput ? nameInput.value.trim() : '';
    const article = articleInput ? articleInput.value.trim() : '';
    const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
    const purchase = numInputs[0] ? numInputs[0].value.trim() : '';
    const sale = numInputs[1] ? numInputs[1].value.trim() : '';
    const statusSelect = r.querySelector('select.work-status');
    const status = statusSelect ? statusSelect.value : 'notordered';
    if (name || article || notes.length || purchase || sale) {
      parts.push({
        name, article,
        notes,
        note: notes.length ? notes[0] : '',
        link: '',
        quantity: qty < 1 ? 1 : qty,
        purchase, sale, status
      });
    }
  });
  return parts;
}

function confirmMove(taskId, newCol) {
  const task = state.tasks.find(t => t.id === taskId);
  const oldCol = task.column;
  const user = USERS[state.currentUser].name;
  const logEntries = [];

  if (newCol === 'waiting') {
    const v = document.getElementById('mExpectedAction').value.trim();
    task.pendingAction = v;
    logEntries.push(`Ожидаемое действие: ${v || '(не указано)'}`);
  } else if (newCol === 'approval') {
    const v = document.getElementById('mApproval').value.trim();
    task.approvalNote = v;
    logEntries.push(`Согласовать: ${v || '(не указано)'}`);
  } else if (newCol === 'parts') {
    const parts = collectPartRows('#partsList');
    task.parts = parts;
    logEntries.push(`Запчасти: ${parts.map(p=>p.name).join(', ') || '(нет)'}. Закупка: ${money(partsCost(task))}, продажа: ${money(partsRevenue(task))}`);
  } else if (newCol === 'inwork') {
    const assigneeEl = document.getElementById('mAssignee');
    const postEl = document.getElementById('mPost');
    const time = getScheduleValue('m');
    const works = collectWorkRows('#mWorksList');

    if (assigneeEl) {
      const assignee = assigneeEl.value;
      if (!assignee) { alert('Назначьте исполнителя'); return; }
      task.assignee = assignee;
    } else if (!task.assignee) {
      const freeWorker = Object.keys(USERS).find(k => USERS[k].role === 'worker' &&
        !state.tasks.some(t => t.assignee === k && t.column === 'inwork'));
      task.assignee = freeWorker || Object.keys(USERS).find(k => USERS[k].role === 'worker');
    }

    if (postEl) {
      task.post = parseInt(postEl.value);
    } else if (!task.post) {
      task.post = 1;
    }

    if (!time) { alert('Укажите время'); return; }
    task.scheduledTime = new Date(time).toISOString();
    if (works.length) {
      task.works = works;
      const hoursTotal = worksHours(task);
      logEntries.push(`Работы: ${works.map(w => w.name + (num(w.hours) > 0 ? ' (' + num(w.hours) + ' ч)' : '')).join(', ')}`);
      if (hoursTotal > 0) logEntries.push(`Всего часов: ${num(hoursTotal)}`);
    }

    const assigneeTxt = task.assignee ? USERS[task.assignee].name : '—';
    logEntries.push(`Исполнитель: ${assigneeTxt}, Пост №${task.post}, Время: ${formatTime(task.scheduledTime)}`);
  } else if (newCol === 'done') {
    const worksDone = collectDoneWorkRows();
    const cmEl = document.getElementById('mDoneComment');
    const cm = cmEl ? cmEl.value.trim() : '';
    if (worksDone && worksDone.length) {
      task.works = worksDone;
      const finished = worksDone.filter(w => w.status === 'finished').length;
      logEntries.push(`Работы: ${worksDone.map(w => w.name + ' — ' + (WORKS_STATUS[w.status] || w.status) + (w.comment ? ' (' + w.comment + ')' : '')).join(', ')}`);
      logEntries.push(`Завершено работ: ${finished} из ${worksDone.length}`);
    }
    task.doneComment = cm;
    if (cm) logEntries.push(`Общий комментарий: ${cm}`);
  } else if (newCol === 'issue') {
    const wdEl = document.getElementById('mWorkDone');
    const rcEl = document.getElementById('mRecommend');
    const issEl = document.getElementById('mIssued');
    const wd = wdEl ? wdEl.value.trim() : '';
    const rc = rcEl ? rcEl.value.trim() : '';
    task.workDone = wd;
    task.recommendations = rc;
    if (issEl) task.issued = issEl.value === '1';
    if (wd) logEntries.push(`Проделанные работы: ${wd}`);
    if (rc) logEntries.push(`Рекомендации: ${rc}`);
    logEntries.push(`Статус выдачи: ${task.issued ? 'ВЫДАНО' : 'НЕ ВЫДАНО'}`);
  }

  const fromTitle = COLUMNS.find(c=>c.id===oldCol).title;
  const toTitle = COLUMNS.find(c=>c.id===newCol).title;

  task.column = newCol;
  task.updatedAt = new Date().toISOString();

  task.log.push({
    time: new Date().toISOString(),
    user: user,
    text: `Перемещение: ${fromTitle} → ${toTitle}` + (logEntries.length ? '. ' + logEntries.join(' | ') : '')
  });

  if (!task.color) task.color = getTaskColor(task.id);

  notifyAboutTask(task, `Задача ${task.car.plate} перемещена в "${toTitle}"`);

  saveState();
  closeModal();
  render();
}

function savePartModal(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.parts || !task.parts[index]) return;
  const row = document.querySelector('#pm_row .part-row');
  if (!row) return;
  const name = row.querySelector('input.name-input').value.trim();
  const article = row.querySelector('input.article').value.trim();
  const qtyInput = row.querySelector('input.qty-input');
  const qty = qtyInput ? (parseInt(qtyInput.value, 10) || 1) : 1;
  const numInputs = row.querySelectorAll('input.num');
  const purchase = numInputs[0] ? numInputs[0].value.trim() : '';
  const sale = numInputs[1] ? numInputs[1].value.trim() : '';
  const status = row.querySelector('select.work-status').value;
  const notes = Array.from(document.querySelectorAll('#pm_notes input.note-input'))
    .map(n => n.value.trim()).filter(v => v !== '');

  const updated = {
    name, article, notes, note: notes.length ? notes[0] : '', link: '',
    quantity: qty < 1 ? 1 : qty, purchase, sale, status
  };

  if (!partHasContent(updated)) {
    if (!confirm('Запчасть пустая — удалить её из задачи?')) return;
    task.parts.splice(index, 1);
    task.log.push({
      time: new Date().toISOString(), user: USERS[state.currentUser].name,
      text: `Удалена запчасть: ${name || article || '(без названия)'}`
    });
  } else {
    task.parts[index] = updated;
    task.log.push({
      time: new Date().toISOString(), user: USERS[state.currentUser].name,
      text: `Запчасть изменена: ${updated.name || '(без названия)'}${article ? ' [' + normArticle(article) + ']' : ''} — ${PARTS_STATUS[status] || status}, закупка ${money(purchase)}, продажа ${money(sale)}, кол-во ${qty}`
    });
  }
  task.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
  setTimeout(() => openTaskView(taskId), 80);
}

function saveWorkModal(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.works || !task.works[index]) return;
  const list = document.getElementById('ce_worksList');
  const rows = list ? list.querySelectorAll('.part-row') : [];

  // Первая строка — редактируемая работа (остальные — добавленные новые)
  const collect = (r) => {
    const nameInput = r.querySelector('input.name-input');
    const hoursInput = r.querySelector('input.hours-input');
    const numInputs = r.querySelectorAll('input.num');
    const statusSelect = r.querySelector('select.work-status');
    const assigneeSelect = r.querySelector('select.work-assignee');
    return {
      name: nameInput ? nameInput.value.trim() : '',
      hours: hoursInput ? hoursInput.value.trim() : '',
      cost: numInputs[0] ? numInputs[0].value.trim() : '',
      price: numInputs[1] ? numInputs[1].value.trim() : '',
      status: statusSelect ? statusSelect.value : 'notstarted',
      assignee: assigneeSelect ? (assigneeSelect.value || '') : ''
    };
  };

  const first = rows[0] ? collect(rows[0]) : { name: '' };

  const works = task.works;
  if (!first.name) {
    if (!confirm('Название работы пустое — удалить работу?')) return;
    works.splice(index, 1);
    task.log.push({
      time: new Date().toISOString(), user: USERS[state.currentUser].name,
      text: 'Работа удалена (пустое название)'
    });
  } else {
    const updated = Object.assign({}, works[index], first);
    works[index] = updated;
    const who = updated.assignee && USERS[updated.assignee] ? USERS[updated.assignee].name
      : (task.assignee && USERS[task.assignee] ? USERS[task.assignee].name + ' (из задачи)' : '—');
    task.log.push({
      time: new Date().toISOString(), user: USERS[state.currentUser].name,
      text: `Работа изменена: ${updated.name} — ${WORKS_STATUS[updated.status] || updated.status}, себест. ${money(updated.cost)}, цена ${money(updated.price)}, исполнитель: ${who}`
    });
  }

  // Добавленные в этой же модалке строки
  const newWorks = [];
  for (let i = 1; i < rows.length; i++) {
    const r = collect(rows[i]);
    if (r.name) newWorks.push(Object.assign({ link: '', comment: '' }, r));
  }
  if (newWorks.length) {
    task.works = (task.works || []).concat(newWorks);
    task.log.push({
      time: new Date().toISOString(), user: USERS[state.currentUser].name,
      text: `Добавлено работ: ${newWorks.map(w => w.name).join(', ')}`
    });
  }

  task.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
  setTimeout(() => openTaskView(taskId), 80);
}

function deleteTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  const info = `Задача ${task.car.plate} · ${task.car.model}\nКлиент: ${task.client.name}\n` +
    `Расходы: ${money(totalCost(task))} · Доходы: ${money(totalRevenue(task))}\n` +
    `Оплачено: ${money(paidSum(task))} · Чистая прибыль: ${money(netProfit(task))}`;
  if (!confirm('Удалить задачу безвозвратно?\n\n' + info)) return;

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal" style="max-width:460px">
      <h2>🗑 Удаление задачи</h2>
      <div class="readonly-field">${esc(info).replace(/\n/g,'<br>')}</div>
      <label>Укажите причину удаления (попадёт в уведомления)</label>
      <textarea id="delReason" placeholder="Например: создана по ошибке"></textarea>
      <div class="modal-actions">
        <button onclick="closeModal()">Отмена</button>
        <button class="danger" onclick="confirmDeleteTask('${taskId}')">Удалить</button>
      </div>
    </div>
  `;
  document.getElementById('modalContainer').appendChild(modal);
}

function confirmDeleteTask(taskId) {
  const idx = state.tasks.findIndex(t => t.id === taskId);
  if (idx === -1) { closeModal(); return; }
  const task = state.tasks[idx];
  const reason = (document.getElementById('delReason')?.value || '').trim();

  state.tasks.splice(idx, 1);
  state.notifications = (state.notifications || []).filter(n => n.taskId !== taskId);

  state.notifications.push({
    id: uid(),
    taskId: null,
    message: `🗑 Задача ${task.car.plate} удалена (${USERS[state.currentUser].name})${reason ? ': ' + reason : ''}`,
    time: new Date().toISOString(),
    read: false
  });
  if (state.notifications.length > 100) state.notifications = state.notifications.slice(-100);

  saveState();
  closeModal();
  render();
}

function addCePartRow(part) {
  const list = document.getElementById('ce_partsList');
  if (!list) return;
  const qty = partQty(part);
  const notes = Array.isArray(part?.notes) && part.notes.length
    ? part.notes
    : (part?.note ? [part.note] : ['']);
  const purchaseVal = part ? (part.purchase !== undefined ? part.purchase : '') : '';
  const saleVal = part ? (part.sale !== undefined ? part.sale : '') : '';
  const div = document.createElement('div');
  div.className = 'part-row';
  div.innerHTML = `
    <input type="text" class="name-input" placeholder="Название" value="${esc(part?.name||'')}">
    <input type="text" class="article" placeholder="Артикул" value="${esc(part?.article||'')}" oninput="updatePartSearchButtons(this)">
    <span class="qty-control">
      <button type="button" class="qty-btn" onclick="stepPartQty(this,-1)" title="Меньше">−</button>
      <input type="number" step="1" min="1" class="qty-input" value="${qty}" oninput="updatePartRowTotal(this)">
      <button type="button" class="qty-btn" onclick="stepPartQty(this,1)" title="Больше">+</button>
    </span>
    <input type="number" step="0.01" min="0" class="num" placeholder="Закупка" value="${esc(purchaseVal)}" oninput="updatePartRowTotal(this)">
    <input type="number" step="0.01" min="0" class="num" placeholder="Продажа" value="${esc(saleVal)}" oninput="updatePartRowTotal(this)">
    <select class="work-status" onchange="updatePartOrderedCheck(this)">
      <option value="notordered" ${part?.status==='notordered'?'selected':''}>Не заказано</option>
      <option value="ordered" ${part?.status==='ordered'?'selected':''}>Заказано</option>
      <option value="instock" ${part?.status==='instock'?'selected':''}>На складе</option>
    </select>
    <span class="row-total">—</span>
    ${partSearchButtonsHtml(part?.article || '')}

    ${notes.map((n, i) => partNoteLineHtml(n, i)).join('')}
  `;
  list.appendChild(div);
  updatePartRowTotal(div.querySelector('input.num'));
}

function workAssigneeSelectHtml(work, taskAssignee) {
  const val = work?.assignee || '';
  const auto = val ? '' : ' auto';
  const opts = Object.keys(USERS).filter(k => USERS[k].role === 'worker')
    .map(k => `<option value="${k}" ${val === k ? 'selected' : ''}>${USERS[k].name}</option>`).join('');
  const autoLabel = taskAssignee && USERS[taskAssignee]
    ? `👤 ${USERS[taskAssignee].name} (задача)`
    : '👤 Как в задаче';
  return `<select class="work-assignee${auto}" title="Исполнитель работы">
    <option value="">${esc(autoLabel)}</option>
    ${opts}
  </select>`;
}
