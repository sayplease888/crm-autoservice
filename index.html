function collectDoneWorkRows() {
  const list = document.getElementById('mWorksDone');
  if (!list) return null;
  const rows = list.querySelectorAll('.part-row');
  const works = [];
  rows.forEach(r => {
    const name = r.querySelector('input.name-input');
    const hrs = r.querySelector('input.hours-input');
    const nums = r.querySelectorAll('input.num');
    const sel = r.querySelector('select.work-status');
    const cm = r.querySelector('input.work-comment');
    const work = {
      name: name ? name.value.trim() : '',
      hours: hrs ? hrs.value.trim() : '',
      cost: nums[0] ? nums[0].value.trim() : '',
      price: nums[1] ? nums[1].value.trim() : '',
      status: sel ? sel.value : 'notstarted',
      comment: cm ? cm.value.trim() : ''
    };
    if (work.name || work.hours || work.cost || work.price || work.comment) {
      works.push(work);
    }
  });
  return works;
}

function stepWorkHours(btn, delta) {
  const row = btn.closest('.part-row');
  if (!row) return;
  const input = row.querySelector('input.hours-input');
  if (!input) return;
  const current = num(input.value);
  let next = Math.round((current + delta) * 2) / 2;
  if (next < 0) next = 0;
  input.value = next === 0 ? '0' : String(next);
  updateWorkRowTotal(input);
}

function updateWorkRowTotal(el) {
  const row = el.closest('.part-row');
  if (!row) return;
  const nums = row.querySelectorAll('input.num');
  const cost = num(nums[0] ? nums[0].value : 0);
  const price = num(nums[1] ? nums[1].value : 0);
  const out = row.querySelector('.row-total');
  if (!out) return;
  const profit = price - cost;
  out.textContent = money(profit);
  out.classList.toggle('neg', profit < 0);
}

function collectWorkRows(selector) {
  const rows = document.querySelectorAll(selector + ' .part-row');
  const works = [];
  rows.forEach(r => {
    const nameInput = r.querySelector('input.name-input');
    const hoursInput = r.querySelector('input.hours-input');
    const numInputs = r.querySelectorAll('input.num');
    const name = nameInput ? nameInput.value.trim() : '';
    const hours = hoursInput ? hoursInput.value.trim() : '';
    const cost = numInputs[0] ? numInputs[0].value.trim() : '';
    const price = numInputs[1] ? numInputs[1].value.trim() : '';
    const statusSelect = r.querySelector('select.work-status');
    const status = statusSelect ? statusSelect.value : 'notstarted';
    const assigneeSelect = r.querySelector('select.work-assignee');
    const assignee = assigneeSelect ? (assigneeSelect.value || '') : '';
    const cmInput = r.querySelector('input.work-comment');
    const comment = cmInput ? cmInput.value.trim() : '';
    if (name) works.push({ name, hours, cost, price, status, assignee, comment, link: '' });
  });
  return works;
}

function removePayment(taskId, index) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.payments) return;
  const p = task.payments[index];
  if (!p) return;
  if (!confirm(`Удалить оплату ${money(p.amount)} от ${formatTime(p.date)}?`)) return;
  task.payments.splice(index, 1);
  task.log.push({
    time: new Date().toISOString(),
    user: USERS[state.currentUser].name,
    text: `Удалена оплата: ${money(p.amount)} (${formatTime(p.date)})`
  });
  task.updatedAt = new Date().toISOString();
  saveState();
  closeModal();
  render();
  setTimeout(()=>openCharEditor(taskId, 'payments'), 100);
}

function saveChar(taskId, field) {
  const task = state.tasks.find(t => t.id === taskId);
  const user = USERS[state.currentUser].name;
  let logText = '';

  if (field === 'car') {
    task.car.plate = document.getElementById('ce_plate').value.trim();
    task.car.model = document.getElementById('ce_model').value.trim();
    task.car.year = document.getElementById('ce_year').value;
    logText = `Авто изменено: ${task.car.plate} ${task.car.model} ${task.car.year}`;
  } else if (field === 'vin') {
    task.car.vin = document.getElementById('ce_vin').value.trim().toUpperCase();
    logText = `VIN изменён: ${task.car.vin}`;
  } else if (field === 'time') {
    const v = getScheduleValue('ce');
    task.scheduledTime = v;
    logText = `Время изменено: ${formatTime(task.scheduledTime)}`;
  } else if (field === 'assignee') {
    task.assignee = document.getElementById('ce_assignee').value || null;
    logText = `Исполнитель: ${task.assignee ? USERS[task.assignee].name : 'не назначен'}`;
  } else if (field === 'post') {
    const v = document.getElementById('ce_post').value;
    task.post = v ? parseInt(v) : null;
    logText = `Пост: ${task.post ? '№'+task.post : '—'}`;
  } else if (field === 'parts') {
    const parts = collectPartRows('#ce_partsList');
    task.parts = parts;
    logText = `Запчасти обновлены: ${parts.map(p=>`${p.name || '(без названия)'}${p.article ? ' ['+normArticle(p.article)+']' : ''}${p.note ? ' — '+p.note : ''} (${PARTS_STATUS[p.status]||p.status}, закупка ${money(p.purchase)}, продажа ${money(p.sale)})`).join(', ') || '—'}`;
  } else if (field === 'works') {
    const works = collectWorkRows('#ce_worksList');
    task.works = works;
    logText = `Работы обновлены: ${works.map(w=>`${w.name} (${WORKS_STATUS[w.status]||w.status}, себест. ${money(w.cost)}, цена ${money(w.price)})`).join(', ') || '—'}`;
  } else if (field === 'payments') {
    const amountRaw = document.getElementById('ce_payAmount').value.trim();
    const amount = num(amountRaw);
    if (!amountRaw || amount <= 0) { alert('Укажите сумму оплаты больше нуля'); return; }
    const dateVal = document.getElementById('ce_payDate').value;
    const comment = document.getElementById('ce_payComment').value.trim();
    const methodEl = document.getElementById('ce_payMethod');
    const method = methodEl ? methodEl.value : 'Наличные';
    task.payments = task.payments || [];
    task.payments.push({
      date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
      amount: amount,
      comment: comment,
      method: method,
      user: user
    });
    logText = `Внесена оплата: ${money(amount)} (${method})${comment ? ' — ' + comment : ''}. Всего оплачено: ${money(paidSum(task))}`;
  } else if (field === 'finance') {
    // только просмотр
  } else if (field === 'client') {
    task.client.name = document.getElementById('ce_clientName').value.trim();
    task.client.phone = document.getElementById('ce_clientPhone').value.trim();
    const add = document.getElementById('ce_historyAdd').value.trim();
    if (add) {
      task.client.history = task.client.history || [];
      task.client.history.push(add);
    }
    logText = `Клиент изменён: ${task.client.name} ${task.client.phone}${add ? ' + запись в историю' : ''}`;
  } else if (field === 'reason') {
    task.reason = document.getElementById('ce_reason').value.trim();
    logText = `Причина изменена: ${task.reason}`;
  } else if (field === 'comment') {
    const nc = document.getElementById('ce_newComment').value.trim();
    if (nc) {
      task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;
      logText = `Добавлен комментарий: ${nc}`;
    }
  }

  if (logText) {
    task.log.push({ time: new Date().toISOString(), user, text: logText });
    task.updatedAt = new Date().toISOString();
    notifyAboutTask(task, `${task.car.plate}: ${logText}`);
  }

  saveState();
  closeModal();
  render();
  setTimeout(()=>{

      </div>

function saveEditTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  const user = USERS[state.currentUser].name;
  const changes = [];

  const nv = (id) => document.getElementById(id).value.trim();

  if (task.car.plate !== nv('e_plate')) { changes.push(`Госномер: ${task.car.plate}→${nv('e_plate')}`); task.car.plate = nv('e_plate'); }
  if (task.car.model !== nv('e_model')) { changes.push(`Модель: ${task.car.model}→${nv('e_model')}`); task.car.model = nv('e_model'); }
  if (String(task.car.year) !== nv('e_year')) { changes.push(`Год: ${task.car.year}→${nv('e_year')}`); task.car.year = nv('e_year'); }
  if (task.car.vin !== nv('e_vin').toUpperCase()) { changes.push(`VIN изменён`); task.car.vin = nv('e_vin').toUpperCase(); }
  if ((task.car.mileage || '') !== nv('e_mileage')) { changes.push(`Пробег: ${task.car.mileage || '—'}→${nv('e_mileage')}`); task.car.mileage = nv('e_mileage'); }
  if (task.client.name !== nv('e_clientName')) { changes.push(`Клиент: ${task.client.name}→${nv('e_clientName')}`); task.client.name = nv('e_clientName'); }
  if (task.client.phone !== nv('e_clientPhone')) { changes.push(`Телефон: ${task.client.phone}→${nv('e_clientPhone')}`); task.client.phone = nv('e_clientPhone'); }
  if (task.reason !== nv('e_reason')) { changes.push(`Причина изменена`); task.reason = nv('e_reason'); }
  if ((task.damageDescription || '') !== nv('e_damage')) { changes.push(`Описание состояния обновлено`); task.damageDescription = nv('e_damage'); }

  const nc = nv('e_newComment');
  if (nc) {
    task.comment = (task.comment ? task.comment + '\n' : '') + `[${nowStr()}] ${nc}`;
    changes.push(`Комментарий: ${nc}`);
  }

  if (changes.length) {
    task.log.push({ time: new Date().toISOString(), user, text: 'Редактирование. ' + changes.join('; ') });
    task.updatedAt = new Date().toISOString();
    notifyAboutTask(task, `Задача ${task.car.plate} отредактирована`);
  }

  saveState();
  closeModal();
  render();
  setTimeout(()=>openTaskView(taskId), 100);
}

// ============ РАСПИСАНИЕ ============
let scheduleDate = null;

function shiftScheduleDate(delta) {
  const base = scheduleDate ? new Date(scheduleDate) : new Date();
  base.setHours(0,0,0,0);
  base.setDate(base.getDate() + delta);
  scheduleDate = dateStrToKey(base);
  showSchedule();
}

function scheduleTasksForDate() {
  const key = scheduleDate || schedDateStr(new Date());
  return state.tasks.filter(t => {
    if (!t.scheduledTime) return false;
    const d = new Date(t.scheduledTime);
    return schedDateStr(d) === key;
  }).sort((a,b)=>parseTimeToMinutes(a.scheduledTime)-parseTimeToMinutes(b.scheduledTime));
}

function dateStrToKey(d) {
  return schedDateStr(d);
}

function showSchedule() {
  const base = scheduleDate ? new Date(scheduleDate + 'T00:00:00') : new Date();
  const today = new Date();
  const isToday = schedDateStr(base) === schedDateStr(today);
  const tasks = scheduleTasksForDate();

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  const fmtDate = base.toLocaleDateString('ru-RU', { day:'2-digit', month:'long', year:'numeric', weekday:'short' });

  let html = `
    <div class="modal-titlebar">
      <h2>📅 Расписание постов</h2>
      <div class="modal-title-actions">
        <button class="back-btn" onclick="closeModal()">×</button>
      </div>
    </div>
    <div class="sched-datebar">
      <button onclick="shiftScheduleDate(-1)">‹</button>
      <span class="sched-date-label">${fmtDate}</span>
      <button onclick="shiftScheduleDate(1)">›</button>
      ${isToday ? '' : `<button onclick="goScheduleToday()">Сегодня</button>`}
    </div>
  `;

  if (tasks.length === 0) {
    html += `<div class="schedule-empty">На эту дату нет записей</div>`;
  } else {
    for (let i=1; i<=4; i++) {
      html += `<h3>Пост №${i}</h3>`;
      const postTasks = tasks.filter(t => t.post === i);
      if (postTasks.length === 0) {
        html += `<div class="schedule-post">Свободен</div>`;
      } else {
        postTasks.forEach(t => {
          const time = new Date(t.scheduledTime);
          const timeStr = String(time.getHours()).padStart(2,'0') + ':' + String(time.getMinutes()).padStart(2,'0');
          html += `<div class="schedule-post">
            <b>${timeStr}</b> — ${t.car.plate} (${t.car.model})<br>
            <small>${t.assignee?USERS[t.assignee].name:'—'}${(t.works && t.works.length) ? ' · ' + t.works.map(w=>esc(w.name)).join(', ') : ''}</small>
          </div>`;
        });
      }
    }
  }

  modal.innerHTML = `<div class="modal">${html}
    <div class="modal-actions"><button onclick="closeModal()">Закрыть</button></div>
  </div>`;
  document.getElementById('modalContainer').appendChild(modal);
}

function goScheduleToday() {
  scheduleDate = null;
  showSchedule();
}

function showPostSchedule(postNum) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  let html = `<h2>📅 Расписание поста №${postNum}</h2>`;
  const tasks = state.tasks.filter(t => t.post === postNum).sort((a,b)=>parseTimeToMinutes(a.scheduledTime)-parseTimeToMinutes(b.scheduledTime));
  if (tasks.length === 0) html += '<div class="schedule-post">Нет задач</div>';
  tasks.forEach(t => {
    html += `<div class="schedule-post">
      <b>${formatTime(t.scheduledTime)}</b> — ${t.car.plate} (${t.car.model})<br>
      <small>Столбец: ${COLUMNS.find(c=>c.id===t.column).title}</small><br>
      <small>Исполнитель: ${t.assignee?USERS[t.assignee].name:'—'}</small>
    </div>`;
  });
  modal.innerHTML = `<div class="modal">${html}
    <div class="modal-actions"><button onclick="closeModal()">Закрыть</button></div>
  </div>`;
  document.getElementById('modalContainer').appendChild(modal);
}

];

// Столбцы, которые нельзя отключить: авто/клиент (содержательный столбец №2) и №
const CALC_FIXED_COLS = ['plate', 'number'];

function activeCalcFields() {
  const hidden = state.calcHiddenCols || {};
  return CALC_FIELDS.filter(f => CALC_FIXED_COLS.indexOf(f.field) >= 0 || !hidden[f.field]);
}

function debtOf(task) {
  const d = totalRevenue(task) - paidSum(task);
  return d > 0 ? d : 0;
}

function calcTaskRow(t) {
  const paySt = paymentState(t);
  return {
    number: t.number || 0,
    createdAt: t.createdAt || t.updatedAt || '',
    plate: t.car.plate,
    reason: t.reason,
    exp_parts: partsCost(t),
    inc_parts: partsRevenue(t),
    exp_works: worksCost(t),
    inc_works: worksRevenue(t),
    exp_total: totalCost(t),
    paid: paidSum(t),
    debt: debtOf(t),
    inc_total: totalRevenue(t),
    profit: netProfit(t),
    payStatus: paymentLabel(paySt),
    payStatusCode: paySt,
    status: t.hidden ? 'скрытая' : ((COLUMNS.find(c => c.id === t.column) || {}).title || '—'),
    statusHidden: !!t.hidden
  };
}

function renderCalculator() {
  const el = document.getElementById('calcView');
  if (!el) return;

  const tasks = visibleTasksForCalc();

  const assigneeFilter = state.calcAssignee || '';
  const filtered = !assigneeFilter ? tasks
                 : assigneeFilter === '__none__' ? tasks.filter(t => !t.assignee)
                 : tasks.filter(t => t.assignee === assigneeFilter);

  const rows = filtered.map(t => ({ task: t, row: calcTaskRow(t) }));

  const { field, dir } = state.calcSort;
  rows.sort((a, b) => {
    let va = a.row[field], vb = b.row[field];
    if (typeof va === 'string' || typeof vb === 'string') {
      va = String(va || '').toLowerCase();
      vb = String(vb || '').toLowerCase();
      return dir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
    }
    va = num(va); vb = num(vb);
    return dir === 'asc' ? va - vb : vb - va;
  });

  const sum = (f) => rows.reduce((s, r) => s + num(r.row[f]), 0);
  const expParts = sum('exp_parts'), expWorks = sum('exp_works'), expTotal = sum('exp_total');
  const incParts = sum('inc_parts'), incWorks = sum('inc_works'), incTotal = sum('inc_total');
  const paid = sum('paid'), profit = sum('profit'), debt = sum('debt');
  const doneCount = filtered.filter(t => t.column === 'done' || t.column === 'issue').length;

  const arrow = (f) => field === f ? (dir === 'asc' ? ' ▲' : ' ▼') : '';
  const cols = activeCalcFields();
  const colSet = new Set(cols.map(c => c.field));
  const hidden = state.calcHiddenCols || {};
  const on = (f) => colSet.has(f);

  const cell = (f, task, row) => {
    if (f === 'number') return `<td class="num calc-num-col">${task.number || '—'}</td>`;
    if (f === 'plate') return `<td><span class="calc-car-model">${esc(task.car.model || '')}</span><span class="calc-car-plate">${esc(row.plate)} · ${esc(task.client.name)}</span></td>`;
    if (f === 'reason') return `<td>${esc(row.reason)}</td>`;
    if (f === 'exp_parts') return `<td class="num exp">${money(row.exp_parts)}</td>`;
    if (f === 'inc_parts') return `<td class="num inc">${money(row.inc_parts)}</td>`;
    if (f === 'exp_works') return `<td class="num exp">${money(row.exp_works)}</td>`;
    if (f === 'inc_works') return `<td class="num inc">${money(row.inc_works)}</td>`;
    if (f === 'exp_total') return `<td class="num exp">${money(row.exp_total)}</td>`;
    if (f === 'paid') return `<td class="num paid">${money(row.paid)}</td>`;
    if (f === 'debt') return `<td class="num debt ${row.debt > 0 ? 'owed' : ''}">${money(row.debt)}</td>`;
    if (f === 'inc_total') return `<td class="num inc">${money(row.inc_total)}</td>`;
    if (f === 'profit') return `<td class="num profit ${row.profit < 0 ? 'neg' : 'pos'}">${money(row.profit)}</td>`;
    if (f === 'payStatus') {
      const payCls = row.payStatusCode === 'paid' ? 'paid' : (row.payStatusCode === 'unpaid' ? 'unpaid' : 'none');
      return `<td><span class="pay-badge ${payCls}">${esc(row.payStatus)}</span></td>`;
    }
    if (f === 'status') return `<td><span class="badge ${row.statusHidden ? 'badge-gray' : 'badge-blue'}">${esc(row.status)}</span></td>`;
    return '';
  };

  const totalCell = (f) => {
    if (f === 'number') return `<td class="num"></td>`;
    if (f === 'plate') return `<td>ИТОГО (${rows.length} задач)</td>`;
    if (f === 'reason') return `<td></td>`;
    if (f === 'exp_parts') return `<td class="num exp">${money(expParts)}</td>`;
    if (f === 'inc_parts') return `<td class="num inc">${money(incParts)}</td>`;
    if (f === 'exp_works') return `<td class="num exp">${money(expWorks)}</td>`;
    if (f === 'inc_works') return `<td class="num inc">${money(incWorks)}</td>`;
    if (f === 'exp_total') return `<td class="num exp">${money(expTotal)}</td>`;
    if (f === 'paid') return `<td class="num paid">${money(paid)}</td>`;
    if (f === 'debt') return `<td class="num debt ${debt > 0 ? 'owed' : ''}">${money(debt)}</td>`;
    if (f === 'inc_total') return `<td class="num inc">${money(incTotal)}</td>`;
    if (f === 'profit') return `<td class="num ${profit < 0 ? 'exp' : 'inc'}">${money(profit)}</td>`;
    if (f === 'payStatus') return `<td colspan="${cols.length - cols.indexOf(cols.find(c => c.field === 'payStatus')) - 2}"></td>`;
    if (f === 'status') return `<td></td>`;
    return '';
  };

  const plateIdx = cols.findIndex(c => c.field === 'plate');

  el.innerHTML = `
    <div class="calc-assignee-bar">
      <label>👤 Разделить по исполнителям:</label>
      <select onchange="state.calcAssignee=this.value; renderCalculator();">
        <option value="">Все исполнители</option>
        ${Object.keys(USERS).filter(k => USERS[k].role === 'worker').map(k =>
          `<option value="${k}" ${assigneeFilter === k ? 'selected' : ''}>${USERS[k].name}</option>`
        ).join('')}
        <option value="__none__" ${assigneeFilter === '__none__' ? 'selected' : ''}>Без исполнителя</option>
      </select>
      <span class="calc-assignee-count">Показано задач: ${filtered.length} из ${tasks.length}</span>
    </div>
    <div class="calc-cols">
      <span class="calc-cols-title">👁 Столбцы:</span>
      ${CALC_FIELDS.map(f => {
        const isFixed = CALC_FIXED_COLS.indexOf(f.field) >= 0;
        if (isFixed) return `<label title="Этот столбец нельзя отключить"><input type="checkbox" checked disabled> ${f.title}</label>`;
        return `<label><input type="checkbox" ${hidden[f.field] ? '' : 'checked'} onchange="toggleCalcColumn('${f.field}', this.checked)"> ${f.title}</label>`;
      }).join('')}
      <button type="button" class="tab-btn" onclick="resetCalcColumns()">Все столбцы</button>
    </div>
    <div class="calc-summary">
      <div class="calc-card red">
        <div class="calc-card-title">Расходы (общие)</div>
        <div class="calc-card-value">${money(expTotal)}</div>
      </div>
      <div class="calc-card green">
        <div class="calc-card-title">Доходы (общие)</div>
        <div class="calc-card-value">${money(incTotal)}</div>
      </div>
      <div class="calc-card blue">
        <div class="calc-card-title">Оплачено</div>
        <div class="calc-card-value">${money(paid)}</div>
      </div>
      <div class="calc-card ${debt > 0 ? 'red' : 'green'}">
        <div class="calc-card-title">Долг</div>
        <div class="calc-card-value">${money(debt)}</div>
      </div>
      <div class="calc-card ${profit < 0 ? 'red' : 'green'}">
        <div class="calc-card-title">Чистая прибыль</div>
        <div class="calc-card-value">${money(profit)}</div>
      </div>
      <div class="calc-card">
        <div class="calc-card-title">Задач / завершено</div>
        <div class="calc-card-value">${tasks.length} / ${doneCount}</div>
      </div>
    </div>
    <div class="calc-hint">Нажмите на любую строку или ячейку — откроется окно задачи для редактирования. Заголовок столбца — сортировка (столбец «№» сортирует по временной шкале).</div>
    <table class="calc-table">
      <thead>
        <tr>
          ${cols.map(f => `<th class="${f.type === 'num' ? 'num' : ''}" onclick="sortCalc('${f.field}')">${f.title}${arrow(f.field)}</th>`).join('')}
          <th class="del-cell"></th>
        </tr>
      </thead>
      <tbody>
        ${rows.length === 0 ? `<tr><td colspan="${cols.length+1}" class="empty-msg">Нет задач для калькуляции</td></tr>` : ''}
        ${rows.map(r => `<tr class="clickable" onclick="openTaskView('${r.task.id}')">${cols.map(f => cell(f.field, r.task, r.row)).join('')}<td class="del-cell"><button type="button" class="danger small" onclick="event.stopPropagation();deleteTask('${r.task.id}')">🗑</button></td></tr>`).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td colspan="${plateIdx + 1}">ИТОГО (${rows.length} задач)</td>
          ${cols.map((f, i) => i > plateIdx ? totalCell(f.field) : '').join('')}
          <td class="del-cell"></td>
        </tr>
      </tfoot>
    </table>
  `;
}

function toggleCalcColumn(field, visible) {
  if (!state.calcHiddenCols) state.calcHiddenCols = {};
  if (visible) delete state.calcHiddenCols[field];
  else state.calcHiddenCols[field] = true;
  renderCalculator();
}

function resetCalcColumns() {
  state.calcHiddenCols = {};
  renderCalculator();
}

function sortCalc(field) {
  if (state.calcSort.field === field) {
    state.calcSort.dir = state.calcSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    state.calcSort.field = field;
    state.calcSort.dir = 'asc';
  }
  renderCalculator();
}

// ============ УВЕДОМЛЕНИЯ ============
function notifyAboutTask(task, message) {
  const notif = {
    id: uid(),
    taskId: task.id,
    message,
    time: new Date().toISOString(),
    read: false
  };
  state.notifications.push(notif);
  if (state.notifications.length > 100) state.notifications = state.notifications.slice(-100);
  saveState();
  renderNotifications();
  updateBadge();
}

function notificationsForUser() {
  const u = state.currentUser;
  if (USERS[u].role === 'chief') return state.notifications;
  return state.notifications.filter(n => {
    const t = state.tasks.find(x => x.id === n.taskId);
    return t && t.assignee === u;
  });
}

function updateBadge() {
  const notifs = notificationsForUser();
  const unread = notifs.filter(n => !n.read).length;
  const badge = document.getElementById('notifBadge');
  if (unread > 0) {
    badge.style.display = 'flex';
    badge.textContent = unread > 99 ? '99+' : unread;
  } else {
    badge.style.display = 'none';
  }
}

function toggleNotifications() {
  state.notifOpen = !state.notifOpen;
  renderNotifications();
  if (state.notifOpen) {
    notificationsForUser().forEach(n => n.read = true);
    saveState();
    updateBadge();
  }
}

function renderNotifications() {
  const panel = document.getElementById('notifPanel');
  if (!state.notifOpen) { panel.innerHTML = ''; return; }
  const notifs = notificationsForUser().slice().reverse();
  panel.innerHTML = `
    <div class="notification-panel">
      <h3>🔔 Уведомления (${notifs.length})</h3>
      ${notifs.length === 0 ? '<div class="empty-msg">Нет уведомлений</div>' : ''}
      ${notifs.slice(0,30).map(n => `
        <div class="notif-item ${n.read?'':'unread'}" onclick="openTaskView('${n.taskId}')">
          <div>${n.message}</div>
          <div class="notif-time">${formatTime(n.time)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

  { key: 'partsNote', title: 'Примечание (запчасти)' },
  { key: 'worksList', title: 'Работы' },
  { key: 'payList',   title: 'Оплаты' },
  { key: 'exp_parts', title: 'Расходы (запчасти)' },
  { key: 'inc_parts', title: 'Запчасти (продажа)' },
  { key: 'exp_works', title: 'Расходы (работа)' },
  { key: 'inc_works', title: 'Работа (цена)' },
  { key: 'exp_total', title: 'Расходы (общие)' },
  { key: 'paid',      title: 'Оплачено' },
  { key: 'debt',      title: 'Долг' },
  { key: 'inc_total', title: 'Доходы (общие)' },
  { key: 'profit',    title: 'Чистая прибыль' },
  { key: 'payStatus', title: 'Оплата' },
  { key: 'issued',    title: 'Статус выдачи' },
  { key: 'comment',   title: 'Комментарий' }
];

function csvNum(v) {
  const n = num(v);
  return n === 0 ? '0' : String(Math.round(n * 100) / 100).replace('.', ',');
}

function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  if (s.indexOf(CSV_SEP) >= 0 || s.indexOf('"') >= 0 || /[\r\n]/.test(s) || s !== s.trim()) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function csvRow(values) {
  return values.map(csvCell).join(CSV_SEP);
}

function csvDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function parseCsvDateTime(s) {
  const v = String(s || '').trim();
  if (!v || v === '—') return null;

  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}))?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)).toISOString();

  m = v.match(/^(\d{2})\.(\d{2})(?:\.(\d{4}))?(?:,?\s+(\d{1,2}):(\d{2}))?/);
  if (m) {
    const year = m[3] ? +m[3] : new Date().getFullYear();
    return new Date(year, +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).toISOString();
  }
  return null;
}

function taskToCsvRecord(t) {
  const paySt = paymentState(t);
  return {
    number: t.number || '',
    createdAt: csvDateTime(t.createdAt),
    plate: t.car.plate,
    model: t.car.model,
    year: t.car.year,
    vin: t.car.vin,
    client: t.client.name,
    phone: t.client.phone,
    reason: t.reason,
    column: (COLUMNS.find(c => c.id === t.column) || {}).title || t.column || '',
    assignee: t.assignee ? USERS[t.assignee].name : '',
    post: t.post || '',
    scheduled: csvDateTime(t.scheduledTime),
    partsList: (t.parts || []).map(p =>
      `${p.name}${p.article ? ' ['+normArticle(p.article)+']' : ''}${partQty(p) > 1 ? ' ×'+partQty(p) : ''} [${PARTS_STATUS[p.status] || p.status}] ${csvNum(partPurchase(p))}→${csvNum(partSale(p))}`).join(' | '),
    partsNote: (t.parts || []).filter(p => (p.notes && p.notes.length) || p.note).map(p => {
      const ns = (p.notes && p.notes.length) ? p.notes : [p.note];
      return `${p.name || p.article || '—'}: ${ns.join('; ')}`;
    }).join(' | '),
    worksList: (t.works || []).map(w =>
      `${w.name}${num(w.hours) > 0 ? ' [' + csvNum(w.hours) + ' ч]' : ''} [${WORKS_STATUS[w.status] || w.status}] ${csvNum(w.cost)}→${csvNum(w.price)}${w.comment ? ' {' + w.comment + '}' : ''}`).join(' | '),
    payList: (t.payments || []).map(p =>
      `${csvDateTime(p.date)}: ${csvNum(p.amount)}${p.comment ? ' (' + p.comment + ')' : ''}`).join(' | '),
    exp_parts: csvNum(partsCost(t)),
    inc_parts: csvNum(partsRevenue(t)),
    exp_works: csvNum(worksCost(t)),
    inc_works: csvNum(worksRevenue(t)),
    exp_total: csvNum(totalCost(t)),
    paid: csvNum(paidSum(t)),
    debt: csvNum(debtOf(t)),
    inc_total: csvNum(totalRevenue(t)),
    profit: csvNum(netProfit(t)),
    payStatus: paymentLabel(paySt),
    issued: t.issued ? 'ВЫДАНО' : 'НЕ ВЫДАНО',
    comment: t.comment || ''
  };
}

function buildCsv(tasks) {
  const lines = [];
  lines.push(csvRow(CSV_COLUMNS.map(c => c.title)));

  const records = tasks.map(taskToCsvRecord);
  records.forEach(r => lines.push(csvRow(CSV_COLUMNS.map(c => r[c.key]))));

  const sum = (f) => tasks.reduce((s, t) => s + f(t), 0);
  const totals = {
    number: 'ИТОГО',
    exp_parts: csvNum(sum(partsCost)),
    inc_parts: csvNum(sum(partsRevenue)),
    exp_works: csvNum(sum(worksCost)),
    inc_works: csvNum(sum(worksRevenue)),
    exp_total: csvNum(sum(totalCost)),
    paid: csvNum(sum(paidSum)),
    debt: csvNum(sum(debtOf)),
    inc_total: csvNum(sum(totalRevenue)),
    profit: csvNum(sum(netProfit))
  };
  lines.push(csvRow(CSV_COLUMNS.map(c => totals[c.key] !== undefined ? totals[c.key] : '')));

  return lines.join('\r\n');
}

function downloadFile(filename, content, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCsv() {
  const tasks = visibleTasksForUser();
  if (!tasks.length) { alert('Нет задач для выгрузки'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  downloadFile(`crm_zadachi_${stamp}.csv`, buildCsv(tasks), 'text/csv;charset=utf-8');
  state.notifications.push({
    id: uid(), taskId: null,
    message: `📤 Выгружено задач в CSV: ${tasks.length}`,
    time: new Date().toISOString(), read: false
  });
  saveState();
  renderNotifications();
}

function parseCsv(text) {
  const src = String(text).replace(/^\uFEFF/, '');
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;
  let i = 0;

  while (i < src.length) {
    const ch = src[i];
    if (inQuotes) {
      if (ch === '"') {
        if (src[i + 1] === '"') { cell += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      cell += ch; i++; continue;
    }
    if (ch === '"') { inQuotes = true; i++; continue; }
    if (ch === CSV_SEP || ch === '\t') { row.push(cell); cell = ''; i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; continue; }
    cell += ch; i++;
  }
  row.push(cell);
  rows.push(row);
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function csvParseNum(v) {
  return num(v);
}

function splitQty(chunk) {
  const m = String(chunk).match(/×\s*(\d+)/);
  if (!m) return { text: chunk, qty: 1 };
  return { text: String(chunk).replace(m[0], ' ').replace(/\s+/g, ' '), qty: Math.max(1, parseInt(m[1], 10) || 1) };
}

function parsePartsCell(text) {
  if (!text) return [];
  const statusByLabel = {};
  Object.keys(PARTS_STATUS).forEach(k => { statusByLabel[PARTS_STATUS[k]] = k; });
  return String(text).split('|').map(s => s.trim()).filter(Boolean).map(rawChunk => {
    const { text: chunk, qty } = splitQty(rawChunk);
    const withArt = chunk.match(/^(.*?)\s*\[(.+?)\]\s*\[(.*?)\]\s*([\d.,\s]*)\s*(?:→|->)\s*([\d.,\s]*)$/);
    if (withArt) {
      return {
        name: withArt[1].trim(),
        article: withArt[2].trim(),
        notes: [],
        note: '',
        link: '',
        quantity: qty,
        purchase: withArt[4].trim() ? String(csvParseNum(withArt[4])) : '',
        sale: withArt[5].trim() ? String(csvParseNum(withArt[5])) : '',
        status: statusByLabel[withArt[3].trim()] || 'notordered'
      };
    }
    const noArt = chunk.match(/^(.*?)\s*\[(.*?)\]\s*([\d.,\s]*)\s*(?:→|->)\s*([\d.,\s]*)$/);
    if (noArt) {
      return {
        name: noArt[1].trim(),
        article: '',
        notes: [],
        note: '',
        link: '',
        quantity: qty,
        purchase: noArt[3].trim() ? String(csvParseNum(noArt[3])) : '',
        sale: noArt[4].trim() ? String(csvParseNum(noArt[4])) : '',
        status: statusByLabel[noArt[2].trim()] || 'notordered'
      };
    }
    return { name: chunk, article: '', note: '', link: '', purchase: '', sale: '', status: 'notordered' };
  }).filter(p => p.name || p.article);
}

function applyPartsNotes(parts, noteCell) {
  if (!parts || !parts.length || !noteCell) return parts;
  const chunks = String(noteCell).split('|').map(s => s.trim()).filter(Boolean);
  if (!chunks.length) return parts;

  const pairs = chunks.map(c => {
    const i = c.indexOf(':');
    if (i < 0) return { key: '', value: c };
    return { key: c.slice(0, i).trim(), value: c.slice(i + 1).trim() };
  });

  if (parts.length === 1 && pairs.length === 1) {
    const v = pairs[0].value || pairs[0].key;
    parts[0].notes = v ? v.split(';').map(s => s.trim()).filter(Boolean) : [];
    parts[0].note = parts[0].notes[0] || '';
    return parts;
  }

  pairs.forEach(pr => {
    if (!pr.key) return;
    const target = parts.find(p =>
      (p.name && p.name === pr.key) ||
      (p.article && normArticle(p.article) === normArticle(pr.key))
    ) || parts.find(p => !(p.notes && p.notes.length));
    if (target) {
      target.notes = pr.value ? pr.value.split(';').map(s => s.trim()).filter(Boolean) : [];
      target.note = target.notes[0] || '';
    }
  });
  return parts;
}

function parseWorksCell(text) {
  if (!text) return [];
  const statusByLabel = {};
  Object.keys(WORKS_STATUS).forEach(k => { statusByLabel[WORKS_STATUS[k]] = k; });
  return String(text).split('|').map(s => s.trim()).filter(Boolean).map(rawChunk => {
    let chunk = String(rawChunk);
    let comment = '';
    const cm = chunk.match(/\s*\{(.*)\}\s*$/);
    if (cm) {
      comment = cm[1].trim();
      chunk = chunk.slice(0, cm.index).trim();
    }
    const withHours = chunk.match(/^(.*?)\s*\[([\d.,\s]+) ч\]\s*\[(.*?)\]\s*([\d.,\s]*)\s*(?:→|->)\s*([\d.,\s]*)$/);
    if (withHours) {
      return {
        name: withHours[1].trim(),
        hours: withHours[2].trim() ? String(csvParseNum(withHours[2])) : '',
        link: '',
        cost: withHours[4].trim() ? String(csvParseNum(withHours[4])) : '',
        price: withHours[5].trim() ? String(csvParseNum(withHours[5])) : '',
        status: statusByLabel[withHours[3].trim()] || 'notstarted',
        comment
      };
    }
    const noHours = chunk.match(/^(.*?)\s*\[(.*?)\]\s*([\d.,\s]*)\s*(?:→|->)\s*([\d.,\s]*)$/);
    if (noHours) {
      return {
        name: noHours[1].trim(),
        hours: '',
        link: '',
        cost: noHours[3].trim() ? String(csvParseNum(noHours[3])) : '',
        price: noHours[4].trim() ? String(csvParseNum(noHours[4])) : '',
        status: statusByLabel[noHours[2].trim()] || 'notstarted',
        comment
      };
    }
    return { name: chunk, hours: '', link: '', cost: '', price: '', status: 'notstarted', comment };
  }).filter(w => w.name);
}

function buildCsvHeaderMap(headerRow) {
  const map = {};
  const byTitle = {};
  CSV_COLUMNS.forEach(c => { byTitle[c.title.toLowerCase().trim()] = c.key; });
  byTitle['дата'] = 'createdAt';
  byTitle['номер'] = 'number';
  byTitle['статус'] = 'column';
  byTitle['ответственный'] = 'assignee';
  byTitle['время'] = 'scheduled';
  byTitle['оплата'] = 'payStatus';
  byTitle['прибыль'] = 'profit';

  headerRow.forEach((h, idx) => {
    const key = byTitle[String(h).toLowerCase().trim()];
    if (key && map[key] === undefined) map[key] = idx;
  });
  return map;
}

const COLUMN_BY_TITLE = {};
COLUMNS.forEach(c => { COLUMN_BY_TITLE[c.title.toLowerCase()] = c.id; });
const USER_BY_NAME = {};
Object.keys(USERS).forEach(k => { USER_BY_NAME[USERS[k].name.toLowerCase()] = k; });

function csvToTasks(rows) {
  if (!rows.length) return { tasks: [], errors: ['Файл пуст'] };
  const map = buildCsvHeaderMap(rows[0]);
  const errors = [];

  if (map.plate === undefined) {
    return { tasks: [], errors: ['Не найден столбец «Госномер» — это не файл выгрузки CRM'] };
  }

  const get = (row, key) => {
    const idx = map[key];
    if (idx === undefined) return '';
    return row[idx] === undefined ? '' : String(row[idx]).trim();
  };

  const tasks = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const plate = get(row, 'plate');
    const numCell = get(row, 'number');
    if (/^итого/i.test(numCell) || /^итого/i.test(plate)) continue;
    if (!plate) { if (row.some(c => String(c).trim())) errors.push(`Строка ${r + 1}: нет госномера — пропущена`); continue; }

    const assigneeName = get(row, 'assignee').toLowerCase();
    const columnTitle = get(row, 'column').toLowerCase();

    const t = {
      id: uid(),
      number: parseInt(numCell, 10) || null,
      column: COLUMN_BY_TITLE[columnTitle] || 'waiting',
      car: {
        plate: plate,
        model: get(row, 'model') || '—',
        year: get(row, 'year') || '',
        vin: get(row, 'vin').toUpperCase()
      },
      client: {
        name: get(row, 'client') || '—',
        phone: get(row, 'phone') || '—',
        history: []
      },
      reason: get(row, 'reason') || '—',
      comment: get(row, 'comment') || '',
      scheduledTime: null,
      assignee: USER_BY_NAME[assigneeName] || null,
      post: parseInt(get(row, 'post'), 10) || null,
      parts: applyPartsNotes(parsePartsCell(get(row, 'partsList')), get(row, 'partsNote')),
      works: parseWorksCell(get(row, 'worksList')),
      payments: [],
      log: [{ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: 'Задача импортирована из CSV' }],
      updatedAt: new Date().toISOString(),
      createdAt: new Date().toISOString(),
      issued: String(get(row, 'issued')).trim().toUpperCase().indexOf('ВЫДАНО') >= 0,
      color: null
    };

    t.scheduledTime = parseCsvDateTime(get(row, 'scheduled'));

    const created = parseCsvDateTime(get(row, 'createdAt'));
    if (created) t.createdAt = created;

    const payCell = get(row, 'payList');
    if (payCell) {
      payCell.split('|').map(s => s.trim()).filter(Boolean).forEach(chunk => {
        const m = chunk.match(/^(.*?):\s*([\d.,\s]+)(?:\s*\((.*)\))?$/);
        if (m) {
          t.payments.push({
            date: (function(){
              const pdt = parseCsvDateTime(m[1]);
              return new Date(pdt || Date.now()).toISOString();
            })(),
            amount: csvParseNum(m[2]),
            comment: (m[3] || '').trim(),
            user: USERS[state.currentUser].name
          });
        }
      });
    }

    if (!t.payments.length) {
      const paidCell = csvParseNum(get(row, 'paid'));
      if (paidCell > 0) {
        t.payments.push({
          date: new Date().toISOString(),
          amount: paidCell,
          comment: 'Импорт из CSV',
          user: USERS[state.currentUser].name
        });
      }
    }

    tasks.push(t);
  }

  return { tasks, errors };
}

  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px">
      <h2>📥 Импорт задач из CSV</h2>
      <div class="readonly-field">

      </select>
      <div class="modal-actions">

        <button class="primary" onclick="runImport()">Импортировать</button>
      </div>

function runImport() {
  const input = document.getElementById('importFile');
  const mode = document.getElementById('importMode').value;
  if (!input || !input.files || !input.files.length) { alert('Выберите файл CSV'); return; }

  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = (e) => {
    let parsed;
    try {
      parsed = csvToTasks(parseCsv(e.target.result));
    } catch(err) {
      alert('Не удалось разобрать файл: ' + err.message);
      return;
    }
    if (parsed.errors.length && !parsed.tasks.length) {
      alert(parsed.errors.join('\n'));
      return;
    }
    applyImport(parsed, mode);
  };
  reader.onerror = () => alert('Не удалось прочитать файл');
  reader.readAsText(file, 'utf-8');
}

function applyImport(parsed, mode) {
  let added = 0, updated = 0, skipped = 0;

  parsed.tasks.forEach(t => {
    if (!t.number) t.number = nextTaskNumber();

    if (mode === 'merge' && t.number) {
      const existing = state.tasks.find(x => x.number === t.number);
      if (existing) {
        existing.car = t.car;
        existing.client = Object.assign({}, existing.client, { name: t.client.name, phone: t.client.phone });
        existing.reason = t.reason;
        existing.comment = t.comment;
        existing.column = t.column;
        existing.assignee = t.assignee;
        existing.post = t.post;
        existing.scheduledTime = t.scheduledTime;
        existing.parts = t.parts;
        existing.works = t.works;
        if (t.payments.length) existing.payments = t.payments;
        existing.updatedAt = new Date().toISOString();
        existing.log.push({
          time: new Date().toISOString(),
          user: USERS[state.currentUser].name,
          text: 'Обновлено при импорте CSV'
        });
        updated++;
        return;
      }
    }

    if (t.number > (state.taskCounter || 0)) state.taskCounter = t.number;
    state.tasks.push(t);
    added++;
  });

  const msg = [
    `Импорт завершён:`,
    `• добавлено: ${added}`,
    `• обновлено: ${updated}`,
    skipped ? `• пропущено: ${skipped}` : '',
    parsed.errors.length ? '• замечания:\n   ' + parsed.errors.slice(0, 5).join('\n   ') : ''
  ].filter(Boolean).join('\n');

  state.notifications.push({
    id: uid(), taskId: null,
    message: `📥 Импорт CSV: добавлено ${added}, обновлено ${updated}`,
    time: new Date().toISOString(), read: false
  });

  saveState();
  closeModal();
  render();
  alert(msg);
}

// ============ ОБЩИЕ ============
let modalHistory = [];
let modalDepth = 0;

function pushModalHistory(reopenFn, title) {
  modalDepth++;
  modalHistory.push({ open: reopenFn, title: title || 'Назад' });
}

function modalBack() {
  const container = document.getElementById('modalContainer');
  if (modalHistory.length < 2) {
    closeModal();
    return;
  }
  const prev = modalHistory[modalHistory.length - 2];
  const reopen = prev.open;
  modalHistory.length = Math.max(0, modalHistory.length - 2);
  modalDepth = Math.max(0, modalDepth - 1);
  const last = container ? container.lastElementChild : null;
  if (last) container.removeChild(last);
  reopen();
}

function canGoBack() {
  return modalHistory.length > 0;
}

// Закрывает только текущее (верхнее) модальное окно, не трогая открытые под ним
function closeModal() {
  const container = document.getElementById('modalContainer');
  if (!container) return;
  const last = container.lastElementChild;
  if (last) container.removeChild(last);
  trimModalHistory();
}

// Закрыть вообще все окна (выход из системы и т.п.)
function closeModalAll() {
  const container = document.getElementById('modalContainer');
  if (container) container.innerHTML = '';
  modalHistory = [];
  modalDepth = 0;
}

function trimModalHistory() {
  const container = document.getElementById('modalContainer');
  const count = container ? container.children.length : 0;
  if (modalHistory.length > count) modalHistory.length = count;
  modalDepth = Math.max(0, count);
}

document.addEventListener('dblclick', e => {
  if (e.target.classList && (e.target.classList.contains('modal-overlay') || e.target.classList.contains('task-modal-overlay'))) {
    // Закрываем только то окно, по фону которого кликнули
    const container = document.getElementById('modalContainer');
    if (container && e.target.parentElement === container) {
      container.removeChild(e.target);
      trimModalHistory();
    } else {
      closeModal();
    }
  }
});

document.addEventListener('click', e => {
  if (state.notifOpen && !e.target.closest('.notification-panel') && !e.target.closest('.bell-btn')) {
    state.notifOpen = false;
    renderNotifications();
  }
});

document.getElementById('userSelect').addEventListener('change', e => {
  state.currentUser = e.target.value;
  state.notifOpen = false;
  render();
});

function renderAuthGate() {
  const gate = document.getElementById('authGate');
  const user = currentUser();
  if (!user) {
    gate.style.display = 'flex';
    const err = document.getElementById('authError');
    if (err) err.textContent = '';
    const login = document.getElementById('authLogin');
    if (login) login.focus();
    return;
  }
  gate.style.display = 'none';
}

function onLoginSubmit(ev) {
  ev.preventDefault();
  const loginEl = document.getElementById('authLogin');
  const passEl = document.getElementById('authPass');
  const errEl = document.getElementById('authError');
  const ok = login(loginEl.value, passEl.value);
  if (!ok) {
    errEl.textContent = 'Неверный логин или пароль';
    passEl.value = '';
    return;
  }
  const t = currentTenant();
  if (t) loadTenantPassword(t);
  renderAuthGate();
  loadSettings();
  loadState();
  render();
}

function logoutBtn() {
  const t = currentUser();
  const name = t ? (TENANTS[t] ? TENANTS[t].name : t) : '';
  if (!confirm('Выйти из ' + (name || 'системы') + '?')) return;
  logout();
}

// Инициализация
renderAuthGate();
const _initialUser = currentUser();
if (_initialUser) {
  loadSettings();
  loadState();
  render();
}
