          <span class="rc-text">${esc(e.text)}</span>
        </div>`).join('');
      const more = g.entries.length > 12 ? `<div class="rc-entry"><span class="rc-time">… ещё ${g.entries.length - 12} записей</span></div>` : '';
      return `
        <div class="rc-group">
          <div class="rc-group__head" onclick="document.getElementById('rcOverlay')?.remove(); openTaskView('${g.taskId}')">
            <span class="rc-group__plate">${esc(g.plate)}</span>
            <span class="rc-group__model">${title ? title + ' · ' : ''}${esc(g.model)}</span>
            <span class="rc-group__count">${g.entries.length}</span>
          </div>
          <div class="rc-group__entries">${entriesHtml}${more}</div>
        </div>`;
    }).join('');
  }

  overlay.innerHTML = `
    <div class="rc-panel" onclick="event.stopPropagation()">
      <div class="rc-header">
        <h2>📜 Последние изменения</h2>
        <button type="button" class="rc-close" title="Закрыть" onclick="document.getElementById('rcOverlay')?.remove()">×</button>
      </div>
      <div class="rc-body">${bodyHtml}</div>
      <div class="rc-footer">
        <span>Группировка по задаче · свежие сверху</span>
        <span>${groups.length} задач · ${flat.length} записей</span>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

// ============ CSV ============
function exportCsv() {
  const tasks = visibleTasksForUser();
  if (!tasks.length) { alert('Нет задач'); return; }
  const sep = ';';
  const cols = [
    ['№', 'number'], ['Госномер', 'plate'], ['Модель', 'model'], ['Клиент', 'client'],
    ['Причина', 'reason'], ['Статус', 'status'], ['Исполнитель', 'assignee'],
    ['Пост', 'post'], ['Время', 'scheduled'], ['Расходы', 'exp'], ['Доходы', 'inc'],
    ['Оплачено', 'paid'], ['Долг', 'debt'], ['Прибыль', 'profit'], ['Комментарий', 'comment']
  ];
  const lines = [cols.map(c => c[0]).join(sep)];
  tasks.forEach(t => {
    const row = [
      t.number || '', t.car.plate, t.car.model, t.client.name, t.reason,
      (COLUMNS.find(c => c.id === t.column) || {}).title || '',
      t.assignee ? USERS[t.assignee].name : '',
      t.post || '', formatTime(t.scheduledTime),
      String(Math.round(totalCost(t)*100)/100).replace('.', ','),
      String(Math.round(totalRevenue(t)*100)/100).replace('.', ','),
      String(Math.round(paidSum(t)*100)/100).replace('.', ','),
      String(Math.round(debtOf(t)*100)/100).replace('.', ','),
      String(Math.round(netProfit(t)*100)/100).replace('.', ','),
      t.comment || ''
    ].map(v => {
      const s = String(v);
      if (s.includes(sep) || s.includes('"') || /[\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    });
    lines.push(row.join(sep));
  });
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'crm_zadachi_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function openImportModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal" style="max-width:560px">
      <h2>📥 Импорт CSV</h2>
      <div class="readonly-field">Файл — выгрузка из CRM (CSV с «;»). Обязательный столбец — Госномер.</div>
      <label>Файл CSV</label><input type="file" id="importFile" accept=".csv,text/csv">
      <div class="modal-actions"><button onclick="closeModal()">Отмена</button><button class="primary" onclick="runImport()">Импортировать</button></div>
    </div>`;
  document.getElementById('modalContainer').appendChild(modal);
}
function runImport() {
  const input = document.getElementById('importFile');
  if (!input || !input.files || !input.files.length) { alert('Выберите файл'); return; }
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const text = String(e.target.result).replace(/^\uFEFF/, '');
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQ = false; }
          else cell += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === ';' || ch === '\t') { row.push(cell); cell = ''; }
          else if (ch === '\r') {}
          else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
          else cell += ch;
        }
      }
      if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
      if (rows.length < 2) { alert('Файл пуст'); return; }
      const header = rows[0].map(h => String(h).toLowerCase().trim());
      const idx = (name) => header.indexOf(name);
      const iPlate = idx('госномер'), iModel = idx('модель'), iClient = idx('клиент'), iReason = idx('причина');
      if (iPlate < 0) { alert('Нет столбца «Госномер»'); return; }
      let added = 0;
      const importedTasks = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const plate = (row[iPlate] || '').trim();
        if (!plate) continue;
        const task = {
          id: uid(), number: nextTaskNumber(), column: 'waiting',
          car: { plate, model: (row[iModel] || '—').trim(), year: '', vin: '', mileage: '' },
          client: { name: (row[iClient] || '—').trim(), phone: '—', history: [] },
          reason: (row[iReason] || '—').trim(),
          comment: '', scheduledTime: null, assignee: null, post: null,
          parts: [], works: [], payments: [],
          log: [{ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: 'Импорт CSV' }],
          updatedAt: new Date().toISOString(), createdAt: new Date().toISOString(),
          issued: false, color: null
        };
        state.tasks.push(task);
        importedTasks.push(task);
        added++;
      }
      importedTasks.forEach(t => saveState(t.id));
      saveMetaNow();
      closeModal();
      render();
      alert('Импортировано: ' + added);
    } catch (err) { alert('Ошибка импорта: ' + err.message); }
  };
  reader.readAsText(file, 'utf-8');
}

function pushModalHistory(reopenFn, title) {
  modalDepth++;
  modalHistory.push({ open: reopenFn, title: title || 'Назад' });
}
function modalBack() {
  const container = document.getElementById('modalContainer');
  if (modalHistory.length < 2) { closeModal(); return; }
  const prev = modalHistory[modalHistory.length - 2];
  const reopen = prev.open;
  modalHistory.length = Math.max(0, modalHistory.length - 2);
  modalDepth = Math.max(0, modalDepth - 1);
  if (container && container.lastElementChild) container.removeChild(container.lastElementChild);
  reopen();
}
function closeModal() {
  const container = document.getElementById('modalContainer');
  if (!container) return;
  const last = container.lastElementChild;
  if (last) container.removeChild(last);
  trimModalHistory();
}
function closeModalAll() {
  const container = document.getElementById('modalContainer');
  if (container) container.innerHTML = '';
  modalHistory = [];
  modalDepth = 0;
}
function trimModalHistory() {
  const container = document.getElementById('modalContainer');
  const count = container ? container.children.length : 0;
  if (modalHistory.length > count) modalHistory.length = count;
  modalDepth = Math.max(0, count);
}

function partsApiKey() {
  try { const v = localStorage.getItem('partsapi_key'); if (v && v.trim()) return v.trim(); } catch (_) {}
  return PARTSAPI.key;
}
function tecdocCatIdForName(partName) {
  const n = String(partName || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (!n) return null;
  if (TECDOC_CAT_MAP[n]) return TECDOC_CAT_MAP[n];
  let best = null, bestLen = 0;
  for (const [k, id] of Object.entries(TECDOC_CAT_MAP)) {
    if (n.includes(k) || k.includes(n)) { if (k.length > bestLen) { best = id; bestLen = k.length; } }
  }
  return best;
}
/**
 * getPartsbyVIN — как в документации PartsAPI:
 * https://api.partsapi.ru?method=getPartsbyVIN&key=...&vin=...&cat=PT_ID
 * Параметры: key, vin, cat (без type).
 * Ответ: массив строк вида "MITSUBISHI 1230A045"
 */
async function partsApiGetPartsByVin(vin, catId) {
  const key = partsApiKey();
  if (!key) throw new Error('Нет ключа PartsAPI');
  if (!vin || String(vin).length < 11) throw new Error('Нужен VIN');
  if (!catId) throw new Error('Не определена категория');
  const url = `${PARTSAPI.base}?method=getPartsbyVIN&key=${encodeURIComponent(key)}&vin=${encodeURIComponent(vin)}&cat=${encodeURIComponent(catId)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('PartsAPI HTTP ' + res.status);
  return await res.json();
}
/** Нормализует сырой ответ PartsAPI → чистый артикул без бренда и скобок */
function partsApiNormalizeArticle(raw) {
  if (!raw) return '';
  let s = String(raw).trim();
  // убрать скобки: [FORD 1302804] → FORD 1302804
  s = s.replace(/^\[+|\]+$/g, '').trim();
  // формат BRAND|ARTICLE|... → берём куски
  const bits = s.split(/[|/;,]+/).map(x => x.trim()).filter(Boolean);
  const isBrand = (b) => /^(OEM|OES|AFTERMARKET|ORIGINAL|FORD|TOYOTA|VW|AUDI|BMW|MERCEDES|KIA|HYUNDAI|NISSAN|HONDA|MAZDA|RENAULT|PEUGEOT|CITROEN|SKODA|OPEL|CHEVROLET|LADA|VAZ|BOSCH|MANN|MAHLE|VALEO|SACHS)$/i.test(b);
  const isArt = (b) => /^[A-Z0-9][A-Z0-9\-\.]{3,24}$/i.test(b) && !isBrand(b);

  // 1) явные куски после разделителя
  for (const b of bits) {
    // "FORD 1302804" в одном куске
    const m = b.match(/^([A-Za-z]{2,15})\s+([A-Z0-9][A-Z0-9\-\.]{3,24})$/i);
    if (m && isArt(m[2])) return m[2].toUpperCase();
    if (isArt(b)) return b.toUpperCase();
  }
  // 2) из строки целиком вытащить последний токен-артикул
  const tokens = s.split(/[\s|/;,]+/).filter(Boolean);
  for (let i = tokens.length - 1; i >= 0; i--) {
    const t = tokens[i].replace(/^\[+|\]+$/g, '');
    if (isArt(t)) return t.toUpperCase();
  }
  return '';
}

function partsApiPickArticle(data) {
  if (!data) return '';
  const rows = Array.isArray(data) ? data
    : Array.isArray(data.parts) ? data.parts
    : Array.isArray(data.data) ? data.data
    : Array.isArray(data.result) ? data.result
    : (typeof data.parts === 'string' ? [data] : [data]);
  for (const row of rows) {
    if (typeof row === 'string') {
      const a = partsApiNormalizeArticle(row);
      if (a) return a;
      continue;
    }
    if (!row || typeof row !== 'object') continue;
    for (const k of ['article','ArticleNo','ART_ARTICLE_NR','oem','number','art','parts','shortname','ArticleSearchNo']) {
      if (row[k]) {
        const a = partsApiNormalizeArticle(row[k]);
        if (a && a.length >= 4) return a;
      }
    }
  }
  if (typeof data.parts === 'string') return partsApiNormalizeArticle(data.parts);
  return '';
}
/**
 * AI подбирает PT_ID категории TecDoc по названию запчасти.
 * В промпт передаётся список ~200 частых категорий.
 * Возвращает number | null.
 */
async function ntResolveCategoryAI(partName, car) {
  if (!_aiCache.key) return null;
  const name = String(partName || '').trim();
  if (!name) return null;
  if (!window._catAiCache) window._catAiCache = new Map();
  const cacheKey = name.toLowerCase();
  if (window._catAiCache.has(cacheKey)) return window._catAiCache.get(cacheKey);

  // Для выбора категории модель авто почти не нужна — категория общая (фильтр, колодки…).
  // VIN/марка не должны влиять на PT_ID.
  const list = (typeof TECDOC_CATS_FOR_AI !== 'undefined' ? TECDOC_CATS_FOR_AI : [])
    .map(c => c.id + ':' + c.name).join('\n');
  const system = `Ты каталогизатор автозапчастей TecDoc. По названию запчасти выбери ОДИН PT_ID из списка.
Ответь ТОЛЬКО JSON: {"id":число,"name":"название из списка"} или {"id":null} если ничего не подходит.
Не выдумывай id вне списка. Марка авто на выбор категории не влияет — только тип детали.`;
  const user = `Запчасть: «${name}»

Список категорий (id:название):
${list}`;
  try {
    const raw = await ntAIChat([
      { role: 'system', content: system },
      { role: 'user', content: user }
    ], { temperature: 0, max_tokens: 80 });
    const parsed = ntAiParseJSON(raw) || {};
    let id = parsed.id;
    if (id == null || id === '' || id === 'null') {
      window._catAiCache.set(cacheKey, null);
      return null;
    }
    id = parseInt(id, 10);
    if (!Number.isFinite(id) || id <= 0) {
      window._catAiCache.set(cacheKey, null);
      return null;
    }
    const known = (typeof TECDOC_CATS_FOR_AI !== 'undefined' && TECDOC_CATS_FOR_AI.some(c => c.id === id))
      || Object.values(TECDOC_CAT_MAP).includes(id);
    if (!known) {
      console.warn('AI category id not in list', id, name);
      window._catAiCache.set(cacheKey, null);
      return null;
    }
    window._catAiCache.set(cacheKey, id);
    return id;
  } catch (e) {
    console.warn('ntResolveCategoryAI', e);
    return null;
  }
}

/**
 * Выбор PT_ID: сначала AI (умнее понимает формулировки),
 * если AI недоступен / null — локальная карта ключевых слов.
 */
async function resolvePartCategory(partName, car) {
  // 1. AI выбирает категорию из списка TecDoc
  if (_aiCache && _aiCache.key) {
    try {
      const aiId = await ntResolveCategoryAI(partName, car);
      if (aiId) return aiId;
    } catch (e) {
      console.warn('AI category failed, fallback to map', e);
    }
  }
  // 2. Запасной вариант — локальная карта
  return tecdocCatIdForName(partName);
}

async function partsApiLookupArticles(parts, car) {
  const map = new Map();
  const vin = (car && car.vin) ? String(car.vin).trim().toUpperCase() : '';
  if (!vin || vin.length < 11) return map;
  const need = (parts || []).filter(p => String(p.name || '').trim() && !ntExtractArticle(p));
  for (const p of need) {
    const name = String(p.name || '').trim();
    let cat = null;
    try { cat = await resolvePartCategory(name, car); } catch (_) {}
    if (!cat) {
      console.warn('Нет категории для', name);
      continue;
    }
    try {
      const data = await partsApiGetPartsByVin(vin, cat);
      const art = partsApiPickArticle(data);
      if (art) map.set(name.toLowerCase(), art);
      else console.warn('PartsAPI пусто для', name, 'cat=' + cat);
    } catch (e) {
      console.warn('PartsAPI', name, 'cat=' + cat, e.message);
    }
  }
  return map;
}

  _aiCache.visionModel = vm;
  try { if (pk) localStorage.setItem('partsapi_key', pk); } catch (_) {}
  const ref = aiSettingsRef();
  if (!ref) return;
  ref.set({ key, textModel: tm, visionModel: vm, partsApiKey: pk || PARTSAPI.key }).catch(err => {
    console.error('AI settings save error:', err);
    ntSetAIStatus('Не удалось сохранить настройки: ' + err.message, 'err');
  });
}

function ntAiParseJSON(s) {

  throw new Error('LLM вернул не-JSON');
}

async function ntLookupArticlesInNewTask() {
  const parts = ntCollectParts();
  const missing = parts.filter(p => p.name && !p.article);
  if (!missing.length) {
    ntSetAIStatus('У всех запчастей уже есть артикул.', 'ok');
    return;
  }
  const car = ntGetCarContext(null);
  if (!car.vin || String(car.vin).length < 11) {
    ntSetAIStatus('Для точного поиска нужен VIN. Без VIN AI смотрит только на поле «модель» (может ошибиться).', 'err');
    if (!car.model) return;
  }
  const btn = document.getElementById('ntLookupArticlesBtn');
  if (btn) { btn.disabled = true; btn.textContent = '🔍 Ищу…'; }
  ntSetAIStatus(`🔍 Ищу по VIN ${car.vin ? car.vin.slice(0,8)+'…' : '—'} (модель в форме игнорируется при наличии VIN)…`, 'info');
  try {
    const filled = await ntAutoFillArticles(parts, null);
    ntRenderParts(filled.map(p => ({
      name: p.name || '',
      article: ntExtractArticle(p) || p.article || '',
      qty: p.qty || 1,
      status: p.status || 'notordered'
    })));
    const found = filled.filter(p => ntExtractArticle(p) || p.article).length;
    ntSetAIStatus(`✓ Артикулов: ${found}/${filled.length}. Проверь перед созданием задачи.`, 'ok');
  } catch (e) {
    ntSetAIStatus('Ошибка поиска: ' + e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔍 Найти артикулы'; }
  }
}

/** Кнопка «Найти артикулы» в карточке задачи */
async function ntLookupArticlesInTask(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  task.parts = task.parts || [];
  const missing = task.parts.filter(p => String(p.name || '').trim() && !String(p.article || '').trim());
  if (!missing.length) {
    alert('У всех запчастей уже есть артикул.');
    return;
  }
  if (!task.car?.model && !task.car?.vin) {
    alert('У задачи нет модели/VIN — укажи в карточке авто.');
    return;
  }
  ntSetAIStatus(`🔍 Ищу OEM для ${missing.length} запч.…`, 'info');
  try {
    const filled = await ntAutoFillArticles(task.parts, task);
    let updated = 0;
    filled.forEach((p, i) => {
      const art = ntExtractArticle(p);
      if (art && art !== String(task.parts[i].article || '')) {
        task.parts[i].article = art;
        updated++;
      }
    });
    if (updated) {
      task.updatedAt = new Date().toISOString();
      task.log = task.log || [];
      task.log.push({
        time: new Date().toISOString(),
        user: USERS[state.currentUser].name,
        text: `AI: подобрано артикулов: ${updated}`
      });
      saveState(taskId);
      closeModal();
      render();
      setTimeout(() => openTaskView(taskId), 100);
    } else {
      ntSetAIStatus('AI не нашёл уверенных OEM-номеров. Укажи артикул вручную или проверь модель/год.', 'info');
    }
  } catch (e) {
    ntSetAIStatus('Ошибка поиска: ' + e.message, 'err');
    alert('Ошибка: ' + e.message);
  }
}

// task — объект задачи или null (тогда только схема)
function ntBuildTaskContext(task) {
  const note = `

КАРТОЧКА АВТОМОБИЛЯ:

КЛИЕНТ:
- client.name      — ФИО владельца
- client.phone     — телефон

ЗАДАЧА:
- reason           — краткая причина обращения (2-4 слова): "ТО", "ремонт", "диагностика", "жалоба", "консультация", "запчасти", "другое"
- comment          — остальные детали, пожелания, свободный текст
- damageDescription— состояние авто при приёмке

ОРГАНИЗАЦИЯ:
- assignee         — key работника, один из: ${Object.keys(USERS).filter(k=>USERS[k].role==='worker').map(k=>`"${k}" (${USERS[k].name})`).join(', ')}
- post             — номер поста, число 1..4

СТАТУСЫ ЗАПЧАСТЕЙ (part.status):
- "notordered" — не заказано (по умолчанию)
- "ordered"    — заказано у поставщика
- "instock"    — есть на складе

СТАТУСЫ РАБОТ (work.status):

ПОЛЯ ЗАПЧАСТИ (part):

- cost        — себестоимость, ₽ (число или "")

- comment     — короткий комментарий

ПРАВИЛА:
1. Если параметр НЕ упомянут в новом тексте — верни null (не затирай существующее).

`;

  let taskBlock = "";
  if (task) {

// ---------- Вызовы LLM ----------
async function ntCallTextLLM(prompt) {
  if (!_aiCache.key) throw new Error('Введи API-ключ в AI-настройках.');
  const res = await fetch(NT_AI_CONFIG.baseURL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _aiCache.key },
    body: JSON.stringify({
      model: _aiCache.textModel,
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.1, max_tokens: 1500
    })
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`API ${res.status}: ${t.slice(0,300)}`); }
  const data = await res.json();
  return ntAiParseJSON(data.choices?.[0]?.message?.content || '');
}
async function ntCallVisionLLM(dataUrl) {
  if (!_aiCache.key) throw new Error('Введи API-ключ в AI-настройках.');
  const res = await fetch(NT_AI_CONFIG.baseURL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _aiCache.key },
    body: JSON.stringify({
      model: _aiCache.visionModel,
      messages: [{
        role: 'user',
        content: [
          { type: 'text', text: ntBuildPhotoPrompt() },
          { type: 'image_url', image_url: { url: dataUrl } }
        ]
      }],
      temperature: 0.1, max_tokens: 1500
    })
  });
  if (!res.ok) {
    const t = await res.text();
    let hint = '';
    try { const j = JSON.parse(t); if (j.error?.code === 'model_not_found') hint = `\n\n💡 Модель «${_aiCache.visionModel}» недоступна. Проверь в AI-настройках.`; } catch (_) {}
    throw new Error(`API ${res.status}: ${t.slice(0,300)}${hint}`);
  }
  const data = await res.json();
  return ntAiParseJSON(data.choices?.[0]?.message?.content || '');
}

// ---------- Применение данных ----------
/** Достаёт артикул из объекта запчасти AI (разные возможные ключи) */
function ntExtractArticle(p) {
  if (!p || typeof p !== 'object') return '';
  const keys = ['article', 'art', 'sku', 'oem', 'partNumber', 'part_number', 'catalog', 'code', 'артикул', 'Артикул'];
  for (const k of keys) {
    const v = p[k];
    if (v == null || !String(v).trim()) continue;
    // чистим [FORD 1302804] / FORD|1302804 → 1302804
    const cleaned = (typeof partsApiNormalizeArticle === 'function')
      ? partsApiNormalizeArticle(v)
      : String(v).trim().toUpperCase();
    if (cleaned) return cleaned;
    return String(v).trim().toUpperCase();
  }
  return '';
}

/**
 * Из сырого текста вытаскивает пары «название → артикул».
 * Паттерны: «крыло артикул 5C0481203», «арт. 8K0941003», «OEM: 12345», «[5C0481203]»
 */
function ntParseArticlesFromText(text) {
  const map = new Map(); // nameLower -> article
  if (!text) return map;
  const t = String(text);

  // 1) «название … артикул/арт./OEM/код … CODE»
  const re1 = /([а-яёa-z0-9][а-яёa-z0-9\s\-]{1,40}?)\s*(?:артикул|арт\.?|oem|код|pn|p\/n|cat\.?|номер)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-]{4,20})/gi;
  let m;
  while ((m = re1.exec(t)) !== null) {
    const name = m[1].trim().toLowerCase().replace(/\s+/g, ' ');
    const art = m[2].trim().toUpperCase();
    if (name.length >= 2 && art.length >= 5) map.set(name, art);
  }

  // 2) «CODE — название» или «название (CODE)»
  const re2 = /([а-яёa-z][а-яёa-z0-9\s\-]{1,30}?)\s*[\(\[]\s*([A-Z0-9][A-Z0-9\-]{4,20})\s*[\)\]]/gi;
  while ((m = re2.exec(t)) !== null) {
    const name = m[1].trim().toLowerCase().replace(/\s+/g, ' ');
    const art = m[2].trim().toUpperCase();
    if (name.length >= 2 && art.length >= 5 && !map.has(name)) map.set(name, art);
  }

  // 3) одиночные артикулы после слова «артикул» без названия рядом
  // (используется как fallback для единственной запчасти)
  const re3 = /(?:артикул|арт\.?|oem)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-]{4,20})/gi;
  const lone = [];
  while ((m = re3.exec(t)) !== null) lone.push(m[1].trim().toUpperCase());
  if (lone.length) map.set('__lone__', lone);

  return map;
}

/** Дополняет parts артикулами из сырого текста, если AI их не вернул */
function ntEnrichPartsWithArticles(parts, rawText) {
  if (!Array.isArray(parts) || !parts.length || !rawText) return parts;
  const map = ntParseArticlesFromText(rawText);
  const loneList = map.get('__lone__') || [];
  map.delete('__lone__');
  let loneIdx = 0;

  return parts.map(p => {
    const existing = ntExtractArticle(p);
    if (existing) return { ...p, article: existing };

    const name = String(p.name || '').trim().toLowerCase();
    // точное совпадение
    if (map.has(name)) return { ...p, article: map.get(name) };
    // частичное: ключ содержится в имени или наоборот
    for (const [k, art] of map.entries()) {
      if (name.includes(k) || k.includes(name)) return { ...p, article: art };
    }
    // fallback — одиночные артикулы по порядку
    if (loneIdx < loneList.length) {
      const art = loneList[loneIdx++];
      return { ...p, article: art };
    }
    return p;
  });
}

/** Собирает данные авто из формы новой задачи или из объекта task */

/**
 * Расшифровка VIN через PartsAPI (марка/модель по факту кузова).
 * Кэшируется. При ошибке — null.
 */
async function partsApiVinDecode(vin) {
  const v = String(vin || '').trim().toUpperCase();
  if (v.length < 11) return null;
  if (!window._vinDecodeCache) window._vinDecodeCache = new Map();
  if (window._vinDecodeCache.has(v)) return window._vinDecodeCache.get(v);
  try {
    const key = partsApiKey();
    const url = `${PARTSAPI.base}?method=VINdecode&key=${encodeURIComponent(key)}&vin=${encodeURIComponent(v)}&lang=ru`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    // разные форматы ответа
    const make = data.make || data.Make || data.brand || data.Brand || data.marka || data.manufacturer || '';
    const model = data.model || data.Model || data.modelName || data.name || '';
    const year = data.year || data.Year || data.modelYear || data.modelyear || '';
    const decoded = {
      make: String(make || '').trim(),
      model: String(model || '').trim(),
      year: String(year || '').trim(),
      raw: data
    };
    // иногда всё в одной строке
    if (!decoded.make && !decoded.model && typeof data === 'object') {
      const s = JSON.stringify(data);
      decoded.note = s.slice(0, 200);
    }
    window._vinDecodeCache.set(v, decoded);
    return decoded;
  } catch (e) {
    console.warn('VINdecode', e.message);
    window._vinDecodeCache.set(v, null);
    return null;
  }
}

/**
 * Контекст авто для подбора артикулов.
 * VIN — главный источник истины. Модель из формы только если VIN нет.
 */
async function ntGetArticleCarContext(carOrTask) {
  const car = ntGetCarContext(carOrTask && carOrTask.car ? carOrTask : carOrTask);
  const vin = String(car.vin || '').trim().toUpperCase();
  let decoded = null;
  if (vin.length >= 11) {
    decoded = await partsApiVinDecode(vin);
  }
  // строка для промптов AI
  let carLine;
  if (vin.length >= 11) {
    const fromVin = [decoded && decoded.make, decoded && decoded.model, decoded && decoded.year]
      .filter(Boolean).join(' ');
    carLine = `VIN: ${vin}` +
      (fromVin ? ` (по VIN: ${fromVin})` : '') +
      (car.model ? `. Поле «модель» в форме: «${car.model}» — ИГНОРИРУЙ, если противоречит VIN` : '');
  } else {
    carLine = [
      car.model && `марка/модель: ${car.model}`,
      car.year && `год: ${car.year}`
    ].filter(Boolean).join(', ') || 'авто неизвестно';
  }
  return { ...car, vin, decoded, carLine, vinPrimary: vin.length >= 11 };
}

/**
 * AI-поиск OEM-артикулов по названию запчасти + авто.
 * Возвращает Map: nameLower → article
 * Если есть VIN — артикулы должны соответствовать VIN, не полю «модель».
 */
async function ntLookupArticlesAI(parts, car) {
  const need = (parts || []).filter(p => {
    const name = String(p.name || '').trim();
    return name && !ntExtractArticle(p);
  });
  if (!need.length) return new Map();
  if (!_aiCache.key) throw new Error('Нужен API-ключ AI для поиска артикулов.');

  const ctx = car && car.carLine ? car : await ntGetArticleCarContext(car);
  const carLine = ctx.carLine || 'авто неизвестно';
  const list = need.map((p, i) => `${i + 1}. ${p.name}`).join('\n');

  const prompt = `Ты — каталогизатор OEM-запчастей автосервиса. Подбери ОРИГИНАЛЬНЫЕ (OEM) артикулы.

Автомобиль: ${carLine}

КРИТИЧЕСКИ ВАЖНО:
- Если указан VIN — подбирай артикулы СТРОГО под этот VIN (марка/модель из VIN).
- Поле «модель» в карточке может быть ошибочным — при наличии VIN оно НЕ источник истины.
- Не подбирай запчасти от другой марки.

Запчасти без артикула:
${list}

Верни СТРОГО JSON без markdown:
{
  "items": [
    {"name": "точное название из списка", "article": "OEM-номер", "confidence": "high|medium|low", "note": "кратко почему"}
  ]
}

Правила:
1. article — только реальный OEM/каталожный номер производителя авто (не aftermarket вроде Bosch/Mann, если не уверен).
2. Формат номера как у марки по VIN.
3. Если для позиции НЕТ уверенного OEM — article: "" и confidence: "low".
4. Не выдумывай «красивые» номера. Лучше пусто, чем неверный артикул.
5. Учитывай сторону (левый/правый), если она в названии.
6. name в ответе должен совпадать с названием из списка.
7. Верни элемент для КАЖДОЙ позиции из списка.`;

  const data = await ntCallTextLLM(prompt);
  const map = new Map();
  const items = Array.isArray(data.items) ? data.items : (Array.isArray(data.parts) ? data.parts : []);
  items.forEach(it => {
    const name = String(it.name || '').trim().toLowerCase();
    const art = ntExtractArticle(it);
    const conf = String(it.confidence || '').toLowerCase();
    if (!name || !art) return;
    if (conf === 'low' && art.length < 6) return;
    map.set(name, art);
  });
  return map;
}

/** Проставляет найденные артикулы в массив parts (мутирует/возвращает новый) */
function ntApplyArticleMap(parts, artMap) {
  if (!artMap || !artMap.size) return parts;
  return (parts || []).map(p => {
    if (ntExtractArticle(p)) return p;
    const name = String(p.name || '').trim().toLowerCase();
    if (artMap.has(name)) return { ...p, article: artMap.get(name) };
    for (const [k, art] of artMap.entries()) {
      if (name.includes(k) || k.includes(name)) return { ...p, article: art };
    }
    return p;
  });
}

/**
 * Главная функция: для parts без артикула —
 * 1) PartsAPI getPartsbyVIN (если есть VIN + категория)
 * 2) fallback — AI-подсказка по марке/модели
 */
async function ntAutoFillArticles(parts, carOrTask) {
  const list = Array.isArray(parts) ? parts : [];
  const missing = list.filter(p => String(p.name || '').trim() && !ntExtractArticle(p));
  if (!missing.length) return list;
  const ctx = await ntGetArticleCarContext(carOrTask && carOrTask.car ? carOrTask : carOrTask);
  if (!ctx.model && !ctx.vin) return list;

  let artMap = new Map();
  // 1. PartsAPI — ТОЛЬКО по VIN (модель из формы не используется)
  if (ctx.vinPrimary) {
    try {
      artMap = await partsApiLookupArticles(list, ctx);
    } catch (e) {
      console.warn('PartsAPI lookup:', e);
    }
  }
  // 2. AI-fallback: тоже с приоритетом VIN
  const stillMissing = list.filter(p => {
    const name = String(p.name || '').trim().toLowerCase();
    return name && !ntExtractArticle(p) && !artMap.has(name);
  });
  if (stillMissing.length && _aiCache.key) {
    try {
      const aiMap = await ntLookupArticlesAI(stillMissing, ctx);
      aiMap.forEach((v, k) => { if (!artMap.has(k)) artMap.set(k, v); });
    } catch (e) {
      console.warn('AI article fallback:', e);
    }
  }
  return ntApplyArticleMap(list, artMap);
}

function ntApplyAIData(data) {
  const set = (id, val) => {
    const el = document.getElementById(id);
    if (!el) return false;
    const s = (val ?? '').toString().trim();
    if (!s) return false;
    el.value = s;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    return true;
  };
  let filled = 0;
  if (set('nPlate', data.plate)) filled++;
  if (set('nModel', data.model)) filled++;
  if (set('nYear', data.year)) filled++;
  if (set('nMileage', data.mileage)) filled++;
  if (data.vin) {
    const v = String(data.vin).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IOQ]/g,'');
    if (v) { set('nVin', v); filled++; }
  }
  if (set('nClientName', data.clientName)) filled++;
  if (set('nClientPhone', data.clientPhone)) filled++;
  if (set('nReason', data.reason)) filled++;
  if (set('nComment', data.comment)) filled++;
  if (set('nDamage', data.damage)) filled++;

  if (Array.isArray(data.parts) && data.parts.length) {
    const raw = data.__rawText || data.raw_text || data.comment || '';
    let enriched = ntEnrichPartsWithArticles(data.parts, raw);
    // Асинхронный автопоиск OEM помечаем флагом — вызывающая сторона дождётся через ntApplyAIDataAsync
    data.__partsEnriched = enriched;
    ntRenderParts(enriched.map(p => ({
      name: p.name || '',
      article: ntExtractArticle(p),
      qty: parseInt(p.qty, 10) || 1,
      status: p.status || 'notordered'
    })));
    filled++;
  }
  if (Array.isArray(data.works) && data.works.length) {
    ntRenderWorks(data.works.map(w => ({ name: w.name||'', qty: parseInt(w.qty,10)||1, status: w.status||'notstarted' })));
    filled++;
  }
  return filled;
}

/** Как ntApplyAIData, но после этого ищет OEM-артикулы для позиций без артикула */
async function ntApplyAIDataWithArticleLookup(data) {
  const filled = ntApplyAIData(data);
  let parts = data.__partsEnriched || (Array.isArray(data.parts) ? data.parts : []);
  const missing = parts.filter(p => String(p.name || '').trim() && !ntExtractArticle(p));
  if (missing.length && _aiCache.key) {
    ntSetAIStatus(`🔍 Ищу артикулы для ${missing.length} запч. по авто…`, 'info');
    parts = await ntAutoFillArticles(parts, null);
    ntRenderParts(parts.map(p => ({
      name: p.name || '',
      article: ntExtractArticle(p),
      qty: parseInt(p.qty, 10) || 1,
      status: p.status || 'notordered'
    })));
    const found = parts.filter(p => ntExtractArticle(p)).length;
    ntSetAIStatus(`✓ Полей: ${filled}. Артикулов найдено: ${found}/${parts.length}.`, 'ok');
  }
  return filled;
}

async function ntHandleVoiceResult(text) {

}

function openNotePrompt(taskId) {
  const existing = document.getElementById('notePromptOverlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'notePromptOverlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:480px">
      <div class="modal-titlebar">
        <h2>📝 Заметка / промпт</h2>
        <div class="modal-title-actions"><button class="close-x" onclick="document.getElementById('notePromptOverlay')?.remove()">×</button></div>
      </div>
      <p style="font-size:12px;color:#a6adc8;margin:0 0 8px">Введи текст — AI разберёт его как голосовой ввод${taskId ? ' и обновит задачу' : ' и заполнит форму новой задачи'}.</p>
      <textarea id="notePromptText" placeholder="Например: Toyota Camry 2019 А123ВС777, клиент Иванов, замена масла артикул 5W30, фара левая 81210-0D040…" style="min-height:120px;width:100%"></textarea>
      <div class="modal-actions">
        <button onclick="document.getElementById('notePromptOverlay')?.remove()">Отмена</button>
        <button class="primary" id="notePromptSubmit">Обработать</button>
      </div>
      <div class="nt-ai-status" id="notePromptStatus"></div>
    </div>`;
  document.getElementById('modalContainer').appendChild(overlay);
  const ta = document.getElementById('notePromptText');
  ta.focus();
  document.getElementById('notePromptSubmit').addEventListener('click', async () => {
    const text = (ta.value || '').trim();
    if (text.length < 3) {
      const st = document.getElementById('notePromptStatus');
      if (st) { st.textContent = 'Введи хотя бы несколько слов.'; st.className = 'nt-ai-status visible err'; }
      return;
    }
    const btn = document.getElementById('notePromptSubmit');
    if (btn) { btn.disabled = true; btn.textContent = '…'; }
    try {
      if (taskId) {
        await ntHandleEditAIData(taskId, text);
        document.getElementById('notePromptOverlay')?.remove();
        openTaskView(taskId);
      } else {
        await ntHandleVoiceResult(text);
        document.getElementById('notePromptOverlay')?.remove();
      }
    } catch (e) {
      const st = document.getElementById('notePromptStatus');
      if (st) { st.textContent = 'Ошибка: ' + e.message; st.className = 'nt-ai-status visible err'; }
      if (btn) { btn.disabled = false; btn.textContent = 'Обработать'; }
    }
  });
}

function ntPickPhoto() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.style.display = 'none';
  inp.addEventListener('change', () => {
    const file = inp.files && inp.files[0];
    if (file) ntHandlePhotoFile(file);
    inp.remove();
  });

}
function ntPickFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,.txt,.csv,.pdf,.doc,.docx';
  inp.style.display = 'none';
  inp.addEventListener('change', () => {
    const file = inp.files && inp.files[0];
    if (!file) { inp.remove(); return; }
    if (file.type.startsWith('image/')) {
      ntHandlePhotoFile(file);
    } else {
      // Текстовый файл — читаем как заметку / AI-текст
      const reader = new FileReader();
      reader.onload = async (e) => {
        const text = String(e.target.result || '').slice(0, 8000);
        if (!text.trim()) { ntSetAIStatus('Файл пустой.', 'err'); return; }
        ntSetAIStatus('📎 Файл прочитан. Обрабатываю как текст…', 'info');
        try {
          if (typeof ntHandleVoiceResult === 'function') {
            await ntHandleVoiceResult(text);
          } else {
            throw new Error('нет обработчика текста');
          }
        } catch (err) {
          // fallback — положить в комментарий/заметку
          const commentEl = document.getElementById('nComment');
          if (commentEl) {
            commentEl.value = (commentEl.value ? commentEl.value + '\n' : '') + '[файл: ' + file.name + ']\n' + text.slice(0, 2000);
            ntSetAIStatus('📎 Содержимое файла добавлено в комментарий.', 'ok');
          } else {
            ntSetAIStatus('Не удалось обработать файл: ' + err.message, 'err');
          }
        }
      };
      reader.onerror = () => ntSetAIStatus('Не удалось прочитать файл.', 'err');
      reader.readAsText(file, 'utf-8');
    }
    inp.remove();
  });
  document.body.appendChild(inp);
  inp.click();
}
/** Обработка файла как заметки в существующей задаче */
function ntHandleFileAsNote(taskId, file) {
  return new Promise(resolve => {
    if (!file) { resolve(); return; }
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) { resolve(); return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        let text = '';
        if (file.type.startsWith('image/')) {
          // не должно сюда попадать, но на всякий
          text = '[изображение: ' + file.name + ']';
        } else {
          text = String(reader.result || '').slice(0, 4000);
        }
        const noteLine = `[файл: ${file.name}] ${text.slice(0, 500)}${text.length > 500 ? '…' : ''}`;
        task.comment = (task.comment ? task.comment + '\n' : '') + noteLine;
        task.log = task.log || [];
        task.log.push({
          time: new Date().toISOString(),
          user: USERS[state.currentUser].name,
          text: `📎 Добавлен файл «${file.name}» как заметка`
        });
        task.updatedAt = new Date().toISOString();
        saveState(taskId);
        ntSetAIStatus('📎 Файл добавлен как заметка в задачу.', 'ok');
        openTaskView(taskId);
      } catch (e) {
        ntSetAIStatus('Ошибка: ' + e.message, 'err');
      } finally {
        resolve();
      }
    };
    reader.onerror = () => { ntSetAIStatus('Не удалось прочитать файл.', 'err'); resolve(); };
    if (file.type.startsWith('text/') || /\.(txt|csv|log)$/i.test(file.name)) {
      reader.readAsText(file, 'utf-8');
    } else {
      // Для pdf/doc — просто фиксируем имя
      task.comment = (task.comment ? task.comment + '\n' : '') + `[файл: ${file.name}]`;
      task.log = task.log || [];
      task.log.push({ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: `📎 Добавлен файл «${file.name}»` });
      task.updatedAt = new Date().toISOString();
      saveState(taskId);
      ntSetAIStatus('📎 Файл «' + file.name + '» добавлен (бинарный — только имя).', 'ok');
      openTaskView(taskId);
      resolve();
    }
  });
}
function ntHandlePhotoFile(file) {
  const btn = document.getElementById('ntPhotoBtn');
  return new Promise(resolve => {
    if (!file) { resolve(); return; }
    if (!file.type.startsWith('image/')) { ntSetAIStatus('Это не картинка.', 'err'); resolve(); return; }
    if (file.size > NT_AI_CONFIG.maxImageMB * 1024 * 1024) {
      ntSetAIStatus(`Файл больше ${NT_AI_CONFIG.maxImageMB} МБ — сожми.`, 'err'); resolve(); return;
    }
    const reader = new FileReader();
    reader.onload = async (e) => {
      if (btn) btn.classList.add('busy');
      ntSetAIStatus(`🤖 Распознаю фото (${_aiCache.visionModel})…`, 'info');
      try {
        const data = await ntCallVisionLLM(e.target.result);
        data.__rawText = data.raw_text || data.comment || '';
        await ntApplyAIDataWithArticleLookup(data);
        ntSetAIStatus('✓ Распознано. Можно сканировать ещё.', 'ok');
      } catch (err) {
        ntSetAIStatus('Ошибка распознавания: ' + err.message, 'err');
      } finally {
        if (btn) btn.classList.remove('busy');
        resolve();
      }
    };
    reader.onerror = () => { ntSetAIStatus('Не удалось прочитать файл.', 'err'); resolve(); };
    reader.readAsDataURL(file);
  });
}

function ntParseAssignee(text) {
  if (!text) return null;
  const s = String(text).toLowerCase().replace(/ё/g, 'е');
  const map = { 'слесар':'locksmith', 'электрик':'electric', 'моторист':'motorist' };
  for (const [frag, key] of Object.entries(map)) if (s.includes(frag)) return key;
  return null;
}

function ntParseTimeText(text) {
  if (!text) return null;
  const s = String(text).toLowerCase().replace(/ё/g, 'е');
  let hh = null, mm = 0;
  let m = s.match(/(\d{1,2})\s*[:.\-]\s*(\d{1,2})/);
  if (m) { hh = parseInt(m[1], 10); mm = parseInt(m[2], 10); }
  else { m = s.match(/в\s+(\d{1,2})(?:\s*час|$)/); if (m) { hh = parseInt(m[1], 10); mm = 0; } }
  if (hh === null || isNaN(hh) || hh < 0 || hh > 23) return null;
  if (mm < 0 || mm > 59) mm = 0;
  const now = new Date();
  let day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (/\bчерез\s+час/.test(s)) { const d = new Date(); d.setMinutes(d.getMinutes() + 60); day = new Date(d.getFullYear(), d.getMonth(), d.getDate()); hh = d.getHours(); mm = d.getMinutes(); }
  else if (/\bзавтра\b/.test(s)) day.setDate(day.getDate() + 1);
  else if (/\bпослезавтра\b/.test(s)) day.setDate(day.getDate() + 2);
  else {
    const wd = { 'понедельник':1, 'вторник':2, 'среду':3, 'среда':3, 'четверг':4, 'пятницу':5, 'пятница':5, 'субботу':6, 'суббота':6, 'воскресенье':0, 'воскресение':0 };
    for (const [name, w] of Object.entries(wd)) if (s.includes(name)) { const cur = day.getDay(); const diff = (w - cur + 7) % 7 || 7; day.setDate(day.getDate() + diff); break; }
  }
  const result = new Date(day.getFullYear(), day.getMonth(), day.getDate(), hh, mm, 0, 0);
  const totalMin = result.getHours() * 60 + result.getMinutes();
  const snapped = Math.round(totalMin / 30) * 30;
  const clamped = Math.min(Math.max(snapped, SLOT_START_HOUR*60), SLOT_END_HOUR*60);
  result.setHours(Math.floor(clamped / 60), clamped % 60, 0, 0);
  return result.toISOString();
}

  let filled = 0;

  if (set('e_year', data.year)) filled++;
  if (set('e_mileage', data.mileage)) filled++;
  if (data.vin) { const v = String(data.vin).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IOQ]/g,''); if (v) { set('e_vin', v); filled++; } }
  if (set('e_clientName', data.clientName)) filled++;

function ntMergeIntoTask(taskId, data) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return { partsAdded: 0, partsUpdated: 0, worksAdded: 0, worksUpdated: 0 };
  let partsAdded = 0, partsUpdated = 0, worksAdded = 0, worksUpdated = 0;
  if (Array.isArray(data.parts) && data.parts.length) {
    task.parts = task.parts || [];
    const byName = new Map();
    task.parts.forEach((p, i) => byName.set(String(p.name || '').trim().toLowerCase(), i));
    // Дополняем артикулы из сырого текста, если AI их пропустил
    const raw = data.__rawText || data.raw_text || '';
    const enrichedParts = ntEnrichPartsWithArticles(data.parts, raw);
    enrichedParts.forEach(p => {
      const name = String(p.name || '').trim(); if (!name) return;
      const key = name.toLowerCase(); const idx = byName.get(key);
      const art = ntExtractArticle(p);
      if (idx !== undefined) {
        const cur = task.parts[idx]; let ch = false;
        if (p.qty != null) { const q = Math.max(1, parseInt(p.qty,10)||1); if (q !== cur.quantity) { cur.quantity = q; ch = true; } }
        if (p.status && ['notordered','ordered','instock'].includes(p.status) && p.status !== cur.status) { cur.status = p.status; ch = true; }
        if (p.purchase != null && String(p.purchase) !== String(cur.purchase)) { cur.purchase = p.purchase; ch = true; }
        if (p.sale != null && String(p.sale) !== String(cur.sale)) { cur.sale = p.sale; ch = true; }
        if (art && art !== String(cur.article || '')) { cur.article = art; ch = true; }
        if (ch) partsUpdated++;
      } else {
        task.parts.push({ name, article: art, quantity: Math.max(1, parseInt(p.qty,10)||1), purchase: p.purchase != null ? p.purchase : '', sale: p.sale != null ? p.sale : '', status: ['ordered','instock'].includes(p.status) ? p.status : 'notordered', notes: [], note: '', link: '' });
        byName.set(key, task.parts.length - 1); partsAdded++;
      }
    });
  }
  if (Array.isArray(data.works) && data.works.length) {
    task.works = task.works || [];
    const byName = new Map();
    task.works.forEach((w, i) => byName.set(String(w.name || '').trim().toLowerCase(), i));
    data.works.forEach(w => {
      const name = String(w.name || '').trim(); if (!name) return;
      const key = name.toLowerCase(); const idx = byName.get(key);
      if (idx !== undefined) {
        const cur = task.works[idx]; let ch = false;
        if (w.hours != null && String(w.hours) !== String(cur.hours)) { cur.hours = w.hours; ch = true; }
        if (w.cost != null && String(w.cost) !== String(cur.cost)) { cur.cost = w.cost; ch = true; }
        if (w.price != null && String(w.price) !== String(cur.price)) { cur.price = w.price; ch = true; }
        if (w.status && ['notstarted','inwork','finished'].includes(w.status) && w.status !== cur.status) { cur.status = w.status; ch = true; }
        if (ch) worksUpdated++;
      } else {
        task.works.push({ name, hours: w.hours || '', cost: w.cost || '', price: w.price || '', status: ['inwork','finished'].includes(w.status) ? w.status : 'notstarted', assignee: '', comment: '', link: '' });
        byName.set(key, task.works.length - 1); worksAdded++;
      }
    });
  }
  const total = partsAdded + partsUpdated + worksAdded + worksUpdated;
  if (total) {
    task.updatedAt = new Date().toISOString();
    task.log = task.log || [];
    const artCount = (task.parts || []).filter(p => p.article && String(p.article).trim()).length;
    task.log.push({ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: `AI: запчасти +${partsAdded}/~${partsUpdated} (артикулов: ${artCount}), работы +${worksAdded}/~${worksUpdated}` });
    saveState(taskId);
  }
  return { partsAdded, partsUpdated, worksAdded, worksUpdated };
}

/** Merge + автопоиск OEM для запчастей без артикула */
async function ntMergeIntoTaskWithArticleLookup(taskId, data) {
  const result = ntMergeIntoTask(taskId, data);
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.parts || !task.parts.length) return result;
  const missing = task.parts.filter(p => String(p.name || '').trim() && !String(p.article || '').trim());
  if (!missing.length || !_aiCache.key) return result;
  try {
    ntSetAIStatus(`🔍 Ищу артикулы для ${missing.length} запч. (${task.car?.model || 'авто'})…`, 'info');
    const filled = await ntAutoFillArticles(task.parts, task);
    let updated = 0;
    filled.forEach((p, i) => {
      const art = ntExtractArticle(p);
      if (art && art !== String(task.parts[i].article || '')) {
        task.parts[i].article = art;
        updated++;
      }
    });
    if (updated) {
      task.updatedAt = new Date().toISOString();
      task.log = task.log || [];
      task.log.push({
        time: new Date().toISOString(),
        user: USERS[state.currentUser].name,
        text: `AI: подобрано артикулов: ${updated}`
      });
      saveState(taskId);
      result.partsUpdated = (result.partsUpdated || 0) + updated;
    }
  } catch (e) {
    console.warn('article lookup after merge:', e);
  }
  return result;
}

function ntMaybeApplyPayment(taskId, data) {
  if (!data.payment || !data.payment.amount) return false;
  const amount = Number(data.payment.amount);
  if (!isFinite(amount) || amount <= 0) return false;
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return false;
  const method = data.payment.method || 'Наличные';
  if (!confirm(`Записать оплату ${amount.toLocaleString('ru-RU')} ₽ (${method})?`)) return false;
  task.payments = task.payments || [];
  task.payments.push({ date: new Date().toISOString(), amount, method, comment: data.payment.comment || 'AI-ввод', user: USERS[state.currentUser].name });
  task.updatedAt = new Date().toISOString();
  task.log = task.log || [];
  task.log.push({ time: new Date().toISOString(), user: USERS[state.currentUser].name, text: `Оплата ${amount.toLocaleString('ru-RU')} ₽ (AI)` });
  saveState(taskId);
  return true;
}

async function ntHandleEditAIData(taskId, text) {
  if (!text || text.length < 3) return;
  const task = state.tasks.find(t => t.id === taskId); if (!task) return;
  ntSetAIStatus('🤖 Разбираю текст…', 'info');
  try {
    const data = await ntCallTextLLM(ntBuildEditTextPrompt(text, task));
    data.__rawText = text;
    if (!data.assignee) data.assignee = ntParseAssignee(text);
    if (!data.scheduledTimeText && /завтра|послезавтра|сегодня|через час|понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье/i.test(text)) data.scheduledTimeText = text;
    const filled = ntApplyEditAIData(data);
    const merged = await ntMergeIntoTaskWithArticleLookup(taskId, data);
    const paid = ntMaybeApplyPayment(taskId, data);
    const info = [];
    if (merged.partsAdded) info.push(`+${merged.partsAdded} запч.`);
    if (merged.partsUpdated) info.push(`~${merged.partsUpdated} запч.`);
    if (merged.worksAdded) info.push(`+${merged.worksAdded} раб.`);
    if (merged.worksUpdated) info.push(`~${merged.worksUpdated} раб.`);
    if (paid) info.push('+оплата');
    const suffix = info.length ? ` · ${info.join(', ')}` : '';
    ntSetAIStatus(`✓ Заполнено полей: ${filled}${suffix}. Нажми «Сохранить».`, 'ok');
  } catch (e) { ntSetAIStatus('Ошибка разбора: ' + e.message, 'err'); }
}

function ntHandleEditPhoto(taskId, file) {
  return new Promise(resolve => {
    if (!file) { resolve(); return; }
    if (!file.type.startsWith('image/')) { ntSetAIStatus('Это не картинка.', 'err'); resolve(); return; }
    if (file.size > NT_AI_CONFIG.maxImageMB * 1024 * 1024) { ntSetAIStatus(`Файл больше ${NT_AI_CONFIG.maxImageMB} МБ.`, 'err'); resolve(); return; }
    const reader = new FileReader();
    reader.onload = async (e) => {
      ntSetAIStatus(`🤖 Распознаю фото (${_aiCache.visionModel})…`, 'info');
      try {
        const task = state.tasks.find(t => t.id === taskId);
        const prompt = ntBuildEditPhotoPrompt('', task);
        const res = await fetch(NT_AI_CONFIG.baseURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _aiCache.key },
          body: JSON.stringify({ model: _aiCache.visionModel, messages: [{ role: 'user', content: [ { type: 'text', text: prompt }, { type: 'image_url', image_url: { url: e.target.result } } ] }], temperature: 0.1, max_tokens: 2000 })
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const jres = await res.json();
        const data = ntAiParseJSON(jres.choices?.[0]?.message?.content || '');
        data.__rawText = data.raw_text || '';
        const filled = ntApplyEditAIData(data);
        const merged = await ntMergeIntoTaskWithArticleLookup(taskId, data);
        const paid = ntMaybeApplyPayment(taskId, data);
        const info = [];
        if (merged.partsAdded) info.push(`+${merged.partsAdded} запч.`);
        if (merged.partsUpdated) info.push(`~${merged.partsUpdated} запч.`);
        if (merged.worksAdded) info.push(`+${merged.worksAdded} раб.`);
        if (merged.worksUpdated) info.push(`~${merged.worksUpdated} раб.`);
        if (paid) info.push('+оплата');
        const suffix = info.length ? ` · ${info.join(', ')}` : '';
        ntSetAIStatus(`✓ Распознано. Заполнено полей: ${filled}${suffix}. Нажми «Сохранить».`, 'ok');
      } catch (err) { ntSetAIStatus('Ошибка распознавания: ' + err.message, 'err'); }
      finally { resolve(); }
    };
    reader.onerror = () => { ntSetAIStatus('Не удалось прочитать файл.', 'err'); resolve(); };
    reader.readAsDataURL(file);
  });
}

// ---------- Микрофон (общий) ----------
function ntSetupMic(btn, { onResult, onStart, onError } = {}) {
  if (!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    btn.title = 'Голосовой ввод не поддерживается в этом браузере';
    btn.style.opacity = '0.45';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ntSetAIStatus('🎤 Web Speech API не поддерживается. Используй Chrome или Edge (или загрузи файл 📎 / фото 📷).', 'err');
    });
    return;
  }
  // Доп. проверка: в некоторых браузерах объект есть, но start() падает
  try {
    const test = new SR();
    if (!test || typeof test.start !== 'function') throw new Error('no start');
  } catch (_) {
    btn.title = 'Голосовой ввод недоступен';
    btn.style.opacity = '0.45';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      ntSetAIStatus('🎤 Распознавание речи недоступно в этом браузере. Используй 📎 или 📷.', 'err');
    });
    return;
  }
  let rec = null, state = 'idle', collected = '';
  const origTitle = btn.title || 'Голосовой ввод';
  const origText = btn.textContent || '🎤';

  function setUI(mode) {
    btn.classList.toggle('recording', mode === 'recording');
    btn.classList.toggle('busy', mode === 'processing');
    if (mode === 'recording') { btn.title = 'Остановить запись'; btn.textContent = '⏹'; }
    else if (mode === 'processing') { btn.title = 'Распознавание…'; btn.textContent = '⏳'; }
    else { btn.title = origTitle; btn.textContent = origText; }
  }

  async function start() {
    collected = '';
    rec = new SR();
    rec.lang = 'ru-RU'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onstart = () => {
      state = 'recording'; setUI('recording');
      if (onStart) onStart();
      else ntSetAIStatus('🎤 Слушаю… нажми ⏹, чтобы остановить.', 'info');
    };
    rec.onresult = (e) => {
      let interim = '', fin = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
      }
      if (fin) collected += (collected ? ' ' : '') + fin.trim();
      const preview = (collected + ' ' + interim).trim();
      if (preview && !onStart) ntSetAIStatus('🎤 ' + preview.slice(0,120) + (preview.length>120?'…':''), 'info');
    };
    rec.onerror = (e) => {
      if (onError) onError(e);
      else {
        if (e.error === 'not-allowed') ntSetAIStatus('Доступ к микрофону запрещён.', 'err');
        else if (e.error !== 'aborted' && e.error !== 'no-speech') ntSetAIStatus('Ошибка записи: ' + e.error, 'err');
      }
      if (state === 'recording') { state = 'idle'; setUI('idle'); }
    };
    rec.onend = () => { if (state === 'recording') finalize(); };
    try { rec.start(); }
    catch (err) { state = 'idle'; setUI('idle'); ntSetAIStatus('Не удалось запустить микрофон: ' + err.message, 'err'); }
  }

  function finalize() {
    state = 'processing'; setUI('processing');
    const text = collected.trim();
    if (!text || text.length < 3) {
      state = 'idle'; setUI('idle');
      ntSetAIStatus('Ничего не распознано — попробуй ещё раз.', 'err');
      return;
    }
    Promise.resolve(onResult(text)).finally(() => { state = 'idle'; setUI('idle'); });
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (state === 'processing') return;
    if (state === 'recording') { try { rec.stop(); } catch (_) {} }
    else start();
  });
}

  let changed = 0;
  if (data.plate && String(data.plate).trim() !== task.car.plate) { task.car.plate = String(data.plate).trim(); changed++; }
  if (data.model && String(data.model).trim() !== task.car.model) { task.car.model = String(data.model).trim(); changed++; }
  if (data.year && String(data.year).trim() !== String(task.car.year)) { task.car.year = String(data.year).trim(); changed++; }
  if (data.vin) {
    const v = String(data.vin).toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IOQ]/g,'');
    if (v && v !== task.car.vin) { task.car.vin = v; changed++; }
  }
  if (data.mileage && String(data.mileage).trim() !== String(task.car.mileage || '')) { task.car.mileage = String(data.mileage).trim(); changed++; }
  if (data.clientName && String(data.clientName).trim() !== task.client.name) { task.client.name = String(data.clientName).trim() || '—'; changed++; }
  if (data.clientPhone && String(data.clientPhone).trim() !== task.client.phone) { task.client.phone = String(data.clientPhone).trim() || '—'; changed++; }
  if (data.reason && String(data.reason).trim() !== task.reason) { task.reason = String(data.reason).trim() || '—'; changed++; }
  if (data.comment && String(data.comment).trim() !== (task.comment || '')) { task.comment = String(data.comment).trim(); changed++; }
  if (data.damage && String(data.damage).trim() !== (task.damageDescription || '')) { task.damageDescription = String(data.damage).trim(); changed++; }

  // Исполнитель
  const assignee = data.assignee || ntParseAssignee(data.__rawText || '');
  if (assignee && USERS[assignee] && task.assignee !== assignee) { task.assignee = assignee; changed++; }

  // Пост
  if (data.post) {
    const p = parseInt(data.post, 10);
    if (p >= 1 && p <= 4 && task.post !== p) { task.post = p; changed++; }
  }

  // Время
  const timeText = data.scheduledTimeText || data.__rawText || '';
  if (timeText) {
    const iso = ntParseTimeText(timeText);
    if (iso && task.scheduledTime !== iso) { task.scheduledTime = iso; changed++; }
  }

  return changed;
}

// Голос → редактирует ВСЁ в задаче
async function ntHandleEditRWOnly(taskId, text) {
  if (!text || text.length < 3) return;
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  ntSetAIStatus('🤖 Разбираю текст…', 'info');
  try {
    // Полный промпт для редактирования (тот же, что в openEditTask)
    const prompt = ntBuildEditTextPrompt(text, task);
    const data = await ntCallTextLLM(prompt);
    data.__rawText = text;

    if (!data.assignee) data.assignee = ntParseAssignee(text);
    if (!data.scheduledTimeText && /завтра|послезавтра|сегодня|через час|понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье/i.test(text)) {
      data.scheduledTimeText = text;
    }

    // Применяем скалярные поля прямо к task
    const fieldsChanged = ntApplyEditFormToTask(task, data);

    // Дополняем/обновляем parts/works + автопоиск артикулов
    const merged = await ntMergeIntoTaskWithArticleLookup(taskId, {
      parts: Array.isArray(data.parts) ? data.parts : [],
      works: Array.isArray(data.works) ? data.works : [],
      __rawText: text
    });

    // Оплата (с confirm)
    const paid = ntMaybeApplyPayment(taskId, data);

    if (fieldsChanged || merged.partsAdded || merged.partsUpdated || merged.worksAdded || merged.worksUpdated || paid) {
      task.updatedAt = new Date().toISOString();
      task.log = task.log || [];
      task.log.push({
        time: new Date().toISOString(),
        user: USERS[state.currentUser].name,
        text: `AI из карточки: полей ${fieldsChanged}, запчасти +${merged.partsAdded}/~${merged.partsUpdated}, работы +${merged.worksAdded}/~${merged.worksUpdated}${paid ? ', +оплата' : ''}`
      });
      saveState(taskId);
    }

    const info = [];
    if (fieldsChanged) info.push(`полей: ${fieldsChanged}`);
    if (merged.partsAdded) info.push(`+${merged.partsAdded} запч.`);
    if (merged.partsUpdated) info.push(`~${merged.partsUpdated} запч.`);
    if (merged.worksAdded) info.push(`+${merged.worksAdded} раб.`);
    if (merged.worksUpdated) info.push(`~${merged.worksUpdated} раб.`);
    if (paid) info.push('+оплата');

    if (info.length) {
      ntSetAIStatus(`✓ Обновлено: ${info.join(', ')}. Перерисовываю…`, 'ok');
      closeModal();
      render();
      setTimeout(() => openTaskView(taskId), 120);
    } else {
      ntSetAIStatus('Ничего не найдено в тексте.', 'info');
    }
  } catch (e) {
    ntSetAIStatus('Ошибка разбора: ' + e.message, 'err');
  }
}

// Фото → редактирует ВСЁ в задаче
function ntHandleEditPhotoRWOnly(taskId, file) {
  return new Promise(resolve => {
    if (!file) { resolve(); return; }
    if (!file.type.startsWith('image/')) { ntSetAIStatus('Это не картинка.', 'err'); resolve(); return; }
    if (file.size > NT_AI_CONFIG.maxImageMB * 1024 * 1024) {
      ntSetAIStatus(`Файл больше ${NT_AI_CONFIG.maxImageMB} МБ.`, 'err'); resolve(); return;
    }

    const reader = new FileReader();
    reader.onload = async (e) => {
      ntSetAIStatus(`🤖 Распознаю фото (${_aiCache.visionModel})…`, 'info');
      try {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task) throw new Error('Задача не найдена');

        // Полный промпт для редактирования по фото
        const prompt = ntBuildEditPhotoPrompt('', task);

        const res = await fetch(NT_AI_CONFIG.baseURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _aiCache.key },
          body: JSON.stringify({
            model: _aiCache.visionModel,
            messages: [{ role: 'user', content: [
              { type: 'text', text: prompt },
              { type: 'image_url', image_url: { url: e.target.result } }
            ]}],
            temperature: 0.1, max_tokens: 2000
          })
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const jres = await res.json();
        const data = ntAiParseJSON(jres.choices?.[0]?.message?.content || '');
        data.__rawText = data.raw_text || '';

        // Применяем скалярные поля
        const fieldsChanged = ntApplyEditFormToTask(task, data);

        // Дополняем parts/works + автопоиск артикулов
        const merged = await ntMergeIntoTaskWithArticleLookup(taskId, {
          parts: Array.isArray(data.parts) ? data.parts : [],
          works: Array.isArray(data.works) ? data.works : [],
          __rawText: data.__rawText || ''
        });

        // Оплата
        const paid = ntMaybeApplyPayment(taskId, data);

        if (fieldsChanged || merged.partsAdded || merged.partsUpdated || merged.worksAdded || merged.worksUpdated || paid) {
          task.updatedAt = new Date().toISOString();
          task.log = task.log || [];
          task.log.push({
            time: new Date().toISOString(),
            user: USERS[state.currentUser].name,
            text: `AI из карточки (фото): полей ${fieldsChanged}, запчасти +${merged.partsAdded}/~${merged.partsUpdated} (с артикулами), работы +${merged.worksAdded}/~${merged.worksUpdated}${paid ? ', +оплата' : ''}`
          });
          saveState(taskId);
        }

        const info = [];
        if (fieldsChanged) info.push(`полей: ${fieldsChanged}`);
        if (merged.partsAdded) info.push(`+${merged.partsAdded} запч.`);
        if (merged.partsUpdated) info.push(`~${merged.partsUpdated} запч.`);
        if (merged.worksAdded) info.push(`+${merged.worksAdded} раб.`);
        if (merged.worksUpdated) info.push(`~${merged.worksUpdated} раб.`);
        if (paid) info.push('+оплата');

        if (info.length) {
          ntSetAIStatus(`✓ Обновлено: ${info.join(', ')}. Перерисовываю…`, 'ok');
          closeModal();
          render();
          setTimeout(() => openTaskView(taskId), 120);
        } else {
          ntSetAIStatus('На фото ничего не найдено для обновления.', 'info');
        }
      } catch (err) {
        ntSetAIStatus('Ошибка распознавания: ' + err.message, 'err');
      } finally { resolve(); }
    };
    reader.onerror = () => { ntSetAIStatus('Не удалось прочитать файл.', 'err'); resolve(); };
    reader.readAsDataURL(file);
  });
}
